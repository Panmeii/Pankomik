<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Pankomik</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Halaman auth berdiri sendiri, tidak pakai layout utama */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
    }

    .auth-logo {
      font-family: 'Bangers', cursive;
      font-size: 32px;
      color: var(--accent);
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    /* Tab Login / Register */
    .auth-tabs {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .auth-tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      color: var(--text-muted);
      background: transparent;
      border: none;
    }

    .auth-tab.active {
      background: var(--accent);
      color: #fff;
    }

    /* Input fields */
    .auth-input {
      width: 100%;
      padding: 11px 13px;
      margin-bottom: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }

    .auth-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232,82,42,0.15);
    }

    /* Tombol submit utama */
    .auth-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 12px;
    }

    .auth-btn:hover  { background: #c73f1c; }
    .auth-btn:active { transform: scale(0.97); }
    .auth-btn:disabled { background: var(--bg-surface); color: var(--text-muted); cursor: not-allowed; }

    /* Separator "atau" */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0 12px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Tombol Google */
    .btn-google {
      width: 100%;
      padding: 11px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, border 0.2s;
    }

    .btn-google:hover { border-color: var(--accent); }

    /* Pesan error / sukses */
    .auth-message {
      padding: 10px 13px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    .auth-message.error {
      background: rgba(232,82,42,0.1);
      border: 1px solid rgba(232,82,42,0.3);
      color: var(--accent);
      display: block;
    }

    .auth-message.success {
      background: rgba(39,174,96,0.1);
      border: 1px solid rgba(39,174,96,0.3);
      color: #27ae60;
      display: block;
    }

    /* Loading spinner kecil */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <!-- Logo -->
      <div class="auth-logo">Pankomik</div>
      <p class="auth-subtitle">Baca komik favoritmu kapan saja</p>

      <!-- Tab Login / Register -->
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')" id="tab-login">Masuk</button>
        <button class="auth-tab" onclick="switchTab('register')" id="tab-register">Daftar</button>
      </div>

      <!-- Pesan error/sukses -->
      <div class="auth-message" id="authMessage"></div>

      <!-- Form Email -->
      <input type="email"    id="emailInput"    class="auth-input" placeholder="Email">
      <input type="password" id="passwordInput" class="auth-input" placeholder="Password (min. 6 karakter)">

      <!-- Tombol submit -->
      <button class="auth-btn" id="submitBtn" onclick="handleSubmit()">Masuk</button>

      <!-- Separator -->
      <div class="auth-divider">atau</div>

      <!-- Tombol Google -->
      <button class="btn-google" onclick="handleGoogle()">
        <!-- Ikon Google (SVG inline) -->
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Lanjutkan dengan Google
      </button>
    </div>
  </div>

  <script type="module">
    import { loginWithEmail, registerWithEmail, loginWithGoogle, getCurrentUser } from "./supabase.js";

    /* Kalau sudah login, langsung ke home */
    getCurrentUser().then(user => {
      if (user) window.location.href = "index.html";
    });

    /* Terapkan tema tersimpan */
    if (localStorage.getItem("theme") === "light") {
      document.body.classList.add("light");
    }

    /* ---- STATE ------------------------------------------- */
    let currentTab = "login"; /* "login" atau "register" */

    /* ---- FUNGSI UTILITAS --------------------------------- */
    function showMessage(text, type = "error") {
      const el = document.getElementById("authMessage");
      el.textContent = text;
      el.className   = `auth-message ${type}`;
    }

    function setLoading(isLoading) {
      const btn = document.getElementById("submitBtn");
      btn.disabled    = isLoading;
      btn.innerHTML   = isLoading
        ? '<span class="spinner"></span>Memproses...'
        : (currentTab === "login" ? "Masuk" : "Daftar Sekarang");
    }

    /* ---- TAB SWITCH -------------------------------------- */
    window.switchTab = function(tab) {
      currentTab = tab;
      document.getElementById("tab-login").classList.toggle("active",    tab === "login");
      document.getElementById("tab-register").classList.toggle("active", tab === "register");
      document.getElementById("submitBtn").textContent = tab === "login" ? "Masuk" : "Daftar Sekarang";
      document.getElementById("authMessage").className = "auth-message"; /* reset pesan */
    };

    /* ---- SUBMIT EMAIL/PASSWORD --------------------------- */
    window.handleSubmit = async function() {
      const email    = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;

      /* Validasi sederhana */
      if (!email || !password) {
        showMessage("Email dan password harus diisi.");
        return;
      }
      if (password.length < 6) {
        showMessage("Password minimal 6 karakter.");
        return;
      }

      setLoading(true);

      if (currentTab === "login") {
        const { user, error } = await loginWithEmail(email, password);
        if (error) {
          showMessage("Email atau password salah.");
        } else {
          window.location.href = "index.html";
        }
      } else {
        const { user, error } = await registerWithEmail(email, password);
        if (error) {
          showMessage(error.message.includes("already registered")
            ? "Email sudah terdaftar. Coba login."
            : "Gagal daftar. Coba lagi.");
        } else {
          showMessage("Berhasil! Cek email untuk konfirmasi akun.", "success");
        }
      }

      setLoading(false);
    };

    /* ---- LOGIN GOOGLE ------------------------------------ */
    window.handleGoogle = async function() {
      await loginWithGoogle();
      /* Redirect otomatis ditangani Supabase setelah OAuth selesai */
    };

    /* Enter key untuk submit form */
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") window.handleSubmit();
    });
  </script>
</body>
</html>
