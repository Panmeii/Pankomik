<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel — Pankomik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Cinzel:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════
       PANKOMIK NOVEL — PREMIUM INK & GOLD THEME
    ═══════════════════════════════════════════════════════ */
    :root {
      --ink:        #0d0b14;
      --ink2:       #13101e;
      --ink3:       #1a1728;
      --ink4:       #221f32;
      --gold:       #c9a84c;
      --gold-light: #e8c96a;
      --gold-dim:   rgba(201,168,76,0.18);
      --gold-glow:  rgba(201,168,76,0.08);
      --crimson:    #8b1a1a;
      --crimson2:   #a52020;
      --text:       #ede8f5;
      --text2:      #c4bdd6;
      --muted:      #6e6480;
      --border:     rgba(255,255,255,0.06);
      --border-gold:rgba(201,168,76,0.2);
      --r:          10px;
      --header-h:   58px;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--ink);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      /* Subtle noise */
      background-image:
        radial-gradient(ellipse 70% 40% at 50% 0%, rgba(201,168,76,0.04) 0%, transparent 60%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    }

    /* ── HEADER ─────────────────────────────────────────── */
    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      height: var(--header-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      background: rgba(13,11,20,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-gold);
    }
    .header-logo {
      font-family: 'Cinzel', serif;
      font-size: 16px; font-weight: 700;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      cursor: pointer;
      letter-spacing: 2px;
    }
    .header-right { display: flex; gap: 6px; }
    .hbtn {
      width: 36px; height: 36px; border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--muted); font-size: 15px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .hbtn:hover { background: var(--gold-dim); border-color: var(--border-gold); color: var(--gold); }

    /* ── HERO ─────────────────────────────────────────────── */
    .novel-hero {
      margin-top: var(--header-h);
      padding: 32px 20px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .novel-hero::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 80% at 50% 0%, rgba(201,168,76,0.07) 0%, transparent 70%);
    }
    /* Ornamental top line */
    .novel-hero::after {
      content: '— ✦ —';
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; letter-spacing: 6px;
      color: var(--gold); opacity: 0.5;
    }
    .hero-icon {
      font-size: 32px; margin-bottom: 10px; display: block;
      filter: drop-shadow(0 0 16px rgba(201,168,76,0.3));
    }
    .hero-title {
      font-family: 'Cinzel', serif;
      font-size: 22px; font-weight: 700;
      letter-spacing: 6px; text-transform: uppercase;
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 60%, #8b6820 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .hero-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; font-style: italic;
      color: var(--muted); letter-spacing: 1px;
    }

    /* ── SEARCH ───────────────────────────────────────────── */
    .search-wrap {
      padding: 16px 16px 8px;
      position: relative;
    }
    .search-icon {
      position: absolute; left: 28px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 14px; pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 11px 38px 11px 44px;
      border-radius: 99px;
      border: 1px solid var(--border-gold);
      background: rgba(201,168,76,0.04);
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      outline: none;
      transition: all 0.25s;
      box-sizing: border-box;
    }
    .search-input::placeholder { color: var(--muted); font-style: italic; }
    .search-input:focus {
      background: rgba(201,168,76,0.07);
      border-color: rgba(201,168,76,0.45);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.06), 0 0 24px rgba(201,168,76,0.06);
    }
    .search-clear {
      position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted);
      font-size: 13px; cursor: pointer; padding: 4px;
      display: none; transition: color 0.15s;
    }
    .search-clear.show { display: block; }
    .search-clear:hover { color: var(--gold); }

    /* ── TABS ─────────────────────────────────────────────── */
    .tabs {
      display: flex; gap: 4px; padding: 8px 16px 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      padding: 7px 16px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font-family: 'Nunito', sans-serif;
      font-size: 11.5px; font-weight: 700;
      cursor: pointer; letter-spacing: 0.3px;
      transition: all 0.2s; white-space: nowrap;
    }
    .tab:hover { border-color: var(--border-gold); color: var(--text2); }
    .tab.active {
      background: linear-gradient(135deg, rgba(201,168,76,0.9), rgba(139,26,26,0.8));
      border-color: transparent; color: #fff;
      box-shadow: 0 4px 16px rgba(201,168,76,0.25);
    }

    /* ── CHIPS ────────────────────────────────────────────── */
    .chips-panel {
      display: none;
      padding: 10px 16px 6px;
      overflow-x: auto; scrollbar-width: none;
      gap: 6px; white-space: nowrap;
    }
    .chips-panel::-webkit-scrollbar { display: none; }
    .chips-panel.open { display: flex; }
    .chip {
      flex-shrink: 0;
      padding: 5px 13px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 700;
      cursor: pointer; transition: all 0.15s;
    }
    .chip:hover { border-color: var(--border-gold); color: var(--gold-light); }
    .chip.active {
      background: var(--gold-dim); border-color: var(--border-gold);
      color: var(--gold-light);
      box-shadow: 0 0 12px rgba(201,168,76,0.08);
    }

    /* ── TOOLBAR ──────────────────────────────────────────── */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 8px;
    }
    .toolbar-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px; font-weight: 600; font-style: italic;
      color: var(--text2);
    }
    .count-badge {
      font-size: 10px; color: var(--muted); font-weight: 700;
      background: rgba(255,255,255,0.04);
      padding: 3px 10px; border-radius: 99px;
      border: 1px solid var(--border);
    }

    /* ── GRID ─────────────────────────────────────────────── */
    .novel-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px; padding: 6px 16px 16px;
    }

    /* ── NOVEL CARD ───────────────────────────────────────── */
    .novel-card {
      background: var(--ink2);
      border-radius: var(--r);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer; position: relative;
      transition: transform 0.28s cubic-bezier(.25,.46,.45,.94),
                  box-shadow 0.28s, border-color 0.28s;
      -webkit-tap-highlight-color: transparent;
      animation: cardIn 0.35s ease both;
    }
    .novel-card::after {
      content: '';
      position: absolute; inset: 0; border-radius: var(--r);
      pointer-events: none;
      background: linear-gradient(180deg, transparent 45%, rgba(13,11,20,0.95) 100%);
      z-index: 1;
    }
    /* Gold shimmer on hover */
    .novel-card::before {
      content: '';
      position: absolute; inset: 0; border-radius: var(--r);
      background: linear-gradient(135deg, rgba(201,168,76,0.06) 0%, transparent 50%);
      opacity: 0; transition: opacity 0.3s; z-index: 2; pointer-events: none;
    }
    .novel-card:hover {
      transform: translateY(-5px) scale(1.01);
      box-shadow: 0 14px 36px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,168,76,0.15);
      border-color: rgba(201,168,76,0.2);
    }
    .novel-card:hover::before { opacity: 1; }
    .novel-card:active { transform: scale(0.97); }

    /* Cover image area */
    .card-cover {
      position: relative; width: 100%; aspect-ratio: 2/3;
      background: var(--ink3); overflow: hidden;
    }
    .card-cover img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.5s ease;
    }
    .novel-card:hover .card-cover img { transform: scale(1.07); }
    .card-fallback {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 6px;
      background: linear-gradient(135deg, var(--ink3), rgba(201,168,76,0.1));
      font-size: 28px; color: var(--gold);
    }

    /* Badges */
    .card-type {
      position: absolute; top: 6px; left: 6px; z-index: 3;
      background: linear-gradient(135deg, var(--crimson), var(--crimson2));
      color: #fff; font-size: 7.5px; font-weight: 800;
      padding: 2px 7px; border-radius: 3px;
      text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 2px 8px rgba(139,26,26,0.4);
    }
    .card-rating {
      position: absolute; top: 6px; right: 6px; z-index: 3;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      color: var(--gold-light); font-size: 8px; font-weight: 800;
      padding: 2px 7px; border-radius: 3px;
      border: 1px solid rgba(201,168,76,0.2);
    }
    .card-status {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
      padding: 18px 7px 5px;
      background: linear-gradient(transparent, rgba(13,11,20,0.9));
      font-size: 7.5px; font-weight: 700; color: rgba(255,255,255,0.5);
      text-transform: uppercase; letter-spacing: 0.8px;
    }

    /* Card info */
    .card-info {
      padding: 8px 9px 10px; position: relative; z-index: 2;
    }
    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600; font-size: 11.5px; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; line-height: 1.35; margin-bottom: 4px;
    }
    .card-chapter {
      font-size: 9.5px; color: var(--muted);
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-date {
      font-size: 8.5px; color: var(--muted); margin-top: 3px; opacity: 0.7;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── SEARCH CARD ──────────────────────────────────────── */
    .novel-grid.search-mode { grid-template-columns: 1fr !important; }
    .novel-card.search-card {
      display: flex !important; flex-direction: row !important;
      gap: 12px; padding: 12px; overflow: visible;
      align-items: flex-start;
    }
    .novel-card.search-card::after { display: none; }
    .novel-card.search-card::before { display: none; }
    .novel-card.search-card .search-cover {
      width: 62px; height: 88px; flex-shrink: 0;
      border-radius: 7px; overflow: hidden;
      border: 1px solid var(--border-gold);
    }
    .novel-card.search-card .search-cover img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .novel-card.search-card .search-cover-fallback {
      width: 62px; height: 88px; flex-shrink: 0;
      border-radius: 7px; background: var(--ink3);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; border: 1px solid var(--border);
    }
    .novel-card.search-card .card-info { padding: 0; flex: 1; min-width: 0; }
    .novel-card.search-card .card-type { position: static; display: inline-block; margin-bottom: 6px; }
    .novel-card.search-card .card-rating { position: static; display: inline-block; margin-left: 4px; }
    .novel-card.search-card .card-title { font-size: 13.5px; -webkit-line-clamp: 3; }
    .novel-card.search-card .card-status { position: static; background: none; padding: 0; font-size: 10px; color: var(--muted); }

    /* ── SKELETON ─────────────────────────────────────────── */
    .skel {
      background: linear-gradient(90deg, var(--ink2) 0%, var(--ink3) 50%, var(--ink2) 100%);
      background-size: 200% 100%; animation: shimmer 1.7s ease-in-out infinite;
      border-radius: var(--r);
    }
    .skel-img { aspect-ratio: 2/3; }
    .skel-info { height: 55px; margin-top: 2px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── LOAD MORE ────────────────────────────────────────── */
    #loadMoreWrap {
      display: none; flex-direction: column; align-items: center;
      gap: 10px; padding: 8px 16px 100px;
    }
    #loadMoreSpinner {
      display: none; grid-template-columns: repeat(3,1fr);
      gap: 11px; padding: 0 16px; width: 100%;
    }
    #pageInfo { font-family: 'Cormorant Garamond', serif; font-size: 12px; color: var(--muted); font-style: italic; }
    #loadMoreBtn {
      width: 100%; max-width: 320px; padding: 13px 24px;
      border-radius: 99px;
      border: 1px solid var(--border-gold);
      background: rgba(201,168,76,0.05);
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-size: 12px; font-weight: 600; letter-spacing: 2px;
      cursor: pointer; position: relative; overflow: hidden;
      transition: all 0.3s; text-transform: uppercase;
    }
    #loadMoreBtn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(139,26,26,0.1));
      opacity: 0; transition: opacity 0.3s;
    }
    #loadMoreBtn:hover:not(:disabled)::before { opacity: 1; }
    #loadMoreBtn:hover:not(:disabled) {
      border-color: rgba(201,168,76,0.5);
      box-shadow: 0 0 24px rgba(201,168,76,0.1);
    }
    #loadMoreBtn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── ORNAMENTAL DIVIDER ───────────────────────────────── */
    .divider-ornament {
      text-align: center;
      padding: 4px 0 8px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; letter-spacing: 8px;
      color: rgba(201,168,76,0.25);
    }

    /* ── BOTTOM NAV ───────────────────────────────────────── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 990;
      height: 60px;
      display: flex; align-items: center;
      background: rgba(13,11,20,0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-gold);
      padding: 0 8px;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      transition: color 0.2s;
      padding: 6px 0;
    }
    .nav-item.active, .nav-item:hover { color: var(--gold); }
    .nav-icon { font-size: 18px; line-height: 1; }
    .nav-label { font-size: 9px; font-weight: 700; letter-spacing: 0.3px; }

    /* ── DROPDOWN ─────────────────────────────────────────── */
    .dropdown {
      display: none; position: fixed; top: var(--header-h); right: 12px; z-index: 999;
      min-width: 160px; padding: 8px;
      background: rgba(20,17,30,0.97); backdrop-filter: blur(16px);
      border: 1px solid var(--border-gold); border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    /* ── CARD ANIMATION ───────────────────────────────────── */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SCROLLBAR ────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--ink); }
    ::-webkit-scrollbar-thumb { background: var(--border-gold); border-radius: 99px; }
  </style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-logo" onclick="window.location.href='/'">PANKOMIK</div>
  <div class="header-right">
    <button class="hbtn" onclick="toggleDarkMode()" title="Tema">🌙</button>
    <button class="hbtn" onclick="toggleMenu()" title="Menu">👤</button>
  </div>
</header>
<div id="menuDropdown" class="dropdown"></div>

<!-- Hero -->
<div class="novel-hero">
  <span class="hero-icon">📖</span>
  <h1 class="hero-title">Novel</h1>
  <p class="hero-subtitle">Light novel &amp; web novel terlengkap</p>
</div>

<!-- Search -->
<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input
    type="text" id="searchInput"
    class="search-input"
    placeholder="Cari judul novel..."
    oninput="onSearchInput(this.value)"
    autocomplete="off"
  >
  <button class="search-clear" id="searchClearBtn" onclick="clearSearch()">✕</button>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" id="tab-home"  onclick="switchTab('home')">✦ Terbaru</button>
  <button class="tab"        id="tab-genre" onclick="switchTab('genre')">Kategori</button>
  <button class="tab"        id="tab-tag"   onclick="switchTab('tag')">Label</button>
</div>

<!-- Chips -->
<div class="chips-panel" id="genrePanel">
  <span class="chip" style="opacity:0.5">⏳ Memuat...</span>
</div>
<div class="chips-panel" id="tagPanel">
  <span class="chip" style="opacity:0.5">⏳ Memuat...</span>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <span class="toolbar-title" id="toolbarTitle">✦ Update Terbaru</span>
  <span class="count-badge" id="countBadge"></span>
</div>

<!-- Divider -->
<div class="divider-ornament">— ✦ —</div>

<!-- Grid -->
<div id="novelGrid" class="novel-grid"></div>

<!-- Load more spinner -->
<div id="loadMoreSpinner">
  <div><div class="skel skel-img"></div><div class="skel skel-info"></div></div>
  <div><div class="skel skel-img"></div><div class="skel skel-info"></div></div>
  <div><div class="skel skel-img"></div><div class="skel skel-info"></div></div>
</div>

<!-- Load more -->
<div id="loadMoreWrap">
  <span id="pageInfo"></span>
  <button id="loadMoreBtn" onclick="loadMore()">Muat Lebih Banyak</button>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-item" onclick="window.location.href='/'">
    <span class="nav-icon">🏠</span><span class="nav-label">Home</span>
  </button>
  <button class="nav-item" onclick="window.location.href='/'">
    <span class="nav-icon">📚</span><span class="nav-label">Komik</span>
  </button>
  <button class="nav-item" onclick="window.location.href='/anime/'">
    <span class="nav-icon">⚡</span><span class="nav-label">Anime</span>
  </button>
  <button class="nav-item active" onclick="window.location.href='/novel/'">
    <span class="nav-icon">📖</span><span class="nav-label">Novel</span>
  </button>
  <button class="nav-item" onclick="window.location.href='/profil'">
    <span class="nav-icon">👤</span><span class="nav-label">Profil</span>
  </button>
</nav>

<script type="module">
  import { initAuthHeader } from "/auth-header.js";
  initAuthHeader();
</script>

<script>
/* ============================================================
   NOVEL.HTML — JavaScript (Redesign Premium)
   APIs:
   - Home    : GET /novel/sakuranovel/home?page=N
   - Search  : GET /novel/sakuranovel/search?q=QUERY
   - Genres  : GET /novel/sakuranovel/genres
   - By genre: GET /novel/sakuranovel/genre/SLUG?page=N
   - Tags    : GET /novel/sakuranovel/tags
   - By tag  : GET /novel/sakuranovel/tag/SLUG?page=N
   ============================================================ */

const BASE = "https://www.sankavollerei.com/novel/sakuranovel";

/* ── State ─────────────────────────────────────────── */
let currentTab   = "home";
let activeGenre  = null;
let activeTag    = null;
let page         = 1;
let hasNext      = false;
let loading      = false;
let totalLoaded  = 0;
let genreList    = [];
let tagList      = [];
let searchTimer  = null;
let isSearchMode = false;

/* ── Image proxy ─────────────────────────────────── */
function proxyImg(url) {
  if (!url) return "";
  if (url.startsWith("data:")) return url;
  return "https://proxy.sankavolereii.my.id/" + url;
}

function makeImg(originalUrl, alt, cssText) {
  const img = document.createElement("img");
  img.alt = alt || "";
  if (cssText) img.style.cssText = cssText;

  img.onerror = function() {
    img.onerror = null;
    const fb = document.createElement("div");
    fb.className = "card-fallback";
    fb.textContent = "📖";
    if (img.parentNode) img.parentNode.replaceChild(fb, img);
  };

  if (originalUrl) img.src = proxyImg(originalUrl);
  return img;
}

/* ── INIT ─────────────────────────────────────────── */
window.onload = async function() {
  if (localStorage.getItem("theme") === "light") document.body.classList.add("light-mode");

  const fType = sessionStorage.getItem("novelFilterType");
  const fSlug = sessionStorage.getItem("novelFilterSlug");
  const fName = sessionStorage.getItem("novelFilterName");
  sessionStorage.removeItem("novelFilterType");
  sessionStorage.removeItem("novelFilterSlug");
  sessionStorage.removeItem("novelFilterName");

  loadGenres();
  loadTags();

  if (fType === "genre" && fSlug) {
    currentTab = "genre"; activeGenre = fSlug;
    activateTab("genre");
    document.getElementById("genrePanel").classList.add("open");
    document.getElementById("toolbarTitle").textContent = "✦ " + (fName || fSlug);
    await fetchFiltered(BASE + "/genre/" + fSlug, 1, true);
    setTimeout(() => highlightChip("genrePanel", fSlug), 700);
    return;
  }
  if (fType === "tag" && fSlug) {
    currentTab = "tag"; activeTag = fSlug;
    activateTab("tag");
    document.getElementById("tagPanel").classList.add("open");
    document.getElementById("toolbarTitle").textContent = "✦ " + (fName || fSlug);
    await fetchFiltered(BASE + "/tag/" + fSlug, 1, true);
    setTimeout(() => highlightChip("tagPanel", fSlug), 700);
    return;
  }

  await fetchHome(1, true);

  window.addEventListener("scroll", () => {
    if (isSearchMode) return;
    if (window.scrollY + window.innerHeight >= document.body.offsetHeight - 450 && hasNext && !loading) {
      loadMore();
    }
  }, { passive: true });
};

/* ── TAB SWITCH ───────────────────────────────────── */
function activateTab(tab) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById("tab-" + tab)?.classList.add("active");
}

window.switchTab = function(tab) {
  if (isSearchMode) clearSearch();
  currentTab = tab;
  activateTab(tab);

  const si = document.getElementById("searchInput");
  if (si) {
    si.placeholder = tab === "genre" ? "Cari genre..." : tab === "tag" ? "Cari label..." : "Cari judul novel...";
  }

  document.getElementById("genrePanel").classList.remove("open");
  document.getElementById("tagPanel").classList.remove("open");

  if (tab === "home") {
    activeGenre = null; activeTag = null;
    document.getElementById("toolbarTitle").textContent = "✦ Update Terbaru";
    fetchHome(1, true);
  } else if (tab === "genre") {
    document.getElementById("genrePanel").classList.add("open");
    if (!activeGenre && genreList.length > 0) selectGenre(genreList[0].slug, genreList[0].name);
    else if (activeGenre) fetchFiltered(BASE + "/genre/" + activeGenre, 1, true);
  } else if (tab === "tag") {
    document.getElementById("tagPanel").classList.add("open");
    if (!activeTag && tagList.length > 0) selectTag(tagList[0].slug, tagList[0].name);
    else if (activeTag) fetchFiltered(BASE + "/tag/" + activeTag, 1, true);
  }
};

/* ── SEARCH ───────────────────────────────────────── */
window.onSearchInput = function(val) {
  document.getElementById("searchClearBtn").classList.toggle("show", val.length > 0);
  clearTimeout(searchTimer);

  if (!val.trim()) {
    if (currentTab === "genre") { filterChips("genrePanel", ""); return; }
    if (currentTab === "tag")   { filterChips("tagPanel", ""); return; }
    if (isSearchMode) clearSearch();
    return;
  }

  if (currentTab === "genre") { filterChips("genrePanel", val.trim()); return; }
  if (currentTab === "tag")   { filterChips("tagPanel",   val.trim()); return; }

  searchTimer = setTimeout(() => doSearch(val.trim()), 500);
};

function filterChips(panelId, q) {
  const panel = document.getElementById(panelId);
  if (!panel) return;
  const lq = q.toLowerCase();
  panel.querySelectorAll(".chip").forEach(c => {
    c.style.display = (!lq || c.textContent.toLowerCase().includes(lq)) ? "" : "none";
  });
}

window.clearSearch = function() {
  document.getElementById("searchInput").value = "";
  document.getElementById("searchClearBtn").classList.remove("show");
  isSearchMode = false;
  document.getElementById("novelGrid").classList.remove("search-mode");
  switchTab(currentTab);
};

async function doSearch(query) {
  isSearchMode = true;
  const grid = document.getElementById("novelGrid");
  grid.innerHTML = makeSkeleton(6);
  grid.classList.add("search-mode");
  document.getElementById("loadMoreWrap").style.display = "none";
  document.getElementById("countBadge").textContent = "";
  document.getElementById("toolbarTitle").textContent = '✦ "' + query + '"';

  try {
    const res  = await fetch(BASE + "/search?q=" + encodeURIComponent(query));
    const json = await res.json();
    const list = json.data?.results || [];
    grid.innerHTML = "";
    if (!list.length) {
      grid.innerHTML = emptyState("Tidak ada hasil untuk <em>" + query + "</em>");
    } else {
      list.forEach(n => appendSearchCard(n));
      document.getElementById("countBadge").textContent = list.length + " hasil";
    }
  } catch {
    grid.innerHTML = emptyState("Gagal mencari. Coba lagi.");
  }
}

function appendSearchCard(novel) {
  if (!novel?.slug) return;
  const coverUrl = novel.poster || novel.cover || novel.image || novel.thumbnail || "";
  const title    = novel.title || "Untitled";
  const rating   = novel.rating ? "⭐ " + novel.rating : "";
  const type     = novel.type   || "Novel";
  const status   = novel.status && novel.status !== "Unknown" ? novel.status : "";

  const card = document.createElement("div");
  card.className = "novel-card search-card";

  const coverEl = document.createElement("div");
  if (coverUrl) {
    coverEl.className = "search-cover";
    const img = makeImg(coverUrl, title, "width:100%;height:100%;object-fit:cover;display:block;");
    coverEl.appendChild(img);
  } else {
    coverEl.className = "search-cover-fallback";
    coverEl.textContent = "📖";
  }
  card.appendChild(coverEl);

  const info = document.createElement("div");
  info.className = "card-info";
  info.innerHTML =
    '<div style="display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-wrap:wrap;">' +
      '<span class="card-type">' + type + '</span>' +
      (rating ? '<span class="card-rating">' + rating + '</span>' : '') +
    '</div>' +
    '<p class="card-title" style="font-size:13.5px;-webkit-line-clamp:3;">' + title + '</p>' +
    (status ? '<p class="card-status" style="position:static;background:none;padding:0;color:var(--muted);font-size:10px;margin-top:4px;">' + status + '</p>' : '');
  card.appendChild(info);

  card.onclick = () => {
    sessionStorage.setItem("novelData", JSON.stringify(novel));
    window.location.href = "/novel/" + novel.slug;
  };
  document.getElementById("novelGrid").appendChild(card);
}

/* ── GENRE & TAG ──────────────────────────────────── */
async function loadGenres() {
  try {
    const res  = await fetch(BASE + "/genres");
    const json = await res.json();
    genreList  = json.data || [];
    renderChips("genrePanel", genreList, "genre");
  } catch (e) { console.error(e); }
}

async function loadTags() {
  try {
    const res  = await fetch(BASE + "/tags");
    const json = await res.json();
    tagList    = json.data || [];
    renderChips("tagPanel", tagList, "tag");
  } catch (e) { console.error(e); }
}

function renderChips(panelId, list, type) {
  const panel = document.getElementById(panelId);
  if (!panel || !list.length) return;
  panel.innerHTML = list.map(item =>
    `<button class="chip" data-slug="${item.slug}" onclick="${type === 'genre' ? 'selectGenre' : 'selectTag'}('${item.slug}','${item.name.replace(/'/g,"\\'")}')">
      ${item.name}<span style="font-size:9px;opacity:0.5;margin-left:3px;">${item.count}</span>
    </button>`
  ).join("");
}

function highlightChip(panelId, slug) {
  document.querySelectorAll("#" + panelId + " .chip").forEach(c => {
    c.classList.toggle("active", c.dataset.slug === slug);
  });
}

window.selectGenre = function(slug, name) {
  if (isSearchMode) return;
  activeGenre = slug;
  highlightChip("genrePanel", slug);
  document.getElementById("toolbarTitle").textContent = "✦ " + name;
  fetchFiltered(BASE + "/genre/" + slug, 1, true);
};

window.selectTag = function(slug, name) {
  if (isSearchMode) return;
  activeTag = slug;
  highlightChip("tagPanel", slug);
  document.getElementById("toolbarTitle").textContent = "✦ " + name;
  fetchFiltered(BASE + "/tag/" + slug, 1, true);
};

/* ── FETCH HOME ───────────────────────────────────── */
async function fetchHome(pg, reset) {
  loading = true;
  if (reset) {
    page = 1; hasNext = false; totalLoaded = 0;
    document.getElementById("novelGrid").innerHTML = makeSkeleton(6);
    document.getElementById("novelGrid").classList.remove("search-mode");
    document.getElementById("countBadge").textContent = "";
    document.getElementById("loadMoreWrap").style.display = "none";
  }
  try {
    const res  = await fetch(BASE + "/home?page=" + pg);
    const json = await res.json();
    if (json.status !== "success") throw new Error("API error");
    const list = json.data?.results || [];
    const pag  = json.data?.pagination || {};
    hasNext = pag.hasNext ?? false;
    page = pg;
    if (reset) document.getElementById("novelGrid").innerHTML = "";
    list.forEach(n => appendCard(n));
    totalLoaded += list.length;
    document.getElementById("countBadge").textContent = totalLoaded + " novel";
    updateLoadMoreBtn();
  } catch (e) {
    console.error(e);
    if (reset) document.getElementById("novelGrid").innerHTML = emptyState("Gagal memuat. Cek koneksimu.");
  } finally {
    loading = false;
    document.getElementById("loadMoreSpinner").style.display = "none";
  }
}

/* ── FETCH FILTERED ───────────────────────────────── */
async function fetchFiltered(url, pg, reset) {
  loading = true;
  if (reset) {
    page = 1; hasNext = false; totalLoaded = 0;
    document.getElementById("novelGrid").innerHTML = makeSkeleton(6);
    document.getElementById("novelGrid").classList.remove("search-mode");
    document.getElementById("countBadge").textContent = "";
    document.getElementById("loadMoreWrap").style.display = "none";
  }
  try {
    const fetchUrl = pg > 1 ? url + (url.includes("?") ? "&" : "?") + "page=" + pg : url;
    const res  = await fetch(fetchUrl);
    const json = await res.json();
    const list = json.data?.results || [];
    const pag  = json.data?.pagination || {};
    hasNext = pag.hasNext ?? false;
    page = pg;
    if (reset) document.getElementById("novelGrid").innerHTML = "";
    list.forEach(n => appendCard(n));
    totalLoaded += list.length;
    document.getElementById("countBadge").textContent = totalLoaded + " novel";
    updateLoadMoreBtn();
  } catch (e) {
    console.error(e);
    if (reset) document.getElementById("novelGrid").innerHTML = emptyState("Gagal memuat. Coba lagi.");
  } finally {
    loading = false;
    document.getElementById("loadMoreSpinner").style.display = "none";
  }
}

/* ── LOAD MORE ────────────────────────────────────── */
window.loadMore = async function() {
  if (loading || !hasNext) return;
  loading = true;
  const btn     = document.getElementById("loadMoreBtn");
  const spinner = document.getElementById("loadMoreSpinner");
  if (btn) { btn.disabled = true; btn.textContent = "Memuat..."; }
  if (spinner) spinner.style.display = "grid";

  try {
    const np = page + 1;
    if (currentTab === "home") await fetchHome(np, false);
    else if (currentTab === "genre" && activeGenre) await fetchFiltered(BASE + "/genre/" + activeGenre, np, false);
    else if (currentTab === "tag"   && activeTag)   await fetchFiltered(BASE + "/tag/"   + activeTag,   np, false);
  } finally {
    loading = false;
    if (btn) btn.disabled = false;
    if (spinner) spinner.style.display = "none";
  }
};

/* ── APPEND CARD ──────────────────────────────────── */
function appendCard(novel) {
  if (!novel?.slug) return;
  const coverUrl = novel.poster || novel.cover || novel.image || novel.thumbnail ||
                   novel.img || novel.cover_url || novel.poster_url || novel.picture || "";
  const title    = novel.title || "Untitled";
  const chapter  = novel.latest_chapter || novel.chapter || "";
  const rating   = novel.rating || "";
  const type     = novel.type   || "Novel";
  const status   = novel.status && novel.status !== "Unknown" ? novel.status : "";
  const date     = novel.last_update || novel.updated_at || novel.update_date || novel.date || "";
  const short    = chapter.length > 55 ? chapter.slice(0, 52) + "…" : chapter;

  const card = document.createElement("div");
  card.className = "novel-card";

  /* Type & rating badges */
  const typeBadge = document.createElement("span");
  typeBadge.className = "card-type";
  typeBadge.textContent = type;
  card.appendChild(typeBadge);

  if (rating) {
    const rBadge = document.createElement("span");
    rBadge.className = "card-rating";
    rBadge.textContent = "⭐" + rating;
    card.appendChild(rBadge);
  }

  /* Cover */
  const cover = document.createElement("div");
  cover.className = "card-cover";

  if (coverUrl) {
    const img = makeImg(coverUrl, title, "width:100%;height:100%;object-fit:cover;display:block;");
    cover.appendChild(img);
  } else {
    const fb = document.createElement("div");
    fb.className = "card-fallback";
    fb.textContent = "📖";
    cover.appendChild(fb);
  }

  if (status) {
    const statusEl = document.createElement("div");
    statusEl.className = "card-status";
    statusEl.textContent = status;
    cover.appendChild(statusEl);
  }

  card.appendChild(cover);

  /* Info */
  const info = document.createElement("div");
  info.className = "card-info";
  info.innerHTML =
    '<p class="card-title">' + title + '</p>' +
    '<p class="card-chapter">' + (short || "—") + '</p>' +
    (date ? '<p class="card-date">📅 ' + date + '</p>' : "");
  card.appendChild(info);

  card.onclick = () => {
    sessionStorage.setItem("novelData", JSON.stringify(novel));
    window.location.href = "/novel/" + novel.slug;
  };

  document.getElementById("novelGrid").appendChild(card);
}

/* ── HELPERS ──────────────────────────────────────── */
function updateLoadMoreBtn() {
  const wrap = document.getElementById("loadMoreWrap");
  const btn  = document.getElementById("loadMoreBtn");
  const info = document.getElementById("pageInfo");
  if (info) info.textContent = "— Halaman " + page + " —";
  wrap.style.display = "flex";
  if (hasNext) {
    btn.disabled = false;
    btn.textContent = "Muat Lebih Banyak";
  } else {
    btn.disabled = true;
    btn.textContent = "✦ Semua Telah Dimuat ✦";
  }
}

function makeSkeleton(n) {
  return Array(n).fill(
    "<div><div class='skel skel-img'></div><div class='skel skel-info'></div></div>"
  ).join("");
}

function emptyState(msg) {
  return `<div style="grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--muted);">
    <p style="font-family:'Cormorant Garamond',serif;font-size:36px;margin-bottom:12px;opacity:0.4">📖</p>
    <p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;">${msg}</p>
  </div>`;
}

function toggleDarkMode() {
  document.body.classList.toggle("light-mode");
}
function toggleMenu() {
  const m = document.getElementById("menuDropdown");
  if (m) m.style.display = m.style.display === "block" ? "none" : "block";
}
document.addEventListener("click", e => {
  const m   = document.getElementById("menuDropdown");
  const btn = document.querySelector('.hbtn[onclick="toggleMenu()"]');
  if (m && !m.contains(e.target) && !btn?.contains(e.target)) m.style.display = "none";
});
</script>
