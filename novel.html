<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel — Pankomik</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════
       NOVEL PAGE — INK & PARCHMENT LUXURY
    ═══════════════════════════════════════════════════════ */
    :root {
      --ink:    #0a0812;
      --ink2:   #120f1e;
      --ink3:   #1c1829;
      --parchment: #e8e0f0;
      --gold:   #c9a84c;
      --gold2:  rgba(201,168,76,0.15);
      --violet: #7c3aed;
      --violet2: rgba(124,58,237,0.18);
      --rose:   #e879a0;
      --text:   #ede8f5;
      --muted:  #7a6e8a;
      --border: rgba(255,255,255,0.07);
      --purple: #7c3aed;
      --purple-light: rgba(124,58,237,0.15);
      --r: 12px;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }

    body {
      background: var(--ink);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      /* Subtle noise texture */
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124,58,237,0.12) 0%, transparent 60%);
    }

    /* ── HERO ─────────────────────────────────────────────── */
    .novel-hero {
      position: relative;
      padding: 28px 20px 22px;
      text-align: center;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(124,58,237,0.1) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
    }
    .novel-hero::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(circle at 20% 50%, rgba(201,168,76,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(124,58,237,0.08) 0%, transparent 50%);
    }
    /* Dekoratif garis atas */
    .novel-hero::after {
      content: '';
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 60px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .novel-hero-icon {
      font-size: 36px; margin-bottom: 8px; display: block;
      filter: drop-shadow(0 0 12px rgba(201,168,76,0.4));
    }
    .novel-hero h1 {
      font-family: 'Cinzel', serif;
      font-size: 24px; font-weight: 700; letter-spacing: 4px;
      background: linear-gradient(135deg, #c9a84c 0%, #f0d080 50%, #c9a84c 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .novel-hero p {
      font-family: 'Lora', serif; font-size: 12px; font-style: italic;
      color: var(--muted); letter-spacing: 0.5px;
    }

    /* ── SEARCH BAR ──────────────────────────────────────── */
    .search-bar-wrap {
      padding: 14px 16px 8px;
      position: relative;
    }
    .search-bar-wrap input {
      width: 100%; padding: 11px 40px 11px 42px;
      border-radius: 99px;
      border: 1px solid rgba(124,58,237,0.3);
      background: rgba(124,58,237,0.08);
      color: var(--text); font-family: 'Nunito', sans-serif; font-size: 13px;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      box-sizing: border-box;
    }
    .search-bar-wrap input::placeholder { color: var(--muted); }
    .search-bar-wrap input:focus {
      border-color: var(--violet);
      background: rgba(124,58,237,0.13);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.12), 0 0 20px rgba(124,58,237,0.08);
    }
    .search-icon {
      position: absolute; left: 28px; top: 50%; transform: translateY(-50%);
      font-size: 14px; pointer-events: none; color: var(--muted);
    }
    .search-clear {
      position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 14px;
      color: var(--muted); display: none; padding: 4px; line-height: 1;
      transition: color 0.15s;
    }
    .search-clear.visible { display: block; }
    .search-clear:hover { color: var(--text); }

    /* ── TABS ────────────────────────────────────────────── */
    .novel-tabs {
      display: flex; gap: 6px; padding: 8px 16px 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .novel-tabs::-webkit-scrollbar { display: none; }
    .ntab {
      flex-shrink: 0; padding: 7px 16px; border-radius: 99px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--muted); font-family: 'Nunito', sans-serif;
      font-size: 12px; font-weight: 700; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
      letter-spacing: 0.3px;
    }
    .ntab:hover { border-color: rgba(124,58,237,0.4); color: var(--text); }
    .ntab.active {
      background: linear-gradient(135deg, rgba(124,58,237,0.9), rgba(124,58,237,0.7));
      border-color: transparent; color: #fff;
      box-shadow: 0 4px 14px rgba(124,58,237,0.35);
    }

    /* ── CHIPS PANEL ─────────────────────────────────────── */
    .chips-panel {
      display: none; padding: 10px 16px 6px;
      overflow-x: auto; scrollbar-width: none;
      gap: 6px; white-space: nowrap;
    }
    .chips-panel::-webkit-scrollbar { display: none; }
    .chips-panel.open { display: flex; }
    .chip {
      flex-shrink: 0; padding: 5px 14px; border-radius: 99px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--muted); font-family: 'Nunito', sans-serif;
      font-size: 11px; font-weight: 700; cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover { border-color: rgba(201,168,76,0.4); color: var(--gold); }
    .chip.active {
      background: var(--gold2); border-color: rgba(201,168,76,0.5);
      color: var(--gold); box-shadow: 0 2px 10px rgba(201,168,76,0.1);
    }

    /* ── TOOLBAR ─────────────────────────────────────────── */
    .novel-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 8px;
    }
    .novel-toolbar-title {
      font-family: 'Lora', serif; font-size: 14px; font-weight: 600;
      color: var(--text); font-style: italic;
    }
    .novel-count {
      font-size: 11px; color: var(--muted); font-weight: 600;
      background: rgba(255,255,255,0.05); padding: 3px 10px;
      border-radius: 99px; border: 1px solid var(--border);
    }

    /* ── GRID ────────────────────────────────────────────── */
    .novel-grid {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 12px; padding: 6px 16px 16px;
    }

    /* ── NOVEL CARD ──────────────────────────────────────── */
    .novel-card {
      background: var(--ink2); border-radius: var(--r); overflow: hidden;
      border: 1px solid var(--border); cursor: pointer; position: relative;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      -webkit-tap-highlight-color: transparent;
    }
    .novel-card::after {
      content: ''; position: absolute; inset: 0;
      border-radius: var(--r); pointer-events: none;
      background: linear-gradient(180deg, transparent 55%, rgba(10,8,18,0.92) 100%);
      z-index: 1;
    }
    .novel-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(124,58,237,0.2);
      border-color: rgba(124,58,237,0.25);
    }
    .novel-card:active { transform: scale(0.97); }

    .novel-img-area {
      position: relative; width: 100%; aspect-ratio: 2/3;
      background: var(--ink3); overflow: hidden;
    }
    .novel-img-area img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.4s ease;
    }
    .novel-card:hover .novel-img-area img { transform: scale(1.05); }

    .novel-card-fallback {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      background: linear-gradient(135deg, var(--ink3), rgba(124,58,237,0.2));
      font-size: 26px;
    }

    .novel-badge {
      position: absolute; top: 6px; left: 6px; z-index: 3;
      background: rgba(124,58,237,0.9); backdrop-filter: blur(6px);
      color: #fff; font-size: 8px; font-weight: 800;
      padding: 2px 7px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .novel-rating {
      position: absolute; top: 6px; right: 6px; z-index: 3;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);
      color: var(--gold); font-size: 8px; font-weight: 800;
      padding: 2px 6px; border-radius: 4px;
    }
    .novel-status {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
      padding: 20px 7px 5px;
      font-size: 8px; font-weight: 700; color: rgba(255,255,255,0.6);
      text-transform: uppercase; letter-spacing: 0.6px;
      background: linear-gradient(transparent, rgba(10,8,18,0.85));
    }

    .novel-info { padding: 8px 8px 10px; position: relative; z-index: 2; }
    .novel-title {
      font-weight: 700; font-size: 10.5px; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; line-height: 1.4; margin-bottom: 4px;
    }
    .novel-chapter {
      font-size: 9.5px; color: var(--muted);
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
      overflow: hidden; line-height: 1.3;
    }
    .novel-update-date {
      font-size: 9px; color: var(--muted); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.75;
    }

    /* ── SEARCH CARD ─────────────────────────────────────── */
    .novel-card.search-card {
      display: flex !important; flex-direction: row !important;
      gap: 12px; padding: 12px; align-items: flex-start; overflow: visible;
    }
    .novel-card.search-card::after { display: none; }
    .novel-card.search-card .search-cover {
      width: 64px; height: 90px; flex-shrink: 0;
      border-radius: 8px; overflow: hidden;
      background: var(--ink3);
    }
    .novel-card.search-card .search-cover img {
      width: 64px !important; height: 90px !important;
      aspect-ratio: unset !important; object-fit: cover !important;
      display: block !important; border-radius: 8px;
    }
    .novel-card.search-card .search-cover-fallback {
      width: 64px; height: 90px; flex-shrink: 0; border-radius: 8px;
      background: var(--ink3); display: flex;
      align-items: center; justify-content: center;
      font-size: 22px; color: var(--muted);
    }
    .novel-card.search-card .novel-badge  { position: static; display: inline-block; margin-bottom: 5px; }
    .novel-card.search-card .novel-rating { position: static; display: inline-block; margin-left: 4px; }
    .novel-card.search-card .novel-title  { font-size: 13px; -webkit-line-clamp: 3; }
    .novel-card.search-card .novel-status { position: static; background: none; padding: 0; color: var(--muted); font-size: 10px; }
    .novel-card.search-card .novel-info   { padding: 0; flex: 1; min-width: 0; }
    .novel-grid.search-mode { grid-template-columns: 1fr !important; }

    /* ── SKELETON ─────────────────────────────────────────── */
    .novel-skeleton {
      background: linear-gradient(90deg, var(--ink2) 0%, var(--ink3) 50%, var(--ink2) 100%);
      background-size: 200% 100%; animation: shimmer 1.6s infinite; border-radius: var(--r);
    }
    .novel-skeleton-img  { aspect-ratio: 2/3; border-radius: var(--r) var(--r) 0 0; }
    .novel-skeleton-info { height: 58px; border-radius: 0 0 var(--r) var(--r); margin-top: 2px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── LOAD MORE ───────────────────────────────────────── */
    #novelLoadMoreWrap {
      display: none; flex-direction: column; align-items: center;
      gap: 10px; padding: 16px 16px 32px;
    }
    #novelLoadMoreSpinner {
      display: none; grid-template-columns: repeat(3,1fr);
      gap: 12px; padding: 0 16px; width: 100%;
    }
    #novelPageInfo { font-size: 11px; color: var(--muted); font-weight: 600; }
    #novelLoadMoreBtn {
      position: relative; overflow: hidden;
      width: 100%; max-width: 340px; padding: 13px 20px; border-radius: 99px;
      border: 1px solid rgba(124,58,237,0.35);
      background: rgba(124,58,237,0.1);
      color: var(--text); font-family: 'Nunito', sans-serif;
      font-size: 13px; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.25s; letter-spacing: 0.3px;
    }
    #novelLoadMoreBtn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(124,58,237,0.6), rgba(201,168,76,0.3));
      opacity: 0; transition: opacity 0.25s;
    }
    #novelLoadMoreBtn:hover:not(:disabled)::before { opacity: 1; }
    #novelLoadMoreBtn:hover:not(:disabled) {
      border-color: rgba(124,58,237,0.6);
      box-shadow: 0 4px 20px rgba(124,58,237,0.25);
      transform: translateY(-2px);
    }
    #novelLoadMoreBtn:active:not(:disabled) { transform: scale(0.97); }
    #novelLoadMoreBtn:disabled { cursor: not-allowed; opacity: 0.4; }

    /* ── CARD ANIMATION ─────────────────────────────────── */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .novel-card { animation: cardIn 0.3s ease both; }
  </style>
</head>

<script type="module">
  import { initAuthHeader } from "/auth-header.js";
  initAuthHeader();

<script>
/* ============================================================
   novel.html — JavaScript
   APIs:
   - Home    : GET /novel/sakuranovel/home?page=N
   - Search  : GET /novel/sakuranovel/search?q=QUERY
   - Genres  : GET /novel/sakuranovel/genres
   - By genre: GET /novel/sakuranovel/genre/SLUG?page=N
   - Tags    : GET /novel/sakuranovel/tags
   - By tag  : GET /novel/sakuranovel/tag/SLUG?page=N
   ============================================================ */

const BASE = "https://www.sankavollerei.com/novel/sakuranovel";

/* ── State ─────────────────────────────────────────────────── */
let currentTab    = "home";
let activeGenre   = null;
let activeTag     = null;
let novelPage     = 1;
let novelHasNext  = false;
let novelLoading  = false;
let novelAllData  = [];
let totalLoaded   = 0;
let genreList     = [];
let tagList       = [];
let searchTimer   = null;
let isSearchMode  = false;

/* ============================================================
   IMAGE PROXY — proxy.sankavolereii.my.id
   Format: https://proxy.sankavolereii.my.id/{original_url_tanpa_encode}
   ============================================================ */
function proxyImg(url) {
  if (!url) return "";
  if (url.startsWith("data:")) return url;
  /* Jangan strip query params — kirim URL asli ke proxy */
  return "https://proxy.sankavolereii.my.id/" + url;
}

function createProxiedImg(originalUrl, altText, cssText) {
  var img = document.createElement("img");
  img.alt = altText || "";
  if (cssText) img.style.cssText = cssText;
  img.style.background = "var(--ink3, #1c1829)";

  if (!originalUrl) return img;

  var proxiedUrl = "https://proxy.sankavolereii.my.id/" + originalUrl;

  img.onerror = function () {
    img.onerror = null;
    var ph = document.createElement("div");
    ph.className = "novel-card-fallback";
    ph.style.cssText = "display:flex !important;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(135deg,#1c1829,rgba(124,58,237,0.2));";
    ph.textContent = "📖";
    if (img.parentNode) img.parentNode.replaceChild(ph, img);
    var sib = img.nextElementSibling;
    if (sib && sib.classList.contains("novel-card-fallback")) sib.style.display = "flex";
  };

  img.src = proxiedUrl;
  return img;
}

/* ── INIT ─────────────────────────────────────────────────── */
window.onload = async function () {
  if (localStorage.getItem("theme") === "light") document.body.classList.add("light");

  /* Cek filter redirect dari novel-detail.html */
  const filterType = sessionStorage.getItem("novelFilterType");
  const filterSlug = sessionStorage.getItem("novelFilterSlug");
  const filterName = sessionStorage.getItem("novelFilterName");
  sessionStorage.removeItem("novelFilterType");
  sessionStorage.removeItem("novelFilterSlug");
  sessionStorage.removeItem("novelFilterName");

  loadGenres();
  loadTags();

  if (filterType === "genre" && filterSlug) {
    currentTab  = "genre";
    activeGenre = filterSlug;
    document.querySelectorAll(".ntab").forEach(t => t.classList.remove("active"));
    document.getElementById("tab-genre").classList.add("active");
    document.getElementById("genreChipsPanel").classList.add("open");
    document.getElementById("toolbarTitle").textContent = "🏷️ " + (filterName || filterSlug);
    await fetchByGenre(filterSlug, 1, true);
    setTimeout(() => {
      document.querySelectorAll("#genreChipsPanel .chip").forEach(c => {
        c.classList.toggle("active", c.dataset.slug === filterSlug);
      });
    }, 600);
    return;
  }

  if (filterType === "tag" && filterSlug) {
    currentTab = "tag";
    activeTag  = filterSlug;
    document.querySelectorAll(".ntab").forEach(t => t.classList.remove("active"));
    document.getElementById("tab-tag").classList.add("active");
    document.getElementById("tagChipsPanel").classList.add("open");
    document.getElementById("toolbarTitle").textContent = "🔖 " + (filterName || filterSlug);
    await fetchByTag(filterSlug, 1, true);
    setTimeout(() => {
      document.querySelectorAll("#tagChipsPanel .chip").forEach(c => {
        c.classList.toggle("active", c.dataset.slug === filterSlug);
      });
    }, 600);
    return;
  }

  await novelFetch(1, true);

  window.addEventListener("scroll", () => {
    if (isSearchMode) return;
    const scrollBottom = window.scrollY + window.innerHeight;
    if (scrollBottom >= document.body.offsetHeight - 400 && novelHasNext && !novelLoading) {
      novelLoadMore();
    }
  }, { passive: true });
};

/* ============================================================
   TAB SWITCHING
   ============================================================ */
window.switchTab = function (tab) {
  if (isSearchMode) clearSearch();

  currentTab = tab;
  document.querySelectorAll(".ntab").forEach(t => t.classList.remove("active"));
  document.getElementById("tab-" + tab).classList.add("active");

  const inp = document.getElementById("novelSearchInput");
  if (inp) {
    if (tab === "genre") inp.placeholder = "Cari genre...";
    else if (tab === "tag") inp.placeholder = "Cari tag...";
    else inp.placeholder = "Cari judul novel...";
  }

  document.getElementById("genreChipsPanel").classList.remove("open");
  document.getElementById("tagChipsPanel").classList.remove("open");

  if (tab === "home") {
    activeGenre = null; activeTag = null;
    document.getElementById("toolbarTitle").textContent = "🆕 Update Terbaru";
    novelFetch(1, true);
  } else if (tab === "genre") {
    document.getElementById("genreChipsPanel").classList.add("open");
    if (!activeGenre && genreList.length > 0) selectGenre(genreList[0].slug, genreList[0].name);
    else if (activeGenre) fetchByGenre(activeGenre, 1, true);
  } else if (tab === "tag") {
    document.getElementById("tagChipsPanel").classList.add("open");
    if (!activeTag && tagList.length > 0) selectTag(tagList[0].slug, tagList[0].name);
    else if (activeTag) fetchByTag(activeTag, 1, true);
  }
};

/* ============================================================
   SEARCH
   ============================================================ */
window.onSearchInput = function (val) {
  const clearBtn = document.getElementById("searchClearBtn");
  clearBtn.classList.toggle("visible", val.length > 0);
  clearTimeout(searchTimer);

  if (!val.trim()) {
    if (currentTab === "genre") { filterChips("genreChipsPanel", ""); return; }
    if (currentTab === "tag")   { filterChips("tagChipsPanel",   ""); return; }
    if (isSearchMode) clearSearch();
    return;
  }

  if (currentTab === "genre") { filterChips("genreChipsPanel", val.trim()); return; }
  if (currentTab === "tag")   { filterChips("tagChipsPanel",   val.trim()); return; }

  searchTimer = setTimeout(() => doSearch(val.trim()), 500);
};

function filterChips(panelId, query) {
  const panel = document.getElementById(panelId);
  if (!panel) return;
  const q = query.toLowerCase();
  panel.querySelectorAll(".chip").forEach(chip => {
    chip.style.display = (!q || chip.textContent.toLowerCase().includes(q)) ? "" : "none";
  });
}

window.clearSearch = function () {
  const input = document.getElementById("novelSearchInput");
  const clearBtn = document.getElementById("searchClearBtn");
  input.value = "";
  clearBtn.classList.remove("visible");
  isSearchMode = false;
  document.getElementById("novelGrid").classList.remove("search-mode");
  switchTab(currentTab);
};

async function doSearch(query) {
  isSearchMode = true;
  const grid = document.getElementById("novelGrid");
  grid.innerHTML = makeSkeleton(6);
  grid.classList.add("search-mode");
  document.getElementById("novelLoadMoreWrap").style.display = "none";
  document.getElementById("novelCount").textContent = "";
  document.getElementById("toolbarTitle").textContent = '🔍 "' + query + '"';

  try {
    const res  = await fetch(BASE + "/search?q=" + encodeURIComponent(query));
    const json = await res.json();
    const list = json.data?.results || [];
    grid.innerHTML = "";
    if (list.length === 0) {
      grid.innerHTML = emptyState('Tidak ada hasil untuk "<strong>' + query + '</strong>"');
    } else {
      list.forEach(n => appendSearchCard(n));
      document.getElementById("novelCount").textContent = list.length + " hasil";
    }
  } catch (err) {
    console.error("Search error:", err);
    grid.innerHTML = emptyState("Gagal mencari. Cek koneksimu.");
  }
}

function appendSearchCard(novel) {
  if (!novel?.slug) return;
  const originalUrl = novel.poster || novel.cover || novel.image || novel.thumbnail || novel.img || novel.cover_url || "";
  const title   = novel.title || "Untitled";
  const rating  = novel.rating ? "⭐ " + novel.rating : "";
  const type    = novel.type || "Novel";
  const status  = novel.status && novel.status !== "Unknown" ? novel.status : "";

  const card = document.createElement("div");
  card.className = "novel-card search-card";

  /* ── Cover wrapper — penting agar CSS override tidak bentrok ── */
  const coverWrap = document.createElement("div");
  coverWrap.className = "search-cover";

  if (originalUrl) {
    /* Buat img langsung (bukan createProxiedImg) agar style-nya terkontrol */
    const img = createProxiedImg(
      originalUrl, title,
      "width:60px;height:85px;object-fit:cover;display:block;flex-shrink:0;border-radius:7px;"
    );
    /* Paksa dimensi via attribute juga agar tidak di-override CSS lain */
    img.setAttribute("width", "60");
    img.setAttribute("height", "85");
    coverWrap.appendChild(img);
  } else {
    const fb = document.createElement("div");
    fb.className = "search-cover-fallback";
    fb.textContent = "📖";
    coverWrap.appendChild(fb);
  }
  card.appendChild(coverWrap);

  /* ── Info section ── */
  const info = document.createElement("div");
  info.className = "novel-info";
  info.innerHTML =
    '<div style="display:flex;align-items:center;gap:4px;margin-bottom:5px;flex-wrap:wrap;">' +
      '<span class="novel-badge">' + type + '</span>' +
      (rating ? '<span class="novel-rating">' + rating + '</span>' : '') +
    '</div>' +
    '<p class="novel-title">' + title + '</p>' +
    (status ? '<p class="novel-status">' + status + '</p>' : '');
  card.appendChild(info);

  card.onclick = () => {
    sessionStorage.setItem("novelData", JSON.stringify(novel));
    window.location.href = "/novel/" + novel.slug;
  };
  document.getElementById("novelGrid").appendChild(card);
}

/* ============================================================
   GENRE & TAG
   ============================================================ */
async function loadGenres() {
  try {
    const res  = await fetch(BASE + "/genres");
    const json = await res.json();
    genreList  = json.data || [];
    renderChips("genreChipsPanel", genreList, "genre");
    if (currentTab === "genre" && !activeGenre && genreList.length > 0) {
      selectGenre(genreList[0].slug, genreList[0].name);
    }
  } catch (err) { console.error("Gagal load genres:", err); }
}

async function loadTags() {
  try {
    const res  = await fetch(BASE + "/tags");
    const json = await res.json();
    tagList    = json.data || [];
    renderChips("tagChipsPanel", tagList, "tag");
    if (currentTab === "tag" && !activeTag && tagList.length > 0) {
      selectTag(tagList[0].slug, tagList[0].name);
    }
  } catch (err) { console.error("Gagal load tags:", err); }
}

window.selectGenre = function (slug, name) {
  if (isSearchMode) return;
  activeGenre = slug;
  document.querySelectorAll("#genreChipsPanel .chip").forEach(c => {
    c.classList.toggle("active", c.dataset.slug === slug);
  });
  document.getElementById("toolbarTitle").textContent = "🏷️ " + name;
  fetchByGenre(slug, 1, true);
};

window.selectTag = function (slug, name) {
  if (isSearchMode) return;
  activeTag = slug;
  document.querySelectorAll("#tagChipsPanel .chip").forEach(c => {
    c.classList.toggle("active", c.dataset.slug === slug);
  });
  document.getElementById("toolbarTitle").textContent = "🔖 " + name;
  fetchByTag(slug, 1, true);
};

async function fetchByGenre(slug, page, reset) {
  await fetchFiltered(BASE + "/genre/" + slug, page, reset);
}
async function fetchByTag(slug, page, reset) {
  await fetchFiltered(BASE + "/tag/" + slug, page, reset);
}

/* ============================================================
   FETCH FILTERED (genre/tag)
   ============================================================ */
async function fetchFiltered(url, page, reset) {
  novelLoading = true;
  if (reset) {
    novelPage = 1; novelHasNext = false; totalLoaded = 0;
    document.getElementById("novelGrid").innerHTML = makeSkeleton(6);
    document.getElementById("novelGrid").classList.remove("search-mode");
    document.getElementById("novelCount").textContent = "";
    document.getElementById("novelLoadMoreWrap").style.display = "none";
  }
  try {
    const fetchUrl = page > 1 ? url + (url.includes("?") ? "&" : "?") + "page=" + page : url;
    const res  = await fetch(fetchUrl);
    const json = await res.json();
    const list = json.data?.results || [];
    const pag  = json.data?.pagination || {};
    novelHasNext = pag.hasNext ?? false;
    novelPage    = page;
    if (reset) document.getElementById("novelGrid").innerHTML = "";
    list.forEach(n => appendNovelCard(n));
    totalLoaded += list.length;
    document.getElementById("novelCount").textContent = totalLoaded + " novel";
    updateNovelBtn();
  } catch (err) {
    console.error("Fetch filtered error:", err);
    if (reset) document.getElementById("novelGrid").innerHTML = emptyState("Gagal memuat. Coba lagi.");
  } finally {
    novelLoading = false;
    document.getElementById("novelLoadMoreSpinner").style.display = "none";
  }
}

/* ============================================================
   HOME FETCH
   ============================================================ */
async function novelFetch(page, reset) {
  novelLoading = true;
  if (reset) {
    novelPage = 1; novelHasNext = false; novelAllData = []; totalLoaded = 0;
    document.getElementById("novelGrid").innerHTML = makeSkeleton(6);
    document.getElementById("novelGrid").classList.remove("search-mode");
    document.getElementById("novelCount").textContent = "";
    document.getElementById("novelLoadMoreWrap").style.display = "none";
  }
  try {
    const res  = await fetch(BASE + "/home?page=" + page);
    const json = await res.json();
    if (json.status !== "success") throw new Error("API error");
    const list = json.data?.results || [];
    const pag  = json.data?.pagination || {};
    novelHasNext = pag.hasNext ?? false;
    novelPage    = page;
    if (reset) document.getElementById("novelGrid").innerHTML = "";
    /* Debug: log data novel pertama ke console */
    if (list.length > 0 && novelPage === 1) {
      console.log("[Pankomik Novel] Sample data:", JSON.stringify(list[0], null, 2));
    }
    list.forEach(n => appendNovelCard(n));
    novelAllData = novelAllData.concat(list);
    totalLoaded += list.length;
    document.getElementById("novelCount").textContent = totalLoaded + " novel dimuat";
    updateNovelBtn();
  } catch (err) {
    console.error("Gagal fetch novel:", err);
    if (reset) document.getElementById("novelGrid").innerHTML = emptyState("Gagal memuat novel. Cek koneksimu.");
  } finally {
    novelLoading = false;
    document.getElementById("novelLoadMoreSpinner").style.display = "none";
  }
}

/* ============================================================
   LOAD MORE
   ============================================================ */
window.novelLoadMore = async function () {
  if (novelLoading || !novelHasNext) return;
  novelLoading = true;
  const btn     = document.getElementById("novelLoadMoreBtn");
  const spinner = document.getElementById("novelLoadMoreSpinner");
  if (btn)     { btn.disabled = true; btn.textContent = "Memuat..."; }
  if (spinner) spinner.style.display = "grid";

  try {
    const nextPage = novelPage + 1;
    if (currentTab === "home")                  await novelFetch(nextPage, false);
    else if (currentTab === "genre" && activeGenre) await fetchFiltered(BASE + "/genre/" + activeGenre, nextPage, false);
    else if (currentTab === "tag"   && activeTag)   await fetchFiltered(BASE + "/tag/"   + activeTag,   nextPage, false);
  } catch (err) {
    console.error("Load more error:", err);
    if (btn) { btn.textContent = "⚠️ Coba Lagi"; btn.style.borderColor = "var(--purple)"; btn.style.color = "var(--purple)"; }
  } finally {
    novelLoading = false;
    if (btn) btn.disabled = false;
    if (spinner) spinner.style.display = "none";
  }
};

/* ============================================================
   RENDER HELPERS
   ============================================================ */
function appendNovelCard(novel) {
  if (!novel?.slug) return;
  const originalUrl = novel.poster || novel.cover || novel.image || novel.thumbnail || novel.img || novel.cover_url || novel.poster_url || novel.picture || "";
  if (!originalUrl && novel.slug) console.warn("[Pankomik] No cover for:", novel.slug, "keys:", Object.keys(novel));
  const title   = novel.title || "Untitled";
  const chapter    = novel.latest_chapter || novel.chapter || "";
  const short      = chapter.length > 60 ? chapter.slice(0, 57) + "…" : chapter;
  const rating     = novel.rating || "";
  const type       = novel.type || "Novel";
  const status     = novel.status && novel.status !== "Unknown" ? novel.status : "";
  const lastUpdate = novel.last_update || novel.updated_at || novel.update_date || novel.date || novel.time || "";

  const card = document.createElement("div");
  card.className = "novel-card";

  /* Badge & rating overlay (position absolute, dirender via innerHTML) */
  card.insertAdjacentHTML("afterbegin",
    '<span class="novel-badge">' + type + '</span>' +
    (rating ? '<span class="novel-rating">⭐' + rating + '</span>' : "")
  );

  /* Image area */
  const imgArea = document.createElement("div");
  imgArea.className = "novel-img-area";

  const fallback = document.createElement("div");
  fallback.className = "novel-card-fallback";
  fallback.style.display = "none";
  fallback.textContent = "📖";

  if (originalUrl) {
    const img = createProxiedImg(originalUrl, title, "width:100%;height:100%;object-fit:cover;display:block;");
    imgArea.appendChild(img);
    imgArea.appendChild(fallback);
  } else {
    fallback.style.display = "flex";
    imgArea.appendChild(fallback);
  }

  if (status) {
    const statusEl = document.createElement("div");
    statusEl.className = "novel-status";
    statusEl.textContent = status;
    imgArea.appendChild(statusEl);
  }

  card.appendChild(imgArea);

  /* Info */
  const info = document.createElement("div");
  info.className = "novel-info";
  info.innerHTML =
    '<p class="novel-title">' + title + '</p>' +
    '<p class="novel-chapter">' + (short || "–") + '</p>' +
    (lastUpdate ? '<p class="novel-update-date">🕐 ' + lastUpdate + '</p>' : "");
  card.appendChild(info);

  card.onclick = () => {
    sessionStorage.setItem("novelData", JSON.stringify(novel));
    window.location.href = "/novel/" + novel.slug;
  };
  document.getElementById("novelGrid").appendChild(card);
}

function renderChips(panelId, list, type) {
  const panel = document.getElementById(panelId);
  if (!panel || !list.length) return;
  panel.innerHTML = list.map(item =>
    '<button class="chip" data-slug="' + item.slug + '" onclick="' +
      (type === "genre" ? "selectGenre" : "selectTag") +
      "('" + item.slug + "','" + item.name.replace(/'/g, "\\'") + "')" +
    '">' + item.name +
      '<span style="font-size:9px;opacity:0.6;margin-left:3px;">' + item.count + '</span>' +
    '</button>'
  ).join("");
}

function updateNovelBtn() {
  const wrap = document.getElementById("novelLoadMoreWrap");
  const btn  = document.getElementById("novelLoadMoreBtn");
  const info = document.getElementById("novelPageInfo");
  if (info) info.textContent = "Halaman " + novelPage;
  wrap.style.display = "flex";
  if (novelHasNext) {
    btn.disabled = false; btn.textContent = "Muat Lebih Banyak ↓";
    btn.style.opacity = "1"; btn.style.borderColor = ""; btn.style.color = "";
  } else {
    btn.disabled = true; btn.textContent = "✅ Semua Sudah Dimuat";
  }
}

function makeSkeleton(n) {
  return Array(n).fill(
    "<div><div class='novel-skeleton novel-skeleton-img'></div>" +
    "<div class='novel-skeleton novel-skeleton-info'></div></div>"
  ).join("");
}

function emptyState(msg) {
  return '<div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--text-muted);">' +
    '<p style="font-size:32px;margin-bottom:8px;">😕</p><p>' + msg + '</p></div>';
}

/* ── Utils ─────────────────────────────────────────────────── */
function toggleDarkMode() {
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
}
function toggleMenu() {
  const m = document.getElementById("menuDropdown");
  if (m) m.style.display = m.style.display === "block" ? "none" : "block";
}
document.addEventListener("click", e => {
  const m   = document.getElementById("menuDropdown");
  const btn = document.querySelector('button[onclick="toggleMenu()"]');
  if (m && !m.contains(e.target) && !btn?.contains(e.target)) m.style.display = "none";
});
