<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader — Pankomik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/reader.css">
  <style>
    :root {
      --accent:      #e8522a;
      --accent-dark: #b83a18;
      --accent-glow: rgba(232,82,42,0.28);
      --bg-reader:   #06060d;
      --glass:       rgba(8,8,16,0.92);
      --glass-b:     rgba(255,255,255,0.07);
    }

    /* ═══════════════════════════════════════
       PROGRESS BAR — refined
    ═══════════════════════════════════════ */
    #readingProgressBar {
      position: fixed; top: 0; left: 0;
      height: 2px; width: 0%;
      background: linear-gradient(90deg, var(--accent), #f5a623, #ff6b6b, var(--accent));
      background-size: 300% 100%;
      animation: progressShimmer 2.5s linear infinite;
      z-index: 1200;
      transition: width 0.12s linear;
      box-shadow: 0 0 16px var(--accent-glow), 0 0 4px rgba(245,166,35,0.4);
    }
    @keyframes progressShimmer {
      0%   { background-position: 200% 0 }
      100% { background-position: -200% 0 }
    }

    /* ═══════════════════════════════════════
       FLOATING HEADER — Refined pill
    ═══════════════════════════════════════ */
    .reader-header {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1100;

      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 9px;
      border-radius: 999px;
      max-width: calc(100vw - 20px);
      width: max-content;

      background: var(--glass);
      backdrop-filter: blur(28px) saturate(1.8);
      -webkit-backdrop-filter: blur(28px) saturate(1.8);
      border: 1px solid var(--glass-b);
      box-shadow:
        0 12px 40px rgba(0,0,0,0.7),
        0 0 0 1px rgba(255,255,255,0.04),
        inset 0 1px 0 rgba(255,255,255,0.09);

      transition:
        opacity 0.3s cubic-bezier(.4,0,.2,1),
        transform 0.3s cubic-bezier(.4,0,.2,1);
      will-change: opacity, transform;
    }

    .reader-header.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(-72px);
      pointer-events: none;
    }

    /* Home button */
    .reader-header .rh-home {
      width: 33px; height: 33px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      color: #bbb; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .reader-header .rh-home:hover {
      background: rgba(255,255,255,0.13);
      color: #fff;
      transform: scale(1.08);
    }

    /* Title */
    .reader-header .rh-title {
      font-size: 12px; font-weight: 800;
      color: rgba(255,255,255,0.7);
      max-width: 130px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      flex-shrink: 1;
      font-family: 'Syne', sans-serif;
      letter-spacing: 0.3px;
    }

    /* Divider */
    .rh-divider {
      width: 1px; height: 18px;
      background: rgba(255,255,255,0.09);
      flex-shrink: 0;
    }

    /* Nav prev/next */
    .rh-nav {
      display: flex; align-items: center; gap: 3px; flex-shrink: 0;
    }
    .rh-nav-btn {
      height: 33px; padding: 0 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.75);
      font-size: 11px; font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .rh-nav-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.11);
      color: #fff;
      border-color: rgba(255,255,255,0.16);
    }
    .rh-nav-btn:active:not(:disabled) { transform: scale(0.91); }
    .rh-nav-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
      pointer-events: none;
    }
    .rh-nav-btn.next:not(:disabled) {
      background: rgba(232,82,42,0.12);
      border-color: rgba(232,82,42,0.28);
      color: #f59080;
    }
    .rh-nav-btn.next:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    /* Action buttons */
    .rh-actions {
      display: flex; align-items: center; gap: 2px; flex-shrink: 0;
    }
    .rh-btn {
      width: 31px; height: 31px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.14s;
      -webkit-tap-highlight-color: transparent;
    }
    .rh-btn:hover {
      background: rgba(255,255,255,0.09);
      color: #fff;
      transform: scale(1.1);
    }
    .rh-btn:active { transform: scale(0.88); }

    /* ═══════════════════════════════════════
       BOTTOM NAV — refined floating pill
    ═══════════════════════════════════════ */
    #floatingBottomNav {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1100;

      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 7px;
      border-radius: 999px;

      background: var(--glass);
      backdrop-filter: blur(28px) saturate(1.8);
      -webkit-backdrop-filter: blur(28px) saturate(1.8);
      border: 1px solid var(--glass-b);
      box-shadow:
        0 12px 40px rgba(0,0,0,0.6),
        0 0 0 1px rgba(255,255,255,0.04),
        inset 0 1px 0 rgba(255,255,255,0.07);

      transition:
        opacity 0.3s cubic-bezier(.4,0,.2,1),
        transform 0.3s cubic-bezier(.4,0,.2,1);
      will-change: opacity, transform;
    }
    #floatingBottomNav.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(70px);
      pointer-events: none;
    }

    .fbn-btn {
      height: 35px; padding: 0 13px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.7);
      font-size: 11px; font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      transition: all 0.14s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .fbn-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.11);
      color: #fff;
    }
    .fbn-btn:active:not(:disabled) { transform: scale(0.93); }
    .fbn-btn:disabled { opacity: 0.2; pointer-events: none; }

    .fbn-btn.next-ch:not(:disabled) {
      background: linear-gradient(135deg, var(--accent), #c73f1c);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 18px var(--accent-glow);
    }
    .fbn-btn.next-ch:hover:not(:disabled) {
      box-shadow: 0 6px 26px rgba(232,82,42,0.55);
      transform: translateY(-1px);
    }

    .fbn-sep {
      width: 1px; height: 20px;
      background: rgba(255,255,255,0.08);
      flex-shrink: 0;
    }

    .fbn-center-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 10px;
      height: 35px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.45);
      font-size: 11px; font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }
    .fbn-center-btn:hover {
      background: rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.8);
    }
    .fbn-center-btn:active { transform: scale(0.93); }
    .fbn-center-icon { font-size: 13px; opacity: 0.65; }

    /* ═══════════════════════════════════════
       AUTH DROPDOWN
    ═══════════════════════════════════════ */
    .dropdown {
      display: none; position: fixed;
      right: 10px; top: 70px; z-index: 2000;
      background: rgba(10,10,18,0.98);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; overflow: hidden;
      min-width: 162px;
      box-shadow: 0 16px 50px rgba(0,0,0,0.65);
      animation: dropIn 0.16s cubic-bezier(.4,0,.2,1);
    }
    @keyframes dropIn {
      from { opacity:0; transform:translateY(-10px) scale(.96) }
      to   { opacity:1; transform:translateY(0)    scale(1)   }
    }
    .dropdown p {
      padding: 12px 16px; cursor: pointer; font-size: 13px; font-weight: 700;
      color: #eaeaf0; margin: 0; border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: all 0.12s;
    }
    .dropdown p:last-child { border-bottom: none; }
    .dropdown p:hover { background: rgba(255,255,255,0.06); padding-left: 20px; }

    /* ═══════════════════════════════════════
       CHAPTER LIST PANEL
    ═══════════════════════════════════════ */
    #chapterListPanel.open { left: 0 !important; }

    .chapter-list-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: linear-gradient(135deg, rgba(232,82,42,0.12), rgba(232,82,42,0.04));
      flex-shrink: 0;
    }
    .chapter-list-header h3 {
      font-size: 14px; font-weight: 900;
      color: var(--accent); margin: 0;
      font-family: 'Syne', sans-serif;
    }
    .chapter-list-header .close-btn {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
      color: #eaeaf0; width: 30px; height: 30px; border-radius: 9px; cursor: pointer;
      font-size: 14px; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .chapter-list-header .close-btn:hover {
      background: rgba(255,255,255,0.13);
      transform: rotate(90deg);
    }

    .chapter-list-content { flex: 1; overflow-y: auto; padding: 4px 0; }

    .chapter-item-panel {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 18px; cursor: pointer; font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      border-left: 3px solid transparent;
      transition: all 0.14s;
      -webkit-tap-highlight-color: transparent;
    }
    .chapter-item-panel:hover { background: rgba(255,255,255,0.04); padding-left: 22px; }
    .chapter-item-panel.active {
      background: rgba(232,82,42,0.1);
      border-left-color: var(--accent); color: var(--accent); font-weight: 800;
    }
    .chapter-item-panel.active .chapter-num { color: var(--accent); }
    .chapter-num  { font-weight: 700; color: #eaeaf0; }
    .chapter-date { font-size: 11px; color: #555; }

    /* ═══════════════════════════════════════
       SINGLE-PAGE CONTROLS
    ═══════════════════════════════════════ */
    #singleControls {
      display: none; position: fixed;
      bottom: 0; left: 0; right: 0; z-index: 990;
      background: rgba(6,6,13,0.96);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 12px 16px;
      align-items: center; justify-content: space-between; gap: 10px;
    }
    #singleControls button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      color: #eaeaf0; padding: 10px 20px;
      border-radius: 12px; cursor: pointer;
      font-size: 14px; font-family: 'Nunito', sans-serif; font-weight: 800;
      transition: all 0.15s;
      display: flex; align-items: center; gap: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    #singleControls button:hover  { background: rgba(255,255,255,0.12); }
    #singleControls button:active { transform: scale(0.94); }
    #singleControls button:disabled { opacity: 0.22; cursor: not-allowed; pointer-events: none; }
    #singleControls button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border-color: transparent; color: #fff; flex: 1;
      justify-content: center; box-shadow: 0 4px 16px var(--accent-glow);
    }
    #singleControls button.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(232,82,42,0.4);
    }
    #pageCounter {
      font-size: 13px; font-weight: 800; color: #555;
      white-space: nowrap; min-width: 60px; text-align: center;
      font-family: 'Syne', sans-serif;
    }

    /* ═══════════════════════════════════════
       READER LOADING / ERROR
    ═══════════════════════════════════════ */
    .reader-loading {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 70vh; gap: 18px; color: #555;
    }
    .reader-spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(232,82,42,0.12);
      border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.65s linear infinite;
      box-shadow: 0 0 20px rgba(232,82,42,0.15);
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .reader-loading-text {
      font-size: 13px; font-weight: 700; color: #444;
      font-family: 'Syne', sans-serif; letter-spacing: 1px;
      text-transform: uppercase;
    }

    .reader-error {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; gap: 14px; color: #666; text-align: center;
    }
    .btn-retry {
      padding: 11px 28px; border: none; border-radius: 12px;
      cursor: pointer; font-weight: 800; font-size: 13px;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff;
      transition: all 0.2s; box-shadow: 0 4px 16px var(--accent-glow);
    }
    .btn-retry:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-glow); }
    .btn-retry:active { transform: scale(0.95); }
    .btn-home  { background: rgba(255,255,255,0.07); color: #eaeaf0; border: 1px solid rgba(255,255,255,0.1); box-shadow: none; }
    .btn-home:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }

    /* ═══════════════════════════════════════
       MISC
    ═══════════════════════════════════════ */
    .image-error {
      display: flex; flex-direction: column; align-items: center;
      padding: 40px; gap: 10px; color: #555;
      background: #0d0d18;
      border: 1px dashed rgba(255,255,255,0.08);
    }
    .image-error button {
      padding: 8px 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: 800;
      font-family: 'Nunito', sans-serif;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    @keyframes toastIn {
      from { opacity:0; transform:translateY(10px) scale(0.96); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    /* Reader padding */
    #reader { padding-top: 66px; }

    /* ═══════════════════════════════════════
       TAP HINT OVERLAY (satu kali muncul)
    ═══════════════════════════════════════ */
    #tapHint {
      position: fixed; inset: 0; z-index: 3000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      gap: 16px;
      animation: fadeInHint 0.4s ease;
      pointer-events: all;
    }
    #tapHint.gone { display: none; }
    @keyframes fadeInHint {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .tap-hint-icon { font-size: 52px; animation: pulse 1.6s ease infinite; }
    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: 0.9; }
      50%      { transform: scale(1.12); opacity: 1; }
    }
    .tap-hint-text {
      font-size: 15px; font-weight: 800;
      color: rgba(255,255,255,0.85);
      font-family: 'Syne', sans-serif;
      letter-spacing: 0.5px;
      text-align: center; padding: 0 30px;
    }
    .tap-hint-sub {
      font-size: 12px; color: rgba(255,255,255,0.4);
      font-weight: 600;
    }
    .tap-hint-dismiss {
      margin-top: 8px;
      padding: 10px 28px;
      background: rgba(232,82,42,0.9);
      border: none; border-radius: 999px;
      color: #fff; font-size: 13px; font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(232,82,42,0.4);
    }
  </style>
</head>
<body>

<div id="readingProgressBar"></div>

<!-- TAP HINT — hanya muncul satu kali -->
<div id="tapHint" class="gone">
  <div class="tap-hint-icon">👆</div>
  <div class="tap-hint-text">Tap layar untuk sembunyikan / tampilkan navigasi</div>
  <div class="tap-hint-sub">Ketuk gambar komik untuk toggle</div>
  <button class="tap-hint-dismiss" onclick="dismissHint()">Mengerti!</button>
</div>

<!-- ═══ FLOATING HEADER PILL ═══ -->
<div class="reader-header" id="readerHeader">
  <button class="rh-home" onclick="goHome()" title="Beranda">🏠</button>
  <span class="rh-title" id="title">Memuat...</span>
  <div class="rh-divider"></div>
  <div class="rh-nav">
    <button id="prevBtn" class="rh-nav-btn" onclick="prevChapter()" disabled>
      ← <span class="rh-nav-label">Prev</span>
    </button>
    <button id="nextBtn" class="rh-nav-btn next" onclick="nextChapter()" disabled>
      <span class="rh-nav-label">Next</span> →
    </button>
  </div>
  <div class="rh-divider"></div>
  <div class="rh-actions">
    <button class="rh-btn" onclick="toggleChapterList()" title="Daftar Chapter">📚</button>
    <button class="rh-btn" onclick="shareKomik()" title="Bagikan">🔗</button>
    <button class="rh-btn" onclick="toggleSettings()" title="Pengaturan">⚙️</button>
    <button class="rh-btn" onclick="toggleMenu()" title="Akun">👤</button>
  </div>
</div>

<!-- ═══ FLOATING BOTTOM NAV ═══ -->
<div id="floatingBottomNav">
  <button id="fbnPrev" class="fbn-btn" onclick="prevChapter()" disabled>← Prev</button>
  <div class="fbn-sep"></div>
  <button class="fbn-center-btn" onclick="toggleChapterList()" title="Daftar Chapter">
    <span id="fbnInfo">—</span>
    <span class="fbn-center-icon">📚</span>
  </button>
  <div class="fbn-sep"></div>
  <button id="fbnNext" class="fbn-btn next-ch" onclick="nextChapter()" disabled>Next →</button>
</div>

<div id="menuDropdown" class="dropdown"></div>

<!-- Settings panel -->
<div class="settings" id="settings">
  <h3>⚙️ Pengaturan</h3>

  <label>Mode Baca</label>
  <select id="mode" onchange="changeMode(this.value)">
    <option value="scroll">📜 Scroll (Webtoon)</option>
    <option value="single">📖 Per Halaman (Manga)</option>
  </select>

  <div id="scrollSettings">
    <label>Lebar Gambar</label>
    <input type="range" id="width" min="50" max="100" value="100">
    <label>Kecepatan Auto Scroll</label>
    <input type="range" id="speed" min="1" max="10" value="3">
    <button class="btn-auto" id="autoBtn" onclick="toggleAutoScroll()">▶️ Auto Scroll</button>
  </div>

  <div id="singleSettings" style="display:none;">
    <p style="font-size:12px;color:#666;margin-top:12px;line-height:1.7;">
      Navigasi halaman:<br>
      ← → atau
      <kbd style="background:#141420;padding:2px 6px;border-radius:5px;border:1px solid rgba(255,255,255,0.1);">A</kbd>
      <kbd style="background:#141420;padding:2px 6px;border-radius:5px;border:1px solid rgba(255,255,255,0.1);">D</kbd>
    </p>
  </div>
</div>

<!-- Chapter list overlay -->
<div id="chapterListOverlay"
     style="display:none;position:fixed;inset:0;z-index:1499;background:rgba(0,0,0,0.6);backdrop-filter:blur(2px);"
     onclick="toggleChapterList()"></div>

<!-- Chapter list panel -->
<div id="chapterListPanel" style="
  position:fixed;top:0;left:-320px;width:300px;height:100vh;
  background:rgba(8,8,16,0.99);backdrop-filter:blur(22px);
  border-right:1px solid rgba(255,255,255,0.06);
  z-index:1500;overflow:hidden;display:flex;flex-direction:column;
  transition:left 0.3s cubic-bezier(.4,0,.2,1);
  box-shadow:6px 0 40px rgba(0,0,0,0.7);
"></div>

<div id="reader"></div>

<div id="readerCommentSection"
  style="max-width:800px;margin:0 auto;background:#06060d;padding-bottom:110px;"></div>

<div id="singleControls">
  <button id="prevPageBtn" onclick="prevPage()">← Prev</button>
  <span id="pageCounter">1 / ?</span>
  <button id="nextPageBtn" class="primary" onclick="nextPage()">Next →</button>
</div>

<!-- ═══ SCROLL BEHAVIOR CONTROLLER ═══ -->
<script>
(function () {
  const header    = document.getElementById("readerHeader");
  const bottomNav = document.getElementById("floatingBottomNav");

  let lastY     = window.scrollY;
  let ticking   = false;
  let hideTimer = null;
  let isVisible = true;

  const HIDE_SCROLL_DOWN = 55;
  const SHOW_SCROLL_UP   = 6;
  const AUTO_HIDE_MS     = 4500;

  function show() {
    if (isVisible) return;
    isVisible = true;
    header.classList.remove("hidden");
    bottomNav.classList.remove("hidden");
    resetAutoHide();
  }

  function hide() {
    if (!isVisible) return;
    isVisible = false;
    header.classList.add("hidden");
    bottomNav.classList.add("hidden");
    clearTimeout(hideTimer);
  }

  function resetAutoHide() {
    clearTimeout(hideTimer);
    if (window.scrollY > 120) {
      hideTimer = setTimeout(hide, AUTO_HIDE_MS);
    }
  }

  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const y    = window.scrollY;
      const diff = y - lastY;
      if (diff > HIDE_SCROLL_DOWN)     hide();
      else if (diff < -SHOW_SCROLL_UP) show();
      lastY   = y;
      ticking = false;
    });
  }, { passive: true });

  window.addEventListener("readerChapterLoaded", () => { show(); });

  window._navShow    = show;
  window._navHide    = hide;
  window._navVisible = () => isVisible;

  // Show tap hint on first visit
  if (!localStorage.getItem("tapHintDone")) {
    setTimeout(() => {
      const hint = document.getElementById("tapHint");
      if (hint) hint.classList.remove("gone");
    }, 2000);
  }
})();

window.dismissHint = function() {
  const hint = document.getElementById("tapHint");
  if (hint) hint.classList.add("gone");
  localStorage.setItem("tapHintDone", "1");
};
</script>

<script type="module">
  import { initAuthHeader } from "/auth-header.js";
  initAuthHeader();
</script>
<script type="module" src="/reader.js"></script>
<script type="module">
  import { getCurrentUser } from "/supabase.js";
  import { initComments }   from "/comment-system.js";

  let _commentSlug = null;

  async function initReaderComments(chapterSlug) {
    if (!chapterSlug || _commentSlug === chapterSlug) return;
    _commentSlug = chapterSlug;
    const user        = await getCurrentUser();
    const contentSlug = `chapter:${chapterSlug}`;
    await initComments({
      containerId : "readerCommentSection",
      contentSlug,
      accentColor : "#e8522a",
      user,
    });
    const section = document.getElementById("readerCommentSection");
    if (section) {
      section.style.borderTop = "1px solid rgba(255,255,255,0.06)";
    }
  }

  window.addEventListener("readerChapterLoaded", e => {
    initReaderComments(e.detail?.slug);
  });

  setTimeout(async () => {
    const params = new URLSearchParams(window.location.search);
    const slug   = params.get("slug")
      || window.location.pathname.split("/").filter(Boolean).pop();
    if (slug && !_commentSlug) initReaderComments(slug);
  }, 3000);
</script>
