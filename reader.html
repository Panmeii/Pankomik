<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader</title>
<link rel="stylesheet" href="reader.css">
</head>

<body>

<!-- HEADER -->
<div class="reader-header">
  <button onclick="goHome()">🏠</button>
  <h3 id="title">Loading...</h3>
  <div>
<button id="prevBtn" onclick="prevChapter()">⬅️</button>
<button id="nextBtn" onclick="nextChapter()">➡️</button>
    <button onclick="toggleSettings()">⚙️</button>
  </div>
</div>

<!-- SETTINGS -->
<div class="settings" id="settings">
  <h3>Pengaturan</h3>

  <label>Mode:</label>
  <select id="mode">
    <option value="scroll">Scroll</option>
    <option value="single">Per Gambar</option>
  </select>

  <label>Lebar Gambar:</label>
  <input type="range" id="width" min="50" max="100" value="100">

  <label>Auto Scroll Speed:</label>
  <input type="range" id="speed" min="1" max="10" value="3">

  <button onclick="toggleAutoScroll()">▶️ Auto Play</button>
</div>

<!-- CONTENT -->
<div id="reader"></div>

<script src="reader.js"></script>
</body>
</html>
