<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — Pankomik</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════════════════
       PANKOMIK PROFILE — PREMIUM REDESIGN
       Aesthetic: Dark editorial luxury / sharp & architectural
    ═══════════════════════════════════════════════════════ */

    :root {
      --acc:        #ff4d00;
      --acc2:       #ff8c42;
      --acc3:       #ffd166;
      --acc-glow:   rgba(255, 77, 0, 0.22);
      --acc-soft:   rgba(255, 77, 0, 0.08);
      --bg:         #0a0a0f;
      --bg-card:    #111118;
      --bg-card2:   #16161f;
      --bg-card3:   #1c1c28;
      --border:     rgba(255,255,255,0.06);
      --border-acc: rgba(255, 77, 0, 0.18);
      --text:       #f0eff8;
      --text2:      #a09db8;
      --text3:      #5e5c78;
      --radius:     16px;
      --radius-sm:  10px;
      --radius-xs:  7px;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding-bottom: 80px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ─── NOISE TEXTURE OVERLAY ──────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.025;
    }

    /* ─── HERO ───────────────────────────────────────────── */
    .profile-hero {
      position: relative;
      min-height: 240px;
      overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      padding: 48px 20px 32px;
      z-index: 1;
    }

    .hero-grid-bg {
      position: absolute; inset: 0; z-index: 0;
      background:
        linear-gradient(to bottom, rgba(255,77,0,0.12) 0%, transparent 60%),
        linear-gradient(to bottom, var(--bg) 0%, transparent 100%);
    }
    .hero-grid-bg::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
    }
    .hero-grid-bg::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255,77,0,0.15) 0%, transparent 70%);
    }

    /* ─── AVATAR ─────────────────────────────────────────── */
    .avatar-wrap {
      position: relative; z-index: 1;
      width: 88px; height: 88px;
      margin-bottom: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .avatar-border {
      position: absolute; inset: -2px; border-radius: 50%; z-index: 0;
      background: conic-gradient(var(--acc) 0deg, var(--acc2) 90deg, var(--acc3) 180deg, transparent 260deg, transparent 360deg);
      animation: spin-ring 8s linear infinite;
    }

    @keyframes spin-ring { to { transform: rotate(360deg); } }

    .avatar-inner {
      position: absolute; inset: 2px; border-radius: 50%; z-index: 1;
      background: var(--bg-card);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    .avatar-inner img {
      width: 100%; height: 100%;
      border-radius: 50%; object-fit: cover;
      transition: filter 0.25s, transform 0.25s;
    }

    .avatar-edit {
      position: absolute; bottom: 2px; right: 2px; z-index: 2;
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--acc);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      box-shadow: 0 0 0 2px var(--bg-card);
      transition: transform 0.2s;
    }

    .avatar-wrap:hover .avatar-inner img { filter: brightness(0.7); transform: scale(0.96); }
    .avatar-wrap:hover .avatar-edit { transform: scale(1.15); }
    .avatar-uploading .avatar-border { animation: spin-ring 0.4s linear infinite !important; }

    /* ─── HERO TEXT ──────────────────────────────────────── */
    .hero-name {
      position: relative; z-index: 1;
      font-family: 'Syne', sans-serif;
      font-size: 24px; font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-align: center;
    }

    .hero-level-tag {
      position: relative; z-index: 1;
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 14px 5px 10px;
      background: rgba(255,77,0,0.1);
      border: 1px solid var(--border-acc);
      border-radius: 99px;
      font-size: 12px; font-weight: 600;
      color: var(--acc2);
      margin-bottom: 20px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.2px;
    }

    .lv-pip {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--acc);
      box-shadow: 0 0 8px var(--acc);
      animation: pip-pulse 2.2s ease-in-out infinite;
    }

    @keyframes pip-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.6)} }

    /* ─── STATS STRIP ────────────────────────────────────── */
    .hero-stats {
      position: relative; z-index: 1;
      display: flex; gap: 1px;
      width: 100%; max-width: 340px;
      background: var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .hero-stat {
      flex: 1; padding: 14px 8px;
      background: var(--bg-card);
      text-align: center;
    }

    .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 24px; font-weight: 800;
      color: var(--text);
      line-height: 1;
      display: block;
    }

    .stat-label {
      font-size: 9px; font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
      display: block;
    }

    /* ─── BADGES STRIP ───────────────────────────────────── */
    .hero-badges {
      position: relative; z-index: 1;
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 12px 16px 0;
      justify-content: center;
    }

    .badge-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      background: var(--bg-card2);
      border: 1px solid var(--border-acc);
      border-radius: 99px;
      font-size: 11px; font-weight: 500;
      color: var(--acc2);
      animation: chip-in 0.35s cubic-bezier(.34,1.56,.64,1) both;
    }

    @keyframes chip-in {
      from { opacity:0; transform:scale(0.75) translateY(6px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }

    /* ─── NAV SYSTEM ─────────────────────────────────────── */
    .nav-wrap {
      position: sticky; top: 0; z-index: 200;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(20px) saturate(1.5);
      border-bottom: 1px solid var(--border);
    }

    .nav-l1 {
      display: flex; overflow-x: auto; scrollbar-width: none;
      padding: 0 4px; gap: 0;
    }
    .nav-l1::-webkit-scrollbar { display: none; }

    .nav-l1-btn {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 5px;
      padding: 13px 15px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 600;
      color: var(--text3);
      background: none; border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.18s, border-color 0.18s;
    }
    .nav-l1-btn.active { color: var(--text); border-bottom-color: var(--acc); }
    .nav-l1-btn:hover:not(.active) { color: var(--text2); }

    .nav-l2 {
      display: none; padding: 6px 10px 8px; gap: 5px;
      overflow-x: auto; scrollbar-width: none;
      background: rgba(0,0,0,0.2);
      border-top: 1px solid var(--border);
    }
    .nav-l2::-webkit-scrollbar { display: none; }
    .nav-l2.show { display: flex; }

    .nav-l2-btn {
      flex-shrink: 0;
      padding: 5px 14px; border-radius: 99px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text3);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .nav-l2-btn.active {
      background: var(--acc); border-color: var(--acc);
      color: #fff;
      box-shadow: 0 2px 12px var(--acc-glow);
    }
    .nav-l2-btn:hover:not(.active) { border-color: var(--acc); color: var(--acc); }

    /* ─── TAB CONTENT ────────────────────────────────────── */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ─── LIST ITEM — KOMIK/NOVEL/ANIME ──────────────────── */
    .media-item {
      display: flex; gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      transition: background 0.15s;
      cursor: pointer;
    }
    .media-item:hover { background: rgba(255,255,255,0.02); }
    .media-item:active { background: rgba(255,77,0,0.04); }

    .media-cover {
      width: 50px; height: 68px;
      border-radius: var(--radius-xs);
      overflow: hidden; flex-shrink: 0;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .media-cover img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    .media-info { flex: 1; min-width: 0; }
    .media-title {
      font-family: 'Syne', sans-serif;
      font-size: 13.5px; font-weight: 700;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .media-meta {
      font-size: 11px; color: var(--text3);
      margin: 2px 0;
    }
    .media-tag {
      display: inline-block;
      padding: 2px 8px; border-radius: 4px;
      font-size: 10px; font-weight: 600;
      background: var(--acc-soft); color: var(--acc2);
      border: 1px solid var(--border-acc);
      margin-top: 3px;
    }

    .media-actions {
      display: flex; flex-direction: column; gap: 5px; flex-shrink: 0;
    }

    /* ─── PROGRESS PILL ──────────────────────────────────── */
    .prog-bar {
      height: 3px; background: var(--bg-card3);
      border-radius: 99px; margin-top: 5px; overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--acc), var(--acc2));
      border-radius: 99px;
      transition: width 0.8s cubic-bezier(.4,0,.2,1);
    }

    /* ─── BUTTONS ────────────────────────────────────────── */
    .btn {
      padding: 7px 14px; border-radius: var(--radius-xs);
      font-family: 'DM Sans', sans-serif;
      font-size: 11.5px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      border: 1px solid var(--border);
      background: var(--bg-card2);
      color: var(--text2);
      transition: all 0.15s;
    }
    .btn:hover { filter: brightness(1.2); }
    .btn.primary {
      background: var(--acc); border-color: var(--acc);
      color: #fff;
      box-shadow: 0 2px 10px var(--acc-glow);
    }
    .btn.ghost {
      background: transparent; border-color: var(--border);
      color: var(--text3);
    }
    .btn.ghost:hover { border-color: var(--acc); color: var(--acc); }

    /* ─── EMPTY STATE ────────────────────────────────────── */
    .empty {
      padding: 56px 24px;
      text-align: center;
      color: var(--text3);
    }
    .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
    .empty p { font-size: 14px; font-family: 'Syne', sans-serif; }

    /* ─── SEARCH BAR ─────────────────────────────────────── */
    .search-wrap { padding: 12px 16px; }
    .search-input {
      width: 100%; padding: 10px 16px;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 13px;
      outline: none; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--border-acc); }
    .search-input::placeholder { color: var(--text3); }

    /* ─── FILTER TABS ────────────────────────────────────── */
    .filter-row {
      display: flex; gap: 6px; padding: 8px 16px 4px;
      overflow-x: auto; scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex-shrink: 0; padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text3);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .filter-btn.active {
      background: var(--acc); border-color: var(--acc);
      color: #fff;
    }
    .filter-btn:hover:not(.active) { border-color: var(--acc); color: var(--acc); }

    /* ─── LOAD MORE ──────────────────────────────────────── */
    .load-more-wrap { padding: 14px 16px; text-align: center; }
    .load-more-btn {
      width: 100%; padding: 11px;
      background: var(--bg-card2);
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      color: var(--text3); font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
    }
    .load-more-btn:hover { border-color: var(--acc); color: var(--acc); background: var(--acc-soft); }

    /* ─── SECTION HEADING ────────────────────────────────── */
    .section-head {
      display: flex; align-items: center; gap: 10px;
      padding: 20px 16px 10px;
    }
    .section-head-title {
      font-family: 'Syne', sans-serif;
      font-size: 11px; font-weight: 700;
      color: var(--text3); text-transform: uppercase; letter-spacing: 1.5px;
      display: flex; align-items: center; gap: 7px;
    }
    .section-head-title::before {
      content: '';
      width: 3px; height: 14px;
      background: var(--acc); border-radius: 2px;
    }

    /* ─── BADGE CARDS ────────────────────────────────────── */
    .badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 8px; }

    .badge-card {
      padding: 16px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .badge-card.owned {
      border-color: var(--border-acc);
      background: linear-gradient(135deg, rgba(255,77,0,0.06), var(--bg-card));
      box-shadow: 0 0 24px rgba(255,77,0,0.06);
    }
    .badge-card.locked { opacity: 0.45; }
    .badge-card:hover { transform: translateY(-2px); }
    .badge-icon { font-size: 28px; margin-bottom: 8px; }
    .badge-name { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .badge-desc { font-size: 10.5px; color: var(--text3); line-height: 1.4; }
    .badge-owned-label { margin-top: 8px; font-size: 11px; color: #4ade80; font-weight: 600; }
    .badge-locked-label { margin-top: 8px; font-size: 11px; color: var(--text3); }

    /* ─── LEVEL CARD ─────────────────────────────────────── */
    .level-card {
      margin: 16px; padding: 20px;
      background: var(--bg-card2);
      border: 1px solid var(--border-acc);
      border-radius: var(--radius);
      position: relative; overflow: hidden;
    }
    .level-card::before {
      content: attr(data-lv);
      position: absolute; right: -4px; top: -16px;
      font-family: 'Syne', sans-serif;
      font-size: 90px; font-weight: 800;
      color: rgba(255,77,0,0.05);
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }
    .level-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .level-num { font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 800; color: var(--acc); line-height: 1; }
    .level-title-text { font-size: 12px; color: var(--text3); margin-top: 5px; font-weight: 500; }
    .level-right { text-align: right; }
    .level-right .big-num { font-family: 'Syne', sans-serif; font-size: 30px; font-weight: 800; color: var(--text); display: block; line-height: 1; }
    .level-right small { font-size: 10px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; }
    .xp-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-bottom: 6px; font-family: 'DM Mono', monospace; }

    /* ─── LEADERBOARD ────────────────────────────────────── */
    .lb-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 16px 8px;
    }
    .lb-title {
      font-family: 'Syne', sans-serif;
      font-size: 18px; font-weight: 800;
      letter-spacing: -0.3px;
    }
    .lb-title span { color: var(--acc); }

    .lb-toggle { display: flex; gap: 5px; padding: 0 16px 12px; }
    .lb-toggle-btn {
      flex: 1; padding: 9px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card2); color: var(--text3);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .lb-toggle-btn.active {
      background: var(--acc); border-color: var(--acc);
      color: #fff; box-shadow: 0 4px 14px var(--acc-glow);
    }

    .lb-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      transition: background 0.15s;
      animation: lb-in 0.3s ease both;
    }
    @keyframes lb-in { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }
    .lb-row:hover { background: rgba(255,255,255,0.02); }
    .lb-row.me { background: rgba(255,77,0,0.05); border-left: 2px solid var(--acc); padding-left: 14px; }
    .lb-row.rank-1 { background: rgba(255,215,0,0.04); }
    .lb-row.rank-2 { background: rgba(192,192,192,0.03); }
    .lb-row.rank-3 { background: rgba(205,127,50,0.04); }

    .lb-rank { font-size: 14px; min-width: 28px; text-align: center; color: var(--text3); font-weight: 700; font-family: 'DM Mono', monospace; }
    .lb-row.rank-1 .lb-rank { font-size: 20px; }
    .lb-row.rank-2 .lb-rank { font-size: 18px; }
    .lb-row.rank-3 .lb-rank { font-size: 16px; }

    .lb-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      object-fit: cover; border: 1.5px solid var(--border);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      background: var(--bg-card2); font-size: 14px; font-weight: 700;
      color: var(--text2); overflow: hidden;
    }
    .lb-row.rank-1 .lb-avatar { border-color: #ffd700; box-shadow: 0 0 12px rgba(255,215,0,0.3); }
    .lb-row.rank-2 .lb-avatar { border-color: #c0c0c0; }
    .lb-row.rank-3 .lb-avatar { border-color: #cd7f32; }

    .lb-info { flex: 1; min-width: 0; }
    .lb-name {
      font-weight: 700; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lb-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
    .lb-me-tag { display: inline-block; font-size: 9px; font-weight: 700; background: var(--acc-soft); color: var(--acc); padding: 1px 6px; border-radius: 4px; margin-left: 5px; vertical-align: middle; }

    .lb-score { text-align: right; flex-shrink: 0; }
    .lb-score-num { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; color: var(--acc); display: block; line-height: 1; }
    .lb-score-label { font-size: 9.5px; color: var(--text3); white-space: nowrap; }

    .lb-my-rank {
      margin: 12px 16px;
      padding: 12px 16px;
      border: 1px dashed var(--border-acc);
      border-radius: var(--radius-sm);
      background: var(--acc-soft);
      font-size: 12px; color: var(--text3);
      text-align: center; line-height: 1.6;
    }
    .lb-my-rank strong { color: var(--acc); }

    .lb-skel { height: 62px; border-bottom: 1px solid var(--border); background: linear-gradient(90deg, var(--bg-card) 0%, var(--bg-card2) 50%, var(--bg-card) 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }

    /* ─── COMMENTS ───────────────────────────────────────── */
    .comment-card {
      display: block; padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      text-decoration: none; color: inherit;
      transition: background 0.15s;
    }
    .comment-card:hover { background: rgba(255,255,255,0.02); }
    .comment-loc {
      display: inline-flex; align-items: center; gap: 4px;

      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);

      font-size: 10px; font-weight: 700; color: var(--text3);
      text-transform: uppercase; letter-spacing: 1px;
      padding: 14px 16px 8px;

    .settings-input {

    .settings-hint { font-size: 11px; color: var(--text3); margin-top: 6px; }
    .char-count { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); text-align: right; margin-top: 4px; }

    .settings-btn {
      width: 100%; padding: 12px;

      border-radius: var(--radius-sm);
      color: #fff; font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 700;

    .upload-text-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .upload-text-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

    /* ─── EMAIL BADGE ────────────────────────────────────── */
    .email-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px; background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);

    /* ─── SKELETON ───────────────────────────────────────── */
    .skel { background: linear-gradient(90deg, var(--bg-card) 0%, var(--bg-card2) 50%, var(--bg-card) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius-sm); }

    /* ─── BOTTOM NAV ─────────────────────────────────────── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 990;
      height: 60px; display: flex; align-items: center;

    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column;

      background: none; border: none; color: var(--text3);

    }
    .nav-item.active, .nav-item:hover { color: var(--acc); }
    .nav-icon { font-size: 18px; line-height: 1; }
    .nav-label { font-size: 9px; font-weight: 600; font-family: 'DM Sans', sans-serif; }

    /* ─── LAST READ BAR ──────────────────────────────────── */
    .last-read-banner {
      margin: 12px 16px;
      padding: 12px 14px;
      background: var(--bg-card2);
      border: 1px solid var(--border-acc);

    .lr-label { font-size: 9.5px; font-weight: 700; color: var(--acc); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 2px; }
    .lr-title { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lr-continue { flex-shrink: 0; padding: 7px 12px; background: var(--acc); border: none; border-radius: var(--radius-xs); color: #fff; font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; }

    /* ─── TOAST ──────────────────────────────────────────── */
    #toastWrap {
      position: fixed; bottom: 80px; left: 50%;

      pointer-events: none; white-space: nowrap;
    }

    /* ─── HEADER (minimal, passes through to global) ─────── */
    .header { padding-bottom: 0; }

    /* ─── DROPDOWN ─────────────────────────────────────────── */
    .dropdown {
      display: none; position: fixed; top: 54px; right: 12px; z-index: 999;

      border: 1px solid var(--border); border-radius: var(--radius);

  </style>
</head>

<script type="module">
import {
  getCurrentUser, getProfile, updateProfile, updatePassword,
  isOAuthUser, uploadAvatar,
  getBookmarks, removeBookmark,
  getHistory, getProgress, syncProfileProgress, getTotalChaptersRead,
  getLeaderboard, getNovelLeaderboard,
  getNovelBookmarks, removeNovelBookmark,
  getNovelHistory, getMyComments,
  getAnimeHistory
} from "/supabase.js";
import { initAuthHeader } from "/auth-header.js";
import { animeWatchURL, animeURL } from "/router.js";

window._animeWatchURL = animeWatchURL;
window._animeURL      = animeURL;

let currentUser    = null;
let currentProfile = null;
let bookmarkData   = {};
let activeKategori = "favorit";

/* ── Image proxy ─────────────────────────────────────── */
const _DOMAIN_REF = {
  "komikindo":"https://komikindo.org","komikcast":"https://komikcast.me",
  "komiku":"https://komiku.id","manhwaindo":"https://manhwaindo.id",
  "bacakomik":"https://bacakomik.me","mangatale":"https://mangatale.co",
  "westmanga":"https://westmanga.info","shinigami":"https://shinigami.id",
  "sakuranovel":"https://sakuranovel.id","novelringan":"https://novelringan.com",
  "mangakita":"https://mangakita.me","bacakomik.my":"https://bacakomik.my",
  "i0.wp.com":"https://mangakita.me","i1.wp.com":"https://mangakita.me",
  "i2.wp.com":"https://mangakita.me","i3.wp.com":"https://mangakita.me",
  "kiryuu":"https://kiryuu.id","mgkomik":"https://mgkomik.id",
};

function _getRef(url) {
  if (!url) return "";
  try {
    const host = new URL(url.startsWith("http") ? url : "https://"+url).hostname;
    for (const [k,v] of Object.entries(_DOMAIN_REF)) { if (host.includes(k)) return v; }
    return "https://"+host;
  } catch { return ""; }
}

function _buildWsrv(url, w) {
  const clean = url.split("?")[0];
  const ref = _getRef(clean);
  let q = `https://wsrv.nl/?url=${encodeURIComponent(clean)}&w=${w||200}&output=webp&q=85&n=-1`;
  if (ref) q += `&ref=${encodeURIComponent(ref)}`;
  return q;
}

function coverImg(url, altText, cssText, fallbackEmoji) {
  const wrap = document.createElement("div");
  wrap.style.cssText = "width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px;";
  if (!url) { wrap.textContent = fallbackEmoji || "📚"; return wrap; }
  const clean = url.split("?")[0];
  const isAnime  = url.includes("sankavollerei");
  const isNovel  = url.includes("sakuranovel") || url.includes("novelringan") || url.includes("novelupdates") || url.includes("lightnovelworld") || url.includes("wattpad") || url.includes("gramedia");

  let step = 0;
  function getUrl(n) {
    if (n === 0) {
      if (isAnime) return clean;
      if (isNovel) return "/api/img?url=" + encodeURIComponent(clean);
      return _buildWsrv(clean, 200);
    }
    if (n === 1) { if (isAnime) return clean; return _buildWsrv(clean, 200); }
    if (n === 2) return clean;
    return "";
  }
  const img = document.createElement("img");
  img.alt = altText || "";
  if (cssText) img.style.cssText = cssText;
  img.onerror = function() {
    step++;
    const next = getUrl(step);
    if (next && step <= 2) img.src = next;
    else { img.style.display = "none"; wrap.textContent = fallbackEmoji || "📚"; }
  };
  img.src = getUrl(0);
  wrap.appendChild(img);
  return wrap;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function cleanTitle(t){ return (t||"").replace(/^(Komik|Novel|Manhwa|Manga|Manhua)\s+/i,"").trim() || t || ""; }

function getLevelTitle(level) {
  if (level >= 20) return "Legenda 👑";
  if (level >= 10) return "Otaku ⭐";
  if (level >= 5)  return "Aktif 🔥";
  if (level >= 2)  return "Pembaca 📚";
  return "Pemula 🌱";
}

/* ── INIT ─────────────────────────────────────────────── */
window.onload = async function() {
  await initAuthHeader();
  currentUser = await getCurrentUser();
  if (!currentUser) { window.location.href = "/masuk"; return; }
  await syncProfileProgress(currentUser.id);
  await loadProfile();
  const urlTab = new URLSearchParams(window.location.search).get("tab");
  if (urlTab) switchTab(urlTab);
};

/* ── RENDER PROFILE ────────────────────────────────────── */
async function loadProfile() {
  const [{ profile }, { total: liveTotal }] = await Promise.all([
    getProfile(currentUser.id),
    getTotalChaptersRead(currentUser.id)
  ]);

  if (profile && !profile.username) {
    const meta = currentUser.user_metadata || {};
    profile.username   = meta.full_name || meta.name || meta.preferred_username || currentUser.email?.split("@")[0] || "User";
    profile.avatar_url = profile.avatar_url || meta.avatar_url || meta.picture || null;
  }
  currentProfile = profile;

  const BADGE_DEFS = [
    { id:"pemula",        icon:"📖", name:"Pemula",        min_chapters:1    },
    { id:"pembaca_aktif", icon:"🔥", name:"Pembaca Aktif",  min_chapters:50   },
    { id:"otaku",         icon:"⭐", name:"Otaku",          min_chapters:200  },
    { id:"legenda",       icon:"👑", name:"Legenda",        min_chapters:500  },
    { id:"top_reader",    icon:"🏆", name:"Top Reader",     min_chapters:1000 },
  ];
  const badgeCount = BADGE_DEFS.filter(b => liveTotal >= b.min_chapters).length;
  const liveLevel  = Math.floor(liveTotal / 50) + 1;
  const levelTitle = getLevelTitle(liveLevel);
  const isOAuth    = isOAuthUser(currentUser);
  const displayName = profile?.username || currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email?.split("@")[0] || "User";
  const avatarSrc   = profile?.avatar_url || currentUser.user_metadata?.avatar_url || currentUser.user_metadata?.picture
    || `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=ff4d00&color=fff&bold=true&length=2`;

  const ownedChips = BADGE_DEFS
    .filter(b => liveTotal >= b.min_chapters)
    .map((b,i) => `<div class="badge-chip" style="animation-delay:${i*55}ms">${b.icon} ${esc(b.name)}</div>`)
    .join("");

  document.getElementById("profileContent").innerHTML = `

    <!-- HERO -->
    <div class="profile-hero">
      <div class="hero-grid-bg"></div>

      <div class="avatar-wrap" id="avatarWrap" onclick="document.getElementById('avatarInput').click()">
        <div class="avatar-border"></div>
        <div class="avatar-inner">
          <img id="avatarImg" src="${esc(avatarSrc)}" alt="Avatar"
            onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(displayName.slice(0,2))}&background=ff4d00&color=fff&bold=true'">
        </div>
        <div class="avatar-edit">✏️</div>
      </div>
      <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="handleAvatarUpload(event)">

      <div class="hero-name" id="profileNameDisplay">${esc(displayName)}</div>

      <div class="hero-level-tag">
        <span class="lv-pip"></span>
        LV.${liveLevel} — ${esc(levelTitle)}
      </div>

      <div class="hero-stats">
        <div class="hero-stat">
          <span class="stat-num" id="statChapters">${liveTotal}</span>
          <span class="stat-label">Chapter</span>
        </div>
        <div class="hero-stat">
          <span class="stat-num">${badgeCount}</span>
          <span class="stat-label">Badge</span>
        </div>
        <div class="hero-stat">
          <span class="stat-num">${liveLevel}</span>
          <span class="stat-label">Level</span>
        </div>
      </div>
    </div>

    ${badgeCount > 0 ? `<div class="hero-badges">${ownedChips}</div>` : ""}

    <!-- NAV -->
    <div class="nav-wrap" id="profileNav">
      <div class="nav-l1">
        <button class="nav-l1-btn active" id="l1-bookmark"    onclick="switchSection('bookmark')">🔖 Bookmark</button>
        <button class="nav-l1-btn"        id="l1-history"     onclick="switchSection('history')">📖 Riwayat</button>
        <button class="nav-l1-btn"        id="l1-progress"    onclick="switchSection('progress')">📊 Progress</button>
        <button class="nav-l1-btn"        id="l1-badge"       onclick="switchSection('badge')">🏅 Badge</button>
        <button class="nav-l1-btn"        id="l1-leaderboard" onclick="switchSection('leaderboard')">🏆 Top</button>
        <button class="nav-l1-btn"        id="l1-comments"    onclick="switchSection('comments')">💬 Komen</button>
        <button class="nav-l1-btn"        id="l1-settings"    onclick="switchSection('settings')">⚙️ Edit</button>
      </div>
      <div class="nav-l2 show" id="l2-bookmark">
        <button class="nav-l2-btn active" id="tab-bookmark"       onclick="switchTab('bookmark')">📚 Komik</button>
        <button class="nav-l2-btn"        id="tab-anime-bookmark" onclick="switchTab('anime-bookmark')">⚡ Anime</button>

        <button class="nav-l2-btn" id="tab-anime-history" onclick="switchTab('anime-history')">⚡ Anime</button>
        <button class="nav-l2-btn" id="tab-novel-history" onclick="switchTab('novel-history')">📖 Novel</button>
      </div>
    </div>

    <!-- TABS -->

    <!-- Bookmark Komik -->
    <div class="tab-content active" id="content-bookmark">
      <div class="filter-row">
        <button class="filter-btn active" onclick="filterKategori('favorit',this)">❤️ Favorit</button>
        <button class="filter-btn" onclick="filterKategori('lagi_dibaca',this)">📖 Dibaca</button>

      <div id="animeHistoryList"><div class="empty"><div class="empty-icon">⏳</div><p>Memuat...</p></div></div>

    <!-- Settings -->

      <div class="settings-section" style="margin-top:20px;">

          <div class="email-chip">📧 ${esc(currentUser.email)}</div>
        </div>
      </div>

      <div class="settings-section">

        <div class="settings-row">
          <div class="avatar-upload-area" onclick="document.getElementById('avatarInput').click()">
            <img id="avatarImgSettings" src="${esc(avatarSrc)}" alt="Avatar"
              onerror="this.src='https://ui-avatars.com/api/?name=U&background=ff4d00&color=fff&bold=true'">

              <div class="upload-text-title">Klik untuk ganti foto</div>

        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">👤 Username</div>
        <div class="settings-row">
          <input class="settings-input" type="text" id="usernameInput"
            placeholder="Username baru"
            value="${esc(displayName !== 'User' ? displayName : (profile?.username || ''))}"
            maxlength="30"

/* ── SECTION / TAB SWITCHING ───────────────────────────── */
const TAB_SECTION = {
  "bookmark":"bookmark","anime-bookmark":"bookmark","novel-bookmark":"bookmark",
  "history":"history","anime-history":"history","novel-history":"history",
  "progress":"progress","badge":"badge","leaderboard":"leaderboard",
  "comments":"comments","settings":"settings"
};

window.switchSection = function(section) {
  document.querySelectorAll(".nav-l1-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(`l1-${section}`)?.classList.add("active");
  document.querySelectorAll(".nav-l2").forEach(l => l.classList.remove("show"));
  const l2 = document.getElementById(`l2-${section}`);
  if (l2) {
    l2.classList.add("show");
    const firstBtn = l2.querySelector(".nav-l2-btn");
    if (firstBtn) { switchTab(firstBtn.id.replace("tab-","")); return; }
  }
  switchTab(section);
};

window.switchTab = function(tab) {
  document.querySelectorAll(".nav-l2-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(`tab-${tab}`)?.classList.add("active");
  const section = TAB_SECTION[tab] || tab;
  document.querySelectorAll(".nav-l1-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(`l1-${section}`)?.classList.add("active");
  document.querySelectorAll(".nav-l2").forEach(l => l.classList.remove("show"));
  document.getElementById(`l2-${section}`)?.classList.add("show");
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  document.getElementById(`content-${tab}`)?.classList.add("active");

  if (tab === "history")        loadHistory();
  if (tab === "anime-history")  loadAnimeHistory();
  if (tab === "novel-history")  loadNovelHistory();
  if (tab === "novel-bookmark") loadNovelBookmarks();
  if (tab === "anime-bookmark") loadAnimeBookmarks();
  if (tab === "progress")       loadProgressTab();
  if (tab === "badge")          loadBadgeTab();
  if (tab === "leaderboard")    loadLeaderboard();
  if (tab === "comments")       loadMyComments();
};

/* ── BUILD MEDIA ITEM ──────────────────────────────────── */
function buildMediaItem({ coverUrl, coverEmoji, title, meta1, meta2, tag, actions, onClick }) {
  const wrap = document.createElement("div");
  wrap.className = "media-item";
  if (onClick) wrap.onclick = onClick;

  const coverDiv = document.createElement("div");
  coverDiv.className = "media-cover";
  if (coverUrl) {
    const c = coverImg(coverUrl, title||"", "width:100%;height:100%;object-fit:cover;display:block;", coverEmoji||"📚");
    coverDiv.appendChild(c);
  } else {
    coverDiv.textContent = coverEmoji || "📚";
  }
  wrap.appendChild(coverDiv);

  const infoDiv = document.createElement("div");
  infoDiv.className = "media-info";
  infoDiv.innerHTML = `
    <div class="media-title">${esc(title||"")}</div>
    ${meta1 ? `<div class="media-meta">${esc(meta1)}</div>` : ""}
    ${meta2 ? `<div class="media-meta">${esc(meta2)}</div>` : ""}
    ${tag ? `<span class="media-tag">${esc(tag)}</span>` : ""}`;
  wrap.appendChild(infoDiv);

  if (actions && actions.length) {
    const actDiv = document.createElement("div");
    actDiv.className = "media-actions";
    actions.forEach(a => {
      const btn = document.createElement("button");
      btn.className = `btn ${a.primary ? "primary" : "ghost"}`;
      btn.textContent = a.label;
      btn.onclick = e => { e.stopPropagation(); a.onClick(); };
      actDiv.appendChild(btn);
    });
    wrap.appendChild(actDiv);
  }
  return wrap;
}

let _historyAll = null, _historyPage = 1, _historyFiltered = null;
const PER = 8;

async function loadHistory() {
  if (_historyAll && document.getElementById("historyItems")) return;
  const el = document.getElementById("historyList");
  el.innerHTML = `<div class="empty"><div class="empty-icon">⏳</div><p>Memuat...</p></div>`;

  const { history } = await getHistory(currentUser.id);
  if (!history.length) { el.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><p>Belum ada riwayat baca.</p></div>`; return; }

  /* Deduplicate: 1 entry per komik_slug, ambil yang paling baru */
  const seen = new Map();
  for (const h of history) {
    if (!h.komik_slug) continue;
    if (!seen.has(h.komik_slug)) seen.set(h.komik_slug, h);
    else {
      /* Pertahankan entry terbaru */
      const existing = seen.get(h.komik_slug);
      if (new Date(h.read_at) > new Date(existing.read_at)) seen.set(h.komik_slug, h);
    }
  }
  _historyAll  = Array.from(seen.values());
  _historyPage = 1;
  _historyFiltered = null;

  el.innerHTML = "";
  const search = document.createElement("div");
  search.className = "search-wrap";
  search.innerHTML = `<input class="search-input" id="historySearch" placeholder="🔍 Cari judul komik..." oninput="filterHistorySearch(this.value)">`;
  const refreshBtn = document.createElement("div");
  refreshBtn.style.cssText = "text-align:right;padding:0 16px 8px;";
  refreshBtn.innerHTML = `<button class="btn ghost" style="font-size:11px;" onclick="_historyAll=null;_historyPage=1;_historyFiltered=null;loadHistory()">🔄 Refresh</button>`;
  const itemsWrap = document.createElement("div");
  itemsWrap.id = "historyItems";
  el.appendChild(search);
  el.appendChild(refreshBtn);
  el.appendChild(itemsWrap);
  renderHistoryPage();
}

function renderHistoryPage() {
  const src = _historyFiltered || _historyAll;
  if (!src) return;
  const shown = src.slice(0, _historyPage * PER);
  const wrap  = document.getElementById("historyItems");
  if (!wrap) return;
  wrap.innerHTML = "";
  shown.forEach(h => {
    const item = buildMediaItem({
      coverUrl: h.komik_cover, coverEmoji:"📚",
      title: cleanTitle(h.komik_title) || h.komik_slug,
      meta1: h.chapter_number ? `📖 Ch.${h.chapter_number}` : null,
      meta2: `🕒 ${new Date(h.read_at).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}`,
      onClick: () => window.location.href=`/baca/${h.chapter_slug}`,
      actions: [
        { label:"▶ Lanjut", primary:true, onClick:()=>window.location.href=`/baca/${h.chapter_slug}` },
        { label:"Detail", primary:false, onClick:()=>window.location.href=`/komik/${h.komik_slug}` }

    });
    wrap.appendChild(item);
  });
  if (shown.length < src.length) {
    const lm = document.createElement("div");
    lm.className = "load-more-wrap";
    lm.innerHTML = `<button class="load-more-btn" onclick="_historyPage++;renderHistoryPage()">Muat Lebih Banyak (${src.length - shown.length} lagi)</button>`;
    wrap.appendChild(lm);
  }
}

window.filterHistorySearch = function(q) {
  const s = q.toLowerCase().trim();
  _historyFiltered = s ? (_historyAll||[]).filter(h => (h.komik_title||"").toLowerCase().includes(s)||(h.komik_slug||"").toLowerCase().includes(s)) : null;

      meta1: chapterLabel ? `📖 ${chapterLabel.length > 40 ? chapterLabel.slice(0,37)+"…" : chapterLabel}` : null,
      meta2: `🕒 ${new Date(h.read_at).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}`,
      onClick: () => { if(h.chapter_slug) window.location.href=`/baca-novel/${h.chapter_slug}`; else window.location.href=`/novel/${h.novel_slug}`; },
      actions: [
        { label:"▶ Lanjut", primary:true, onClick:()=>{ if(h.chapter_slug) window.location.href=`/baca-novel/${h.chapter_slug}`; else window.location.href=`/novel/${h.novel_slug}`; } },
        { label:"Detail", primary:false, onClick:()=>window.location.href=`/novel/${h.novel_slug}` }
      ]
    });
    wrap.appendChild(item);
  });
  if (shown.length < src.length) {
    const lm = document.createElement("div");
    lm.className = "load-more-wrap";
    lm.innerHTML = `<button class="load-more-btn" onclick="_novelHistPage++;renderNovelHistPage()">Muat Lebih Banyak (${src.length-shown.length} lagi)</button>`;
    wrap.appendChild(lm);
  }
}
window.renderNovelHistPage = renderNovelHistPage;
window.filterNovelHistSearch = function(q) {
  const s = q.toLowerCase().trim();
  _novelHistFiltered = s ? (_novelHistAll||[]).filter(h=>(h.novel_title||"").toLowerCase().includes(s)||(h.novel_slug||"").toLowerCase().includes(s)) : null;
  _novelHistPage = 1;
  renderNovelHistPage();
};

/* ── PROGRESS ──────────────────────────────────────────── */
let _progressLoaded = false;

async function loadProgressTab() {
  if (_progressLoaded && document.getElementById("progressItems")) return;
  const el = document.getElementById("progressList");
  el.innerHTML = `<div class="empty"><div class="empty-icon">⏳</div><p>Memuat...</p></div>`;

  const [{ progress }, { history }] = await Promise.all([getProgress(currentUser.id), getHistory(currentUser.id)]);
  _progressLoaded = true;

  if (!progress.length) { el.innerHTML = `<div class="empty"><div class="empty-icon">📊</div><p>Belum ada progress. Mulai baca!</p></div>`; return; }

  const coverMap = {};
  (history||[]).forEach(h => { if (h.komik_slug && h.komik_cover) coverMap[h.komik_slug] = h.komik_cover; });

  let _progressAll = progress, _progressPage = 1, _progressFiltered = null;

  el.innerHTML = "";
  const header = document.createElement("div");
  header.style.cssText = "display:flex;align-items:center;gap:8px;padding:8px 16px 0;";
  header.innerHTML = `
    <div class="search-wrap" style="flex:1;padding:0;">
      <input class="search-input" placeholder="🔍 Cari komik..." oninput="filterProgress(this.value)">
    </div>
    <button class="btn ghost" style="font-size:11px;flex-shrink:0;" onclick="_progressLoaded=false;loadProgressTab()">🔄</button>`;
  const itemsWrap = document.createElement("div");
  itemsWrap.id = "progressItems";
  el.appendChild(header);
  el.appendChild(itemsWrap);

  function renderProg() {
    const src = _progressFiltered || _progressAll;
    const shown = src.slice(0, _progressPage * PER);
    itemsWrap.innerHTML = "";
    shown.forEach(p => {
      const pct = p.total_chapters > 0 ? Math.min(100, Math.round((p.read_chapters/p.total_chapters)*100)) : 0;
      const cover = coverMap[p.komik_slug] || "";
      const item = buildMediaItem({
        coverUrl: cover, coverEmoji:"📚",
        title: cleanTitle(p.komik_title),
        meta1: p.total_chapters > 0 ? `${p.read_chapters}/${p.total_chapters} ch (${pct}%)` : `${p.read_chapters} ch`,
        meta2: `🕒 ${new Date(p.updated_at).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}`,
        onClick: () => window.location.href=`/komik/${p.komik_slug}`,
        actions: p.last_chapter_slug
          ? [{ label:"▶ Lanjut", primary:true, onClick:()=>window.location.href=`/baca/${p.last_chapter_slug}` }]
          : [{ label:"Detail", primary:false, onClick:()=>window.location.href=`/komik/${p.komik_slug}` }]
      });
      /* Add progress bar */
      if (p.total_chapters > 0) {
        const pb = document.createElement("div");
        pb.style.cssText = "padding:0 16px 8px;margin-top:-8px;";
        pb.innerHTML = `<div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>`;
        itemsWrap.appendChild(item);
        itemsWrap.appendChild(pb);
      } else {
        itemsWrap.appendChild(item);
      }
    });
    if (shown.length < src.length) {
      const lm = document.createElement("div");
      lm.className = "load-more-wrap";
      lm.innerHTML = `<button class="load-more-btn" onclick="window._progPage++;window._progRender()">Muat Lebih Banyak</button>`;
      itemsWrap.appendChild(lm);
    }
  }

  window._progPage   = _progressPage;
  window._progRender = function() { _progressPage = window._progPage; renderProg(); };
  window.filterProgress = function(q) {
    const s = q.toLowerCase().trim();
    _progressFiltered = s ? _progressAll.filter(p=>(p.komik_title||"").toLowerCase().includes(s)||(p.komik_slug||"").toLowerCase().includes(s)) : null;
    _progressPage = 1; window._progPage = 1;
    renderProg();
  };
  renderProg();
}

/* ── BADGE ─────────────────────────────────────────────── */

  const el = document.getElementById("badgeContent");
  const { total } = await getTotalChaptersRead(currentUser.id);
  _badgeLoaded = true;

  const level  = Math.floor(total/50) + 1;
  const title  = getLevelTitle(level);
  const xpIn   = total % 50;
  const xpPct  = Math.round((xpIn/50)*100);
  const owned  = currentProfile?.user_badges || [];
  const ownedIds = new Set(owned.map(b=>b.badge_id));
  const ownedNames = new Set(owned.map(b=>b.badges?.name).filter(Boolean));

  const allBadges = [
    { id:"pemula",        name:"Pemula",       icon:"📖", desc:"Baca 1 chapter",       min_chapters:1    },
    { id:"pembaca_aktif", name:"Aktif",         icon:"🔥", desc:"50 chapter dibaca",   min_chapters:50   },
    { id:"otaku",         name:"Otaku",         icon:"⭐", desc:"200 chapter dibaca",  min_chapters:200  },
    { id:"legenda",       name:"Legenda",       icon:"👑", desc:"500 chapter dibaca",  min_chapters:500  },
    { id:"top_reader",    name:"Top Reader",    icon:"🏆", desc:"1000 chapter dibaca", min_chapters:1000 },
    { id:"komentator",    name:"Komentator",    icon:"💬", desc:"Buat 10 komentar",    min_chapters:0    },
  ];
  const countOwned = allBadges.filter(b=>b.min_chapters>0&&b.min_chapters<=total).length;

  el.innerHTML = `
    <div class="level-card" data-lv="${level}">
      <div class="level-row">
        <div>
          <div class="level-num">LV.${level}</div>
          <div class="level-title-text">${esc(title)}</div>
        </div>
        <div class="level-right">
          <span class="big-num">${total}</span>
          <small>Chapter Dibaca</small>
        </div>
      </div>
      <div class="xp-labels">
        <span>XP Level ${level}</span>
        <span font-family="DM Mono">${xpIn}/50 XP</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${xpPct}%"></div></div>
      <p style="font-size:11px;color:var(--text3);margin-top:8px;text-align:right;">${50-xpIn} XP lagi ke LV.${level+1}</p>
    </div>

    <div class="section-head"><div class="section-head-title">Badge (${countOwned}/${allBadges.filter(b=>b.min_chapters>0).length})</div></div>
    <div class="badge-grid">
      ${allBadges.map(b => {
        const isOwned = b.min_chapters>0 ? (ownedIds.has(b.id)||ownedNames.has(b.name)||total>=b.min_chapters) : (ownedIds.has(b.id)||ownedNames.has(b.name));
        const prog = b.min_chapters>0 ? Math.min(100,Math.round((total/b.min_chapters)*100)) : 0;
        return `<div class="badge-card ${isOwned?"owned":"locked"}">
          <div class="badge-icon">${b.icon}</div>
          <div class="badge-name">${esc(b.name)}</div>
          <div class="badge-desc">${esc(b.desc)}</div>
          ${isOwned
            ? `<div class="badge-owned-label">✓ Didapat</div>`
            : b.min_chapters>0
              ? `<div class="prog-bar" style="margin-top:8px;"><div class="prog-fill" style="width:${prog}%"></div></div>
                 <div style="font-size:10px;color:var(--text3);margin-top:4px;text-align:center;font-family:'DM Mono',monospace;">${total}/${b.min_chapters}</div>`
              : `<div class="badge-locked-label">🔒 Terkunci</div>`
          }
        </div>`;
      }).join("")}
    </div>`;
}

/* ── LEADERBOARD ───────────────────────────────────────── */
const rankEmoji = i => i===0?"🥇":i===1?"🥈":i===2?"🥉":null;
const rankClass = i => i===0?"rank-1":i===1?"rank-2":i===2?"rank-3":"";
let _lbTab = "komik", _lbExpanded = false;

async function loadLeaderboard(forceRefresh=false) {
  const el = document.getElementById("leaderboardContent");
  _lbExpanded = false;

  el.innerHTML = `
    <div class="lb-head">
      <div class="lb-title">TOP <span>READER</span></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;" id="lbTs"></span>
        <button class="btn ghost" style="font-size:11px;" onclick="loadLeaderboard(true)">🔄</button>
      </div>
    </div>
    <div class="lb-toggle">
      <button class="lb-toggle-btn active" id="lbBtnKomik" onclick="switchLbTab('komik')">📚 Komik</button>
      <button class="lb-toggle-btn"        id="lbBtnNovel" onclick="switchLbTab('novel')">📖 Novel</button>
    </div>
    <div id="lbBody">${Array(8).fill('<div class="lb-skel"></div>').join("")}</div>`;

  const [{ leaderboard: komikLb }, { leaderboard: novelLb }] = await Promise.all([getLeaderboard(20), getNovelLeaderboard(20)]);
  window._lbKomik = komikLb || [];
  window._lbNovel = novelLb || [];

  const ts = document.getElementById("lbTs");
  if (ts) ts.textContent = new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});

  renderLbTab(_lbTab);
  document.getElementById("lbBtnKomik")?.classList.toggle("active", _lbTab==="komik");
  document.getElementById("lbBtnNovel")?.classList.toggle("active", _lbTab==="novel");
}

function buildLbRows(list, scoreField, scoreLabel) {
  if (!list.length) return `<div class="empty"><div class="empty-icon">📭</div><p>Belum ada data.</p></div>`;
  const SHOW = _lbExpanded ? list.length : 10;
  const shown = list.slice(0, SHOW);
  const maxScore = list[0]?.[scoreField] || 1;
  const myIdx = list.findIndex(u => u.id === currentUser.id);
  const myInTop = shown.findIndex(u => u.id === currentUser.id) >= 0;

  let html = shown.map((u,i) => {
    const isMe = u.id === currentUser.id;
    const name = u.username || "Anonim";
    const raw  = u[scoreField] || 0;
    const score = raw.toLocaleString("id-ID");
    const rankIcon = rankEmoji(i);
    return `<div class="lb-row ${rankClass(i)} ${isMe?"me":""}" style="animation-delay:${i*40}ms">
      <div class="lb-rank">${rankIcon || `<span style="font-size:11px;color:var(--text3)">#${i+1}</span>`}</div>
      <div class="lb-avatar">${u.avatar_url
        ? `<img src="${esc(u.avatar_url)}" alt="${esc(name)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
        : ""}<span style="${u.avatar_url?"display:none;":""}width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#ff4d00,#ff8c42);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;">${name[0]?.toUpperCase()||"?"}</span></div>
      <div class="lb-info">
        <div class="lb-name">${esc(name)}${isMe?`<span class="lb-me-tag">Kamu</span>`:""}</div>
        <div class="lb-sub">LV.${u.level||1} · ${esc(getLevelTitle(u.level||1))}</div>
      </div>
      <div class="lb-score">
        <span class="lb-score-num">${esc(score)}</span>
        <span class="lb-score-label">${esc(scoreLabel)}</span>
      </div>
    </div>`;
  }).join("");

  if (!_lbExpanded && list.length > SHOW) {
    html += `<div style="padding:12px 16px;"><button class="load-more-btn" onclick="_lbExpanded=true;renderLbTab(window._lbTab||'komik')">▼ Lihat ${list.length-SHOW} lainnya</button></div>`;
  }
  if (!myInTop) {
    if (myIdx >= 0) {
      const u = list[myIdx];
      html += `<div class="lb-my-rank">Kamu di posisi <strong>#${myIdx+1}</strong> dengan <strong>${(u[scoreField]||0).toLocaleString("id-ID")} ${scoreLabel}</strong> — terus baca! 🚀</div>`;
    } else {
      html += `<div class="lb-my-rank">Kamu belum ada di leaderboard. Baca lebih banyak! 🚀</div>`;
    }
  }
  html += `<p style="text-align:center;font-size:10px;color:var(--text3);padding:10px 16px;">Update otomatis setiap kamu baca</p>`;
  return html;
}

function renderLbTab(tab) {
  const body = document.getElementById("lbBody");
  if (!body) return;
  body.innerHTML = tab==="komik"
    ? buildLbRows(window._lbKomik||[], "total_chapters_read", "ch komik")
    : buildLbRows(window._lbNovel||[], "total_novel_chapters_read", "ch novel");
}

window.switchLbTab = function(tab) {
  _lbTab = tab; _lbExpanded = false;
  window._lbTab = tab;
  document.getElementById("lbBtnKomik")?.classList.toggle("active", tab==="komik");
  document.getElementById("lbBtnNovel")?.classList.toggle("active", tab==="novel");
  renderLbTab(tab);
};
window.renderLbTab = renderLbTab;

/* ── KOMENTAR ──────────────────────────────────────────── */
let _commentsLoaded = false;

async function loadMyComments() {
  if (_commentsLoaded) return;
  const el = document.getElementById("myCommentsList");
  if (!el) return;
  el.innerHTML = `<div class="empty"><div class="empty-icon">⏳</div><p>Memuat komentar...</p></div>`;

  try {
    const { comments, error } = await getMyComments(currentUser.id, 30);
    if (error) throw error;
    if (!comments?.length) { el.innerHTML = `<div class="empty"><div class="empty-icon">💬</div><p>Belum ada komentar.</p></div>`; _commentsLoaded=true; return; }
    _commentsLoaded = true;
    el.innerHTML = comments.map(c => {
      const loc = resolveCommentLoc(c.komik_slug);
      const likes = c.like_count || 0;
      const isReply = !!c.parent_id;
      const text = (c.content||"").slice(0,200);
      let time = "–";
      try { time = new Date(c.created_at).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}); } catch{}
      return `<a class="comment-card" href="${esc(loc.url)}">
        <div class="comment-loc"><span>${esc(loc.icon)}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(loc.label)}</span></div>
        <p class="comment-text">${esc(text)}${(c.content||"").length>200?"…":""}</p>
        <div class="comment-foot">
          <span>🕒 ${esc(time)}</span>
          ${likes>0?`<span class="comment-likes">❤️ ${likes}</span>`:""}
          ${isReply?`<span class="comment-reply-tag">↩ Balasan</span>`:""}
          <span style="margin-left:auto;color:var(--acc);font-size:10px;font-weight:600;">Lihat →</span>
        </div>
      </a>`;
    }).join("");
  } catch(err) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">😕</div><p>Gagal memuat.</p><button class="btn primary" style="margin-top:12px;" onclick="_commentsLoaded=false;loadMyComments()">Coba Lagi</button></div>`;
  }
}

function resolveCommentLoc(slug) {
  if (!slug) return { icon:"💬", label:"Pankomik", url:"/" };
  if (slug.startsWith("novel-chapter:")) { const r=slug.slice(14); return { icon:"📖", label:r.replace(/-/g," ").slice(0,26)||"Chapter Novel", url:`/baca-novel/${r}` }; }
  if (slug.startsWith("novel:")) { const r=slug.slice(6); return { icon:"📖", label:r.replace(/-/g," ").slice(0,26)||"Novel", url:`/novel/${r}` }; }
  if (slug.startsWith("chapter:")) { const r=slug.slice(8); return { icon:"📚", label:r.replace(/-/g," ").slice(0,26)||"Chapter", url:`/baca/${r}` }; }
  return { icon:"📚", label:slug.replace(/-/g," ").slice(0,26)||"Komik", url:`/komik/${slug}` };
}

/* ── SAVE PROFILE ──────────────────────────────────────── */
window.saveProfile = async function() {
  const btn = document.getElementById("saveUsernameBtn");
  const msg = document.getElementById("saveMsg");
  const val = document.getElementById("usernameInput")?.value.trim();
  if (!val||val.length<3) { showMsg(msg,"Username minimal 3 karakter.","error"); return; }
  if (!/^[a-zA-Z0-9_-]+$/.test(val)) { showMsg(msg,"Hanya huruf, angka, _ dan -","error"); return; }
  btn.disabled=true; btn.textContent="Menyimpan...";
  const { error } = await updateProfile(currentUser.id,{username:val});
  if (error) showMsg(msg,"Gagal menyimpan.","error");
  else { showMsg(msg,"✓ Username berhasil disimpan!","success"); document.getElementById("profileNameDisplay").textContent=val; }
  btn.disabled=false; btn.textContent="Simpan Username";
};

window.savePassword = async function() {
  const btn = document.getElementById("savePasswordBtn");
  const msg = document.getElementById("passwordMsg");
  const np  = document.getElementById("newPasswordInput")?.value;
  const cp  = document.getElementById("confirmPasswordInput")?.value;
  if (!np||np.length<6) { showMsg(msg,"Password minimal 6 karakter.","error"); return; }
  if (np!==cp) { showMsg(msg,"Konfirmasi tidak cocok.","error"); return; }
  btn.disabled=true; btn.textContent="Menyimpan...";
  const { error } = await updatePassword(np);
  if (error) showMsg(msg,"Gagal ganti password.","error");
  else showMsg(msg,"✓ Password berhasil diubah!","success");
  btn.disabled=false; btn.textContent="Ganti Password";
};

function showMsg(el,text,type) {
  if (!el) return;
  el.textContent=text; el.className=`form-msg ${type}`;
}

/* ── AVATAR UPLOAD ─────────────────────────────────────── */
window.handleAvatarUpload = async function(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  if (file.size > 2*1024*1024) { toast("File terlalu besar. Maks 2MB.","error"); return; }
  document.getElementById("avatarWrap")?.classList.add("avatar-uploading");
  const { url, error } = await uploadAvatar(currentUser.id, file);
  document.getElementById("avatarWrap")?.classList.remove("avatar-uploading");
  if (!error && url) {
    document.getElementById("avatarImg").src = url;
    const si = document.getElementById("avatarImgSettings");
    if (si) si.src = url;
    toast("✓ Foto profil diperbarui!","success");
    const msg = document.getElementById("uploadMsg");
    if (msg) showMsg(msg,"✓ Foto profil berhasil diperbarui!","success");
  } else {
    toast("Gagal upload foto.","error");
  }
};

window.handleLogout = async function() {
  const { logout } = await import("/supabase.js");
  await logout();
  window.location.href = "/";
};

/* ── HELPERS ───────────────────────────────────────────── */
function toast(msg, type="info") {
  const wrap = document.getElementById("toastWrap");
  if (!wrap) return;
  const t = document.createElement("div");
  const bg = type==="success" ? "linear-gradient(135deg,#15803d,#16a34a)"
           : type==="error"   ? "linear-gradient(135deg,#b91c1c,#dc2626)"
           : "rgba(22,22,31,0.97)";
  t.style.cssText = `padding:10px 20px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;
    background:${bg};box-shadow:0 4px 20px rgba(0,0,0,0.5);margin-top:6px;
    border:1px solid rgba(255,255,255,0.08);font-family:'DM Sans',sans-serif;
    animation:toastIn 0.2s ease;`;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>t.style.opacity="0",2400);
  setTimeout(()=>t.remove(),2700);
}
