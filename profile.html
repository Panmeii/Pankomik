<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — Pankomik</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ---- PROFIL HEADER ─────────────────────────────────── */
    .profile-hero {
      position: relative;
      overflow: hidden;
      padding: 0 0 0;
    }
    .profile-hero-bg {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(232,82,42,0.18) 0%, rgba(245,166,35,0.10) 50%, transparent 100%);
      pointer-events: none;
    }
    .profile-hero-bg::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at 80% 20%, rgba(232,82,42,0.12) 0%, transparent 60%);
    }
    .profile-header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 24px;
      gap: 8px;
      text-align: center;
      z-index: 1;
    }

    /* Avatar */
    .avatar-wrap {
      position: relative;
      width: 92px; height: 92px;
      cursor: pointer;
    }
    .avatar-ring {
      position: absolute; inset: -4px;
      border-radius: 50%;
      background: conic-gradient(var(--accent) 0%, #f5a623 50%, var(--accent) 100%);
      animation: ring-spin 4s linear infinite;
      z-index: 0;
    }
    @keyframes ring-spin { to { transform: rotate(360deg); } }
    .avatar-wrap img {
      position: relative; z-index: 1;
      width: 92px; height: 92px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--bg);
      transition: filter 0.2s, transform 0.2s;
      display: block;
    }
    .avatar-wrap:hover img { filter: brightness(0.75); transform: scale(1.04); }
    .avatar-overlay {
      position: absolute; inset: 3px;
      z-index: 2; border-radius: 50%;
      background: rgba(0,0,0,0.55);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px; opacity: 0;
      transition: opacity 0.2s; pointer-events: none;
    }
    .avatar-overlay span { font-size: 18px; }
    .avatar-overlay p { font-size: 10px; font-weight: 700; color: #fff; margin: 0; }
    .avatar-wrap:hover .avatar-overlay { opacity: 1; }

    .avatar-uploading::after {
      content: '';
      position: absolute; inset: -4px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      z-index: 3;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .profile-name {
      font-size: 20px; font-weight: 900;
      margin-top: 4px; letter-spacing: -0.3px;
    }
    .profile-level {
      font-size: 11px; color: var(--accent); font-weight: 800;
      background: rgba(232,82,42,0.12);
      border: 1px solid rgba(232,82,42,0.25);
      padding: 3px 12px; border-radius: 99px;
      letter-spacing: 0.5px;
    }

    /* Stats row */
    .profile-stats {
      display: flex; gap: 0;
      margin-top: 8px; width: 100%; max-width: 320px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
    }
    .stat-item {
      flex: 1; text-align: center;
      padding: 10px 8px;
      border-right: 1px solid var(--border);
      transition: background 0.2s;
    }
    .stat-item:last-child { border-right: none; }
    .stat-item:hover { background: var(--bg-surface); }
    .stat-item p:first-child { font-size: 18px; font-weight: 900; color: var(--text); margin: 0; }
    .stat-item p:last-child  { font-size: 10px; color: var(--text-muted); margin: 2px 0 0; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }

    /* XP bar under stats */
    .profile-xp-row {
      width: 100%; max-width: 320px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .profile-xp-labels {
      display: flex; justify-content: space-between;
      font-size: 10px; color: var(--text-muted); font-weight: 700;
    }
    .profile-xp-bar {
      height: 5px; background: var(--bg-surface);
      border-radius: 99px; overflow: hidden;
    }
    .profile-xp-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #f5a623);
      border-radius: 99px;
      transition: width 1s cubic-bezier(.4,0,.2,1);
    }

    /* ---- BADGE CHIPS ─────────────────────────────────── */
    .badge-list {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 0 16px 16px; justify-content: center;
    }
    .badge-chip {
      display: flex; align-items: center; gap: 5px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 99px; padding: 4px 11px;
      font-size: 11px; font-weight: 700;
      transition: border-color 0.2s, background 0.2s;
    }
    .badge-chip:hover { border-color: var(--accent); background: rgba(232,82,42,0.08); }

    /* ---- TABS ─────────────────────────────────────────── */
    .profile-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 14px; gap: 2px;
      overflow-x: auto; scrollbar-width: none;
      background: var(--bg-card);
      position: sticky; top: 58px; z-index: 10;
    }
    .profile-tabs::-webkit-scrollbar { display: none; }
    .profile-tab {
      padding: 11px 13px;
      font-size: 12px; font-weight: 700;
      color: var(--text-muted); cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap; background: none;
      border-top: none; border-left: none; border-right: none;
      transition: color 0.2s, border-color 0.2s;
    }
    .profile-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Novel Progress Card ────────────────────────────── */
    .novel-progress-item {
      display: flex; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid var(--border); align-items: flex-start;
    }
    .novel-progress-item:last-child { border-bottom: none; }
    .novel-progress-cover {
      width: 50px; height: 68px; border-radius: 6px;
      object-fit: cover; flex-shrink: 0;
      background: var(--bg-surface);
    }
    .novel-progress-info { flex: 1; min-width: 0; }
    .novel-progress-title {
      font-weight: 700; font-size: 13px; margin-bottom: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .novel-progress-meta { font-size: 11px; color: var(--text-muted); margin: 2px 0; }
    .novel-progress-pct {
      font-size: 15px; font-weight: 900; color: var(--accent);
      flex-shrink: 0; text-align: right;
    }

    /* ---- TAB CONTENT ------------------------------------- */
    .tab-content { display: none; padding: 14px; }
    .tab-content.active { display: block; }

    /* ---- KATEGORI BOOKMARK ------------------------------- */
    .kategori-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .kategori-btn {
      padding: 5px 12px; border-radius: 99px;
      border: 1px solid var(--border); background: var(--bg-surface);
      color: var(--text-muted); font-size: 12px; font-weight: 700;
      cursor: pointer; transition: background 0.2s, color 0.2s;
    }
    .kategori-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ---- KARTU KOMIK ------------------------------------- */
    .komik-list-item {
      display: flex; gap: 12px; padding: 10px 0;
      border-bottom: 1px solid var(--border); align-items: center;
    }
    .komik-list-item:last-child { border-bottom: none; }
    .komik-list-item img { width: 50px; height: 68px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .komik-list-info { flex: 1; }
    .komik-list-info .title { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
    .komik-list-info p { font-size: 11px; color: var(--text-muted); margin: 2px 0; }
    .komik-list-actions { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
    .btn-sm {
      padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg-surface); color: var(--text); font-size: 11px;
      font-weight: 700; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .btn-sm.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-sm:hover { filter: brightness(1.15); }

    /* ---- PROGRESS BAR ------------------------------------ */
    .progress-bar-wrap { height: 4px; background: var(--bg-surface); border-radius: 99px; margin-top: 5px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.5s ease; }

    /* ---- EMPTY STATE ------------------------------------- */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
    .empty-state p:first-child { font-size: 32px; margin-bottom: 8px; }

    /* ---- EDIT PROFIL FORM -------------------------------- */
    .edit-section-title {
      font-size: 12px; font-weight: 800; margin-bottom: 8px; color: var(--text);
    }
    .edit-form-row { margin-bottom: 18px; }
    .edit-form input, .edit-form textarea {
      width: 100%; padding: 10px 12px; margin-bottom: 0;
      background: var(--bg-surface); border: 1.5px solid var(--border);
      border-radius: 9px; color: var(--text); font-family: 'Nunito', sans-serif;
      font-size: 14px; outline: none; box-sizing: border-box; transition: border-color 0.2s;
    }
    .edit-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,82,42,0.12); }
    .input-hint { font-size: 11px; color: var(--text-muted); margin-top: 5px; }
    .char-counter { font-size: 11px; color: var(--text-muted); text-align: right; margin-top: 3px; }
    .edit-btn {
      width: 100%; padding: 11px 20px; background: var(--accent); color: #fff;
      border: none; border-radius: 9px; font-family: 'Nunito', sans-serif;
      font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .edit-btn:hover    { background: #c73f1c; }
    .edit-btn:active   { transform: scale(0.97); }
    .edit-btn:disabled { background: var(--bg-surface); color: var(--text-muted); cursor: not-allowed; }
    .form-msg {
      font-size: 12px; margin-top: 8px; padding: 8px 12px;
      border-radius: 8px; display: none;
    }
    .form-msg.success { display: block; background: rgba(39,174,96,0.1); border: 1px solid rgba(39,174,96,0.3); color: #27ae60; }
    .form-msg.error   { display: block; background: rgba(232,82,42,0.1); border: 1px solid rgba(232,82,42,0.3); color: var(--accent); }
    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    /* ---- AVATAR UPLOAD AREA ------------------------------ */
    .avatar-upload-area {
      display: flex; align-items: center; gap: 14px;
      padding: 14px; background: var(--bg-surface);
      border: 1.5px dashed var(--border); border-radius: 12px;
      cursor: pointer; transition: border-color 0.2s, background 0.2s;
      margin-bottom: 4px;
    }
    .avatar-upload-area:hover { border-color: var(--accent); background: rgba(232,82,42,0.05); }
    .avatar-upload-area img {
      width: 54px; height: 54px; border-radius: 50%; object-fit: cover;
      border: 2px solid var(--accent); flex-shrink: 0;
    }
    .avatar-upload-text p:first-child { font-size: 13px; font-weight: 700; color: var(--text); }
    .avatar-upload-text p:last-child  { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

    /* ---- LEVEL & BADGE ----------------------------------- */
    .level-card {
      background: linear-gradient(135deg, var(--bg-surface) 0%, rgba(232,82,42,0.08) 100%);
      border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    }
    .level-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .level-number { font-size: 22px; font-weight: 800; color: var(--accent); line-height: 1; }
    .level-title  { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
    .level-total  { text-align: right; }
    .level-total span  { font-size: 24px; font-weight: 800; color: var(--text); display: block; line-height: 1; }
    .level-total small { font-size: 10px; color: var(--text-muted); }
    .badge-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .badge-card {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 12px; text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .badge-card.owned { border-color: var(--accent); background: rgba(232,82,42,0.06); }
    .badge-card.locked { opacity: 0.55; }
    .badge-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    .badge-icon   { font-size: 28px; margin-bottom: 6px; }
    .badge-name   { font-size: 13px; font-weight: 800; margin-bottom: 3px; }
    .badge-desc   { font-size: 10px; color: var(--text-muted); line-height: 1.4; }
    .badge-status-owned  { margin-top: 6px; font-size: 11px; color: #27ae60; font-weight: 700; }
    .badge-status-locked { margin-top: 6px; font-size: 11px; color: var(--text-muted); }

    /* ---- LEADERBOARD ------------------------------------- */
    .lb-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .lb-header h3 { font-size: 15px; font-weight: 800; }
    .lb-refresh-btn {
      padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-surface); color: var(--text-muted);
      font-size: 12px; font-weight: 700; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .lb-refresh-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    .lb-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 12px;
      margin-bottom: 6px; border: 1px solid var(--border);
      background: var(--bg-card); transition: background 0.2s;
      position: relative; overflow: hidden;
    }
    .lb-row:hover { background: var(--bg-surface); }
    .lb-row.me    { border-color: var(--accent); background: rgba(232,82,42,0.07); }

    /* Shimmer untuk baris top 3 */
    .lb-row.rank-1 { border-color: #f5a623; background: rgba(245,166,35,0.07); }
    .lb-row.rank-2 { border-color: #b0b0c0; background: rgba(176,176,192,0.06); }
    .lb-row.rank-3 { border-color: #cd7f32; background: rgba(205,127,50,0.06); }

    .lb-rank {
      font-size: 15px; font-weight: 800; min-width: 28px; text-align: center;
      color: var(--text-muted); flex-shrink: 0;
    }
    .lb-row.rank-1 .lb-rank { color: #f5a623; font-size: 20px; }
    .lb-row.rank-2 .lb-rank { color: #b0b0c0; font-size: 18px; }
    .lb-row.rank-3 .lb-rank { color: #cd7f32; font-size: 16px; }

    .lb-avatar {
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
      border: 2px solid var(--border); flex-shrink: 0;
    }
    .lb-row.rank-1 .lb-avatar { border-color: #f5a623; }
    .lb-row.rank-2 .lb-avatar { border-color: #b0b0c0; }
    .lb-row.rank-3 .lb-avatar { border-color: #cd7f32; }

    .lb-info { flex: 1; min-width: 0; }
    .lb-name {
      font-weight: 700; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lb-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .lb-score {
      text-align: right; flex-shrink: 0;
    }
    .lb-score-num { font-size: 18px; font-weight: 800; color: var(--accent); display: block; line-height: 1; }
    .lb-score-label { font-size: 10px; color: var(--text-muted); }

    .lb-me-badge {
      font-size: 10px; font-weight: 800; color: var(--accent);
      background: rgba(232,82,42,0.15); padding: 2px 7px;
      border-radius: 99px; margin-left: 5px; vertical-align: middle;
    }

    /* User's own rank card if not in top 20 */
    .lb-my-rank {
      margin-top: 12px; padding: 12px 14px; border-radius: 12px;
      border: 1.5px dashed var(--accent); background: rgba(232,82,42,0.05);
      font-size: 13px; color: var(--text-muted); text-align: center;
    }

    /* Skeleton for leaderboard */
    .lb-skeleton {
      height: 64px; border-radius: 12px; margin-bottom: 6px;
      background: linear-gradient(90deg, var(--bg-surface) 0%, var(--bg-card) 50%, var(--bg-surface) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body class="has-bottom-nav">

<header class="header">
  <div class="logo" onclick="goHome()">Pankomik</div>
  <input type="text" id="searchInput" placeholder="Cari komik..." oninput="liveSearch()" autocomplete="off">
  <div class="header-right">
    <button onclick="toggleDarkMode()">🌙</button>
    <button onclick="toggleMenu()">👤</button>
  </div>
</header>
<div id="searchResult" class="search-result"></div>
<div id="menuDropdown" class="dropdown"></div>

<div id="profileContent">
  <div class="empty-state"><p>⏳</p><p>Memuat profil...</p></div>
</div>

<script type="module">
import {
  getCurrentUser, getProfile, updateProfile, updatePassword,
  isOAuthUser, uploadAvatar,
  getBookmarks, removeBookmark, addBookmark,
  getHistory, getProgress, syncProfileProgress, getTotalChaptersRead,
  getLeaderboard,
  getNovelBookmarks, removeNovelBookmark,
  getNovelHistory, getNovelProgress,
  getTotalNovelChaptersRead
} from "/supabase.js";
import { initAuthHeader } from "/auth-header.js";

let currentUser    = null;

/* Image proxy — bypass CORS/hotlink */
function proxyImg(url, w) {
  if (!url) return "";
  if (url.includes("wsrv.nl") || url.includes("ui-avatars")) return url;
  return "https://wsrv.nl/?url=" + encodeURIComponent(url) + "&w=" + (w||200) + "&output=webp&q=80";
}
let currentProfile = null;
let bookmarkData   = {};
let activeKategori = "favorit";

/* ============================================================
   INIT
   ============================================================ */
window.onload = async function () {
  if (localStorage.getItem("theme") === "light") document.body.classList.add("light");
  await initAuthHeader();
  currentUser = await getCurrentUser();
  if (!currentUser) { window.location.href = "/masuk"; return; }
  await syncProfileProgress(currentUser.id);
  await loadProfile();
  const urlTab = new URLSearchParams(window.location.search).get("tab");
  if (urlTab) switchTab(urlTab);
};

/* ============================================================
   LOAD PROFIL — render kerangka halaman
   ============================================================ */
async function loadProfile() {
  const [{ profile }, { total: liveTotal }] = await Promise.all([
    getProfile(currentUser.id),
    getTotalChaptersRead(currentUser.id)
  ]);
  currentProfile = profile;

  const BADGE_DEFS = [
    { id:"pemula",        icon:"📖", name:"Pemula",        min_chapters:1    },
    { id:"pembaca_aktif", icon:"🔥", name:"Pembaca Aktif",  min_chapters:50   },
    { id:"otaku",         icon:"⭐", name:"Otaku",          min_chapters:200  },
    { id:"legenda",       icon:"👑", name:"Legenda",        min_chapters:500  },
    { id:"top_reader",    icon:"🏆", name:"Top Reader",     min_chapters:1000 },
  ];
  const badgeCount = BADGE_DEFS.filter(b => liveTotal >= b.min_chapters).length;
  const liveLevel  = Math.floor(liveTotal / 50) + 1;
  const levelTitle = getLevelTitle(liveLevel);
  const xpInLevel  = liveTotal % 50;
  const xpPct      = Math.round((xpInLevel / 50) * 100);
  const isOAuth    = isOAuthUser(currentUser);

  const ownedChips = BADGE_DEFS
    .filter(b => liveTotal >= b.min_chapters)
    .map(b => `<div class="badge-chip">${b.icon} ${b.name}</div>`)
    .join("");

  const avatarSrc  = profile?.avatar_url
    || `https://ui-avatars.com/api/?name=${encodeURIComponent(profile?.username || 'U')}&background=e8522a&color=fff&bold=true`;

  document.getElementById("profileContent").innerHTML = `
    <!-- ── Hero Profil ── -->
    <div class="profile-hero">
      <div class="profile-hero-bg"></div>
      <div class="profile-header">
        <div class="avatar-wrap" id="avatarWrap" onclick="document.getElementById('avatarInput').click()" title="Klik untuk ganti foto">
          <div class="avatar-ring"></div>
          <img id="avatarImg" src="${avatarSrc}" alt="Avatar">
          <div class="avatar-overlay"><span>📷</span><p>Ganti Foto</p></div>
        </div>
        <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none" onchange="handleAvatarUpload(event)">

        <div class="profile-name" id="profileNameDisplay">${profile?.username || 'User'}</div>
        <div class="profile-level">✨ Level ${liveLevel} — ${levelTitle}</div>

        <div class="profile-stats">
          <div class="stat-item"><p id="statChapters">${liveTotal}</p><p>Komik Ch</p></div>
          <div class="stat-item"><p id="statNovelChapters">–</p><p>Novel Ch</p></div>
          <div class="stat-item"><p>${badgeCount}</p><p>Badge</p></div>
        </div>

        <div class="profile-xp-row">
          <div class="profile-xp-labels">
            <span>XP Level ${liveLevel}</span>
            <span>${xpInLevel}/50 — ${50 - xpInLevel} lagi ke Lv.${liveLevel + 1}</span>
          </div>
          <div class="profile-xp-bar">
            <div class="profile-xp-fill" id="xpFill" style="width:0%"></div>
          </div>
        </div>
      </div>
    </div>

    ${badgeCount > 0 ? `<div class="badge-list">${ownedChips}</div>` : ""}

    <!-- ── Tab Navigasi ── -->
    <div class="profile-tabs">
      <button class="profile-tab active" id="tab-bookmark"       onclick="switchTab('bookmark')">🔖 Komik</button>
      <button class="profile-tab"        id="tab-novel-bookmark" onclick="switchTab('novel-bookmark')">📚 Novel</button>
      <button class="profile-tab"        id="tab-history"        onclick="switchTab('history')">📖 Riwayat</button>
      <button class="profile-tab"        id="tab-novel-history"  onclick="switchTab('novel-history')">📝 Novel</button>

   ============================================================ */
window.switchTab = function (tab) {
  document.querySelectorAll(".profile-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  document.getElementById(`tab-${tab}`)?.classList.add("active");
  document.getElementById(`content-${tab}`)?.classList.add("active");

  if (tab === "history")        loadHistory();
  if (tab === "novel-history")    loadNovelHistory();
  if (tab === "novel-bookmark")  loadNovelBookmarks();
  if (tab === "progress")         loadProgressTab();
  if (tab === "novel-progress")   loadNovelProgressTab();
  if (tab === "badge")          loadBadgeTab();
  if (tab === "leaderboard")    loadLeaderboard();
};

/* ============================================================
   BOOKMARK
   ============================================================ */
async function loadBookmarks() {
  const { bookmarks } = await getBookmarks(currentUser.id);
  bookmarkData = bookmarks;
  renderBookmarks(activeKategori);
}

function renderBookmarks(kategori) {
  const list = bookmarkData[kategori] || [];
  const el   = document.getElementById("bookmarkList");
  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><p>📭</p><p>Belum ada komik di kategori ini.</p></div>`;
    return;
  }
  el.innerHTML = list.map(bm => `
    <div class="komik-list-item">
      <img src="${bm.komik_cover || ''}" alt="${bm.komik_title}" onclick="gotoDetail('${bm.komik_slug}')" style="cursor:pointer">
      <div class="komik-list-info" onclick="gotoDetail('${bm.komik_slug}')" style="cursor:pointer">
        <div class="title">${bm.komik_title}</div>
        <p>📅 ${new Date(bm.created_at).toLocaleDateString('id-ID')}</p>
      </div>
      <div class="komik-list-actions">
        <button class="btn-sm primary" onclick="gotoDetail('${bm.komik_slug}')">Buka</button>
        <button class="btn-sm" onclick="hapusBookmark('${bm.komik_slug}',this)">Hapus</button>
      </div>
    </div>`).join("");
}

window.filterKategori = function (kategori, btn) {
  activeKategori = kategori;
  document.querySelectorAll(".kategori-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderBookmarks(kategori);
};

window.hapusBookmark = async function (slug, btn) {
  btn.textContent = "..."; btn.disabled = true;
  await removeBookmark(currentUser.id, slug);
  await loadBookmarks();

  /* Animate XP bar */
  setTimeout(() => {
    const fill = document.getElementById("xpFill");
    if (fill) fill.style.width = xpPct + "%";
  }, 300);

  /* Load novel chapter count */
  try {
    const { total: novelTotal } = await getTotalNovelChaptersRead(currentUser.id);
    const el = document.getElementById("statNovelChapters");
    if (el) el.textContent = novelTotal || 0;
  } catch(e) {}
};

   ============================================================ */
async function loadProgressTab() {
  const el = document.getElementById("progressList");
  el.innerHTML = `<div class="empty-state"><p>⏳</p><p>Memuat...</p></div>`;
  const { progress } = await getProgress(currentUser.id);
  if (!progress.length) {
    el.innerHTML = `<div class="empty-state"><p>📊</p><p>Belum ada progress. Mulai baca komik dulu!</p></div>`;
    return;
  }
  el.innerHTML = progress.map(p => {
    const pct      = p.total_chapters > 0 ? Math.min(100, Math.round((p.read_chapters / p.total_chapters) * 100)) : 0;
    const pctLabel = p.total_chapters > 0 ? `${pct}%` : "—";
    const chapLabel = p.total_chapters > 0 ? `${p.read_chapters} / ${p.total_chapters} chapter` : `${p.read_chapters} chapter dibaca`;
    const updated   = new Date(p.updated_at).toLocaleDateString("id-ID", { day:"numeric", month:"short", year:"numeric" });
    return `
      <div class="komik-list-item" style="flex-direction:column;align-items:flex-start;gap:8px;">
        <div style="display:flex;gap:12px;align-items:center;width:100%;">
          <div style="flex:1;min-width:0;">
            <div class="title" style="cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" onclick="gotoDetail('${p.komik_slug}')">${p.komik_title}</div>
            <p style="font-size:11px;color:var(--text-muted);margin:0;">📖 ${chapLabel} &nbsp;·&nbsp; 🕒 ${updated}</p>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <span style="font-size:16px;font-weight:800;color:var(--accent);">${pctLabel}</span>
          </div>
        </div>
        ${p.total_chapters > 0 ? `<div class="progress-bar-wrap" style="width:100%;"><div class="progress-bar-fill" style="width:${pct}%"></div></div>` : ""}
        <div style="display:flex;gap:6px;width:100%;">
          ${p.last_chapter_slug ? `<button class="btn-sm primary" onclick="window.location.href='/baca/${p.last_chapter_slug}'">▶️ Lanjut Baca</button>` : ""}

   ============================================================ */
async function loadBadgeTab() {
  const el = document.getElementById("badgeContent");
  const { total: liveTotal } = await getTotalChaptersRead(currentUser.id);
  const level         = Math.floor(liveTotal / 50) + 1;
  const title         = getLevelTitle(level);
  const xpInLevel     = liveTotal % 50;
  const xpPct         = Math.round((xpInLevel / 50) * 100);
  const ownedBadges   = currentProfile?.user_badges || [];
  const ownedIds      = new Set(ownedBadges.map(b => b.badge_id));
  const ownedNames    = new Set(ownedBadges.map(b => b.badges?.name).filter(Boolean));
  const allBadges = [
    { id:"pemula",        name:"Pemula",        icon:"📖", desc:"Baca 1 chapter pertama",  min_chapters:1    },
    { id:"pembaca_aktif", name:"Pembaca Aktif",  icon:"🔥", desc:"Sudah baca 50 chapter",   min_chapters:50   },
    { id:"otaku",         name:"Otaku",          icon:"⭐", desc:"Sudah baca 200 chapter",  min_chapters:200  },
    { id:"legenda",       name:"Legenda",        icon:"👑", desc:"Sudah baca 500 chapter",  min_chapters:500  },
    { id:"top_reader",    name:"Top Reader",     icon:"🏆", desc:"Sudah baca 1000 chapter", min_chapters:1000 },
    { id:"komentator",    name:"Komentator",     icon:"💬", desc:"Sudah buat 10 komentar",  min_chapters:0    },
  ];
  const countOwned = allBadges.filter(b => b.min_chapters > 0 && b.min_chapters <= liveTotal).length;

  el.innerHTML = `
    <div class="level-card">
      <div class="level-top">
        <div><div class="level-number">Level ${level}</div><div class="level-title">${title}</div></div>
        <div class="level-total"><span>${liveTotal}</span><small>Chapter Dibaca</small></div>
      </div>
      <div style="margin-top:10px;">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:5px;">
          <span>XP Level ${level}</span>
          <span>${xpInLevel}/50 — ${50-xpInLevel} lagi ke Level ${level+1}</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" style="width:${xpPct}%;background:linear-gradient(90deg,var(--accent),#f5a623);"></div>
        </div>
      </div>
    </div>
    <div style="margin-top:16px;">
      <p style="font-size:13px;font-weight:800;margin-bottom:10px;">
        🏅 Koleksi Badge
        <span style="font-weight:400;font-size:12px;color:var(--text-muted)">(${countOwned}/${allBadges.filter(b=>b.min_chapters>0).length} didapat)</span>
      </p>
      <div class="badge-grid">
        ${allBadges.map(b => {
          const owned    = b.min_chapters > 0 ? (ownedIds.has(b.id) || ownedNames.has(b.name) || liveTotal >= b.min_chapters) : (ownedIds.has(b.id) || ownedNames.has(b.name));
          const progress = b.min_chapters > 0 ? Math.min(100, Math.round((liveTotal / b.min_chapters) * 100)) : 0;
          return `<div class="badge-card ${owned ? "owned" : "locked"}">
            <div class="badge-icon">${b.icon}</div>
            <div class="badge-name">${b.name}</div>
            <div class="badge-desc">${b.desc}</div>
            ${owned ? `<div class="badge-status-owned">✅ Didapat</div>` : b.min_chapters > 0 ? `
              <div style="margin-top:6px;">
                <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${progress}%"></div></div>
                <div style="font-size:10px;color:var(--text-muted);margin-top:3px;text-align:center;">${liveTotal}/${b.min_chapters}</div>
              </div>` : `<div class="badge-status-locked">🔒 Terkunci</div>`}
          </div>`;
        }).join("")}
      </div>
    </div>`;
}

/* ============================================================
   LEADERBOARD
   ============================================================ */
async function loadLeaderboard(forceRefresh = false) {
  const el = document.getElementById("leaderboardContent");

  // Skeleton loading
  el.innerHTML = Array(8).fill(`<div class="lb-skeleton"></div>`).join("");

  const { leaderboard, error } = await getLeaderboard(20);

  if (error || !leaderboard.length) {
    el.innerHTML = `<div class="empty-state"><p>😕</p><p>Gagal memuat leaderboard. Coba lagi.</p>
      <button onclick="loadLeaderboard(true)" style="margin-top:12px;padding:7px 18px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Coba Lagi</button>
    </div>`;
    return;
  }

  // Cari rank user sendiri
  const myRankIndex = leaderboard.findIndex(u => u.id === currentUser.id);
  const myRank      = myRankIndex >= 0 ? myRankIndex + 1 : null;

  const rankEmoji = (i) => {
    if (i === 0) return "🥇";
    if (i === 1) return "🥈";
    if (i === 2) return "🥉";
    return `#${i + 1}`;
  };

  const rankClass = (i) => {
    if (i === 0) return "rank-1";
    if (i === 1) return "rank-2";
    if (i === 2) return "rank-3";
    return "";
  };

  const rows = leaderboard.map((u, i) => {
    const isMe    = u.id === currentUser.id;
    const name    = u.username || "Anonim";
    const avatar  = u.avatar_url
      || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=e8522a&color=fff&bold=true&size=80`;
    const level   = u.level || 1;
    const chaps   = u.total_chapters_read || 0;

    return `
      <div class="lb-row ${rankClass(i)} ${isMe ? "me" : ""}">
        <div class="lb-rank">${rankEmoji(i)}</div>
        <img class="lb-avatar" src="${avatar}" alt="${name}" loading="lazy">
        <div class="lb-info">
          <div class="lb-name">
            ${name}${isMe ? `<span class="lb-me-badge">Kamu</span>` : ""}
          </div>
          <div class="lb-meta">Level ${level} · ${getLevelTitle(level)}</div>
        </div>
        <div class="lb-score">
          <span class="lb-score-num">${chaps.toLocaleString("id-ID")}</span>
          <span class="lb-score-label">chapter</span>
        </div>
      </div>`;
  }).join("");

  // Tampilkan rank user jika tidak ada di top 20
  const myRankCard = (!myRank) ? `
    <div class="lb-my-rank">
      Kamu belum masuk top 20. Terus baca komik untuk naik peringkat! 📚
    </div>` : "";

  el.innerHTML = `
    <div class="lb-header">
      <h3>🏆 Top 20 Pembaca</h3>
      <button class="lb-refresh-btn" onclick="loadLeaderboard(true)">🔄 Refresh</button>
    </div>
    ${rows}
    ${myRankCard}`;
}

window.loadLeaderboard = loadLeaderboard;

   ============================================================ */
window.handleAvatarUpload = async function (event) {
  const file = event.target.files[0];
  if (!file) return;

  // Reset input agar bisa upload file sama lagi
  event.target.value = "";

  // Validasi tipe
  const allowed = ["image/jpeg", "image/png", "image/webp", "image/gif"];
  if (!allowed.includes(file.type)) {
    showUploadMsg("❌ Format tidak didukung. Gunakan JPG, PNG, atau WebP.", "error");
    return;
  }

  // Validasi ukuran (2MB)
  if (file.size > 2 * 1024 * 1024) {
    showUploadMsg("❌ Ukuran foto maksimal 2MB.", "error");
    return;
  }

  // Tunjukkan preview lokal + loading state
  const reader = new FileReader();
  reader.onload = e => {
    const src = e.target.result;
    ["avatarImg", "avatarImgSettings"].forEach(id => {
      const img = document.getElementById(id);
      if (img) img.src = src;
    });
  };
  reader.readAsDataURL(file);

  const wrap = document.getElementById("avatarWrap");
  wrap?.classList.add("avatar-uploading");
  showUploadMsg("⏳ Mengupload foto...", "");

  // Upload ke Supabase Storage
  const { url, error } = await uploadAvatar(currentUser.id, file);

  wrap?.classList.remove("avatar-uploading");

  if (error) {
    console.error("Upload error:", error);
    showUploadMsg(`❌ Gagal upload: ${error.message || "Coba lagi."}`, "error");
    // Kembalikan avatar lama
    const oldSrc = currentProfile?.avatar_url
      || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentProfile?.username || 'U')}&background=e8522a&color=fff`;
    ["avatarImg", "avatarImgSettings"].forEach(id => {
      const img = document.getElementById(id); if (img) img.src = oldSrc;
    });
    return;
  }

  // Simpan URL baru ke profil
  const { error: updateErr } = await updateProfile(currentUser.id, { avatar_url: url });
  if (updateErr) {
    showUploadMsg("⚠️ Foto terupload tapi gagal disimpan ke profil. Coba muat ulang.", "error");
    return;
  }

  if (currentProfile) currentProfile.avatar_url = url;
  // Pastikan kedua gambar tampilkan URL final (bukan blob)
  ["avatarImg", "avatarImgSettings"].forEach(id => {
    const img = document.getElementById(id); if (img) img.src = url + "?t=" + Date.now();
  });

  showUploadMsg("✅ Foto profil berhasil diperbarui!", "success");
};

function showUploadMsg(text, type) {
  const el = document.getElementById("uploadMsg");
  if (!el) return;
  el.textContent  = text;
  el.className    = `form-msg ${type}`;
  el.style.display = "block";
  if (type === "success") setTimeout(() => { el.style.display = "none"; }, 4000);
}

/* ============================================================
   SIMPAN USERNAME — FIXED
   ============================================================ */
window.saveProfile = async function () {
  const input    = document.getElementById("usernameInput");
  const btn      = document.getElementById("saveUsernameBtn");
  const username = input.value.trim();

  if (!username) { showFormMsg("saveMsg", "❌ Username tidak boleh kosong.", "error"); return; }
  if (username.length < 3) { showFormMsg("saveMsg", "❌ Username minimal 3 karakter.", "error"); return; }
  if (username.length > 30) { showFormMsg("saveMsg", "❌ Username maksimal 30 karakter.", "error"); return; }

  // Validasi karakter: huruf, angka, underscore, dash
  if (!/^[a-zA-Z0-9_\-]+$/.test(username)) {
    showFormMsg("saveMsg", "❌ Hanya huruf, angka, underscore (_), dan dash (-) yang diizinkan.", "error");
    return;
  }

  btn.disabled    = true;
  btn.textContent = "⏳ Menyimpan...";

  const { profile: updated, error } = await updateProfile(currentUser.id, { username });

  btn.disabled    = false;
  btn.textContent = "💾 Simpan Username";

  if (error) {
    const isDuplicate = error.message?.includes("duplicate") || error.message?.includes("unique") || error.code === "23505";
    showFormMsg("saveMsg", isDuplicate ? "❌ Username sudah dipakai orang lain." : `❌ Gagal: ${error.message}`, "error");
    return;
  }

  // Verifikasi dengan fetch ulang dari DB
  const { profile: verified } = await getProfile(currentUser.id);
  const savedUsername = verified?.username || updated?.username || username;

  // Update semua tampilan nama
  const nameEl = document.getElementById("profileNameDisplay");
  if (nameEl) nameEl.textContent = savedUsername;
  if (currentProfile) currentProfile.username = savedUsername;
  input.value = savedUsername;

  showFormMsg("saveMsg", "✅ Username berhasil diperbarui!", "success");
};

/* ============================================================
   GANTI PASSWORD
   ============================================================ */
window.savePassword = async function () {
  const newPass     = document.getElementById("newPasswordInput")?.value;
  const confirmPass = document.getElementById("confirmPasswordInput")?.value;
  const btn         = document.getElementById("savePasswordBtn");

  if (!newPass) { showFormMsg("passwordMsg", "❌ Password baru tidak boleh kosong.", "error"); return; }
  if (newPass.length < 6) { showFormMsg("passwordMsg", "❌ Password minimal 6 karakter.", "error"); return; }
  if (newPass !== confirmPass) { showFormMsg("passwordMsg", "❌ Konfirmasi password tidak cocok.", "error"); return; }

  btn.disabled = true; btn.textContent = "⏳ Menyimpan...";
  const { error } = await updatePassword(newPass);
  btn.disabled = false; btn.textContent = "🔒 Ganti Password";

  if (!error) {
    document.getElementById("newPasswordInput").value     = "";
    document.getElementById("confirmPasswordInput").value = "";
    showFormMsg("passwordMsg", "✅ Password berhasil diubah!", "success");
  } else {
    const msg = error.message?.includes("same password")
      ? "❌ Password baru tidak boleh sama dengan yang lama."
      : "❌ Gagal mengubah password. Coba lagi.";
    showFormMsg("passwordMsg", msg, "error");
  }
};

/* Tampilkan pesan form dengan auto-hide */
function showFormMsg(id, text, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className   = `form-msg ${type}`;
  if (type === "success") setTimeout(() => { el.className = "form-msg"; el.textContent = ""; }, 5000);
}

/* Novel functions */
let novelBookmarkData   = {};
let activeNovelKategori = "favorit";

async function loadNovelBookmarks() {
  const { bookmarks } = await getNovelBookmarks(currentUser.id);
  novelBookmarkData = bookmarks;
  renderNovelBookmarks(activeNovelKategori);
}

function renderNovelBookmarks(kategori) {
  const list = novelBookmarkData[kategori] || [];
  const el   = document.getElementById("novelBookmarkList");
  if (!list.length) {
    el.innerHTML = '<div class="empty-state"><p>📭</p><p>Belum ada novel di kategori ini.</p></div>';
    return;
  }
  el.innerHTML = list.map(bm => `
    <div class="komik-list-item">
      <div style="width:50px;height:68px;background:var(--bg-surface);border-radius:6px;
        display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
        ${bm.novel_cover ? 'display:none' : ''}">📖</div>
      ${bm.novel_cover ? `<img src="${proxyImg(bm.novel_cover,120)}" alt="${bm.novel_title}" style="width:50px;height:68px;object-fit:cover;border-radius:6px;flex-shrink:0;cursor:pointer" onclick="gotoNovelDetail('${bm.novel_slug}')">` : ''}
      <div class="komik-list-info" onclick="gotoNovelDetail('${bm.novel_slug}')" style="cursor:pointer">
        <div class="title">${bm.novel_title}</div>
        <p>📅 ${new Date(bm.created_at).toLocaleDateString('id-ID')}</p>
      </div>
      <div class="komik-list-actions">
        <button class="btn-sm primary" onclick="gotoNovelDetail('${bm.novel_slug}')">Buka</button>
        <button class="btn-sm" onclick="hapusNovelBookmark('${bm.novel_slug}',this)">Hapus</button>
      </div>
    </div>`).join("");
}

window.filterNovelKategori = function (kategori, btn) {
  activeNovelKategori = kategori;
  document.querySelectorAll("#content-novel-bookmark .kategori-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderNovelBookmarks(kategori);
};

window.hapusNovelBookmark = async function (slug, btn) {
  btn.textContent = "..."; btn.disabled = true;
  await removeNovelBookmark(currentUser.id, slug);
  await loadNovelBookmarks();
};

async function loadNovelHistory() {
  const { history } = await getNovelHistory(currentUser.id);
  const el = document.getElementById("novelHistoryList");
  if (!history?.length) {
    el.innerHTML = '<div class="empty-state"><p>📭</p><p>Belum ada riwayat baca novel.</p></div>';
    return;
  }
  el.innerHTML = history.map(h => `
    <div class="komik-list-item">
      <div style="width:50px;height:68px;background:var(--bg-surface);border-radius:6px;
        display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">📖</div>
      <div class="komik-list-info">
        <div class="title">${h.novel_title || h.novel_slug || '–'}</div>
        <p style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;">
          ${h.chapter_title || h.chapter_slug || ''}
        </p>
        <p>⏱️ ${new Date(h.read_at).toLocaleDateString('id-ID')}</p>
      </div>
      <div class="komik-list-actions">
        <button class="btn-sm primary" onclick="window.location.href='/baca-novel/${h.chapter_slug}'">Lanjut</button>
        <button class="btn-sm" onclick="gotoNovelDetail('${h.novel_slug}')">Detail</button>
      </div>
    </div>`).join("");
}

window.gotoNovelDetail = slug => window.location.href = '/novel/'+slug;
window.gotoDetail = slug => window.location.href = '/komik/'+slug;

window.toggleMenu   = () => { const m = document.getElementById("menuDropdown"); if (m) m.style.display = m.style.display === "block" ? "none" : "block"; };
window.toggleDarkMode = () => { document.body.classList.toggle("light"); localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark"); };

function getLevelTitle(level) {
  if (level >= 20) return "Legenda Komik 👑";
  if (level >= 10) return "Otaku Sejati ⭐";
  if (level >= 5)  return "Pembaca Aktif 🔥";
  if (level >= 2)  return "Pecinta Komik 📚";
  return "Pemula 🌱";
}
