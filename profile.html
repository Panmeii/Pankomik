<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — Pankomik</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════
       PANKOMIK PROFILE — REDESIGN v2
       Aesthetic: dark manga-editorial, neon-accent, glassmorphism
    ═══════════════════════════════════════════════════════ */

    :root {
      --acc:       #e8522a;
      --acc2:      #f5a623;
      --acc-glow:  rgba(232,82,42,0.28);
      --acc-soft:  rgba(232,82,42,0.10);
      --glass:     rgba(255,255,255,0.04);
      --glass-b:   rgba(255,255,255,0.08);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    /* ─── HERO BANNER ───────────────────────────────────── */
    .profile-hero {
      position: relative;
      padding: 0 0 0;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(232,82,42,0.35) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 90% 30%, rgba(245,166,35,0.18) 0%, transparent 60%),
        var(--bg-card, #1a1a24);
      z-index: 0;
    }

    .hero-bg::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 60px;
      background: linear-gradient(to bottom, transparent, var(--bg, #0e0e12));
    }

    /* Subtle dot grid texture */
    .hero-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 22px 22px;
      opacity: 0.5;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      padding: 32px 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
    }

    /* ─── AVATAR ─────────────────────────────────────────── */
    .avatar-ring {
      position: relative;
      width: 96px; height: 96px;
      margin-bottom: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .avatar-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(var(--acc), var(--acc2), #ff6b35, var(--acc));
      animation: spin-slow 5s linear infinite;
      z-index: 0;
    }

    @keyframes spin-slow { to { transform: rotate(360deg); } }

    .avatar-ring::after {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: var(--bg, #0e0e12);
      z-index: 1;
    }

    .avatar-ring img {
      position: relative;
      z-index: 2;
      width: 90px; height: 90px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 3px auto;
      transition: filter 0.2s, transform 0.2s;
    }

    .avatar-edit-icon {
      position: absolute;
      bottom: 4px; right: 4px;
      z-index: 3;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--acc);
      border: 2px solid var(--bg, #0e0e12);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      box-shadow: 0 2px 8px var(--acc-glow);
      transition: transform 0.2s;
    }

    .avatar-ring:hover img { filter: brightness(0.75); transform: scale(0.97); }
    .avatar-ring:hover .avatar-edit-icon { transform: scale(1.15); }

    .avatar-uploading::before {
      animation: spin-slow 0.6s linear infinite !important;
      background: conic-gradient(var(--acc), transparent 120deg) !important;
    }

    /* ─── NAME / LEVEL ROW ────────────────────────────────── */
    .hero-name {
      font-family: 'Nunito', sans-serif;
      font-size: 22px; font-weight: 900;
      color: var(--text, #eaeaf0);
      line-height: 1.2;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .hero-level-pill {
      display: inline-flex;
      align-items: center; gap: 6px;
      padding: 4px 13px;
      background: var(--acc-soft);
      border: 1px solid rgba(232,82,42,0.3);
      border-radius: 99px;
      font-size: 12px; font-weight: 800;
      color: var(--acc);
      margin-bottom: 18px;
      letter-spacing: 0.2px;
    }

    .hero-level-pill .lv-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--acc);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.7); }
    }

    /* ─── STATS ROW ──────────────────────────────────────── */
    .hero-stats {
      display: flex;
      gap: 0;
      width: 100%;
      max-width: 320px;
      background: var(--glass);
      border: 1px solid var(--glass-b);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .hero-stat {
      flex: 1;
      padding: 13px 10px;
      text-align: center;
      position: relative;
    }

    .hero-stat + .hero-stat::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 1px;
      background: var(--glass-b);
    }

    .hero-stat-num {
      font-size: 22px; font-weight: 900;
      color: var(--text, #eaeaf0);
      line-height: 1;
      font-family: 'Bangers', cursive;
      letter-spacing: 1px;
    }

    .hero-stat-label {
      font-size: 10px;
      color: var(--text-muted, #888);
      font-weight: 700;
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ─── BADGE CHIPS ────────────────────────────────────── */
    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 14px 16px 4px;
      justify-content: center;
    }

    .hero-badge-chip {
      display: inline-flex;
      align-items: center; gap: 4px;
      padding: 4px 10px;
      background: linear-gradient(135deg, rgba(232,82,42,0.12), rgba(245,166,35,0.08));
      border: 1px solid rgba(232,82,42,0.25);
      border-radius: 99px;
      font-size: 11px; font-weight: 800;
      color: var(--acc2, #f5a623);
      animation: badge-in 0.4s ease both;
    }

    @keyframes badge-in {
      from { opacity: 0; transform: scale(0.8) translateY(4px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ─── TABS ───────────────────────────────────────────── */
    .profile-tabs-wrap {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-card, #1a1a24);
      border-bottom: 1px solid var(--glass-b);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .profile-tabs {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 12px;
      gap: 2px;
    }
    .profile-tabs::-webkit-scrollbar { display: none; }

    .profile-tab {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 12px;
      font-size: 12px; font-weight: 800;
      color: var(--text-muted, #666);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      background: none;
      border-top: none; border-left: none; border-right: none;
      font-family: 'Nunito', sans-serif;
      transition: color 0.2s, border-color 0.2s;
      letter-spacing: 0.2px;
    }

    .profile-tab .tab-icon { font-size: 14px; }

    .profile-tab.active {
      color: var(--acc);
      border-bottom-color: var(--acc);
    }

    .profile-tab:hover:not(.active) { color: var(--text, #eaeaf0); }

    /* ─── TAB CONTENT ────────────────────────────────────── */
    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    /* ─── KATEGORI FILTER PILLS ──────────────────────────── */
    .kategori-tabs {
      display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap;
    }

    .kategori-btn {
      padding: 6px 14px;
      border-radius: 99px;
      border: 1.5px solid var(--glass-b);
      background: var(--glass);
      color: var(--text-muted, #888);
      font-size: 12px; font-weight: 700;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: all 0.18s;
    }

    .kategori-btn.active {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      box-shadow: 0 4px 12px var(--acc-glow);
    }

    .kategori-btn:hover:not(.active) {
      border-color: var(--acc);
      color: var(--acc);
    }

    /* ─── KOMIK LIST CARDS ───────────────────────────────── */
    .komik-list-item {
      display: flex; gap: 12px;
      padding: 12px;
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      align-items: center;
      transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
    }

    .komik-list-item:hover {
      border-color: rgba(232,82,42,0.35);
      transform: translateX(3px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .komik-list-item img {
      width: 52px; height: 70px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      border: 1px solid var(--glass-b);
    }

    .komik-list-info { flex: 1; min-width: 0; }
    .komik-list-info .title {
      font-weight: 800; font-size: 13px;
      margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text, #eaeaf0);
    }
    .komik-list-info p {
      font-size: 11px; color: var(--text-muted, #888);
      margin: 2px 0;
    }

    .komik-list-actions {
      display: flex; flex-direction: column; gap: 5px; flex-shrink: 0;
    }

    .btn-sm {
      padding: 6px 12px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--glass-b);
      background: var(--glass);
      color: var(--text, #eaeaf0);
      font-size: 11px; font-weight: 800;
      cursor: pointer; white-space: nowrap;
      font-family: 'Nunito', sans-serif;
      transition: all 0.15s;
    }

    .btn-sm.primary {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      box-shadow: 0 2px 8px var(--acc-glow);
    }

    .btn-sm:hover { filter: brightness(1.2); transform: translateY(-1px); }

    /* ─── PROGRESS BAR ───────────────────────────────────── */
    .progress-bar-wrap {
      height: 5px;
      background: var(--glass);
      border-radius: 99px;
      margin-top: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--acc), var(--acc2));
      border-radius: 99px;
      transition: width 0.7s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 0 8px var(--acc-glow);
    }

    /* ─── EMPTY STATE ────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted, #888);
      font-size: 13px;
    }
    .empty-state .es-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
    .empty-state p:first-child { font-size: 32px; margin-bottom: 8px; }

    /* ─── EDIT PROFIL ────────────────────────────────────── */
    .edit-section-card {
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
    }

    .edit-section-title {
      font-size: 11px; font-weight: 800;
      color: var(--text-muted, #888);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    .edit-form input, .edit-form textarea {
      width: 100%;
      padding: 11px 14px;
      background: rgba(0,0,0,0.25);
      border: 1.5px solid var(--glass-b);
      border-radius: var(--radius-md);
      color: var(--text, #eaeaf0);
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .edit-form input:focus {
      border-color: var(--acc);
      box-shadow: 0 0 0 3px var(--acc-glow);
    }

    .input-hint { font-size: 11px; color: var(--text-muted, #888); margin-top: 6px; }
    .char-counter { font-size: 11px; color: var(--text-muted, #888); text-align: right; margin-top: 4px; }

    .edit-btn {
      width: 100%; padding: 12px 20px;
      background: linear-gradient(135deg, var(--acc), #c73f1c);
      color: #fff; border: none;
      border-radius: var(--radius-md);
      font-family: 'Nunito', sans-serif;
      font-size: 14px; font-weight: 800;
      cursor: pointer; margin-top: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 16px var(--acc-glow);
      letter-spacing: 0.3px;
    }

    .edit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--acc-glow); }
    .edit-btn:active { transform: scale(0.97); }
    .edit-btn:disabled { background: var(--glass); color: var(--text-muted); box-shadow: none; cursor: not-allowed; }

    .form-msg {
      font-size: 12px; margin-top: 8px; padding: 9px 13px;
      border-radius: var(--radius-sm); display: none;
      font-weight: 700;
    }
    .form-msg.success { display: block; background: rgba(39,174,96,0.12); border: 1px solid rgba(39,174,96,0.3); color: #27ae60; }
    .form-msg.error   { display: block; background: rgba(232,82,42,0.1); border: 1px solid rgba(232,82,42,0.3); color: var(--acc); }

    /* ─── AVATAR UPLOAD AREA ─────────────────────────────── */
    .avatar-upload-area {
      display: flex; align-items: center; gap: 14px;
      padding: 14px;
      background: rgba(0,0,0,0.2);
      border: 1.5px dashed rgba(255,255,255,0.12);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 4px;
    }
    .avatar-upload-area:hover {
      border-color: var(--acc);
      background: var(--acc-soft);
    }
    .avatar-upload-area img {
      width: 52px; height: 52px;
      border-radius: 50%; object-fit: cover;
      border: 2px solid var(--acc); flex-shrink: 0;
    }
    .avatar-upload-text p:first-child { font-size: 13px; font-weight: 700; color: var(--text, #eaeaf0); }
    .avatar-upload-text p:last-child  { font-size: 11px; color: var(--text-muted, #888); margin-top: 3px; }

    /* ─── LEVEL & BADGE CARD ─────────────────────────────── */
    .level-card {
      background: linear-gradient(135deg, rgba(232,82,42,0.12), rgba(245,166,35,0.07));
      border: 1px solid rgba(232,82,42,0.25);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }

    .level-card::before {
      content: attr(data-level);
      position: absolute;
      right: -8px; top: -12px;
      font-family: 'Bangers', cursive;
      font-size: 80px;
      color: rgba(232,82,42,0.08);
      line-height: 1;
      pointer-events: none;
      user-select: none;
      letter-spacing: 2px;
    }

    .level-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .level-number { font-size: 28px; font-weight: 900; color: var(--acc); line-height: 1; font-family: 'Bangers', cursive; letter-spacing: 1px; }
    .level-title  { font-size: 12px; color: var(--text-muted, #888); margin-top: 4px; font-weight: 700; }
    .level-total  { text-align: right; }
    .level-total span  { font-size: 28px; font-weight: 900; color: var(--text, #eaeaf0); display: block; line-height: 1; font-family: 'Bangers', cursive; }
    .level-total small { font-size: 10px; color: var(--text-muted, #888); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ─── BADGE GRID ─────────────────────────────────────── */
    .badge-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }

    .badge-card {
      background: var(--glass);
      border: 1.5px solid var(--glass-b);
      border-radius: var(--radius-md);
      padding: 16px 12px;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .badge-card.owned {
      border-color: rgba(232,82,42,0.4);
      background: linear-gradient(135deg, rgba(232,82,42,0.08), rgba(245,166,35,0.04));
      box-shadow: 0 0 20px rgba(232,82,42,0.08);
    }

    .badge-card.locked { opacity: 0.5; }
    .badge-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }

    .badge-icon { font-size: 30px; margin-bottom: 7px; }
    .badge-name { font-size: 13px; font-weight: 800; margin-bottom: 4px; color: var(--text, #eaeaf0); }
    .badge-desc { font-size: 10px; color: var(--text-muted, #888); line-height: 1.4; }
    .badge-status-owned  { margin-top: 7px; font-size: 11px; color: #27ae60; font-weight: 700; }
    .badge-status-locked { margin-top: 7px; font-size: 11px; color: var(--text-muted, #888); }

    /* ─── LEADERBOARD ────────────────────────────────────── */
    .lb-top-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; padding: 0 2px;
    }
    .lb-top-title {
      font-family: 'Bangers', cursive;
      font-size: 18px; letter-spacing: 2px;
      color: var(--text, #eaeaf0);
    }
    .lb-top-title span { color: var(--acc); }
    .lb-top-right { display: flex; align-items: center; gap: 8px; }
    .lb-updated { font-size: 10px; color: var(--text-muted, #888); font-weight: 600; }

    .lb-toggle {
      display: flex; gap: 6px;
      padding: 4px 0 12px;
      margin-bottom: 4px;
    }
    .lb-toggle-btn {
      flex: 1; padding: 9px 12px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--glass-b);
      background: var(--glass);
      color: var(--text-muted, #666);
      font-family: 'Nunito', sans-serif;
      font-size: 13px; font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lb-toggle-btn.active {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      box-shadow: 0 4px 14px var(--acc-glow);
    }
    .lb-toggle-btn:not(.active):hover { border-color: var(--acc); color: var(--acc); }

    .lb-refresh-btn {
      padding: 6px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--glass-b);
      background: var(--glass);
      color: var(--text-muted, #888);
      font-size: 13px; font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
    }
    .lb-refresh-btn:hover { background: var(--acc); border-color: var(--acc); color: #fff; }

    .lb-row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: var(--radius-md);
      margin-bottom: 8px;
      border: 1px solid var(--glass-b);
      background: var(--glass);
      transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
      position: relative; overflow: hidden;
      animation: lbSlideIn 0.3s ease both;
    }
    .lb-row:hover { background: var(--glass-b); transform: translateX(3px); }
    .lb-row.me    { border-color: rgba(232,82,42,0.4); background: rgba(232,82,42,0.07); }
    .lb-row.rank-1 { border-color: rgba(245,166,35,0.4); background: rgba(245,166,35,0.07); }
    .lb-row.rank-2 { border-color: rgba(176,176,192,0.3); background: rgba(176,176,192,0.05); }
    .lb-row.rank-3 { border-color: rgba(205,127,50,0.35); background: rgba(205,127,50,0.06); }

    @keyframes lbSlideIn { from { opacity:0; transform:translateX(-12px); } to { opacity:1; transform:translateX(0); } }

    .lb-rank { font-size: 13px; font-weight: 800; min-width: 30px; text-align: center; color: var(--text-muted, #888); flex-shrink: 0; line-height: 1; }
    .lb-row.rank-1 .lb-rank { font-size: 22px; }
    .lb-row.rank-2 .lb-rank { font-size: 20px; }
    .lb-row.rank-3 .lb-rank { font-size: 18px; }

    .lb-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--glass-b); flex-shrink: 0; font-family: 'Nunito', sans-serif; }
    .lb-row.rank-1 .lb-avatar { border-color: #f5a623; box-shadow: 0 0 12px rgba(245,166,35,.35); }
    .lb-row.rank-2 .lb-avatar { border-color: #b0b0c0; }
    .lb-row.rank-3 .lb-avatar { border-color: #cd7f32; }

    .lb-info { flex: 1; min-width: 0; }
    .lb-name { font-weight: 800; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lb-meta { font-size: 11px; color: var(--text-muted, #888); margin-top: 2px; }
    .lb-score { text-align: right; flex-shrink: 0; min-width: 60px; }
    .lb-score-num { font-size: 20px; font-weight: 900; color: var(--acc); display: block; line-height: 1; font-family: 'Bangers', cursive; letter-spacing: 1px; }
    .lb-score-label { font-size: 10px; color: var(--text-muted, #888); white-space: nowrap; }
    .lb-me-badge { font-size: 10px; font-weight: 800; color: var(--acc); background: var(--acc-soft); padding: 2px 7px; border-radius: 99px; margin-left: 5px; vertical-align: middle; }
    .lb-my-rank { margin-top: 12px; padding: 12px 14px; border-radius: var(--radius-md); border: 1.5px dashed rgba(232,82,42,0.35); background: var(--acc-soft); font-size: 12px; color: var(--text-muted, #888); text-align: center; line-height: 1.6; }
    .lb-my-rank strong { color: var(--acc); }
    .lb-bar-wrap { height: 3px; border-radius: 99px; background: var(--glass-b); margin-top: 5px; overflow: hidden; }
    .lb-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--acc), var(--acc2)); transition: width 0.6s cubic-bezier(.4,0,.2,1); }
    .lb-row.rank-1 .lb-bar-fill { background: linear-gradient(90deg, #f5a623, #ffdd57); }
    .lb-row.rank-2 .lb-bar-fill { background: linear-gradient(90deg, #b0b0c0, #d0d0e0); }
    .lb-row.rank-3 .lb-bar-fill { background: linear-gradient(90deg, #cd7f32, #e8a050); }
    .lb-show-more { width: 100%; margin-top: 6px; padding: 10px; border: 1.5px dashed var(--glass-b); border-radius: var(--radius-md); background: transparent; color: var(--text-muted, #888); font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800; cursor: pointer; transition: all 0.18s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .lb-show-more:hover { border-color: var(--acc); color: var(--acc); background: var(--acc-soft); }
    .lb-footer { text-align: center; margin-top: 10px; font-size: 10px; color: var(--text-muted, #666); }
    .lb-skeleton { height: 64px; border-radius: var(--radius-md); margin-bottom: 8px; background: linear-gradient(90deg, var(--glass) 0%, var(--glass-b) 50%, var(--glass) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ─── KOMENTAR SAYA ──────────────────────────────────── */
    .my-comment-card {
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: var(--radius-md);
      padding: 13px;
      margin-bottom: 9px;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.18s;
      cursor: pointer;
      text-decoration: none;
      display: block;
      color: inherit;
    }
    .my-comment-card:hover {
      border-color: rgba(232,82,42,0.4);
      transform: translateX(3px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .my-comment-location {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--glass-b);
      border-radius: 99px;
      padding: 3px 10px;
      font-size: 10px; font-weight: 700;
      color: var(--text-muted, #888);
      margin-bottom: 8px;
      max-width: 100%;
    }
    .my-comment-text { font-size: 13px; line-height: 1.55; color: var(--text, #eaeaf0); margin-bottom: 7px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .my-comment-footer { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-muted, #888); }
    .my-comment-likes { color: #ff4060; font-weight: 700; }
    .my-comment-reply-badge { background: rgba(142,68,173,0.12); color: #a855f7; border-radius: 99px; padding: 2px 7px; font-size: 10px; font-weight: 700; }

    /* ─── SECTION LABEL ──────────────────────────────────── */
    .section-label {
      font-size: 11px; font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted, #888);
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .section-label::after {
      content: '';
      flex: 1; height: 1px;
      background: var(--glass-b);
    }

    /* ─── SPIN ───────────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── LOADING SKELETON ───────────────────────────────── */
    .skel { background: linear-gradient(90deg, var(--glass) 0%, var(--glass-b) 50%, var(--glass) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius-md); }

    /* ─── USER EMAIL BADGE ───────────────────────────────── */
    .email-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px;
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--glass-b);
      border-radius: var(--radius-sm);
      font-size: 12px; color: var(--text-muted, #888);
      font-weight: 600;
      margin-bottom: 16px;
      word-break: break-all;
    }

    /* ─── AVATAR LOADING RING ────────────────────────────── */
    .avatar-uploading { opacity: 0.7; pointer-events: none; }
    .avatar-uploading::before { animation: spin 0.5s linear infinite !important; background: conic-gradient(var(--acc), transparent) !important; }

    /* ─── MOBILE TOUCH ───────────────────────────────────── */
    * { -webkit-tap-highlight-color: transparent; }

    /* ─── SCROLL INDICATOR (tabs) ────────────────────────── */
    .profile-tabs-wrap::after {
      content: '';
      position: absolute; right: 0; top: 0; bottom: 0;
      width: 32px;
      background: linear-gradient(to right, transparent, var(--bg-card, #1a1a24));
      pointer-events: none;
    }
    .profile-tabs-wrap { position: sticky; top: 0; z-index: 100; }

    /* ─── REFRESH BUTTON ─────────────────────────────────── */
    .tab-refresh-btn {
      float: right; background: none; border: 1px solid var(--glass-b);
      color: var(--text-muted, #888); font-size: 12px; padding: 4px 10px;
      border-radius: 99px; cursor: pointer; font-family: 'Nunito', sans-serif;
      font-weight: 700; margin-bottom: 10px; transition: all 0.15s;
    }
    .tab-refresh-btn:hover { border-color: var(--acc); color: var(--acc); }

    /* ─── NOVEL HISTORY COVER ────────────────────────────── */
    .novel-history-cover {
      width: 52px; height: 70px; border-radius: 8px; flex-shrink: 0;
      overflow: hidden; border: 1px solid var(--glass-b);
      background: var(--glass);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .novel-history-cover img {
      width: 100%; height: 100%; object-fit: cover;
    }

    /* ─── SEARCH INPUT LIVE ──────────────────────────────── */
    .tab-search {
      width: 100%; padding: 9px 14px; margin-bottom: 12px;
      background: rgba(0,0,0,0.2); border: 1px solid var(--glass-b);
      border-radius: 99px; color: var(--text, #eaeaf0);
      font-family: 'Nunito', sans-serif; font-size: 13px;
      outline: none; box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .tab-search:focus { border-color: var(--acc); }
    .tab-search::placeholder { color: var(--text-muted, #888); }
  </style>
</head>
<body class="has-bottom-nav">

<header class="header">
  <div class="logo" onclick="goHome()">Pankomik</div>
  <input type="text" id="searchInput" placeholder="Cari komik..." oninput="liveSearch()" autocomplete="off">
  <div class="header-right">
    <button onclick="toggleDarkMode()">🌙</button>
    <button onclick="toggleMenu()">👤</button>
  </div>
</header>
<div id="searchResult" class="search-result"></div>
<div id="menuDropdown" class="dropdown"></div>

<div id="profileContent">
  <!-- Loading state -->
  <div class="profile-hero">
    <div class="hero-bg"></div>
    <div class="hero-inner">
      <div style="width:96px;height:96px;border-radius:50%;margin-bottom:14px;" class="skel"></div>
      <div style="width:130px;height:22px;margin-bottom:8px;" class="skel"></div>
      <div style="width:100px;height:24px;border-radius:99px;margin-bottom:18px;" class="skel"></div>
      <div style="width:280px;height:66px;border-radius:18px;" class="skel"></div>
    </div>
  </div>
</div>

<script type="module">
import {
  getCurrentUser, getProfile, updateProfile, updatePassword,
  isOAuthUser, uploadAvatar, logout,
  getBookmarks, removeBookmark, addBookmark,
  getHistory, getProgress, syncProfileProgress, getTotalChaptersRead,
  getLeaderboard, getNovelLeaderboard,
  getNovelBookmarks, removeNovelBookmark,
  getNovelHistory, getMyComments
} from "/supabase.js";
import { initAuthHeader } from "/auth-header.js";

let currentUser    = null;
let currentProfile = null;
let bookmarkData   = {};
let activeKategori = "favorit";

function proxyImg(url, w) {
  if (!url) return "";
  if (url.includes("wsrv.nl") || url.includes("ui-avatars")) return url;
  return "https://wsrv.nl/?url=" + encodeURIComponent(url) + "&w=" + (w||200) + "&output=webp&q=80";
}

/* Proxy khusus untuk cover novel dari sakuranovel.id */
function proxyNovelCover(url) {
  if (!url) return "";
  if (url.includes("proxy.sankavolereii.my.id")) return url;
  if (url.startsWith("/")) url = "https://sakuranovel.id" + url;
  if (!url.startsWith("http")) url = "https://" + url;
  return "https://proxy.sankavolereii.my.id/" + url;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

/* ── INIT ─────────────────────────────────────────────── */
window.onload = async function () {
  if (localStorage.getItem("theme") === "light") document.body.classList.add("light");
  await initAuthHeader();
  currentUser = await getCurrentUser();
  if (!currentUser) { window.location.href = "/masuk"; return; }
  await syncProfileProgress(currentUser.id);
  await loadProfile();
  const urlTab = new URLSearchParams(window.location.search).get("tab");
  if (urlTab) switchTab(urlTab);
};

/* ── LOAD PROFILE HTML ────────────────────────────────── */
async function loadProfile() {
  const [{ profile }, { total: liveTotal }] = await Promise.all([
    getProfile(currentUser.id),
    getTotalChaptersRead(currentUser.id)
  ]);

  if (profile && !profile.username) {
    const meta = currentUser.user_metadata || {};
    profile.username   = meta.full_name || meta.name || meta.preferred_username || currentUser.email?.split("@")[0] || "User";
    profile.avatar_url = profile.avatar_url || meta.avatar_url || meta.picture || null;
  }
  currentProfile = profile;

  const BADGE_DEFS = [
    { id:"pemula",        icon:"📖", name:"Pemula",        min_chapters:1    },
    { id:"pembaca_aktif", icon:"🔥", name:"Pembaca Aktif",  min_chapters:50   },
    { id:"otaku",         icon:"⭐", name:"Otaku",          min_chapters:200  },
    { id:"legenda",       icon:"👑", name:"Legenda",        min_chapters:500  },
    { id:"top_reader",    icon:"🏆", name:"Top Reader",     min_chapters:1000 },
  ];
  const badgeCount = BADGE_DEFS.filter(b => liveTotal >= b.min_chapters).length;
  const liveLevel  = Math.floor(liveTotal / 50) + 1;
  const levelTitle = getLevelTitle(liveLevel);
  const isOAuth    = isOAuthUser(currentUser);

  const ownedChips = BADGE_DEFS
    .filter(b => liveTotal >= b.min_chapters)
    .map((b,i) => `<div class="hero-badge-chip" style="animation-delay:${i*60}ms">${b.icon} ${b.name}</div>`)
    .join("");

  const displayName = profile?.username || currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email?.split("@")[0] || "User";
  const avatarSrc   = profile?.avatar_url || currentUser.user_metadata?.avatar_url || currentUser.user_metadata?.picture
    || `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=e8522a&color=fff&bold=true`;

  document.getElementById("profileContent").innerHTML = `

    <!-- ══ HERO BANNER ══ -->
    <div class="profile-hero">
      <div class="hero-bg"></div>
      <div class="hero-inner">

        <!-- Avatar -->
        <div class="avatar-ring" id="avatarRing" onclick="document.getElementById('avatarInput').click()" title="Ganti foto profil">
          <img id="avatarImg" src="${esc(avatarSrc)}" alt="Avatar"
            onerror="this.src='https://ui-avatars.com/api/?name=U&background=e8522a&color=fff&bold=true'">
          <div class="avatar-edit-icon">✏️</div>
        </div>
        <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none" onchange="handleAvatarUpload(event)">

        <!-- Name -->
        <div class="hero-name" id="profileNameDisplay">${esc(displayName)}</div>

        <!-- Level pill -->
        <div class="hero-level-pill">
          <span class="lv-dot"></span>
          Level ${liveLevel} — ${esc(levelTitle)}
        </div>

        <!-- Stats -->
        <div class="hero-stats">
          <div class="hero-stat">
            <div class="hero-stat-num" id="statChapters">${liveTotal}</div>
            <div class="hero-stat-label">Chapter</div>
          </div>
          <div class="hero-stat">
            <div class="hero-stat-num">${badgeCount}</div>
            <div class="hero-stat-label">Badge</div>
          </div>
          <div class="hero-stat">
            <div class="hero-stat-num">${liveLevel}</div>
            <div class="hero-stat-label">Level</div>
          </div>
        </div>

      </div>
    </div>

    <!-- Badge chips -->
    ${badgeCount > 0 ? `<div class="hero-badges">${ownedChips}</div>` : ""}

    <!-- ══ TABS ══ -->
    <div class="profile-tabs-wrap">
      <div class="profile-tabs">
        <button class="profile-tab active" id="tab-bookmark"       onclick="switchTab('bookmark')"><span class="tab-icon">🔖</span>Komik</button>
        <button class="profile-tab"        id="tab-anime-bookmark" onclick="switchTab('anime-bookmark')"><span class="tab-icon">⚡</span>Anime</button>
        <button class="profile-tab"        id="tab-novel-bookmark" onclick="switchTab('novel-bookmark')"><span class="tab-icon">📚</span>Novel</button>
        <button class="profile-tab"        id="tab-history"        onclick="switchTab('history')"><span class="tab-icon">📖</span>Riwayat</button>
        <button class="profile-tab"        id="tab-novel-history"  onclick="switchTab('novel-history')"><span class="tab-icon">📝</span>Nov. Hist</button>
        <button class="profile-tab"        id="tab-progress"       onclick="switchTab('progress')"><span class="tab-icon">📊</span>Progress</button>
        <button class="profile-tab"        id="tab-badge"          onclick="switchTab('badge')"><span class="tab-icon">🏅</span>Badge</button>
        <button class="profile-tab"        id="tab-leaderboard"    onclick="switchTab('leaderboard')"><span class="tab-icon">🏆</span>Top</button>
        <button class="profile-tab"        id="tab-comments"       onclick="switchTab('comments')"><span class="tab-icon">💬</span>Komen</button>
        <button class="profile-tab"        id="tab-settings"       onclick="switchTab('settings')"><span class="tab-icon">⚙️</span>Edit</button>
      </div>
    </div>

    <!-- ══ TAB CONTENTS ══ -->

    <!-- Bookmark Komik -->
    <div class="tab-content active" id="content-bookmark">
      <div class="kategori-tabs">
        <button class="kategori-btn active" onclick="filterKategori('favorit',this)">❤️ Favorit</button>
        <button class="kategori-btn" onclick="filterKategori('lagi_dibaca',this)">📖 Dibaca</button>
        <button class="kategori-btn" onclick="filterKategori('tamat',this)">✅ Tamat</button>
      </div>
      <input type="text" id="bookmarkSearch" class="tab-search" placeholder="🔍 Cari judul komik..." oninput="bookmarkSearch(this.value)">
      <div id="bookmarkList"><div class="empty-state"><p>⏳</p><p>Memuat...</p></div></div>
    </div>

    <!-- Bookmark Anime -->
    <div class="tab-content" id="content-anime-bookmark">
      <div class="kategori-tabs">
        <button class="kategori-btn active" onclick="filterAnimeKategori('favorit',this)">❤️ Favorit</button>
        <button class="kategori-btn" onclick="filterAnimeKategori('lagi_menonton',this)">📺 Nonton</button>
        <button class="kategori-btn" onclick="filterAnimeKategori('selesai',this)">✅ Selesai</button>
      </div>
      <div id="animeBookmarkList"><div class="empty-state"><p>⏳</p><p>Memuat...</p></div></div>
    </div>

    <!-- Bookmark Novel -->
    <div class="tab-content" id="content-novel-bookmark">
      <div class="kategori-tabs">
        <button class="kategori-btn active" onclick="filterNovelKategori('favorit',this)">❤️ Favorit</button>
        <button class="kategori-btn" onclick="filterNovelKategori('lagi_dibaca',this)">📖 Dibaca</button>
        <button class="kategori-btn" onclick="filterNovelKategori('tamat',this)">✅ Tamat</button>
      </div>
      <div id="novelBookmarkList"><div class="empty-state"><p>⏳</p><p>Memuat...</p></div></div>
    </div>

    <!-- Riwayat Novel -->
    <div class="tab-content" id="content-novel-history">
      <div id="novelHistoryList"><div class="empty-state"><p>⏳</p><p>Memuat...</p></div></div>
    </div>

    <!-- Riwayat Komik -->
    <div class="tab-content" id="content-history">
      <div id="historyList"><div class="empty-state"><p>⏳</p><p>Memuat...</p></div></div>
    </div>

    <!-- Progress -->
    <div class="tab-content" id="content-progress">
      <div id="progressList"><div class="empty-state"><p>⏳</p><p>Memuat...</p></div></div>
    </div>

    <!-- Badge & Level -->
    <div class="tab-content" id="content-badge">
      <div id="badgeContent"><div class="empty-state"><p>⏳</p><p>Memuat...</p></div></div>
    </div>

    <!-- Leaderboard -->
    <div class="tab-content" id="content-leaderboard">
      <div id="leaderboardContent"><div class="empty-state"><p>⏳</p><p>Memuat...</p></div></div>
    </div>

    <!-- Komentar Saya -->
    <div class="tab-content" id="content-comments">
      <div id="myCommentsList"><div class="empty-state"><p>⏳</p><p>Memuat...</p></div></div>
    </div>

    <!-- Edit Profil -->
    <div class="tab-content" id="content-settings">
      <div class="edit-form">

        <div class="email-badge">📧 ${esc(currentUser.email)}</div>

        <!-- Ganti Foto -->
        <div class="edit-section-card">
          <p class="edit-section-title">📷 Foto Profil</p>
          <div class="avatar-upload-area" onclick="document.getElementById('avatarInput').click()">
            <img id="avatarImgSettings" src="${esc(avatarSrc)}" alt="Avatar"
              onerror="this.src='https://ui-avatars.com/api/?name=U&background=e8522a&color=fff&bold=true'">
            <div class="avatar-upload-text">
              <p>Klik untuk ganti foto</p>
              <p>JPG, PNG, atau WebP · Maks 2MB</p>
            </div>
          </div>
          <div id="uploadMsg" class="form-msg"></div>
        </div>

        <!-- Ganti Username -->
        <div class="edit-section-card">
          <p class="edit-section-title">👤 Username</p>
          <input type="text" id="usernameInput"
            placeholder="Masukkan username baru"
            value="${esc(displayName !== 'User' ? displayName : (profile?.username || ''))}"
            maxlength="30"
            oninput="document.getElementById('usernameCounter').textContent = this.value.length + '/30'">
          <div class="char-counter"><span id="usernameCounter">${(displayName !== "User" ? displayName : (profile?.username || "")).length}/30</span></div>
          <p class="input-hint">3–30 karakter. Huruf, angka, underscore, dan strip saja.</p>
          <button class="edit-btn" onclick="saveProfile()" id="saveUsernameBtn">💾 Simpan Username</button>
          <div id="saveMsg" class="form-msg"></div>
        </div>

        <!-- Ganti Password -->
        <div class="edit-section-card">
          <p class="edit-section-title">🔐 Password</p>
          ${isOAuth ? `
            <div style="padding:14px;background:rgba(0,0,0,0.2);border-radius:10px;border:1px solid var(--glass-b);text-align:center;">
              <p style="font-size:13px;color:var(--text-muted);">Login via Google — password tidak bisa diubah di sini.</p>
            </div>
          ` : `
            <input type="password" id="newPasswordInput" placeholder="Password baru (min. 6 karakter)" style="margin-bottom:8px;">
            <input type="password" id="confirmPasswordInput" placeholder="Konfirmasi password baru">
            <button class="edit-btn" onclick="savePassword()" id="savePasswordBtn">🔒 Ganti Password</button>
            <div id="passwordMsg" class="form-msg"></div>
          `}
        </div>

        <!-- Danger Zone -->
        <div class="edit-section-card" style="border-color:rgba(232,82,42,0.2);">
          <p class="edit-section-title" style="color:var(--acc);">⚠️ Keluar</p>
          <button class="edit-btn" onclick="handleLogout()"
            style="background:transparent;border:1.5px solid rgba(232,82,42,0.35);
            color:var(--acc);box-shadow:none;margin-top:0;">
            🚪 Logout dari Akun
          </button>
        </div>

      </div>
    </div>

  `;

  await loadBookmarks();
}

/* ── SWITCH TAB ───────────────────────────────────────── */
/* Cache flags: tab hanya di-load sekali kecuali data mungkin berubah */
const _tabLoaded = {};

window.switchTab = function (tab) {
  document.querySelectorAll(".profile-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  document.getElementById(`tab-${tab}`)?.classList.add("active");
  document.getElementById(`content-${tab}`)?.classList.add("active");

  /* Update URL tanpa reload */
  const url = new URL(window.location.href);
  url.searchParams.set("tab", tab);
  history.replaceState({}, "", url);

  /* Load data hanya sekali per sesi, kecuali yang sering berubah */
  if (tab === "history"        && !_tabLoaded.history)        { _tabLoaded.history = true; loadHistory(); }
  if (tab === "novel-history"  && !_tabLoaded.novelHistory)   { _tabLoaded.novelHistory = true; loadNovelHistory(); }
  if (tab === "novel-bookmark" && !_tabLoaded.novelBookmark)  { _tabLoaded.novelBookmark = true; loadNovelBookmarks(); }
  if (tab === "anime-bookmark" && !_tabLoaded.animeBookmark)  { loadAnimeBookmarks(); }
  if (tab === "progress"       && !_tabLoaded.progress)       { _tabLoaded.progress = true; loadProgressTab(); }
  if (tab === "badge"          && !_tabLoaded.badge)          { _tabLoaded.badge = true; loadBadgeTab(); }
  if (tab === "leaderboard"    && !_tabLoaded.leaderboard)    { _tabLoaded.leaderboard = true; loadLeaderboard(); }
  if (tab === "comments"       && !_tabLoaded.comments)       { loadMyComments(); }
};

/* ── BOOKMARKS ────────────────────────────────────────── */
async function loadBookmarks() {
  const { bookmarks } = await getBookmarks(currentUser.id);
  bookmarkData = {

/* ── LEADERBOARD ──────────────────────────────────────── */
const rankEmoji = i => i===0?"🥇":i===1?"🥈":i===2?"🥉":`#${i+1}`;
const rankClass = i => i===0?"rank-1":i===1?"rank-2":i===2?"rank-3":"";

function buildLbRows(list, scoreField, scoreLabel, userId, showAll=false) {
  if (!list.length) return `<div class="empty-state"><p>📭</p><p>Belum ada data. Jadilah yang pertama!</p></div>`;
  const SHOW_DEFAULT = 10;
  const displayList  = showAll ? list : list.slice(0, SHOW_DEFAULT);
  const hasMore      = !showAll && list.length > SHOW_DEFAULT;
  const maxScore     = list[0]?.[scoreField] || 1;
  const myRankIndex  = list.findIndex(u => u.id === userId);
  const myRankInTop  = displayList.findIndex(u => u.id === userId) >= 0;

  let myRankCard = "";
  if (!myRankInTop) {
    if (myRankIndex >= 0) {
      const u = list[myRankIndex];
      const score = (u[scoreField]||0).toLocaleString("id-ID");
      myRankCard = `<div class="lb-my-rank">Kamu di <strong>#${myRankIndex+1}</strong> dengan <strong>${score} ${scoreLabel}</strong> — terus baca! 🚀</div>`;
    } else {
      myRankCard = `<div class="lb-my-rank">Kamu belum masuk top ${SHOW_DEFAULT}. Terus baca untuk naik! 🚀</div>`;
    }
  }

  const rows = displayList.map((u, i) => {
    const isMe    = u.id === userId;
    const name    = u.username || "Anonim";
    const avatar  = u.avatar_url || null;
    const level   = u.level || 1;
    const rawScore= u[scoreField] || 0;
    const score   = rawScore.toLocaleString("id-ID");
    const barPct  = maxScore > 0 ? Math.round((rawScore/maxScore)*100) : 0;
    const avatarHtml = avatar
      ? `<img class="lb-avatar" src="${esc(avatar)}" alt="${esc(name)}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
         <div class="lb-avatar" style="display:none;align-items:center;justify-content:center;
           background:linear-gradient(135deg,#e8522a,#c73f1c);font-weight:800;font-size:14px;color:#fff;">
           ${name[0]?.toUpperCase()||"?"}</div>`
      : `<div class="lb-avatar" style="display:flex;align-items:center;justify-content:center;
          background:linear-gradient(135deg,#e8522a,#c73f1c);font-weight:800;font-size:14px;color:#fff;">
          ${name[0]?.toUpperCase()||"?"}</div>`;
    return `
      <div class="lb-row ${rankClass(i)} ${isMe?"me":""}" style="animation-delay:${i*45}ms">
        <div class="lb-rank">${rankEmoji(i)}</div>
        ${avatarHtml}
        <div class="lb-info">
          <div class="lb-name">${esc(name)}${isMe?`<span class="lb-me-badge">Kamu</span>`:""}</div>
          <div class="lb-meta">Level ${level} · ${esc(getLevelTitle(level))}</div>
          <div class="lb-bar-wrap"><div class="lb-bar-fill" style="width:${barPct}%"></div></div>
        </div>
        <div class="lb-score">
          <span class="lb-score-num">${esc(score)}</span>
          <span class="lb-score-label">${esc(scoreLabel)}</span>
        </div>
      </div>`;
  }).join("");

  const showMoreBtn = hasMore ? `<button class="lb-show-more" onclick="expandLbTab()">▼ Lihat ${list.length-SHOW_DEFAULT} lainnya</button>` : "";
  return rows + showMoreBtn + myRankCard + `<div class="lb-footer">Update otomatis setiap kamu selesai baca</div>`;
}

            ${cover
              ? `<img src="${esc(cover)}" alt="${esc(h.novel_title || '')}"
                   onerror="this.onerror=null;this.parentElement.innerHTML='📖'">`
              : "📖"}
          </div>
          <div class="komik-list-info" onclick="gotoNovelDetail('${esc(h.novel_slug || '')}')">
            <div class="title">${esc(h.novel_title || h.novel_slug || "–")}</div>
            <p style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;
               color:var(--acc);">${esc(chShort)}</p>
            <p>⏱️ ${esc(dateStr)}</p>
          </div>
          <div class="komik-list-actions">
            <button class="btn-sm primary"
              onclick="window.location.href='/baca-novel/${esc(h.chapter_slug || '')}'"
            >▶ Lanjut</button>
            <button class="btn-sm" onclick="gotoNovelDetail('${esc(h.novel_slug || '')}')">Detail</button>
          </div>
        </div>`;
    }).join("");
  } catch(err) {
    console.error("loadNovelHistory error:", err);
    el.innerHTML = `<div class="empty-state"><p>😕</p><p>Gagal memuat riwayat novel.</p>
      <button onclick="_tabLoaded.novelHistory=false;loadNovelHistory()"
        style="margin-top:10px;padding:7px 18px;background:var(--acc);color:#fff;border:none;
        border-radius:8px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;">
        🔄 Coba Lagi
      </button></div>`;
  }
}

/* ── KOMENTAR SAYA ────────────────────────────────────── */
let _myCommentsLoaded = false;

async function loadMyComments() {
  if (_myCommentsLoaded) return;
  const el = document.getElementById("myCommentsList");
  if (!el) return;
  el.innerHTML = `<div class="empty-state"><p>⏳</p><p>Memuat komentar...</p></div>`;

  try {
    const { comments, error } = await getMyComments(currentUser.id, 30);
    if (error) throw error;
    if (!comments || comments.length === 0) {
      el.innerHTML = `<div class="empty-state"><p>💬</p><p>Kamu belum pernah berkomentar.</p></div>`;
      _myCommentsLoaded = true;
      return;
    }
    _myCommentsLoaded = true;
    el.innerHTML = comments.map(c => renderMyComment(c)).join("");
  } catch (err) {
    el.innerHTML = `<div class="empty-state"><p>😕</p><p>Gagal memuat komentar.</p><button onclick="_myCommentsLoaded=false;loadMyComments()" style="margin-top:10px;padding:7px 18px;background:var(--acc);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;">🔄 Coba Lagi</button></div>`;
  }
}

function resolveCommentLocation(komikSlug) {
  if (!komikSlug) return { icon:"💬", label:"Pankomik", url:"/" };
  if (komikSlug.startsWith("novel-chapter:")) {
    const raw = komikSlug.slice("novel-chapter:".length);
    const label = raw.replace(/-chapter-[\d-]+$/i,"").replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,26) || "Chapter Novel";
    return { icon:"📖", label, url:`/baca-novel/${raw}` };
  }
  if (komikSlug.startsWith("novel:")) {
    const raw = komikSlug.slice("novel:".length);
    const label = raw.replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,26) || "Novel";
    return { icon:"📖", label, url:`/novel/${raw}` };
  }
  if (komikSlug.startsWith("chapter:")) {
    const raw = komikSlug.slice("chapter:".length);
    const label = raw.replace(/-chapter-[\d-]+$/i,"").replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,26) || "Chapter Komik";
    return { icon:"📚", label, url:`/baca/${raw}` };
  }
  const label = komikSlug.replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,26) || "Komik";
  return { icon:"📚", label, url:`/komik/${komikSlug}` };
}

function renderMyComment(c) {
  const loc   = resolveCommentLocation(c.komik_slug);
  const likes = c.like_count || 0;
  const isReply = !!c.parent_id;
  const text  = (c.content || "").slice(0, 200);
  let   time  = "–";
  try { time = new Date(c.created_at).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}); } catch {}
  return `
    <a class="my-comment-card" href="${esc(loc.url)}" title="Komentar di: ${esc(loc.label)}">
      <div class="my-comment-location">
        <span>${esc(loc.icon)}</span>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(loc.label)}</span>
      </div>
      <p class="my-comment-text">${esc(text)}${(c.content||"").length>200?"…":""}</p>
      <div class="my-comment-footer">
        <span>🕒 ${esc(time)}</span>
        ${likes>0?`<span class="my-comment-likes">❤️ ${likes}</span>`:""}
        ${isReply?`<span class="my-comment-reply-badge">↩ Balasan</span>`:""}
        <span style="margin-left:auto;color:var(--acc);font-weight:700;font-size:10px;">Lihat →</span>
      </div>
    </a>`;
}

/* ── SAVE PROFILE ─────────────────────────────────────── */
window.saveProfile = async function () {
  const btn  = document.getElementById("saveUsernameBtn");
  const msg  = document.getElementById("saveMsg");
  const val  = document.getElementById("usernameInput")?.value.trim();
  if (!val || val.length < 3) { showMsg(msg,"Username minimal 3 karakter.","error"); return; }
  if (!/^[a-zA-Z0-9_-]+$/.test(val)) { showMsg(msg,"Hanya huruf, angka, _ dan -","error"); return; }
  btn.disabled = true; btn.textContent = "⏳ Menyimpan...";
  const { error } = await updateProfile(currentUser.id, { username: val });
  if (error) showMsg(msg, "Gagal menyimpan. Coba lagi.", "error");
  else {
    showMsg(msg,"✅ Username berhasil disimpan!","success");
    document.getElementById("profileNameDisplay").textContent = val;
  }
  btn.disabled = false; btn.textContent = "💾 Simpan Username";
};

window.savePassword = async function () {
  const btn  = document.getElementById("savePasswordBtn");
  const msg  = document.getElementById("passwordMsg");
  const np   = document.getElementById("newPasswordInput")?.value;
  const cp   = document.getElementById("confirmPasswordInput")?.value;
  if (!np || np.length < 6) { showMsg(msg,"Password minimal 6 karakter.","error"); return; }
  if (np !== cp) { showMsg(msg,"Konfirmasi password tidak cocok.","error"); return; }
  btn.disabled = true; btn.textContent = "⏳ Menyimpan...";
  const { error } = await updatePassword(np);
  if (error) showMsg(msg,"Gagal ganti password.","error");
  else showMsg(msg,"✅ Password berhasil diubah!","success");
  btn.disabled = false; btn.textContent = "🔒 Ganti Password";
};

function showMsg(el, text, type) {
  if (!el) return;
  el.textContent = text;
  el.className = `form-msg ${type}`;
}

/* ── AVATAR UPLOAD ────────────────────────────────────── */
window.handleAvatarUpload = async function (event) {
  const file = event.target.files?.[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    const msg = document.getElementById("uploadMsg");
    showMsg(msg, "File terlalu besar. Maks 2MB.", "error");
    return;
  }
  const ring = document.getElementById("avatarRing");
  ring?.classList.add("avatar-uploading");

  const { url, error } = await uploadAvatar(currentUser.id, file);
  ring?.classList.remove("avatar-uploading");

  if (!error && url) {
    document.getElementById("avatarImg").src = url;
    const si = document.getElementById("avatarImgSettings");
    if (si) si.src = url;
    const msg = document.getElementById("uploadMsg");
    showMsg(msg, "✅ Foto profil berhasil diperbarui!", "success");
  } else {
    const msg = document.getElementById("uploadMsg");
    showMsg(msg, "Gagal upload foto. Coba lagi.", "error");
  }
};

function getLevelTitle(level) {
  if (level >= 20) return "Legenda Komik 👑";
  if (level >= 10) return "Otaku Sejati ⭐";
  if (level >= 5)  return "Pembaca Aktif 🔥";
  if (level >= 2)  return "Pecinta Komik 📚";
  return "Pemula 🌱";
}

window.loadMyComments   = loadMyComments;
window.gotoNovelDetail  = slug => window.location.href = `/novel/${slug}`;
window.gotoDetail       = slug => window.location.href = `/komik/${slug}`;
window.goHome           = () => window.location.href = "/";
window.liveSearch       = () => {};  /* search dihandle oleh auth-header.js */
window.toggleMenu       = () => { const m = document.getElementById("menuDropdown"); if (m) m.style.display = m.style.display==="block"?"none":"block"; };
window.toggleDarkMode   = () => { document.body.classList.toggle("light"); localStorage.setItem("theme", document.body.classList.contains("light")?"light":"dark"); const btn = document.querySelector('button[onclick="toggleDarkMode()"]'); if(btn) btn.textContent = document.body.classList.contains("light") ? "☀️" : "🌙"; };

window.handleLogout = async function () {
  if (!confirm("Yakin ingin keluar?")) return;
  try {
    await logout();
  } catch(e) { console.error("Logout error:", e); }
  window.location.href = "/masuk";
};
