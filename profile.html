<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — Pankomik</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ---- PROFIL HEADER ----------------------------------- */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 20px;
      gap: 10px;
      text-align: center;
    }

    .avatar-wrap {
      position: relative;
      width: 80px;
      height: 80px;
    }

    .avatar-wrap img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
    }

    /* Tombol ganti foto (muncul saat hover) */
    .avatar-edit {
      position: absolute;
      bottom: 0; right: 0;
      width: 26px; height: 26px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 800;
    }

    .profile-level {
      font-size: 12px;
      color: var(--accent);
      font-weight: 700;
      background: rgba(232,82,42,0.12);
      padding: 3px 10px;
      border-radius: 99px;
    }

    .profile-stats {
      display: flex;
      gap: 20px;
      margin-top: 4px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-item p:first-child {
      font-size: 18px;
      font-weight: 800;
    }

    .stat-item p:last-child {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ---- BADGE LIST -------------------------------------- */
    .badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 16px;
      justify-content: center;
    }

    .badge-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
    }

    /* ---- TAB NAVIGASI ------------------------------------ */
    .profile-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 14px;
      gap: 4px;
      overflow-x: auto;
    }

    .profile-tab {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      transition: color 0.2s, border-color 0.2s;
    }

    .profile-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ---- TAB CONTENT ------------------------------------- */
    .tab-content {
      display: none;
      padding: 14px;
    }

    .tab-content.active { display: block; }

    /* ---- KATEGORI BOOKMARK ------------------------------- */
    .kategori-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .kategori-btn {
      padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .kategori-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ---- KARTU KOMIK (bookmark & history) ---------------- */
    .komik-list-item {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }

    .komik-list-item:last-child { border-bottom: none; }

    .komik-list-item img {
      width: 50px;
      height: 68px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .komik-list-info { flex: 1; }

    .komik-list-info .title {
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .komik-list-info p {
      font-size: 11px;
      color: var(--text-muted);
      margin: 2px 0;
    }

    .komik-list-actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }

    .btn-sm {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }

    .btn-sm.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-sm:hover { filter: brightness(1.15); }

    /* Progress bar */
    .progress-bar-wrap {
      height: 4px;
      background: var(--bg-surface);
      border-radius: 99px;
      margin-top: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.5s ease;
    }

    /* ---- EMPTY STATE ------------------------------------- */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .empty-state p:first-child { font-size: 32px; margin-bottom: 8px; }

    /* ---- EDIT PROFIL FORM -------------------------------- */
    .edit-form input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }

    .edit-form input:focus {
      border-color: var(--accent);
    }

    .edit-form button {
      padding: 10px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- Header (sama seperti halaman lain) -->
<header class="header">
  <div class="logo" onclick="goHome()">Pankomik</div>
  <input type="text" id="searchInput" placeholder="Cari komik..." oninput="liveSearch()" autocomplete="off">
  <div class="header-right">
    <button onclick="toggleDarkMode()">🌙</button>
    <button onclick="toggleMenu()">👤</button>
  </div>
</header>
<div id="searchResult" class="search-result"></div>
<div id="menuDropdown" class="dropdown"></div>

<!-- ============================================================
     KONTEN PROFIL
     ============================================================ -->
<div id="profileContent">
  <!-- Diisi oleh JS -->
  <div class="empty-state"><p>⏳</p><p>Memuat profil...</p></div>
</div>

<script type="module">
  import { getCurrentUser, getProfile, updateProfile, uploadAvatar, getBookmarks, removeBookmark, addBookmark, getHistory } from "./supabase.js";
  import { initAuthHeader } from "./auth-header.js";

  let currentUser = null;
  let currentProfile = null;
  let bookmarkData = {};
  let activeKategori = "favorit";

  /* ---- INIT -------------------------------------------- */
  window.onload = async function() {
    /* Tema */
    if (localStorage.getItem("theme") === "light") document.body.classList.add("light");

    /* Init header */
    initAuthHeader();

    currentUser = await getCurrentUser();

    /* Kalau belum login → redirect ke auth */
    if (!currentUser) {
      window.location.href = "auth.html";
      return;
    }

    await loadProfile();

    /* Cek tab aktif dari URL: profile.html?tab=bookmark */
    const urlTab = new URLSearchParams(window.location.search).get("tab");
    if (urlTab) switchTab(urlTab);
  };

  /* ---- LOAD PROFIL ------------------------------------- */
  async function loadProfile() {
    const { profile } = await getProfile(currentUser.id);
    currentProfile = profile;

    const badges = profile?.user_badges || [];
    const levelTitle = getLevelTitle(profile?.level || 1);

    document.getElementById("profileContent").innerHTML = `
      <!-- Header profil -->
      <div class="profile-header">
        <div class="avatar-wrap">
          <img id="avatarImg" src="${profile?.avatar_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(profile?.username || 'U') + '&background=e8522a&color=fff'}" alt="Avatar">
          <button class="avatar-edit" onclick="document.getElementById('avatarInput').click()" title="Ganti foto">✏️</button>
          <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
        </div>

        <div class="profile-name">${profile?.username || 'User'}</div>
        <div class="profile-level">Level ${profile?.level || 1} — ${levelTitle}</div>

        <div class="profile-stats">
          <div class="stat-item">
            <p>${profile?.total_chapters_read || 0}</p>
            <p>Chapter Dibaca</p>
          </div>
          <div class="stat-item">
            <p>${badges.length}</p>
            <p>Badge</p>
          </div>
        </div>
      </div>

      <!-- Badge yang dimiliki -->
      ${badges.length > 0 ? `
        <div class="badge-list">
          ${badges.map(ub => `
            <div class="badge-chip" title="${ub.badges?.description || ''}">
              ${ub.badges?.icon || '🏅'} ${ub.badges?.name || ''}
            </div>
          `).join("")}
        </div>
      ` : ""}

      <!-- Tab navigasi -->
      <div class="profile-tabs">
        <button class="profile-tab active" id="tab-bookmark" onclick="switchTab('bookmark')">🔖 Bookmark</button>
        <button class="profile-tab" id="tab-history" onclick="switchTab('history')">📖 Riwayat</button>
        <button class="profile-tab" id="tab-settings" onclick="switchTab('settings')">⚙️ Edit Profil</button>
      </div>

      <!-- Tab: Bookmark -->
      <div class="tab-content active" id="content-bookmark">
        <div class="kategori-tabs">
          <button class="kategori-btn active" onclick="filterKategori('favorit', this)">❤️ Favorit</button>
          <button class="kategori-btn" onclick="filterKategori('lagi_dibaca', this)">📖 Lagi Dibaca</button>
          <button class="kategori-btn" onclick="filterKategori('tamat', this)">✅ Tamat</button>
        </div>
        <div id="bookmarkList">
          <div class="empty-state"><p>⏳</p><p>Memuat...</p></div>
        </div>
      </div>

      <!-- Tab: Riwayat -->
      <div class="tab-content" id="content-history">
        <div id="historyList">
          <div class="empty-state"><p>⏳</p><p>Memuat...</p></div>
        </div>
      </div>

      <!-- Tab: Edit Profil -->
      <div class="tab-content" id="content-settings">
        <div class="edit-form">
          <p style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">Email: ${currentUser.email}</p>
          <input type="text" id="usernameInput" placeholder="Username" value="${profile?.username || ''}">
          <button onclick="saveProfile()">Simpan Perubahan</button>
          <p id="saveMsg" style="font-size:12px;margin-top:8px;color:#27ae60;display:none">✅ Profil diperbarui!</p>
        </div>
      </div>
    `;

    /* Load data tab default (bookmark) */
    await loadBookmarks();
  }

  /* ---- SWITCH TAB -------------------------------------- */
  window.switchTab = function(tab) {
    document.querySelectorAll(".profile-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));

    document.getElementById(`tab-${tab}`)?.classList.add("active");
    document.getElementById(`content-${tab}`)?.classList.add("active");

    if (tab === "history") loadHistory();
  };

  /* ---- BOOKMARK ---------------------------------------- */
  async function loadBookmarks() {
    const { bookmarks } = await getBookmarks(currentUser.id);
    bookmarkData = bookmarks;
    renderBookmarks(activeKategori);
  }

  function renderBookmarks(kategori) {
    const list = bookmarkData[kategori] || [];
    const el   = document.getElementById("bookmarkList");

    if (!list.length) {
      el.innerHTML = `<div class="empty-state"><p>📭</p><p>Belum ada komik di kategori ini.</p></div>`;
      return;
    }

    el.innerHTML = list.map(bm => `
      <div class="komik-list-item">
        <img src="${bm.komik_cover || ''}" alt="${bm.komik_title}" onclick="gotoDetail('${bm.komik_slug}')" style="cursor:pointer">
        <div class="komik-list-info" onclick="gotoDetail('${bm.komik_slug}')" style="cursor:pointer">
          <div class="title">${bm.komik_title}</div>
          <p>📅 ${new Date(bm.created_at).toLocaleDateString('id-ID')}</p>
        </div>
        <div class="komik-list-actions">
          <button class="btn-sm primary" onclick="gotoDetail('${bm.komik_slug}')">Buka</button>
          <button class="btn-sm" onclick="hapusBookmark('${bm.komik_slug}', this)">Hapus</button>
        </div>
      </div>
    `).join("");
  }

  window.filterKategori = function(kategori, btn) {
    activeKategori = kategori;
    document.querySelectorAll(".kategori-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderBookmarks(kategori);
  };

  window.hapusBookmark = async function(slug, btn) {
    btn.textContent = "...";
    btn.disabled    = true;
    await removeBookmark(currentUser.id, slug);
    await loadBookmarks();
  };

  /* ---- RIWAYAT BACA ------------------------------------ */
  async function loadHistory() {
    const { history } = await getHistory(currentUser.id);
    const el          = document.getElementById("historyList");

    if (!history.length) {
      el.innerHTML = `<div class="empty-state"><p>📭</p><p>Belum ada riwayat baca.</p></div>`;
      return;
    }

    el.innerHTML = history.map(h => `
      <div class="komik-list-item">
        <img src="${h.komik_cover || ''}" alt="${h.komik_title}" onclick="gotoDetail('${h.komik_slug}')" style="cursor:pointer">
        <div class="komik-list-info">
          <div class="title">${h.komik_title}</div>
          <p>📖 Chapter ${h.chapter_number || '?'}</p>
          <p>⏱️ ${new Date(h.read_at).toLocaleDateString('id-ID')}</p>
        </div>
        <div class="komik-list-actions">
          <button class="btn-sm primary" onclick="window.location.href='reader.html?slug=${h.chapter_slug}'">Lanjut</button>
          <button class="btn-sm" onclick="gotoDetail('${h.komik_slug}')">Detail</button>
        </div>
      </div>
    `).join("");
  }

  /* ---- AVATAR UPLOAD ----------------------------------- */
  window.handleAvatarUpload = async function(event) {
    const file = event.target.files[0];
    if (!file) return;

    /* Validasi ukuran max 2MB */
    if (file.size > 2 * 1024 * 1024) {
      alert("Ukuran foto maksimal 2MB.");
      return;
    }

    const { url, error } = await uploadAvatar(currentUser.id, file);
    if (error) { alert("Gagal upload foto."); return; }

    /* Update avatar_url di profil */
    await updateProfile(currentUser.id, { avatar_url: url });
    document.getElementById("avatarImg").src = url;
  };

  /* ---- SIMPAN PROFIL ----------------------------------- */
  window.saveProfile = async function() {
    const username = document.getElementById("usernameInput").value.trim();
    if (!username) { alert("Username tidak boleh kosong."); return; }

    const { error } = await updateProfile(currentUser.id, { username });
    const msg = document.getElementById("saveMsg");

    if (!error) {
      msg.style.display = "block";
      setTimeout(() => msg.style.display = "none", 3000);
    } else {
      alert("Gagal menyimpan. Username mungkin sudah dipakai.");
    }
  };

  /* ---- HELPER ------------------------------------------ */
  window.gotoDetail = slug => window.location.href = `detail.html?slug=${slug}`;

  function getLevelTitle(level) {
    if (level >= 20) return "Legenda Komik 👑";
    if (level >= 10) return "Otaku Sejati ⭐";
    if (level >= 5)  return "Pembaca Aktif 🔥";
    if (level >= 2)  return "Pecinta Komik 📚";
    return "Pemula 🌱";
  }

  /* Header utils */
  window.goHome    = () => window.location.href = "index.html";
  window.toggleMenu = () => {
    const m = document.getElementById("menuDropdown");
    m.style.display = m.style.display === "block" ? "none" : "block";
  };
  window.toggleDarkMode = () => {
    document.body.classList.toggle("light");
    localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
  };
  window.liveSearch = () => {}; /* bisa diisi nanti */
</script>
</body>
</html>
