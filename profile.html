<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — Pankomik</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════
       PANKOMIK PROFILE — REDESIGN v2
       Aesthetic: dark manga-editorial, neon-accent, glassmorphism
    ═══════════════════════════════════════════════════════ */

    :root {
      --acc:       #e8522a;
      --acc2:      #f5a623;
      --acc-glow:  rgba(232,82,42,0.28);
      --acc-soft:  rgba(232,82,42,0.10);
      --glass:     rgba(255,255,255,0.04);
      --glass-b:   rgba(255,255,255,0.08);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    /* ─── HERO BANNER ───────────────────────────────────── */
    .profile-hero {
      position: relative;
      padding: 0 0 0;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(232,82,42,0.35) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 90% 30%, rgba(245,166,35,0.18) 0%, transparent 60%),
        var(--bg-card, #1a1a24);
      z-index: 0;
    }

    .hero-bg::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 60px;
      background: linear-gradient(to bottom, transparent, var(--bg, #0e0e12));
    }

    /* Subtle dot grid texture */
    .hero-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 22px 22px;
      opacity: 0.5;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      padding: 32px 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
    }

    /* ─── AVATAR ─────────────────────────────────────────── */
    .avatar-ring {
      position: relative;
      width: 96px; height: 96px;
      margin-bottom: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .avatar-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(var(--acc), var(--acc2), #ff6b35, var(--acc));
      animation: spin-slow 5s linear infinite;
      z-index: 0;
    }

    @keyframes spin-slow { to { transform: rotate(360deg); } }

    .avatar-ring::after {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: var(--bg, #0e0e12);
      z-index: 1;
    }

    .avatar-ring img {
      position: relative;
      z-index: 2;
      width: 90px; height: 90px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 3px auto;
      transition: filter 0.2s, transform 0.2s;
    }

    .avatar-edit-icon {
      position: absolute;
      bottom: 4px; right: 4px;
      z-index: 3;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--acc);
      border: 2px solid var(--bg, #0e0e12);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      box-shadow: 0 2px 8px var(--acc-glow);
      transition: transform 0.2s;
    }

    .avatar-ring:hover img { filter: brightness(0.75); transform: scale(0.97); }
    .avatar-ring:hover .avatar-edit-icon { transform: scale(1.15); }

    .avatar-uploading::before {
      animation: spin-slow 0.6s linear infinite !important;
      background: conic-gradient(var(--acc), transparent 120deg) !important;
    }

    /* ─── NAME / LEVEL ROW ────────────────────────────────── */
    .hero-name {
      font-family: 'Nunito', sans-serif;
      font-size: 22px; font-weight: 900;
      color: var(--text, #eaeaf0);
      line-height: 1.2;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .hero-level-pill {
      display: inline-flex;
      align-items: center; gap: 6px;
      padding: 4px 13px;
      background: var(--acc-soft);
      border: 1px solid rgba(232,82,42,0.3);
      border-radius: 99px;
      font-size: 12px; font-weight: 800;
      color: var(--acc);
      margin-bottom: 18px;
      letter-spacing: 0.2px;
    }

    .hero-level-pill .lv-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--acc);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.7); }
    }

    /* ─── STATS ROW ──────────────────────────────────────── */
    .hero-stats {
      display: flex;
      gap: 0;
      width: 100%;
      max-width: 320px;
      background: var(--glass);
      border: 1px solid var(--glass-b);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .hero-stat {
      flex: 1;
      padding: 13px 10px;
      text-align: center;
      position: relative;
    }

    .hero-stat + .hero-stat::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 1px;
      background: var(--glass-b);
    }

    .hero-stat-num {
      font-size: 22px; font-weight: 900;
      color: var(--text, #eaeaf0);
      line-height: 1;
      font-family: 'Bangers', cursive;
      letter-spacing: 1px;
    }

    .hero-stat-label {
      font-size: 10px;
      color: var(--text-muted, #888);
      font-weight: 700;
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ─── BADGE CHIPS ────────────────────────────────────── */
    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 14px 16px 4px;
      justify-content: center;
    }

    .hero-badge-chip {
      display: inline-flex;
      align-items: center; gap: 4px;
      padding: 4px 10px;
      background: linear-gradient(135deg, rgba(232,82,42,0.12), rgba(245,166,35,0.08));
      border: 1px solid rgba(232,82,42,0.25);
      border-radius: 99px;
      font-size: 11px; font-weight: 800;
      color: var(--acc2, #f5a623);
      animation: badge-in 0.4s ease both;
    }

    @keyframes badge-in {
      from { opacity: 0; transform: scale(0.8) translateY(4px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ─── NAVIGASI 2-LEVEL ──────────────────────────────── */
    .nav-wrap {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg-card, #1a1a24);
      border-bottom: 1px solid var(--glass-b);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    /* Level 1 — Section utama */
    .nav-l1 {
      display: flex; padding: 0 8px; gap: 2px;
      overflow-x: auto; scrollbar-width: none;
    }
    .nav-l1::-webkit-scrollbar { display: none; }

    .nav-l1-btn {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 5px;
      padding: 12px 14px;
      font-size: 13px; font-weight: 900;
      color: var(--text-muted, #666);
      cursor: pointer;
      border: none; border-bottom: 2px solid transparent;
      background: none;
      font-family: 'Nunito', sans-serif;
      transition: color 0.18s, border-color 0.18s;
      white-space: nowrap;
    }
    .nav-l1-btn.active { color: var(--acc); border-bottom-color: var(--acc); }
    .nav-l1-btn:hover:not(.active) { color: var(--text, #eaeaf0); }

    /* Level 2 — Sub tabs per section (hidden by default) */
    .nav-l2 {
      display: none; padding: 6px 10px 8px; gap: 6px;
      overflow-x: auto; scrollbar-width: none;
      background: rgba(0,0,0,0.15);
      border-top: 1px solid var(--glass-b);
    }
    .nav-l2::-webkit-scrollbar { display: none; }
    .nav-l2.show { display: flex; }

    .nav-l2-btn {
      flex-shrink: 0;
      padding: 5px 14px; border-radius: 99px;
      border: 1.5px solid var(--glass-b);
      background: transparent;
      color: var(--text-muted, #666);
      font-size: 12px; font-weight: 800;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .nav-l2-btn.active {
      background: var(--acc); border-color: var(--acc);
      color: #fff; box-shadow: 0 3px 10px var(--acc-glow);
    }
    .nav-l2-btn:hover:not(.active) { border-color: var(--acc); color: var(--acc); }

    /* ─── TAB CONTENT ────────────────────────────────────── */
    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    /* ─── PROFILE TAB (legacy compat) ────────────────────── */
    .profile-tab { display:none; }

    /* ─── KATEGORI FILTER PILLS ──────────────────────────── */
    .kategori-tabs {
      display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap;
    }

    .kategori-btn {
      padding: 6px 14px;
      border-radius: 99px;
      border: 1.5px solid var(--glass-b);
      background: var(--glass);
      color: var(--text-muted, #888);
      font-size: 12px; font-weight: 700;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: all 0.18s;
    }

    .kategori-btn.active {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      box-shadow: 0 4px 12px var(--acc-glow);
    }

    .kategori-btn:hover:not(.active) {
      border-color: var(--acc);
      color: var(--acc);
    }

    /* ─── PROFILE SEARCH BAR ─────────────────────────────── */
    .profile-search-bar {
      padding: 10px 14px 6px;
    }
    .profile-search-bar input {
      width: 100%;
      padding: 9px 14px;
      background: var(--glass);
      border: 1.5px solid var(--glass-b);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .profile-search-bar input:focus {
      border-color: var(--acc);
    }

    /* ─── KOMIK LIST CARDS ───────────────────────────────── */
    .komik-list-item {
      display: flex; gap: 12px;
      padding: 12px;
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      align-items: center;
      transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
    }

    .komik-list-item:hover {
      border-color: rgba(232,82,42,0.35);
      transform: translateX(3px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .komik-list-item img {
      width: 52px; height: 70px;
      object-fit: cover;
      border-radius: 7px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      border: 1px solid var(--glass-b);
    }

    .komik-list-info { flex: 1; min-width: 0; }
    .komik-list-info .title {
      font-weight: 800; font-size: 13px;
      margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text, #eaeaf0);
    }
    .komik-list-info p {
      font-size: 11px; color: var(--text-muted, #888);
      margin: 2px 0;
    }

    .komik-list-actions {
      display: flex; flex-direction: column; gap: 5px; flex-shrink: 0;
    }

    .btn-sm {
      padding: 6px 12px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--glass-b);
      background: var(--glass);
      color: var(--text, #eaeaf0);
      font-size: 11px; font-weight: 800;
      cursor: pointer; white-space: nowrap;
      font-family: 'Nunito', sans-serif;
      transition: all 0.15s;
    }

    .btn-sm.primary {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      box-shadow: 0 2px 8px var(--acc-glow);
    }

    .btn-sm:hover { filter: brightness(1.2); transform: translateY(-1px); }

    /* ─── PROGRESS BAR ───────────────────────────────────── */
    .progress-bar-wrap {
      height: 5px;
      background: var(--glass);
      border-radius: 99px;
      margin-top: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--acc), var(--acc2));
      border-radius: 99px;
      transition: width 0.7s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 0 8px var(--acc-glow);
    }

    /* ─── EMPTY STATE ────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted, #888);
      font-size: 13px;
    }
    .empty-state .es-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
    .empty-state p:first-child { font-size: 32px; margin-bottom: 8px; }

    /* ─── EDIT PROFIL ────────────────────────────────────── */
    .edit-section-card {
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
    }

    .edit-section-title {
      font-size: 11px; font-weight: 800;
      color: var(--text-muted, #888);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    .edit-form input, .edit-form textarea {
      width: 100%;
      padding: 11px 14px;
      background: rgba(0,0,0,0.25);
      border: 1.5px solid var(--glass-b);
      border-radius: var(--radius-md);
      color: var(--text, #eaeaf0);
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .edit-form input:focus {
      border-color: var(--acc);
      box-shadow: 0 0 0 3px var(--acc-glow);
    }

    .input-hint { font-size: 11px; color: var(--text-muted, #888); margin-top: 6px; }
    .char-counter { font-size: 11px; color: var(--text-muted, #888); text-align: right; margin-top: 4px; }

    .edit-btn {
      width: 100%; padding: 12px 20px;
      background: linear-gradient(135deg, var(--acc), #c73f1c);
      color: #fff; border: none;
      border-radius: var(--radius-md);
      font-family: 'Nunito', sans-serif;
      font-size: 14px; font-weight: 800;
      cursor: pointer; margin-top: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 16px var(--acc-glow);
      letter-spacing: 0.3px;
    }

    .edit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--acc-glow); }
    .edit-btn:active { transform: scale(0.97); }
    .edit-btn:disabled { background: var(--glass); color: var(--text-muted); box-shadow: none; cursor: not-allowed; }

    .form-msg {
      font-size: 12px; margin-top: 8px; padding: 9px 13px;
      border-radius: var(--radius-sm); display: none;
      font-weight: 700;
    }
    .form-msg.success { display: block; background: rgba(39,174,96,0.12); border: 1px solid rgba(39,174,96,0.3); color: #27ae60; }
    .form-msg.error   { display: block; background: rgba(232,82,42,0.1); border: 1px solid rgba(232,82,42,0.3); color: var(--acc); }

    /* ─── AVATAR UPLOAD AREA ─────────────────────────────── */
    .avatar-upload-area {
      display: flex; align-items: center; gap: 14px;
      padding: 14px;
      background: rgba(0,0,0,0.2);
      border: 1.5px dashed rgba(255,255,255,0.12);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 4px;
    }
    .avatar-upload-area:hover {
      border-color: var(--acc);
      background: var(--acc-soft);
    }
    .avatar-upload-area img {
      width: 52px; height: 52px;
      border-radius: 50%; object-fit: cover;
      border: 2px solid var(--acc); flex-shrink: 0;
    }
    .avatar-upload-text p:first-child { font-size: 13px; font-weight: 700; color: var(--text, #eaeaf0); }
    .avatar-upload-text p:last-child  { font-size: 11px; color: var(--text-muted, #888); margin-top: 3px; }

    /* ─── LEVEL & BADGE CARD ─────────────────────────────── */
    .level-card {
      background: linear-gradient(135deg, rgba(232,82,42,0.12), rgba(245,166,35,0.07));
      border: 1px solid rgba(232,82,42,0.25);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }

    .level-card::before {
      content: attr(data-level);
      position: absolute;
      right: -8px; top: -12px;
      font-family: 'Bangers', cursive;
      font-size: 80px;
      color: rgba(232,82,42,0.08);
      line-height: 1;
      pointer-events: none;
      user-select: none;
      letter-spacing: 2px;
    }

    .level-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .level-number { font-size: 28px; font-weight: 900; color: var(--acc); line-height: 1; font-family: 'Bangers', cursive; letter-spacing: 1px; }
    .level-title  { font-size: 12px; color: var(--text-muted, #888); margin-top: 4px; font-weight: 700; }
    .level-total  { text-align: right; }
    .level-total span  { font-size: 28px; font-weight: 900; color: var(--text, #eaeaf0); display: block; line-height: 1; font-family: 'Bangers', cursive; }
    .level-total small { font-size: 10px; color: var(--text-muted, #888); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ─── BADGE GRID ─────────────────────────────────────── */
    .badge-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }

    .badge-card {
      background: var(--glass);
      border: 1.5px solid var(--glass-b);
      border-radius: var(--radius-md);
      padding: 16px 12px;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .badge-card.owned {
      border-color: rgba(232,82,42,0.4);
      background: linear-gradient(135deg, rgba(232,82,42,0.08), rgba(245,166,35,0.04));
      box-shadow: 0 0 20px rgba(232,82,42,0.08);
    }

    .badge-card.locked { opacity: 0.5; }
    .badge-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }

    .badge-icon { font-size: 30px; margin-bottom: 7px; }
    .badge-name { font-size: 13px; font-weight: 800; margin-bottom: 4px; color: var(--text, #eaeaf0); }
    .badge-desc { font-size: 10px; color: var(--text-muted, #888); line-height: 1.4; }
    .badge-status-owned  { margin-top: 7px; font-size: 11px; color: #27ae60; font-weight: 700; }
    .badge-status-locked { margin-top: 7px; font-size: 11px; color: var(--text-muted, #888); }

    /* ─── LEADERBOARD ────────────────────────────────────── */
    .lb-top-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; padding: 0 2px;
    }
    .lb-top-title {
      font-family: 'Bangers', cursive;
      font-size: 18px; letter-spacing: 2px;
      color: var(--text, #eaeaf0);
    }
    .lb-top-title span { color: var(--acc); }
    .lb-top-right { display: flex; align-items: center; gap: 8px; }
    .lb-updated { font-size: 10px; color: var(--text-muted, #888); font-weight: 600; }

    .lb-toggle {
      display: flex; gap: 6px;
      padding: 4px 0 12px;
      margin-bottom: 4px;
    }
    .lb-toggle-btn {
      flex: 1; padding: 9px 12px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--glass-b);
      background: var(--glass);
      color: var(--text-muted, #666);
      font-family: 'Nunito', sans-serif;
      font-size: 13px; font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lb-toggle-btn.active {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      box-shadow: 0 4px 14px var(--acc-glow);
    }
    .lb-toggle-btn:not(.active):hover { border-color: var(--acc); color: var(--acc); }

    .lb-refresh-btn {
      padding: 6px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--glass-b);
      background: var(--glass);
      color: var(--text-muted, #888);
      font-size: 13px; font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
    }
    .lb-refresh-btn:hover { background: var(--acc); border-color: var(--acc); color: #fff; }

    .lb-row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: var(--radius-md);
      margin-bottom: 8px;
      border: 1px solid var(--glass-b);
      background: var(--glass);
      transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
      position: relative; overflow: hidden;
      animation: lbSlideIn 0.3s ease both;
    }
    .lb-row:hover { background: var(--glass-b); transform: translateX(3px); }
    .lb-row.me    { border-color: rgba(232,82,42,0.4); background: rgba(232,82,42,0.07); }
    .lb-row.rank-1 { border-color: rgba(245,166,35,0.4); background: rgba(245,166,35,0.07); }
    .lb-row.rank-2 { border-color: rgba(176,176,192,0.3); background: rgba(176,176,192,0.05); }

/* ── Domain → Referer map (sama dengan script.js) ── */
const _DOMAIN_REF = {
  "komikindo":"https://komikindo.org","komikcast":"https://komikcast.me",
  "komiku":"https://komiku.id","manhwaindo":"https://manhwaindo.id",
  "bacakomik":"https://bacakomik.me","mangatale":"https://mangatale.co",
  "westmanga":"https://westmanga.info","shinigami":"https://shinigami.id",
  "sakuranovel":"https://sakuranovel.id","novelringan":"https://novelringan.com",
  "mangakita":"https://mangakita.me","bacakomik.my":"https://bacakomik.my",
  "i0.wp.com":"https://mangakita.me","i1.wp.com":"https://mangakita.me",
  "i2.wp.com":"https://mangakita.me","i3.wp.com":"https://mangakita.me",
  "kiryuu":"https://kiryuu.id","mgkomik":"https://mgkomik.id",
};

function _getRef(url) {
  if (!url) return "";
  try {
    const host = new URL(url.startsWith("http") ? url : "https://"+url).hostname;
    for (const [k,v] of Object.entries(_DOMAIN_REF)) { if (host.includes(k)) return v; }
    return "https://"+host;
  } catch { return ""; }
}

function _buildWsrv(url, w) {
  const clean = url.split("?")[0];
  const ref   = _getRef(clean);
  let q = `https://wsrv.nl/?url=${encodeURIComponent(clean)}&w=${w||200}&output=webp&q=85&n=-1`;
  if (ref) q += `&ref=${encodeURIComponent(ref)}`;
  return q;
}

/* proxyImg — meniru logika script.js:
   - sankavollerei (anime): langsung
   - sudah wsrv/ui-avatars: lewati
   - novel (sakuranovel dll): /api/img dulu, fallback wsrv
   - komik (komikindo dll): wsrv dengan ref header
*/
function proxyImg(url, w) {
  if (!url) return "";
  const clean = url.split("?")[0];
  if (url.includes("wsrv.nl") || url.includes("ui-avatars") || url.includes("/api/img")) return url;
  if (url.includes("sankavollerei")) return url; /* anime — akses langsung */
  if (url.includes("data:image/svg") || url.includes("data:image/gif")) return "";
  return _buildWsrv(clean, w || 200);
}

/* coverImg — DOM element dengan fallback chain lengkap */
function coverImg(url, altText, cssText, fallbackEmoji) {
  const wrap = document.createElement("div");
  wrap.style.cssText = "width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;";
  if (!url) { wrap.textContent = fallbackEmoji || "📚"; return wrap; }

  const clean = url.split("?")[0];
  const isAnime  = url.includes("sankavollerei");
  const isNovel  = url.includes("sakuranovel") || url.includes("novelringan") ||
                   url.includes("novelupdates") || url.includes("lightnovelworld") ||
                   url.includes("wattpad") || url.includes("gramedia");

  let step = 0;
  function getUrl(n) {
    if (n === 0) {
      if (isAnime) return clean;              /* anime: langsung */
      if (isNovel) return "/api/img?url=" + encodeURIComponent(clean); /* novel: /api/img */
      return _buildWsrv(clean, 200);          /* komik: wsrv+ref */
    }
    if (n === 1) {
      if (isAnime) return clean;
      return _buildWsrv(clean, 200);          /* fallback: wsrv */
    }
    if (n === 2) return clean;               /* direct */
    return "";
  }

  const img = document.createElement("img");
  img.alt = altText || "";
  if (cssText) img.style.cssText = cssText;
  img.style.background = "var(--bg-surface,rgba(255,255,255,0.05))";

  img.onerror = function() {
    step++;
    const next = getUrl(step);
    if (next && step <= 2) { img.src = next; }
    else { img.style.display = "none"; wrap.textContent = fallbackEmoji || "📚"; }
  };
  img.src = getUrl(0);
  wrap.appendChild(img);
  return wrap;
}

/* Legacy alias */
function novelCoverImg(url, altText, cssText) {
  const w = coverImg(url, altText, cssText, "📖");
  return w.querySelector("img") || w;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

/* Strip prefix "Komik ", "Novel " dari judul yang tersimpan di DB */
function cleanTitle(t) {
  return (t||"").replace(/^(Komik|Novel|Manhwa|Manga|Manhua)\s+/i,"").trim() || t || "";
}

/* ── SWITCH TAB ───────────────────────────────────────── */
/* ── Section map: tab → section ── */
const TAB_SECTION = {
  "bookmark": "bookmark", "anime-bookmark": "bookmark", "novel-bookmark": "bookmark",
  "history":  "history",  "anime-history":  "history",  "novel-history":  "history",
  "progress": "progress", "badge": "badge", "leaderboard": "leaderboard",
  "comments": "comments", "settings": "settings"
};

window.switchSection = function(section) {
  /* Aktifkan L1 button */
  document.querySelectorAll(".nav-l1-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(`l1-${section}`)?.classList.add("active");

  /* Sembunyikan semua L2 */
  document.querySelectorAll(".nav-l2").forEach(l => l.classList.remove("show"));

  /* Tampilkan L2 kalau ada (bookmark / history) */
  const l2 = document.getElementById(`l2-${section}`);
  if (l2) {
    l2.classList.add("show");
    /* Aktifkan sub-tab pertama yang ada di section ini */
    const firstBtn = l2.querySelector(".nav-l2-btn");
    if (firstBtn) {
      const firstTab = firstBtn.id.replace("tab-", "");
      switchTab(firstTab);
      return;
    }
  }

  /* Tidak ada L2 → langsung tampilkan content */
  switchTab(section);
};

window.switchTab = function (tab) {
  /* Update L2 active state */
  document.querySelectorAll(".nav-l2-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(`tab-${tab}`)?.classList.add("active");

  /* Update L1 active state */
  const section = TAB_SECTION[tab] || tab;
  document.querySelectorAll(".nav-l1-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(`l1-${section}`)?.classList.add("active");

  /* Pastikan L2 yang benar terlihat */
  document.querySelectorAll(".nav-l2").forEach(l => l.classList.remove("show"));
  document.getElementById(`l2-${section}`)?.classList.add("show");

  /* Ganti content */
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  document.getElementById(`content-${tab}`)?.classList.add("active");

  /* Load data */
  if (tab === "history")        loadHistory();
  if (tab === "anime-history")  loadAnimeHistory();
  if (tab === "novel-history")  loadNovelHistory();
  if (tab === "novel-bookmark") loadNovelBookmarks();
  if (tab === "anime-bookmark") loadAnimeBookmarks();
  if (tab === "progress")       loadProgressTab();
  if (tab === "badge")          loadBadgeTab();
  if (tab === "leaderboard")    loadLeaderboard();
  if (tab === "comments")       loadMyComments();
};

      </div>
      <div class="empty-state">
        <p>⚡</p>

  searchBar.className = "profile-search-bar";

  window._animeBmBuildItem = buildAnimeItem;

      ? list.filter(bm =>
          (bm.komik_title||"").toLowerCase().includes(s) ||

/* ── RIWAYAT KOMIK ────────────────────────────────────── */
const HISTORY_PER_PAGE = 8;

async function loadHistory() {
  if (window._historyAll && document.getElementById("historyItems")) return;
  const el = document.getElementById("historyList");
  el.innerHTML = `<div class="empty-state"><p>⏳</p><p>Memuat...</p></div>`;
  const { history } = await getHistory(currentUser.id);
  if (!history.length) {
    el.innerHTML = `<div class="empty-state"><p>📭</p><p>Belum ada riwayat baca.</p></div>`;
    return;
  }

  /* Dedup: 1 entry per komik_slug */
  const seen = new Map();
  for (const h of history) {
    if (!h.komik_slug) continue;
    if (!seen.has(h.komik_slug)) seen.set(h.komik_slug, h);
  }
  window._historyAll = Array.from(seen.values());
  window._historyPage = 1;

  function historyItemHTML(h) {
    return `<div class="komik-list-item">
      <div style="width:52px;height:70px;flex-shrink:0;border-radius:7px;overflow:hidden;cursor:pointer;border:1px solid var(--glass-b);" onclick="gotoDetail('${esc(h.komik_slug)}')" data-cover-komik="${esc(h.komik_cover||'')}"></div>
      <div class="komik-list-info" onclick="gotoDetail('${esc(h.komik_slug)}')" style="cursor:pointer">
        <div class="title">${esc(cleanTitle(h.komik_title) || h.komik_slug)}</div>
        <p>📖 Ch.${esc(String(h.chapter_number || '?'))}</p>
        <p>🕒 ${new Date(h.read_at).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}</p>
      </div>
      <div class="komik-list-actions">
        <button class="btn-sm primary" onclick="window.location.href='/baca/${esc(h.chapter_slug)}'">▶️ Lanjut</button>
        <button class="btn-sm" onclick="gotoDetail('${esc(h.komik_slug)}')">Detail</button>
      </div>
    </div>`;
  }

  window.renderHistoryPage = function() {
    const src    = window._historyFiltered || window._historyAll;
    const shown  = src.slice(0, window._historyPage * HISTORY_PER_PAGE);
    const hasMore = shown.length < src.length;
    const wrap   = document.getElementById("historyItems");
    if (!wrap) return;
    wrap.innerHTML = shown.map(historyItemHTML).join("") +
      (hasMore ? `<div style="text-align:center;padding:12px 0;">
        <button onclick="window._historyPage++;window.renderHistoryPage()"
          style="padding:9px 28px;background:var(--acc);color:#fff;border:none;border-radius:10px;
          font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;">
          Muat Lebih Banyak ↓
        </button>
      </div>` : "");
    /* Inject cover images setelah render */
    wrap.querySelectorAll("[data-cover-komik]").forEach(el => {
      const url = el.getAttribute("data-cover-komik");
      if (!url) { el.textContent = "📚"; return; }
      const c = coverImg(url, "", "width:100%;height:100%;object-fit:cover;display:block;", "📚");
      el.appendChild(c.tagName ? c : c);
    });
  };

  window.filterHistory = function(q) {
    const s = q.toLowerCase().trim();
    window._historyFiltered = s
      ? window._historyAll.filter(h =>
          (h.komik_title||"").toLowerCase().includes(s) ||
          (h.komik_slug||"").toLowerCase().includes(s))
      : null;
    window._historyPage = 1;
    window.renderHistoryPage();
  };

  el.innerHTML = `
    <div class="profile-search-bar">
      <input id="historySearch" placeholder="🔍 Cari judul komik..." oninput="filterHistory(this.value)">
    </div>
    <div id="historyItems"></div>`;
  window.renderHistoryPage();
}

/* ── PROGRESS ─────────────────────────────────────────── */
let _progressLoaded = false;
let _novelHistoryLoaded = false;
let _animeHistoryLoaded = false;
async function loadProgressTab() {
  if (_progressLoaded && document.getElementById("progressItems")) return;
  const el = document.getElementById("progressList");
  el.innerHTML = `<div class="empty-state"><p>⏳</p><p>Memuat...</p></div>`;

  /* Ambil progress + history (untuk cover) secara paralel */
  const [{ progress }, { history }] = await Promise.all([
    getProgress(currentUser.id),
    getHistory(currentUser.id),
  ]);
  _progressLoaded = true;

  if (!progress.length) {
    el.innerHTML = `<div class="empty-state"><p>📊</p><p>Belum ada progress. Mulai baca komik dulu!</p></div>`;
    return;
  }

  /* Buat cover map dari history */
  const coverMap = {};
  (history||[]).forEach(h => { if (h.komik_slug && h.komik_cover) coverMap[h.komik_slug] = h.komik_cover; });

  window._progressAll  = progress;
  window._progressPage = 1;
  const PER_PAGE = 8;

  function buildProgressItem(p) {
    const pct      = p.total_chapters > 0 ? Math.min(100, Math.round((p.read_chapters / p.total_chapters) * 100)) : 0;
    const pctLabel = p.total_chapters > 0 ? `${pct}%` : "—";
    const chapLabel = p.total_chapters > 0
      ? `${p.read_chapters} / ${p.total_chapters} ch`
      : `${p.read_chapters} ch dibaca`;
    const updated = new Date(p.updated_at).toLocaleDateString("id-ID", {day:"numeric",month:"short",year:"numeric"});
    const cover   = coverMap[p.komik_slug] || "";

    const wrap = document.createElement("div");
    wrap.className = "komik-list-item";
    wrap.style.cssText = "flex-direction:row;align-items:center;gap:10px;";

    /* Cover */
    const coverWrap = document.createElement("div");
    coverWrap.style.cssText = "width:52px;height:70px;flex-shrink:0;border-radius:8px;overflow:hidden;background:var(--bg-surface);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;";
    coverWrap.onclick = () => gotoDetail(p.komik_slug);
    if (cover) {
      const c = coverImg(cover, p.komik_title||"", "width:100%;height:100%;object-fit:cover;display:block;", "📚");
      coverWrap.appendChild(c);
    } else {
      coverWrap.textContent = "📚";
    }
    wrap.appendChild(coverWrap);

    /* Info + progress */
    const info = document.createElement("div");
    info.style.cssText = "flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;";
    info.innerHTML = `
      <div class="title" style="cursor:pointer" onclick="gotoDetail('${esc(p.komik_slug)}')">${esc(cleanTitle(p.komik_title))}</div>
      <p style="font-size:11px;color:var(--text-muted);margin:0;">📖 ${esc(chapLabel)} · 🕒 ${esc(updated)}</p>
      ${p.total_chapters > 0 ? `
      <div style="display:flex;align-items:center;gap:6px;margin-top:2px;">
        <div class="progress-bar-wrap" style="flex:1;"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <span style="font-size:12px;font-weight:900;color:var(--acc);min-width:32px;text-align:right;">${esc(pctLabel)}</span>
      </div>` : ""}
      <div style="display:flex;gap:5px;margin-top:2px;">
        ${p.last_chapter_slug ? `<button class="btn-sm primary" onclick="window.location.href='/baca/${esc(p.last_chapter_slug)}'">▶️ Lanjut</button>` : ""}
        <button class="btn-sm" onclick="gotoDetail('${esc(p.komik_slug)}')">Detail</button>
      </div>`;
    wrap.appendChild(info);
    return wrap;
  }

  window.renderProgressPage = function() {
    const src     = window._progressFiltered || window._progressAll;
    const shown   = src.slice(0, window._progressPage * PER_PAGE);
    const hasMore = shown.length < src.length;
    const wrap    = document.getElementById("progressItems");
    if (!wrap) return;
    wrap.innerHTML = "";
    shown.forEach(p => wrap.appendChild(buildProgressItem(p)));
    if (hasMore) {
      const btn = document.createElement("div");
      btn.style.cssText = "text-align:center;padding:12px 0;";
      btn.innerHTML = `<button onclick="window._progressPage++;window.renderProgressPage()"
        style="padding:9px 28px;background:var(--acc);color:#fff;border:none;border-radius:10px;
        font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;">
        Muat Lebih Banyak ↓</button>`;
      wrap.appendChild(btn);
    }
  };

  window.filterProgress = function(q) {
    const s = q.toLowerCase().trim();
    window._progressFiltered = s
      ? window._progressAll.filter(p =>
          (p.komik_title||"").toLowerCase().includes(s) ||
          (p.komik_slug||"").toLowerCase().includes(s))
      : null;
    window._progressPage = 1;
    window.renderProgressPage();
  };

  el.innerHTML = "";
  const header = document.createElement("div");
  header.style.cssText = "display:flex;align-items:center;justify-content:space-between;padding:8px 14px 0;";
  header.innerHTML = `
    <div class="profile-search-bar" style="flex:1;padding:0 8px 0 0;">
      <input id="progressSearch" placeholder="🔍 Cari judul komik..." oninput="filterProgress(this.value)">
    </div>
    <button onclick="_progressLoaded=false;window._progressAll=null;loadProgressTab()"
      style="background:none;border:none;color:var(--acc);font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;padding:4px 0;font-family:'Nunito',sans-serif;">
      🔄 Refresh</button>`;
  const itemsWrap = document.createElement("div");
  itemsWrap.id = "progressItems";
  el.appendChild(header);
  el.appendChild(itemsWrap);
  window.renderProgressPage();
}

/* ── LEADERBOARD ──────────────────────────────────────── */
const rankEmoji = i => i===0?"🥇":i===1?"🥈":i===2?"🥉":`#${i+1}`;
const rankClass = i => i===0?"rank-1":i===1?"rank-2":i===2?"rank-3":"";

function buildLbRows(list, scoreField, scoreLabel, userId, showAll=false) {
  if (!list.length) return `<div class="empty-state"><p>📭</p><p>Belum ada data. Jadilah yang pertama!</p></div>`;
  const SHOW_DEFAULT = 10;
  const displayList  = showAll ? list : list.slice(0, SHOW_DEFAULT);
  const hasMore      = !showAll && list.length > SHOW_DEFAULT;
  const maxScore     = list[0]?.[scoreField] || 1;
  const myRankIndex  = list.findIndex(u => u.id === userId);
  const myRankInTop  = displayList.findIndex(u => u.id === userId) >= 0;

  let myRankCard = "";
  if (!myRankInTop) {
    if (myRankIndex >= 0) {
      const u = list[myRankIndex];
      const score = (u[scoreField]||0).toLocaleString("id-ID");
      myRankCard = `<div class="lb-my-rank">Kamu di <strong>#${myRankIndex+1}</strong> dengan <strong>${score} ${scoreLabel}</strong> — terus baca! 🚀</div>`;
    } else {
      myRankCard = `<div class="lb-my-rank">Kamu belum masuk top ${SHOW_DEFAULT}. Terus baca untuk naik! 🚀</div>`;
    }
  }

  const rows = displayList.map((u, i) => {
    const isMe    = u.id === userId;
    const name    = u.username || "Anonim";
    const avatar  = u.avatar_url || null;
    const level   = u.level || 1;
    const rawScore= u[scoreField] || 0;
    const score   = rawScore.toLocaleString("id-ID");
    const barPct  = maxScore > 0 ? Math.round((rawScore/maxScore)*100) : 0;
    const avatarHtml = avatar
      ? `<img class="lb-avatar" src="${esc(avatar)}" alt="${esc(name)}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
         <div class="lb-avatar" style="display:none;align-items:center;justify-content:center;
           background:linear-gradient(135deg,#e8522a,#c73f1c);font-weight:800;font-size:14px;color:#fff;">
           ${name[0]?.toUpperCase()||"?"}</div>`
      : `<div class="lb-avatar" style="display:flex;align-items:center;justify-content:center;
          background:linear-gradient(135deg,#e8522a,#c73f1c);font-weight:800;font-size:14px;color:#fff;">
          ${name[0]?.toUpperCase()||"?"}</div>`;
    return `
      <div class="lb-row ${rankClass(i)} ${isMe?"me":""}" style="animation-delay:${i*45}ms">
        <div class="lb-rank">${rankEmoji(i)}</div>
        ${avatarHtml}
        <div class="lb-info">
          <div class="lb-name">${esc(name)}${isMe?`<span class="lb-me-badge">Kamu</span>`:""}</div>
          <div class="lb-meta">Level ${level} · ${esc(getLevelTitle(level))}</div>
          <div class="lb-bar-wrap"><div class="lb-bar-fill" style="width:${barPct}%"></div></div>
        </div>
        <div class="lb-score">
          <span class="lb-score-num">${esc(score)}</span>
          <span class="lb-score-label">${esc(scoreLabel)}</span>
        </div>
      </div>`;
  }).join("");

  const showMoreBtn = hasMore ? `<button class="lb-show-more" onclick="expandLbTab()">▼ Lihat ${list.length-SHOW_DEFAULT} lainnya</button>` : "";
  return rows + showMoreBtn + myRankCard + `<div class="lb-footer">Update otomatis setiap kamu selesai baca</div>`;
}

  el.appendChild(itemsWrap);

  window._novelBmCurrent = list;
  window._novelBmBuildItem = buildItem;

    const s = q.toLowerCase().trim();

      (bm.novel_title||"").toLowerCase().includes(s) ||
      (bm.novel_slug||"").toLowerCase().includes(s)) : list;

    if (!filtered.length) {
      wrap.innerHTML = `<div class="empty-state" style="padding:30px"><p>🔍</p><p>Tidak ada hasil.</p></div>`;
    } else {
      filtered.forEach(bm => wrap.appendChild(buildItem(bm)));

  };

    const src     = window._novelHistoryFiltered || window._novelHistoryAll;
    const perPage = 8;
    const shown   = src.slice(0, window._novelHistoryPage * perPage);
    const hasMore = shown.length < src.length;
    const wrap    = document.getElementById("novelHistoryItems");
    if (!wrap) return;
    wrap.innerHTML = "";
    shown.forEach(h => wrap.appendChild(buildNovelHistItem(h)));
    if (hasMore) {
      const btn = document.createElement("div");
      btn.style.cssText = "text-align:center;padding:12px 0;";
      btn.innerHTML = `<button onclick="window._novelHistoryPage++;window.renderNovelHistoryPage()"
        style="padding:9px 28px;background:var(--acc);color:#fff;border:none;border-radius:10px;
        font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;">
        Muat Lebih Banyak ↓</button>`;
      wrap.appendChild(btn);
    }
  };

  window.filterNovelHistory = function(q) {
    const s = q.toLowerCase().trim();
    window._novelHistoryFiltered = s
      ? window._novelHistoryAll.filter(h =>
          (h.novel_title||"").toLowerCase().includes(s) ||
          (h.novel_slug||"").toLowerCase().includes(s))
      : null;
    window._novelHistoryPage = 1;
    window.renderNovelHistoryPage();
  };

  el.innerHTML = "";
  const searchBar = document.createElement("div");
  searchBar.className = "profile-search-bar";
  searchBar.innerHTML = `<input id="novelHistorySearch" placeholder="🔍 Cari judul novel..." oninput="filterNovelHistory(this.value)">`;
  const itemsWrap = document.createElement("div");
  itemsWrap.id = "novelHistoryItems";
  el.appendChild(searchBar);
  el.appendChild(itemsWrap);
  window.renderNovelHistoryPage();
}


/* ── KOMENTAR SAYA ────────────────────────────────────── */
let _myCommentsLoaded = false;

async function loadMyComments() {
  if (_myCommentsLoaded) return;
  const el = document.getElementById("myCommentsList");
  if (!el) return;
  el.innerHTML = `<div class="empty-state"><p>⏳</p><p>Memuat komentar...</p></div>`;

  try {
    const { comments, error } = await getMyComments(currentUser.id, 30);
    if (error) throw error;
    if (!comments || comments.length === 0) {
      el.innerHTML = `<div class="empty-state"><p>💬</p><p>Kamu belum pernah berkomentar.</p></div>`;
      _myCommentsLoaded = true;
      return;
    }
    _myCommentsLoaded = true;
    el.innerHTML = comments.map(c => renderMyComment(c)).join("");
  } catch (err) {
    el.innerHTML = `<div class="empty-state"><p>😕</p><p>Gagal memuat komentar.</p><button onclick="_myCommentsLoaded=false;loadMyComments()" style="margin-top:10px;padding:7px 18px;background:var(--acc);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;">🔄 Coba Lagi</button></div>`;
  }
}

function resolveCommentLocation(komikSlug) {
  if (!komikSlug) return { icon:"💬", label:"Pankomik", url:"/" };
  if (komikSlug.startsWith("novel-chapter:")) {
    const raw = komikSlug.slice("novel-chapter:".length);
    const label = raw.replace(/-chapter-[\d-]+$/i,"").replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,26) || "Chapter Novel";
    return { icon:"📖", label, url:`/baca-novel/${raw}` };
  }
  if (komikSlug.startsWith("novel:")) {
    const raw = komikSlug.slice("novel:".length);
    const label = raw.replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,26) || "Novel";
    return { icon:"📖", label, url:`/novel/${raw}` };
  }
  if (komikSlug.startsWith("chapter:")) {
    const raw = komikSlug.slice("chapter:".length);
    const label = raw.replace(/-chapter-[\d-]+$/i,"").replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,26) || "Chapter Komik";
    return { icon:"📚", label, url:`/baca/${raw}` };
  }
  const label = komikSlug.replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,26) || "Komik";
  return { icon:"📚", label, url:`/komik/${komikSlug}` };
}

function renderMyComment(c) {
  const loc   = resolveCommentLocation(c.komik_slug);
  const likes = c.like_count || 0;
  const isReply = !!c.parent_id;
  const text  = (c.content || "").slice(0, 200);
  let   time  = "–";
  try { time = new Date(c.created_at).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}); } catch {}
  return `
    <a class="my-comment-card" href="${esc(loc.url)}" title="Komentar di: ${esc(loc.label)}">
      <div class="my-comment-location">
        <span>${esc(loc.icon)}</span>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(loc.label)}</span>
      </div>
      <p class="my-comment-text">${esc(text)}${(c.content||"").length>200?"…":""}</p>
      <div class="my-comment-footer">
        <span>🕒 ${esc(time)}</span>
        ${likes>0?`<span class="my-comment-likes">❤️ ${likes}</span>`:""}
        ${isReply?`<span class="my-comment-reply-badge">↩ Balasan</span>`:""}
        <span style="margin-left:auto;color:var(--acc);font-weight:700;font-size:10px;">Lihat →</span>
      </div>
    </a>`;
}

/* ── SAVE PROFILE ─────────────────────────────────────── */
window.saveProfile = async function () {
  const btn  = document.getElementById("saveUsernameBtn");
  const msg  = document.getElementById("saveMsg");
  const val  = document.getElementById("usernameInput")?.value.trim();
  if (!val || val.length < 3) { showMsg(msg,"Username minimal 3 karakter.","error"); return; }
  if (!/^[a-zA-Z0-9_-]+$/.test(val)) { showMsg(msg,"Hanya huruf, angka, _ dan -","error"); return; }
  btn.disabled = true; btn.textContent = "⏳ Menyimpan...";
  const { error } = await updateProfile(currentUser.id, { username: val });
  if (error) showMsg(msg, "Gagal menyimpan. Coba lagi.", "error");
  else {
    showMsg(msg,"✅ Username berhasil disimpan!","success");
    document.getElementById("profileNameDisplay").textContent = val;
  }
  btn.disabled = false; btn.textContent = "💾 Simpan Username";
};

window.savePassword = async function () {
  const btn  = document.getElementById("savePasswordBtn");
  const msg  = document.getElementById("passwordMsg");
  const np   = document.getElementById("newPasswordInput")?.value;
  const cp   = document.getElementById("confirmPasswordInput")?.value;
  if (!np || np.length < 6) { showMsg(msg,"Password minimal 6 karakter.","error"); return; }
  if (np !== cp) { showMsg(msg,"Konfirmasi password tidak cocok.","error"); return; }
  btn.disabled = true; btn.textContent = "⏳ Menyimpan...";
  const { error } = await updatePassword(np);
  if (error) showMsg(msg,"Gagal ganti password.","error");
  else showMsg(msg,"✅ Password berhasil diubah!","success");
  btn.disabled = false; btn.textContent = "🔒 Ganti Password";
};

function showMsg(el, text, type) {
  if (!el) return;
  el.textContent = text;
  el.className = `form-msg ${type}`;
}

/* ── AVATAR UPLOAD ────────────────────────────────────── */
window.handleAvatarUpload = async function (event) {
  const file = event.target.files?.[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    const msg = document.getElementById("uploadMsg");
    showMsg(msg, "File terlalu besar. Maks 2MB.", "error");
    return;
  }
  const ring = document.getElementById("avatarRing");
  ring?.classList.add("avatar-uploading");

  const { url, error } = await uploadAvatar(currentUser.id, file);
  ring?.classList.remove("avatar-uploading");

  if (!error && url) {
    document.getElementById("avatarImg").src = url;
    const si = document.getElementById("avatarImgSettings");
    if (si) si.src = url;
    const msg = document.getElementById("uploadMsg");
    showMsg(msg, "✅ Foto profil berhasil diperbarui!", "success");
  } else {
    const msg = document.getElementById("uploadMsg");
    showMsg(msg, "Gagal upload foto. Coba lagi.", "error");
  }
};

  if (level >= 20) return "Legenda Komik 👑";

  if (level >= 5)  return "Pembaca Aktif 🔥";
  if (level >= 2)  return "Pecinta Komik 📚";

}
