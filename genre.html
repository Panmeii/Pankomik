<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genre — Pankomik</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ============================================================
       GENRE PAGE — Layout & komponen khusus
       ============================================================ */

    /* ---- GENRE HERO ----------------------------------------- */
    .genre-hero {
      padding: 18px 14px 10px;
      border-bottom: 1px solid var(--border);
    }

    .genre-hero-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .genre-back-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }

    .genre-back-btn:hover { border-color: var(--accent); color: var(--accent); }

    .genre-active-name {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      letter-spacing: 1.5px;
      color: var(--accent);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .genre-count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ---- GENRE CHIPS SCROLL --------------------------------- */
    .genre-chips-wrap {
      position: relative;
    }

    .genre-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scroll-behavior: smooth;
      /* sembunyikan scrollbar tapi tetap bisa scroll */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .genre-chips::-webkit-scrollbar { display: none; }

    .genre-chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-muted);
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
    }

    .genre-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .genre-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(232,82,42,0.35);
    }

    .genre-chip:active { transform: scale(0.94); }

    /* Fade edge kanan biar keliatan ada lagi */
    .genre-chips-wrap::after {
      content: "";
      position: absolute;
      right: 0; top: 0; bottom: 6px;
      width: 40px;
      background: linear-gradient(to right, transparent, var(--bg));
      pointer-events: none;
    }

    /* ---- SORT & FILTER BAR ---------------------------------- */
    .genre-toolbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .genre-toolbar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .sort-select {
      flex: 1;
      min-width: 0;
      padding: 7px 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .sort-select:focus { border-color: var(--accent); }

    .type-filter-btns {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 2px;
    }

    .type-filter-btns::-webkit-scrollbar { display: none; }

    .type-btn {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-muted);
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .type-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(232,82,42,0.3);
    }

    .type-btn:hover:not(.active) {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ---- KOMIK GRID ----------------------------------------- */
    .genre-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 12px 14px;
    }

    .genre-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .genre-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(232,82,42,0.2);
    }

    .genre-card-info {
      padding: 6px 7px 8px;
    }

    .genre-card-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
      margin-bottom: 3px;
    }

    .genre-card-rating {
      font-size: 10px;
      color: var(--accent2);
      font-weight: 700;
    }

    .genre-card-type {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 8px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* ---- CHAPTER & RATING INLINE --------------------------- */
    .genre-card-chapter {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- IMAGE WRAP & PLACEHOLDER -------------------------- */
    .genre-card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      background: var(--bg-surface);
      overflow: hidden;
    }

    .genre-card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .genre-card-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-card) 100%);
    }

    /* Rating badge overlay bawah-kiri */
    .genre-card-rating-badge {
      position: absolute;
      bottom: 5px;
      left: 5px;
      background: rgba(0,0,0,0.72);
      color: var(--accent2);
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    /* ---- PAGINATION ----------------------------------------- */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 14px 24px;
    }

    .page-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .page-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .page-info {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }

    /* ---- LOADING STATE ------------------------------------- */
    .genre-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 12px;
      color: var(--text-muted);
    }

    .genre-loading .spin {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- EMPTY STATE --------------------------------------- */
    .genre-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .genre-empty p:first-child { font-size: 40px; margin-bottom: 10px; }
    .genre-empty p:last-child  { font-size: 13px; }

    /* ---- SKELETON ------------------------------------------ */
    .genre-card.skeleton img {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-surface) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      aspect-ratio: 2/3;
      width: 100%;
    }

    .genre-card.skeleton .genre-card-title,
    .genre-card.skeleton .genre-card-rating {
      background: linear-gradient(90deg, var(--bg-surface) 25%, var(--border) 50%, var(--bg-surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px;
      color: transparent;
    }

    /* ---- GENRE BROWSE CARDS (mode browse semua genre) --- */
    .genre-browse-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      text-align: center;
      min-height: 90px;
    }

    .genre-browse-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(232,82,42,0.18);
      border-color: rgba(232,82,42,0.3);
    }

    .genre-browse-card:active { transform: scale(0.95); }

    .genre-browse-emoji {
      font-size: 28px;
      line-height: 1;
      display: block;
    }

    .genre-browse-name {
      font-size: 11px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
      word-break: break-word;
      display: block;
    }
  </style>
</head>

<script>

function proxyImg(url) {
  /* Skip SVG placeholder kosong */
  if (!url || url === "undefined" || url === "null") return "";
  if (url.startsWith("data:image/svg") && url.includes("viewBox")) return "";
  if (url.startsWith("data:") || url.includes("wsrv.nl")) return url;
  /* Jangan strip query string — WordPress ?resize= wajib dipertahankan */
  return "https://wsrv.nl/?url=" + encodeURIComponent(url) + "&w=300&output=webp&q=80&n=-1";
}

/* ============================================================
   GENRE PAGE — genre.js (inline)
   ============================================================ */

const GENRES_API  = "https://www.sankavollerei.com/comic/mangakita/genres";
const GENRE_API   = "https://www.sankavollerei.com/comic/mangakita/genres/";
const GENRE_API_2 = "https://www.sankavollerei.com/comic/bacakomik/genre/";

/* ---- STATE ---------------------------------------------- */
let allGenres     = [];
let currentGenre  = null; /* null = tampilkan daftar genre */
let currentPage   = 1;
let hasNextPage   = false;
let typeFilter    = "";
let sortMode      = "";
let allFetched    = []; /* simpan semua hasil untuk filter/sort lokal */

/* ============================================================
   INIT
   ============================================================ */
window.addEventListener("DOMContentLoaded", async () => {
  if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light");
  }

  /* Cek apakah ada genre dari URL param ?genre=action */
  const params = new URLSearchParams(window.location.search);
  const genreFromUrl = params.get("genre");

  await loadGenreList();

  if (genreFromUrl) {
    /* Aktifkan genre dari URL */
    const found = allGenres.find(g => g.slug === genreFromUrl);
    if (found) {
      selectGenre(found.slug, found.title);
    } else {
      /* Fallback: langsung fetch meski tidak ada di list */
      selectGenre(genreFromUrl, genreFromUrl.charAt(0).toUpperCase() + genreFromUrl.slice(1));
    }
  } else {
    /* Tidak ada param → tampilkan daftar genre sebagai grid besar */
    showGenreBrowse();
  }

  /* Back to top */
  const btn = document.getElementById("backToTop");
  if (btn) {
    window.addEventListener("scroll", () => {
      btn.classList.toggle("visible", window.scrollY > 300);
    });
  }
});

/* ============================================================
   FETCH LIST GENRE
   ============================================================ */
async function loadGenreList() {
  try {
    const res  = await fetch(GENRES_API);
    const data = await res.json();

    /* API baru pakai field: name (display) + value (slug untuk URL)
       Deduplicate pakai value sebagai key, filter min 3 karakter & hapus typo */
    const rawGenres = data.genres || [];
    const seen  = new Set();
    const TYPOS = new Set(["actio","traged"]); /* typo dari API lama */

    allGenres = rawGenres
      .filter(g => {
        const val  = (g.value || g.slug || "").toLowerCase();
        const name = (g.name  || g.title || "");
        if (!val || !name || name.length < 3) return false;
        if (TYPOS.has(val)) return false;
        if (seen.has(val)) return false;
        seen.add(val);
        return true;
      })
      .map(g => ({
        /* Normalize ke format slug+title agar kode selanjutnya tetap jalan */
        slug:  g.value || g.slug,
        title: g.name  || g.title,
      }))
      .sort((a, b) => a.title.localeCompare(b.title, "id"));

    renderGenreChips();
  } catch (err) {
    console.error("Gagal fetch genre list:", err);
    document.getElementById("genreChips").innerHTML =
      `<p style="color:var(--text-muted);font-size:12px;padding:4px;">Gagal memuat genre.</p>`;
  }
}

/* ============================================================
   RENDER GENRE CHIPS (horizontal scroll pills)
   ============================================================ */
function renderGenreChips() {
  const container = document.getElementById("genreChips");
  if (!allGenres.length) { container.innerHTML = ""; return; }

  /* allGenres sudah bersih dan deduplicated dari loadGenreList */
  container.innerHTML = allGenres.map(g => `
    <button
      class="genre-chip ${currentGenre === g.slug ? "active" : ""}"
      id="chip-${g.slug}"
      onclick="selectGenre('${g.slug}', '${g.title.replace(/'/g,"\\'")}')">
      ${g.title}
    </button>
  `).join("");
}

/* ============================================================
   SELECT GENRE → fetch komik
   ============================================================ */
function selectGenre(slug, title) {
  currentGenre = slug;
  currentPage  = 1;
  allFetched   = [];
  typeFilter   = "";
  sortMode     = "";

  /* Reset toolbar */
  document.getElementById("sortSelect").value = "";
  document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
  document.querySelector(".type-btn")?.classList.add("active"); /* "Semua" */

  /* Update chip aktif */
  document.querySelectorAll(".genre-chip").forEach(c => c.classList.remove("active"));
  const activeChip = document.getElementById(`chip-${slug}`);
  if (activeChip) {
    activeChip.classList.add("active");
    activeChip.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
  }

  /* Update judul */
  document.getElementById("activeGenreName").textContent = title;
  document.getElementById("activeGenreCount").textContent = "";

  /* Update URL tanpa reload */
  const url = new URL(window.location.href);
  url.searchParams.set("genre", slug);
  history.pushState({}, "", url);

  /* Fetch */
  fetchGenreKomik(slug, 1);
}

/* ============================================================
   FETCH KOMIK BY GENRE
   ============================================================ */
async function fetchGenreKomik(slug, page) {
  const grid = document.getElementById("genreGrid");
  const pagination = document.getElementById("pagination");

  /* Skeleton */
  grid.innerHTML = Array(9).fill(`
    <div class="genre-card skeleton">
      <img alt="" style="aspect-ratio:2/3;width:100%;display:block;">
      <div class="genre-card-info">
        <div class="genre-card-title">⠀⠀⠀⠀⠀⠀⠀</div>
        <div class="genre-card-rating">⠀⠀⠀</div>
      </div>
    </div>`).join("");
  pagination.style.display = "none";

  try {
    const cleanSlug = slug.toLowerCase().replace(/[^a-z0-9-]/g, "-").replace(/-+/g, "-");

    /* Fetch kedua API paralel: mangakita (1) + bacakomik (2) */
    const [r1, r2] = await Promise.allSettled([
      fetch(`${GENRE_API}${cleanSlug}/${page}`).then(r => r.json()).catch(() => null),
      fetch(`${GENRE_API_2}${cleanSlug}/${page}`).then(r => r.json()).catch(() => null),
    ]);

    const d1 = r1.status === "fulfilled" ? r1.value : null;
    const d2 = r2.status === "fulfilled" ? r2.value : null;

    /* Normalize mangakita: mangaList[{image, slug, rating, latestChapter}] */
    const list1 = (d1?.mangaList || []).map(k => ({
      cover:   k.image || k.banner || k.cover || "",
      title:   k.title || "Untitled",
      slug:    k.slug  || "",
      type:    k.type  || "",
      rating:  k.rating || "–",
      chapter: k.latestChapter || k.chapter || "",
    }));

    /* Normalize bacakomik: komikList[{cover, slug, rating, type}] */
    const list2 = (d2?.komikList || []).map(k => ({
      cover:   k.cover || k.image || "",
      title:   k.title || "Untitled",
      slug:    k.slug  || "",
      type:    k.type  || "",
      rating:  k.rating || "–",
      chapter: k.latestChapter || k.chapter || "",
    }));

    /* Merge deduplicate by slug: mangakita dulu, bacakomik tambal yg tidak ada */
    const seen = new Set();
    allFetched = [...list1, ...list2].filter(k => {
      if (!k.slug || seen.has(k.slug)) return false;
      seen.add(k.slug);
      return true;
    });

    if (!allFetched.length) {
      throw new Error(`Tidak ada komik untuk genre "${slug}"`);
    }

    /* Pagination: prioritaskan mangakita, fallback bacakomik */
    const pag   = d1?.pagination || {};
    hasNextPage = !!(pag.hasNextPage ?? pag.hasNext ?? d2?.hasNextPage ?? false);
    currentPage = pag.currentPage || d2?.currentPage || page;

    document.getElementById("activeGenreCount").textContent = `(${allFetched.length}+)`;

    applyFilterAndSort();
    renderPagination();

  } catch (err) {
    console.error("[Genre] Gagal fetch:", err);
    const errMsg = err.message || "Gagal memuat";
    grid.innerHTML = `
      <div style="grid-column:1/-1" class="genre-empty">
        <p>😕</p>
        <p>Gagal memuat genre <strong>${currentGenre||""}</strong>.</p>
        <p style="font-size:11px;color:var(--text-muted);margin-top:4px;">${errMsg}</p>
        <button onclick="fetchGenreKomik('${currentGenre||""}',${page})"
          style="margin-top:12px;padding:8px 20px;background:var(--accent);color:#fff;border:none;
          border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit;">
          🔄 Coba Lagi
        </button>
      </div>`;
    pagination.style.display = "none";
  }
}

/* ============================================================
   FILTER & SORT (dilakukan lokal dari data yang sudah di-fetch)
   ============================================================ */
function applyFilterAndSort() {
  let list = [...allFetched];

  /* Filter by type */
  if (typeFilter) {
    list = list.filter(k => k.type?.toLowerCase() === typeFilter);
  }

  /* Sort */
  if (sortMode === "rating") {
    list.sort((a, b) => parseFloat(b.rating) - parseFloat(a.rating));
  } else if (sortMode === "az") {
    list.sort((a, b) => a.title.localeCompare(b.title, "id"));
  }

  renderGenreGrid(list);
}

function onSortChange() {
  sortMode = document.getElementById("sortSelect").value;
  applyFilterAndSort();
}

function setTypeFilter(type, btn) {
  typeFilter = type;
  document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  applyFilterAndSort();
}

/* ============================================================
   RENDER GRID KOMIK
   ============================================================ */
function renderGenreGrid(list) {
  const grid = document.getElementById("genreGrid");

  if (!list.length) {
    grid.innerHTML = `
      <div style="grid-column:1/-1" class="genre-empty">
        <p>📭</p>
        <p>Tidak ada komik dengan filter ini.</p>
      </div>`;
    return;
  }

  grid.className = "genre-grid";
  grid.innerHTML = list.map(k => {
    const cover  = proxyImg(k.cover);
    const type   = (k.type || "").toLowerCase();
    const href   = k.slug ? `/komik/${k.slug}` : (k.link || "#");
    const rating = parseFloat(k.rating);
    const ratingStr = !isNaN(rating) ? rating.toFixed(1) : "";
    /* Placeholder cover jika gambar kosong/SVG dari API */
    const imgHtml = cover
      ? `<img src="${cover}" alt="${escHtml(k.title)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : "";
    const placeholder = `<div class="genre-card-placeholder" style="${cover ? "display:none" : ""}">📚</div>`;
    return `
      <div class="genre-card" onclick="window.location.href='${href}'">
        <div class="genre-card-img-wrap">
          ${imgHtml}${placeholder}
          ${k.type ? `<span class="genre-card-type badge ${type}">${k.type}</span>` : ""}
          ${ratingStr ? `<span class="genre-card-rating-badge">⭐ ${ratingStr}</span>` : ""}
        </div>
        <div class="genre-card-info">
          <div class="genre-card-title">${escHtml(k.title)}</div>
          ${k.chapter ? `<div class="genre-card-chapter">📖 ${escHtml(k.chapter)}</div>` : ""}
        </div>
      </div>`;
  }).join("");
}

/* ============================================================
   PAGINATION
   ============================================================ */
function renderPagination() {
  const wrap    = document.getElementById("pagination");
  const prevBtn = document.getElementById("prevPageBtn");
  const nextBtn = document.getElementById("nextPageBtn");
  const info    = document.getElementById("pageInfo");

  wrap.style.display = (currentPage > 1 || hasNextPage) ? "flex" : "none";
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = !hasNextPage;
  info.textContent = `Hal ${currentPage}`;
}

function changePage(dir) {
  const newPage = currentPage + dir;
  if (newPage < 1) return;
  if (!hasNextPage && dir > 0) return;

  currentPage = newPage;
  window.scrollTo({ top: 0, behavior: "smooth" });
  fetchGenreKomik(currentGenre, currentPage);
}

/* ============================================================
   MODE: BROWSE SEMUA GENRE (tampilkan grid genre besar)
   jika tidak ada param di URL
   ============================================================ */
function showGenreBrowse() {
  document.getElementById("activeGenreName").textContent = "Semua Genre";
  document.getElementById("activeGenreCount").textContent = `(${allGenres.length})`;

  const grid = document.getElementById("genreGrid");
  const pagination = document.getElementById("pagination");
  pagination.style.display = "none";

  if (!allGenres.length) {
    grid.innerHTML = `<div style="grid-column:1/-1" class="genre-empty"><p>😕</p><p>Gagal memuat genre.</p></div>`;
    return;
  }

  /* allGenres sudah bersih dari loadGenreList */
  const cleaned = allGenres;

  /* Render grid genre dengan emoji acak */
  const emojiMap = {
    action:"⚔️", adventure:"🗺️", comedy:"😄", drama:"🎭", fantasy:"🧙",
    horror:"👻", romance:"💕", "sci-fi":"🚀", mystery:"🔍", sports:"⚽",
    thriller:"😱", school:"🏫", supernatural:"✨", magic:"🪄", slice:"🍞",
    martial:"🥋", historical:"📜", psychological:"🧠", isekai:"🌀",
    mecha:"🤖", military:"🪖", music:"🎵", cooking:"🍳", ecchi:"🌸",
    josei:"👩", seinen:"👨", shoujo:"🌹", shounen:"💥", yaoi:"💙", yuri:"💜"
  };

  const getEmoji = (slug) => {
    const key = Object.keys(emojiMap).find(k => slug.toLowerCase().includes(k));
    return key ? emojiMap[key] : "📚";
  };

  /* Pakai class khusus browse */
  grid.removeAttribute("style");
  grid.className = "genre-grid genre-browse-grid";
  grid.innerHTML = "";
  cleaned.forEach(function(g) {
    var card = document.createElement("div");
    card.className = "genre-browse-card";
    card.onclick = function() { selectGenre(g.slug, g.title); };
    var emoji = document.createElement("span");
    emoji.className = "genre-browse-emoji";
    emoji.textContent = getEmoji(g.slug);
    var name = document.createElement("span");
    name.className = "genre-browse-name";
    name.textContent = g.title;
    card.appendChild(emoji);
    card.appendChild(name);
    grid.appendChild(card);
  });
}

/* ============================================================
   SEARCH (shared dengan halaman lain)
   ============================================================ */
let searchTimeout = null;

function liveSearch() {
  const query     = document.getElementById("searchInput").value.trim();
  const resultBox = document.getElementById("searchResult");
  if (!query) { resultBox.style.display = "none"; return; }
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(async () => {
    try {
      const res  = await fetch(`https://www.sankavollerei.com/comic/bacakomik/search/${encodeURIComponent(query)}`);
      const data = await res.json();
      const list = data.komikList;
      resultBox.innerHTML = "";
      if (!list?.length) { resultBox.style.display = "none"; return; }
      list.slice(0, 5).forEach(k => {
        const item = document.createElement("div");
        item.className = "search-item";
        item.innerHTML = `<img src="${proxyImg(k.cover)}" loading="lazy"><div><p>${escHtml(k.title)}</p><p>⭐ ${k.rating}</p></div>`;
        item.onclick = () => window.location.href = '/komik/'+k.slug;
        resultBox.appendChild(item);
      });
      resultBox.style.display = "block";
    } catch(e) { console.error(e); }
  }, 400);
}

document.addEventListener("click", e => {
  const s = document.getElementById("searchInput");
  const r = document.getElementById("searchResult");
  const m = document.getElementById("menuDropdown");
  const t = document.querySelector('button[onclick="toggleMenu()"]');
  if (r && s && !s.contains(e.target) && !r.contains(e.target)) r.style.display = "none";
  if (m && t && !m.contains(e.target) && !t.contains(e.target)) m.style.display = "none";
});

/* ============================================================
   UTILS
   ============================================================ */
function escHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function goHome() { window.location.href = "/"; }

function toggleDarkMode() {
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
}
