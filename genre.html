<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genre — Pankomik</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ============================================================
       GENRE PAGE — Layout & komponen
       ============================================================ */

    /* ---- GENRE HERO ----------------------------------------- */
    .genre-hero {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(232,82,42,0.04) 0%, transparent 100%);
    }

    .genre-hero-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .genre-back-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .genre-back-btn:hover { border-color: var(--accent); color: var(--accent); }

    .genre-active-name {
      font-family: 'Bangers', cursive;
      font-size: 22px;
      letter-spacing: 1.5px;
      color: var(--accent);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .genre-count {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 99px;
    }

    /* ---- SOURCE BADGE --------------------------------------- */
    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .source-badge.mangakita  { background: rgba(52,152,219,0.12); border-color: rgba(52,152,219,0.3); color: #3498db; }
    .source-badge.bacakomik  { background: rgba(39,174,96,0.12);  border-color: rgba(39,174,96,0.3);  color: #27ae60; }
    .source-badge.komikstation { background: rgba(155,89,182,0.12); border-color: rgba(155,89,182,0.3); color: #9b59b6; }
    .source-badge.merged     { background: rgba(232,82,42,0.12);  border-color: rgba(232,82,42,0.3);  color: var(--accent); }

    /* ---- GENRE CHIPS SCROLL --------------------------------- */
    .genre-chips-wrap { position: relative; }

    .genre-chips {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .genre-chips::-webkit-scrollbar { display: none; }

    .genre-chip {
      flex-shrink: 0;
      padding: 5px 13px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-muted);
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
    }
    .genre-chip:hover { border-color: var(--accent); color: var(--accent); }
    .genre-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(232,82,42,0.35);
    }
    .genre-chip:active { transform: scale(0.94); }

    .genre-chips-wrap::after {
      content: "";
      position: absolute;
      right: 0; top: 0; bottom: 4px;
      width: 36px;
      background: linear-gradient(to right, transparent, var(--bg));
      pointer-events: none;
    }

    /* ---- TOOLBAR -------------------------------------------- */
    .genre-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .sort-select {
      padding: 6px 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
      min-width: 130px;
    }
    .sort-select:focus { border-color: var(--accent); }

    /* Source selector */
    .source-select {
      padding: 6px 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .source-select:focus { border-color: var(--accent); }

    .type-filter-btns {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex-wrap: nowrap;
    }
    .type-filter-btns::-webkit-scrollbar { display: none; }

    .type-btn {
      padding: 5px 9px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-muted);
      font-family: 'Nunito', sans-serif;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .type-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .type-btn:hover:not(.active) {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ---- KOMIK GRID ----------------------------------------- */
    .genre-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 12px 12px;
    }

    .genre-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .genre-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(232,82,42,0.2);
      border-color: rgba(232,82,42,0.25);
    }
    .genre-card:active { transform: scale(0.97); }

    .genre-card-info {
      padding: 6px 7px 8px;
    }

    .genre-card-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
      margin-bottom: 3px;
    }

    .genre-card-chapter {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Overlay badges */
    .genre-card-type {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 8px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      backdrop-filter: blur(4px);
    }

    /* Rating badge — pojok kanan bawah */
    .genre-card-rating-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: rgba(0,0,0,0.72);
      color: #f5a623;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
      backdrop-filter: blur(4px);
    }

    /* Source badge pada kartu — dot kecil di pojok kiri bawah, di atas rating */
    .genre-card-src {
      position: absolute;
      top: 5px;
      left: 5px;
      font-size: 7px;
      font-weight: 900;
      padding: 2px 5px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .genre-card-src.ks { background: rgba(155,89,182,0.88); color: #fff; }
    .genre-card-src.bk { background: rgba(39,174,96,0.88);  color: #fff; }
    .genre-card-src.mk { background: rgba(52,152,219,0.88); color: #fff; }

    /* ---- IMAGE WRAP ----------------------------------------- */
    .genre-card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      background: var(--bg-surface);
      overflow: hidden;
    }
    .genre-card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }
    .genre-card:hover .genre-card-img-wrap img {
      transform: scale(1.04);
    }
    .genre-card-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-card) 100%);
    }

    /* ---- SKELETON ------------------------------------------- */
    .genre-card.skeleton .genre-card-img-wrap {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-surface) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    .genre-card.skeleton .genre-card-title,
    .genre-card.skeleton .genre-card-chapter {
      background: linear-gradient(90deg, var(--bg-surface) 25%, var(--border) 50%, var(--bg-surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px;
      color: transparent;
      height: 11px;
      margin-bottom: 4px;
    }

    /* ---- PAGINATION ----------------------------------------- */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 14px 20px;
    }

    .page-btn {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .page-info {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 700;
      min-width: 70px;
      text-align: center;
    }

    /* ---- LOADING STATE -------------------------------------- */
    .genre-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 12px;
      color: var(--text-muted);
    }
    .genre-loading .spin {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- EMPTY STATE ---------------------------------------- */
    .genre-empty {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .genre-empty .empty-icon { font-size: 40px; margin-bottom: 10px; }
    .genre-empty .empty-text { font-size: 13px; margin-bottom: 14px; }
    .genre-empty .retry-btn {
      padding: 8px 18px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 8px;
      font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800;
      cursor: pointer; transition: background 0.2s;
    }
    .genre-empty .retry-btn:hover { background: #c73f1c; }

    /* ---- GENRE BROWSE CARDS --------------------------------- */
    .genre-browse-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 12px 12px;
    }

    .genre-browse-card {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px; padding: 16px 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer; min-height: 88px; text-align: center;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .genre-browse-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(232,82,42,0.18);
      border-color: rgba(232,82,42,0.3);
    }
    .genre-browse-card:active { transform: scale(0.95); }
    .genre-browse-emoji { font-size: 26px; line-height: 1; display: block; }
    .genre-browse-name {
      font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 700;
      color: var(--text); line-height: 1.3;
      overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }

    /* ---- RESULT META BAR ------------------------------------ */
    .result-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
      gap: 8px;
      flex-wrap: wrap;
    }

    .result-meta-left { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    /* ---- INFINITE SCROLL SENTINEL --------------------------- */
    #infiniteSentinel {
      height: 20px;
      margin: 0 auto;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .genre-card { animation: fadeInUp 0.28s ease both; }
  </style>
</head>

<script>
/* ============================================================
   CONSTANTS & CONFIG
   ============================================================ */
const API_GENRES_MK  = "https://www.sankavollerei.com/comic/mangakita/genres";
const API_GENRE_MK   = "https://www.sankavollerei.com/comic/mangakita/genres/";   /* + slug/page */
const API_GENRE_BK   = "https://www.sankavollerei.com/comic/bacakomik/genre/";    /* + slug/page */
const API_GENRE_KS   = "https://www.sankavollerei.com/comic/komikstation/genre/"; /* + slug/page */

/* ---- STATE ----------------------------------------------- */
let allGenres    = [];
let currentGenre = null;   /* null = browse mode */
let currentPage  = 1;
let hasNextPage  = false;
let typeFilter   = "";
let sortMode     = "";
let sourceFilter = "all";  /* "all" | "komikstation" | "bacakomik" | "mangakita" */
let allFetched   = [];     /* semua hasil fetch (sudah merged) */
let isLoading    = false;
let ioSentinel   = null;   /* IntersectionObserver untuk infinite scroll */

/* ============================================================
   IMAGE PROXY
   ============================================================ */
function proxyImg(url, w) {
  w = w || 240;
  if (!url || url === "undefined" || url === "null") return "";
  if (url.startsWith("data:image/svg")) return "";
  if (url.startsWith("data:") || url.includes("wsrv.nl")) return url;
  try {
    var host = new URL(url.startsWith("http") ? url : "https://" + url).hostname;
    if (/^i[0-3]\.wp\.com$/.test(host)) return url.split("?")[0];
  } catch(e) {}
  var clean = url.split("?")[0];
  var ref = "";
  try {
    var h = new URL(clean.startsWith("http") ? clean : "https://" + clean).hostname;
    if (h.includes("bacakomik"))    ref = "https://bacakomik.my";
    else if (h.includes("komikindo")) ref = "https://komikindo.org";
    else if (h.includes("komikstation")) ref = "https://komikstation.org";
    else if (h.includes("mangakita"))  ref = "https://mangakita.me";
    else ref = "https://" + h;
  } catch(e) {}
  var q = "https://wsrv.nl/?url=" + encodeURIComponent(clean) + "&w=" + w + "&output=webp&q=85&n=-1";
  if (ref) q += "&ref=" + encodeURIComponent(ref);
  return q;
}

function escHtml(str) {
  return String(str || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

/* ============================================================
   INIT
   ============================================================ */
window.addEventListener("DOMContentLoaded", async () => {
  if (localStorage.getItem("theme") === "light") document.body.classList.add("light");

  const params       = new URLSearchParams(window.location.search);
  const genreFromUrl = params.get("genre");

  await loadGenreList();

  if (genreFromUrl) {
    const found = allGenres.find(g => g.slug === genreFromUrl);
    selectGenre(
      genreFromUrl,
      found?.title || (genreFromUrl.charAt(0).toUpperCase() + genreFromUrl.slice(1))
    );
  } else {
    showGenreBrowse();
  }

  /* Back to top */
  const btn = document.getElementById("backToTop");
  if (btn) {
    window.addEventListener("scroll", () => {
      btn.classList.toggle("visible", window.scrollY > 300);
    }, { passive: true });
  }
});

/* ============================================================
   FETCH GENRE LIST (dari MangaKita, paling lengkap)
   ============================================================ */
async function loadGenreList() {
  try {
    const res  = await fetch(API_GENRES_MK);
    const data = await res.json();
    const raw  = data.genres || [];
    const seen = new Set();
    const TYPOS = new Set(["actio", "traged"]);

    allGenres = raw
      .filter(g => {
        const val  = (g.value || g.slug || "").toLowerCase();
        const name = (g.name  || g.title || "");
        if (!val || !name || name.length < 3) return false;
        if (TYPOS.has(val)) return false;
        if (seen.has(val))  return false;
        seen.add(val);
        return true;
      })
      .map(g => ({ slug: g.value || g.slug, title: g.name || g.title }))
      .sort((a, b) => a.title.localeCompare(b.title, "id"));

    renderGenreChips();
  } catch (err) {
    console.error("Gagal fetch genre list:", err);
    document.getElementById("genreChips").innerHTML =
      `<p style="color:var(--text-muted);font-size:12px;padding:4px;">Gagal memuat genre.</p>`;
  }
}

/* ============================================================
   GENRE CHIPS
   ============================================================ */
function renderGenreChips() {
  const container = document.getElementById("genreChips");
  if (!allGenres.length) { container.innerHTML = ""; return; }
  container.innerHTML = allGenres.map(g => `
    <button
      class="genre-chip ${currentGenre === g.slug ? "active" : ""}"
      id="chip-${g.slug}"
      onclick="selectGenre('${g.slug}','${escHtml(g.title).replace(/'/g,"\\'")}')">
      ${escHtml(g.title)}
    </button>`).join("");
}

/* ============================================================
   SELECT GENRE
   ============================================================ */
function selectGenre(slug, title) {
  currentGenre = slug;
  currentPage  = 1;
  allFetched   = [];
  typeFilter   = "";
  sortMode     = "";
  /* sourceFilter dipertahankan — user mungkin ingin ganti genre
     tapi tetap pada source yang sama */

  /* Reset toolbar */
  document.getElementById("sortSelect").value = "";
  document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
  document.querySelector(".type-btn")?.classList.add("active");
  document.getElementById("genreToolbar").style.display = "flex";
  document.getElementById("resultMeta").style.display   = "flex";

  /* Update chip aktif */
  document.querySelectorAll(".genre-chip").forEach(c => c.classList.remove("active"));
  const chip = document.getElementById("chip-" + slug);
  if (chip) {
    chip.classList.add("active");
    chip.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
  }

  document.getElementById("activeGenreName").textContent = title;
  document.getElementById("activeGenreCount").textContent = "";

  const url = new URL(window.location.href);
  url.searchParams.set("genre", slug);
  history.pushState({}, "", url);

  fetchGenreKomik(slug, 1);
}

/* ============================================================
   FETCH KOMIK BY GENRE — 3 API paralel
   komikstation JSON: { seriesList:[{title,slug,image,latestChapter,rating}], nextPage }
   mangakita JSON:    { mangaList:[{title,slug,image,latestChapter,rating,type}] }
   bacakomik JSON:    { komikList:[{title,slug,cover,latestChapter,rating,type}] }
   ============================================================ */
async function fetchGenreKomik(slug, page) {
  if (isLoading) return;
  isLoading = true;

  const grid       = document.getElementById("genreGrid");
  const pagination = document.getElementById("pagination");

  /* Skeleton hanya di halaman pertama */
  if (page === 1) {
    grid.innerHTML = Array(9).fill(`
      <div class="genre-card skeleton">
        <div class="genre-card-img-wrap"></div>
        <div class="genre-card-info">
          <div class="genre-card-title">⠀⠀⠀⠀⠀⠀⠀</div>
          <div class="genre-card-chapter">⠀⠀⠀</div>
        </div>
      </div>`).join("");
    pagination.style.display = "none";
  }

  try {
    const cleanSlug = slug.toLowerCase().replace(/[^a-z0-9-]/g, "-").replace(/-+/g, "-");

    /* ── Tentukan API mana yang di-fetch sesuai sourceFilter ── */
    const fetchMK = sourceFilter === "all" || sourceFilter === "mangakita";
    const fetchBK = sourceFilter === "all" || sourceFilter === "bacakomik";
    const fetchKS = sourceFilter === "all" || sourceFilter === "komikstation";

    const [r1, r2, r3] = await Promise.allSettled([
      fetchMK ? fetch(`${API_GENRE_MK}${cleanSlug}/${page}`).then(r => r.json()).catch(() => null) : Promise.resolve(null),
      fetchBK ? fetch(`${API_GENRE_BK}${cleanSlug}/${page}`).then(r => r.json()).catch(() => null) : Promise.resolve(null),
      fetchKS ? fetch(`${API_GENRE_KS}${cleanSlug}/${page}`).then(r => r.json()).catch(() => null) : Promise.resolve(null),
    ]);

    const d1 = r1.status === "fulfilled" ? r1.value : null; /* mangakita */
    const d2 = r2.status === "fulfilled" ? r2.value : null; /* bacakomik */
    const d3 = r3.status === "fulfilled" ? r3.value : null; /* komikstation */

    console.log(`[Genre] page=${page} mk=${d1?.mangaList?.length||0} bk=${d2?.komikList?.length||0} ks=${d3?.seriesList?.length||0}`);

    /* ── Normalize masing-masing API ke format internal ── */
    const listMK = (d1?.mangaList || []).map(k => ({
      cover:   k.image || k.banner || k.cover || "",
      title:   k.title   || "Untitled",
      slug:    k.slug    || "",
      type:    k.type    || "",
      rating:  k.rating  || "",
      chapter: k.latestChapter || k.chapter || "",
      _src:    "mangakita",
    }));

    const listBK = (d2?.komikList || []).map(k => ({
      cover:   k.cover || k.image || "",
      title:   k.title   || "Untitled",
      slug:    k.slug    || "",
      type:    k.type    || "",
      rating:  k.rating  || "",
      chapter: k.latestChapter || k.chapter || "",
      _src:    "bacakomik",
    }));

    /* KomikStation: seriesList */
    const listKS = (d3?.seriesList || []).map(k => ({
      cover:   k.image   || k.cover || "",
      title:   k.title   || "Untitled",
      slug:    k.slug    || "",
      type:    k.type    || "",
      rating:  k.rating  || "",
      chapter: k.latestChapter || k.chapter || "",
      _src:    "komikstation",
    })).filter(k => {
      /* Filter SVG placeholder dari komikstation */
      const img = k.cover;
      return !img || !img.startsWith("data:image/svg");
    });

    /* ── Merge: deduplicate by slug ─────────────────────────
       Priority: komikstation (cover biasanya bagus) > mangakita > bacakomik
       Slug dari komikstation dipakai sebagai canonical
    ── */
    const seen = new Set();
    /* KS dulu, lalu MK, lalu BK */
    const merged = [...listKS, ...listMK, ...listBK].filter(k => {
      if (!k.slug || seen.has(k.slug)) return false;
      seen.add(k.slug);
      return true;
    });

    /* Kalau page 1 → replace; kalau page > 1 → append */
    if (page === 1) {
      allFetched = merged;
    } else {
      /* Append, tapi filter slug yang sudah ada */
      const existingSlugs = new Set(allFetched.map(k => k.slug));
      allFetched.push(...merged.filter(k => !existingSlugs.has(k.slug)));
    }

    if (!allFetched.length) throw new Error(`Tidak ada hasil untuk genre "${slug}"`);

    /* ── hasNextPage: true kalau salah satu API masih ada halaman ── */
    const pag1 = d1?.pagination || {};
    const pag2 = d2?.pagination || {};
    hasNextPage =
      !!(pag1.hasNextPage ?? pag1.hasNext) ||
      !!(pag2.hasNextPage ?? pag2.hasNext) ||
      !!(d3?.nextPage);     /* komikstation: { nextPage: "url" | null } */

    currentPage = page;

    /* Update count badge */
    document.getElementById("activeGenreCount").textContent =
      allFetched.length ? `(${allFetched.length}${hasNextPage ? "+" : ""})` : "";

    applyFilterAndSort();
    renderPagination();
    updateResultMeta(d1, d2, d3);
    setupInfiniteScroll();

  } catch (err) {
    console.error("Gagal fetch genre komik:", err);
    if (page === 1) {
      grid.innerHTML = `
        <div class="genre-empty">
          <div class="empty-icon">😕</div>
          <div class="empty-text">Gagal memuat komik genre ini.<br>Coba genre lain atau cek koneksi.</div>
          <button class="retry-btn" onclick="fetchGenreKomik('${escHtml(currentGenre)}', 1)">🔄 Coba Lagi</button>
        </div>`;
    }
    pagination.style.display = "none";
  } finally {
    isLoading = false;
  }
}

/* ── Update meta bar ── */
function updateResultMeta(d1, d2, d3) {
  const badges = document.getElementById("resultSrcBadges");
  const count  = document.getElementById("resultCount");
  const page   = document.getElementById("resultPage");

  const parts = [];
  if (d1?.mangaList?.length)  parts.push(`<span class="source-badge mangakita">💙 Gamma &nbsp;${d1.mangaList.length}</span>`);
  if (d2?.komikList?.length)  parts.push(`<span class="source-badge bacakomik">💚 Beta &nbsp;${d2.komikList.length}</span>`);
  if (d3?.seriesList?.length) parts.push(`<span class="source-badge komikstation">💜 Alpha &nbsp;${d3.seriesList.length}</span>`);

  badges.innerHTML = parts.join(" ");
  count.textContent = `${allFetched.length} komik`;
  page.textContent  = `Hal. ${currentPage}`;
}

/* ============================================================
   FILTER & SORT (lokal)
   ============================================================ */
function applyFilterAndSort() {
  let list = [...allFetched];

  /* Filter by type */
  if (typeFilter) {
    list = list.filter(k => (k.type || "").toLowerCase() === typeFilter);
  }

  /* Filter by source */
  if (sourceFilter !== "all") {
    list = list.filter(k => k._src === sourceFilter);
    /* Kalau filter source dan hasilnya kosong → tampilkan semua + toast */
    if (!list.length) {
      list = [...allFetched];
      showToast(`Tidak ada hasil dari ${sourceFilter} untuk filter ini`, "info");
    }
  }

  /* Sort */
  if (sortMode === "rating") {
    list.sort((a, b) => (parseFloat(b.rating) || 0) - (parseFloat(a.rating) || 0));
  } else if (sortMode === "az") {
    list.sort((a, b) => (a.title || "").localeCompare(b.title || "", "id"));
  }

  renderGenreGrid(list);
}

function onSortChange() {
  sortMode = document.getElementById("sortSelect").value;
  applyFilterAndSort();
}

function onSourceChange() {
  sourceFilter = document.getElementById("sourceSelect").value;
  /* Reset ke halaman 1 & re-fetch kalau perlu */
  currentPage = 1;
  allFetched  = [];
  fetchGenreKomik(currentGenre, 1);
}

function setTypeFilter(type, btn) {
  typeFilter = type;
  document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  applyFilterAndSort();
}

/* ============================================================
   RENDER GRID
   ============================================================ */
function renderGenreGrid(list) {
  const grid = document.getElementById("genreGrid");

  if (!list.length) {
    grid.innerHTML = `
      <div class="genre-empty">
        <div class="empty-icon">📭</div>
        <div class="empty-text">Tidak ada komik dengan filter ini.</div>
      </div>`;
    return;
  }

  grid.innerHTML = list.map((k, i) => {
    const cover      = proxyImg(k.cover, 240);
    const type       = (k.type || "").toLowerCase();
    const href       = k.slug ? `/komik/${k.slug}` : "#";
    const rating     = parseFloat(k.rating);
    const ratingStr  = !isNaN(rating) ? rating.toFixed(1) : "";
    const srcLabel   = { komikstation: "α", bacakomik: "β", mangakita: "γ" }[k._src] || "";
    const srcClass   = { komikstation: "ks", bacakomik: "bk", mangakita: "mk" }[k._src] || "";

    const imgHtml = cover
      ? `<img src="${cover}" alt="${escHtml(k.title)}" loading="${i < 6 ? "eager" : "lazy"}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : "";
    const placeholder = `<div class="genre-card-placeholder" style="${cover ? "display:none" : ""}">📚</div>`;

    return `
      <div class="genre-card" onclick="gotoKomik('${escHtml(k.slug)}','${escHtml(k._src || "")}')"
           style="animation-delay:${Math.min(i, 8) * 35}ms">
        <div class="genre-card-img-wrap">
          ${imgHtml}${placeholder}
          ${srcLabel ? `<span class="genre-card-src ${srcClass}">${srcLabel}</span>` : ""}
          ${k.type ? `<span class="genre-card-type badge ${type}">${escHtml(k.type)}</span>` : ""}
          ${ratingStr ? `<span class="genre-card-rating-badge">⭐ ${ratingStr}</span>` : ""}
        </div>
        <div class="genre-card-info">
          <div class="genre-card-title">${escHtml(k.title)}</div>
          ${k.chapter ? `<div class="genre-card-chapter">📖 ${escHtml(k.chapter)}</div>` : ""}
        </div>
      </div>`;
  }).join("");
}

/* Klik kartu → simpan source hint dulu baru navigasi */
function gotoKomik(slug, src) {
  if (!slug) return;
  if (src) {
    sessionStorage.setItem("komikSrcHint", src);
    sessionStorage.setItem("komikSrcSlug", slug);
  }
  window.location.href = "/komik/" + slug;
}

/* ============================================================
   PAGINATION
   ============================================================ */
function renderPagination() {
  const wrap    = document.getElementById("pagination");
  const prevBtn = document.getElementById("prevPageBtn");
  const nextBtn = document.getElementById("nextPageBtn");
  const info    = document.getElementById("pageInfo");

  const show = currentPage > 1 || hasNextPage;
  wrap.style.display = show ? "flex" : "none";
  prevBtn.disabled   = currentPage <= 1;
  nextBtn.disabled   = !hasNextPage;
  info.textContent   = `Hal ${currentPage}`;
}

function changePage(dir) {
  if (dir > 0 && !hasNextPage) return;
  if (dir < 0 && currentPage <= 1) return;
  const newPage = currentPage + dir;
  window.scrollTo({ top: 0, behavior: "smooth" });
  fetchGenreKomik(currentGenre, newPage);
}

/* ============================================================
   INFINITE SCROLL (untuk page berikutnya)
   ============================================================ */
function setupInfiniteScroll() {
  ioSentinel?.disconnect();
  if (!hasNextPage) return;

  const sentinel = document.getElementById("infiniteSentinel");
  if (!sentinel) return;

  ioSentinel = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && hasNextPage && !isLoading) {
      fetchGenreKomik(currentGenre, currentPage + 1);
    }
  }, { rootMargin: "300px" });

  ioSentinel.observe(sentinel);
}

/* ============================================================
   GENRE BROWSE (tidak ada param genre di URL)
   ============================================================ */
function showGenreBrowse() {
  document.getElementById("activeGenreName").textContent = "Semua Genre";
  document.getElementById("activeGenreCount").textContent = `(${allGenres.length})`;
  document.getElementById("genreToolbar").style.display = "none";
  document.getElementById("resultMeta").style.display   = "none";
  document.getElementById("pagination").style.display   = "none";

  const wrap = document.getElementById("genreGridWrap");
  const grid = document.getElementById("genreGrid");

  if (!allGenres.length) {
    grid.innerHTML = `<div class="genre-empty"><div class="empty-icon">😕</div><div class="empty-text">Gagal memuat genre.</div></div>`;
    return;
  }

  /* Ganti class grid ke browse grid */
  grid.className = "genre-browse-grid";

  const emojiMap = {
    action:"⚔️", adventure:"🗺️", comedy:"😄", drama:"🎭", fantasy:"🧙",
    horror:"👻", romance:"💕", "sci-fi":"🚀", mystery:"🔍", sports:"⚽",
    thriller:"😱", school:"🏫", supernatural:"✨", magic:"🪄", slice:"🍞",
    martial:"🥋", historical:"📜", psychological:"🧠", isekai:"🌀",
    mecha:"🤖", military:"🪖", music:"🎵", cooking:"🍳", ecchi:"🌸",
    josei:"👩", seinen:"👨", shoujo:"🌹", shounen:"💥", yaoi:"💙", yuri:"💜",
    "harem":"👥", "demons":"😈", "game":"🎮", "system":"⚙️", "cultivation":"🌱"
  };
  const getEmoji = slug => {
    const key = Object.keys(emojiMap).find(k => slug.toLowerCase().includes(k));
    return emojiMap[key] || "📚";
  };

  grid.innerHTML = allGenres.map((g, i) => `
    <div class="genre-browse-card"
         onclick="selectGenre('${g.slug}','${escHtml(g.title).replace(/'/g,"\\'")}' )"
         style="animation:fadeInUp 0.25s ease ${Math.min(i,11)*30}ms both">
      <span class="genre-browse-emoji">${getEmoji(g.slug)}</span>
      <span class="genre-browse-name">${escHtml(g.title)}</span>
    </div>`).join("");
}

/* ============================================================
   LIVE SEARCH
   ============================================================ */
let searchTimeout = null;
function liveSearch() {
  const query     = document.getElementById("searchInput").value.trim();
  const resultBox = document.getElementById("searchResult");
  if (!query) { resultBox.style.display = "none"; return; }
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(async () => {
    try {
      const res  = await fetch(`https://www.sankavollerei.com/comic/bacakomik/search/${encodeURIComponent(query)}`);
      const data = await res.json();
      const list = data.komikList || [];
      resultBox.innerHTML = "";
      if (!list.length) { resultBox.style.display = "none"; return; }
      list.slice(0, 6).forEach(k => {
        const item = document.createElement("div");
        item.className = "search-item";
        const cover = proxyImg(k.cover || k.image, 80);
        item.innerHTML = `
          ${cover ? `<img src="${cover}" loading="lazy">` : `<div style="width:44px;height:60px;background:var(--bg-surface);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;">📚</div>`}
          <div><p>${escHtml(k.title)}</p><p>⭐ ${k.rating || "–"}</p></div>`;
        item.onclick = () => { window.location.href = "/komik/" + k.slug; };
        resultBox.appendChild(item);
      });
      resultBox.style.display = "block";
    } catch(e) { console.error(e); }
  }, 380);
}

document.addEventListener("click", e => {
  const s = document.getElementById("searchInput");
  const r = document.getElementById("searchResult");
  if (r && s && !s.contains(e.target) && !r.contains(e.target)) r.style.display = "none";
});

/* ============================================================
   TOAST
   ============================================================ */
function showToast(msg, type) {
  let c = document.getElementById("toastContainer");
  if (!c) { c = document.createElement("div"); c.id = "toastContainer"; c.className = "toast-container"; document.body.appendChild(c); }
  const t = document.createElement("div");
  t.className = "toast " + (type || "info");
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

   UTILS

function toggleDarkMode() {
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
}
