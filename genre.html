<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genre — Pankomik</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ============================================================
       GENRE PAGE — Layout & komponen khusus
       ============================================================ */

    /* ---- GENRE HERO ----------------------------------------- */
    .genre-hero {
      padding: 18px 14px 10px;
      border-bottom: 1px solid var(--border);
    }

    .genre-hero-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .genre-back-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }

    .genre-back-btn:hover { border-color: var(--accent); color: var(--accent); }

    .genre-active-name {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      letter-spacing: 1.5px;
      color: var(--accent);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .genre-count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ---- GENRE CHIPS SCROLL --------------------------------- */
    .genre-chips-wrap {
      position: relative;
    }

    .genre-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scroll-behavior: smooth;
      /* sembunyikan scrollbar tapi tetap bisa scroll */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .genre-chips::-webkit-scrollbar { display: none; }

    .genre-chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-muted);
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
    }

    .genre-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .genre-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(232,82,42,0.35);
    }

    .genre-chip:active { transform: scale(0.94); }

    /* Fade edge kanan biar keliatan ada lagi */
    .genre-chips-wrap::after {
      content: "";
      position: absolute;
      right: 0; top: 0; bottom: 6px;
      width: 40px;
      background: linear-gradient(to right, transparent, var(--bg));
      pointer-events: none;
    }

    /* ---- SORT & FILTER BAR ---------------------------------- */
    .genre-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .sort-select {
      flex: 1;
      padding: 7px 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .sort-select:focus { border-color: var(--accent); }

    .type-filter-btns {
      display: flex;
      gap: 5px;
    }

    .type-btn {
      padding: 6px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-muted);
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .type-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .type-btn:hover:not(.active) {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ---- KOMIK GRID ----------------------------------------- */
    .genre-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 12px 14px;
    }

    .genre-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .genre-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(232,82,42,0.2);
    }

    .genre-card-info {
      padding: 6px 7px 8px;
    }

    .genre-card-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
      margin-bottom: 3px;
    }

    .genre-card-rating {
      font-size: 10px;
      color: var(--accent2);
      font-weight: 700;
    }

    .genre-card-type {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 8px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* ---- CHAPTER & RATING INLINE --------------------------- */
    .genre-card-chapter {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- IMAGE WRAP & PLACEHOLDER -------------------------- */
    .genre-card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      background: var(--bg-surface);
      overflow: hidden;
    }

    .genre-card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .genre-card-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-card) 100%);
    }

    /* Rating badge overlay bawah-kiri */
    .genre-card-rating-badge {
      position: absolute;
      bottom: 5px;
      left: 5px;
      background: rgba(0,0,0,0.72);
      color: var(--accent2);
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    /* ---- PAGINATION ----------------------------------------- */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 14px 24px;
    }

    .page-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .page-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .page-info {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }

    /* ---- LOADING STATE ------------------------------------- */
    .genre-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 12px;
      color: var(--text-muted);
    }

    .genre-loading .spin {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- EMPTY STATE --------------------------------------- */
    .genre-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .genre-empty p:first-child { font-size: 40px; margin-bottom: 10px; }
    .genre-empty p:last-child  { font-size: 13px; }

    /* ---- SKELETON ------------------------------------------ */
    .genre-card.skeleton img {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-surface) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      aspect-ratio: 2/3;
      width: 100%;
    }

    .genre-card.skeleton .genre-card-title,
    .genre-card.skeleton .genre-card-rating {
      background: linear-gradient(90deg, var(--bg-surface) 25%, var(--border) 50%, var(--bg-surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px;
      color: transparent;
    }
  </style>
</head>

<script>

function proxyImg(url) {
  if (!url || url === "undefined" || url === "null") return "";
  if (url.startsWith("data:image/svg") && url.includes("viewBox")) return "";
  if (url.startsWith("data:") || url.includes("wsrv.nl")) return url;
  /* Strip query string untuk i0.wp.com agar tidak duplikat params */
  var clean = url.split("?")[0];
  /* Referer map - i0.wp.com perlu referer maid.my.id */
  var ref = "";
  try {
    var host = new URL(clean.startsWith("http") ? clean : "https://" + clean).hostname;
    var refMap = {
      "mangakita.me":  "https://mangakita.me",
      "maid.my.id":    "https://www.maid.my.id",
      "i0.wp.com":     "https://mangakita.me",
      "i1.wp.com":     "https://mangakita.me",
      "i2.wp.com":     "https://mangakita.me",
      "i3.wp.com":     "https://mangakita.me",
      "komikindo":     "https://komikindo.org",
      "komikcast":     "https://komikcast.me",
      "komiku":        "https://komiku.id",
    };
    for (var k in refMap) {
      if (host === k || host.indexOf(k) !== -1) { ref = refMap[k]; break; }
    }
    if (!ref) ref = "https://" + host;
  } catch(e) {}
  var q = "https://wsrv.nl/?url=" + encodeURIComponent(clean) + "&w=300&output=webp&q=85&n=-1";
  if (ref) q += "&ref=" + encodeURIComponent(ref);
  return q;
}

/* ============================================================
   GENRE PAGE — genre.js (inline)
   ============================================================ */

const GENRES_API = "https://www.sankavollerei.com/comic/mangakita/genres";
const GENRE_API  = "https://www.sankavollerei.com/comic/mangakita/genres/";

/* ---- STATE ---------------------------------------------- */
let allGenres     = [];
let currentGenre  = null; /* null = tampilkan daftar genre */
let currentPage   = 1;
let hasNextPage   = false;
let typeFilter    = "";
let sortMode      = "";
let allFetched    = []; /* simpan semua hasil untuk filter/sort lokal */

/* ============================================================
   INIT
   ============================================================ */
window.addEventListener("DOMContentLoaded", async () => {
  if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light");
  }

  /* Cek apakah ada genre dari URL param ?genre=action */
  const params = new URLSearchParams(window.location.search);
  const genreFromUrl = params.get("genre");

  await loadGenreList();

  if (genreFromUrl) {
    /* Aktifkan genre dari URL */
    const found = allGenres.find(g => g.slug === genreFromUrl);
    if (found) {
      selectGenre(found.slug, found.title);
    } else {
      /* Fallback: langsung fetch meski tidak ada di list */
      selectGenre(genreFromUrl, genreFromUrl.charAt(0).toUpperCase() + genreFromUrl.slice(1));
    }
  } else {
    /* Tidak ada param → tampilkan daftar genre sebagai grid besar */
    showGenreBrowse();
  }

  /* Back to top */
  const btn = document.getElementById("backToTop");
  if (btn) {
    window.addEventListener("scroll", () => {
      btn.classList.toggle("visible", window.scrollY > 300);
    });
  }
});

/* ============================================================
   FETCH LIST GENRE
   ============================================================ */
async function loadGenreList() {
  const FALLBACK = [
    {slug:"action",title:"Action"},{slug:"adventure",title:"Adventure"},
    {slug:"comedy",title:"Comedy"},{slug:"drama",title:"Drama"},
    {slug:"fantasy",title:"Fantasy"},{slug:"horror",title:"Horror"},
    {slug:"romance",title:"Romance"},{slug:"school-life",title:"School Life"},
    {slug:"sci-fi",title:"Sci-Fi"},{slug:"seinen",title:"Seinen"},
    {slug:"shounen",title:"Shounen"},{slug:"slice-of-life",title:"Slice of Life"},
    {slug:"supernatural",title:"Supernatural"},{slug:"thriller",title:"Thriller"},
    {slug:"isekai",title:"Isekai"},{slug:"martial-arts",title:"Martial Arts"},
    {slug:"harem",title:"Harem"},{slug:"ecchi",title:"Ecchi"},
    {slug:"adult",title:"Adult"},{slug:"mystery",title:"Mystery"},
    {slug:"psychological",title:"Psychological"},{slug:"sports",title:"Sports"},
    {slug:"historical",title:"Historical"},{slug:"mecha",title:"Mecha"},
    {slug:"josei",title:"Josei"},{slug:"shoujo",title:"Shoujo"},
  ];

  try {
    const res  = await fetch(GENRES_API);
    const data = await res.json();
    console.log("[Genre] GENRES_API response keys:", Object.keys(data), "success:", data.success);
    const raw  = data.genres || data.data || data.genreList || data.mangaList || [];
    console.log("[Genre] Raw genres count:", raw.length, "sample:", raw[0]);
    const seen = new Set();
    const parsed = raw
      .map(g => ({
        slug:  (g.value || g.slug  || g.id    || "").toLowerCase().trim(),
        title: (g.name  || g.title || g.label || "").trim(),
      }))
      .filter(g => g.slug && g.title.length >= 2 && !seen.has(g.slug) && seen.add(g.slug));

    allGenres = (parsed.length >= 5 ? parsed : FALLBACK)
      .sort((a, b) => a.title.localeCompare(b.title, "id"));
  } catch (err) {
    console.warn("[Genre] Gagal fetch genre list, pakai fallback:", err.message);
    allGenres = FALLBACK;
  }

  renderGenreChips();
}


/* ============================================================
   RENDER GENRE CHIPS (horizontal scroll pills)
   ============================================================ */
function renderGenreChips() {
  const container = document.getElementById("genreChips");
  if (!allGenres.length) { container.innerHTML = ""; return; }

  /* allGenres sudah bersih dan deduplicated dari loadGenreList */
  container.innerHTML = allGenres.map(g => `
    <button
      class="genre-chip ${currentGenre === g.slug ? "active" : ""}"
      id="chip-${g.slug}"
      onclick="selectGenre('${g.slug}', '${g.title.replace(/'/g,"\\'")}')">
      ${g.title}
    </button>
  `).join("");
}

/* ============================================================
   SELECT GENRE → fetch komik
   ============================================================ */
function selectGenre(slug, title) {
  currentGenre = slug;
  currentPage  = 1;
  allFetched   = [];
  typeFilter   = "";
  sortMode     = "";

  /* Reset toolbar */
  document.getElementById("sortSelect").value = "";
  document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
  document.querySelector(".type-btn")?.classList.add("active"); /* "Semua" */

  /* Update chip aktif */
  document.querySelectorAll(".genre-chip").forEach(c => c.classList.remove("active"));
  const activeChip = document.getElementById(`chip-${slug}`);
  if (activeChip) {
    activeChip.classList.add("active");
    activeChip.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
  }

  /* Update judul */
  document.getElementById("activeGenreName").textContent = title;
  document.getElementById("activeGenreCount").textContent = "";

  /* Update URL tanpa reload */
  const url = new URL(window.location.href);
  url.searchParams.set("genre", slug);
  history.pushState({}, "", url);

  /* Fetch */
  fetchGenreKomik(slug, 1);
}

/* ============================================================
   FETCH KOMIK BY GENRE
   ============================================================ */
async function fetchGenreKomik(slug, page) {
  const grid = document.getElementById("genreGrid");
  const pagination = document.getElementById("pagination");

  /* Skeleton */
  grid.innerHTML = Array(9).fill(`
    <div class="genre-card skeleton">
      <img alt="" style="aspect-ratio:2/3;width:100%;display:block;">
      <div class="genre-card-info">
        <div class="genre-card-title">⠀⠀⠀⠀⠀⠀⠀</div>
        <div class="genre-card-rating">⠀⠀⠀</div>
      </div>
    </div>`).join("");
  pagination.style.display = "none";

  try {
    /* Endpoint: /comic/mangakita/genres/:genre/page:N */
    /* Slug mangakita: lowercase + dash, tanpa encode spesial */
    const cleanSlug = slug.toLowerCase().replace(/[^a-z0-9-]/g, "-").replace(/-+/g,"-");
    const url  = `${GENRE_API}${cleanSlug}/page${page}`;
    console.log("[Genre] Fetching:", url);
    const res  = await fetch(url);
    console.log("[Genre] Status:", res.status);
    const data = await res.json();
    console.log("[Genre] Keys:", Object.keys(data), "mangaList:", data.mangaList?.length, "success:", data.success);

    /* API mangakita: mangaList[] dengan image, slug, rating, latestChapter, link */
    const raw  = data.mangaList || data.data || [];
    allFetched = raw.map(k => {
      const rawImg = k.image || k.banner || k.cover || k.thumbnail || "";
      return {
        ...k,
        cover:   rawImg,
        title:   k.title   || k.name  || "Untitled",
        slug:    k.slug    || k.id    || "",
        type:    k.type    || "",
        rating:  k.rating  || "–",
        chapter: k.latestChapter || k.chapter || "",
      };
    });

    /* Pagination dari data.pagination */
    const pag   = data.pagination || {};
    hasNextPage = !!(pag.hasNextPage ?? pag.hasNext);
    currentPage = pag.currentPage || page;

    /* Kalau success=false tapi ada data, tetap render */
    if (!data.success && !raw.length) {
      const msg = data.message || data.error || "";
      throw new Error(`API error: ${msg || "Genre tidak ditemukan"}`);
    }

    document.getElementById("activeGenreCount").textContent = allFetched.length ? `(${allFetched.length}+)` : "";

    applyFilterAndSort();
    renderPagination();

  } catch (err) {
    console.error("[Genre] Gagal fetch:", err);
    grid.innerHTML = `
      <div style="grid-column:1/-1" class="genre-empty">
        <p>😕</p>
        <p>Genre <strong>${slug}</strong> tidak tersedia.</p>
        <p style="font-size:11px;color:var(--text-muted);margin-top:4px;">${err.message}</p>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
          <button onclick="selectGenre('adult','Adult')"
            style="padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;">
            Adult
          </button>
          <button onclick="selectGenre('adventure','Adventure')"
            style="padding:6px 14px;background:var(--bg-surface);color:var(--text);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;">
            Adventure
          </button>
          <button onclick="fetchGenreKomik('${slug}',${page})"
            style="padding:6px 14px;background:var(--bg-surface);color:var(--text);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;">
            🔄 Coba Lagi
          </button>
        </div>
      </div>`;
    pagination.style.display = "none";
  }
}

/* ============================================================
   FILTER & SORT (dilakukan lokal dari data yang sudah di-fetch)
   ============================================================ */
function applyFilterAndSort() {
  let list = [...allFetched];

  /* Filter by type */
  if (typeFilter) {
    list = list.filter(k => k.type?.toLowerCase() === typeFilter);
  }

  /* Sort */
  if (sortMode === "rating") {
    list.sort((a, b) => parseFloat(b.rating) - parseFloat(a.rating));
  } else if (sortMode === "az") {
    list.sort((a, b) => a.title.localeCompare(b.title, "id"));
  }

  renderGenreGrid(list);
}

function onSortChange() {
  sortMode = document.getElementById("sortSelect").value;
  applyFilterAndSort();
}

function setTypeFilter(type, btn) {
  typeFilter = type;
  document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  applyFilterAndSort();
}

/* ── Generated color cover untuk komik tanpa gambar ─────── */
function genreColorCover(title, h) {
  var COLORS = [
    ["#e8522a","#fad7a0"],["#8e44ad","#d7bde2"],["#2980b9","#aed6f1"],
    ["#27ae60","#a9dfbf"],["#c0392b","#f1948a"],["#16a085","#a2d9ce"],
    ["#2c3e50","#85929e"],["#d4ac0d","#fef9e7"],["#1a5276","#aed6f1"],
    ["#784212","#f0b27a"],["#922b21","#f5b7b1"],["#0e6655","#a2d9ce"],
  ];
  var hash = 0;
  for (var i = 0; i < (title||"").length; i++) hash = ((hash<<5)-hash)+title.charCodeAt(i);
  var c     = COLORS[Math.abs(hash) % COLORS.length];
  var words = (title||"?").trim().split(/\s+/);
  var init  = words.slice(0,2).map(function(w){return (w[0]||"").toUpperCase();}).join("");
  var short = words.slice(0,3).join(" ");
  if (short.length > 16) short = short.slice(0,14)+"…";
  var d = document.createElement("div");
  d.style.cssText =
    "width:100%;height:"+(h||160)+"px;" +
    "background:linear-gradient(145deg,"+c[0]+"dd,"+c[0]+");" +
    "display:flex;flex-direction:column;align-items:center;justify-content:center;" +
    "gap:5px;overflow:hidden;flex-shrink:0;";
  d.innerHTML =
    "<span style='font-size:26px;line-height:1'>📚</span>" +
    "<span style='font-size:20px;font-weight:900;color:#fff;letter-spacing:1px;" +
      "text-shadow:0 2px 6px rgba(0,0,0,.5);line-height:1'>"+init+"</span>" +
    "<span style='font-size:9px;color:"+c[1]+";font-weight:700;text-align:center;" +
      "padding:0 5px;line-height:1.3;word-break:break-word;max-width:90%'>" +
      short.replace(/</g,"&lt;")+"</span>";
  return d;
}

/* ============================================================
   RENDER GRID KOMIK
   ============================================================ */
function renderGenreGrid(list) {
  const grid = document.getElementById("genreGrid");

  if (!list.length) {
    grid.innerHTML = `
      <div style="grid-column:1/-1" class="genre-empty">
        <p>📭</p>
        <p>Tidak ada komik dengan filter ini.</p>
      </div>`;
    return;
  }

  grid.className = "genre-grid";
  grid.innerHTML = "";

  list.forEach(k => {
    const origCover = k.cover || "";
    const cover     = origCover ? proxyImg(origCover) : "";
    const type      = (k.type || "").toLowerCase();
    const href      = k.slug ? `/komik/${k.slug}` : (k.link || "#");
    const rating    = parseFloat(k.rating);
    const ratingStr = !isNaN(rating) ? rating.toFixed(1) : "";

    const card = document.createElement("div");
    card.className = "genre-card";
    card.onclick = () => window.location.href = href;

    const imgWrap = document.createElement("div");
    imgWrap.className = "genre-card-img-wrap";

    if (cover) {
      const img = document.createElement("img");
      img.alt     = escHtml(k.title);
      img.loading = "lazy";
      img.style.cssText = "width:100%;height:100%;object-fit:cover;display:block;background:var(--bg-surface);";
      img.src = cover;

      let tried = 0;
      img.onerror = function onErr() {
        tried++;
        img.onerror = null;
        if (tried === 1 && origCover !== cover) {
          /* Fallback: direct URL */
          img.onerror = function() {
            img.onerror = null;
            imgWrap.replaceChild(genreColorCover(k.title, 160), img);
          };
          img.src = origCover;
        } else {
          imgWrap.replaceChild(genreColorCover(k.title, 160), img);
        }
      };
      imgWrap.appendChild(img);
    } else {
      imgWrap.appendChild(genreColorCover(k.title, 160));
    }

    if (k.type) {
      const tb = document.createElement("span");
      tb.className = `genre-card-type badge ${type}`;
      tb.textContent = k.type;
      imgWrap.appendChild(tb);
    }
    if (ratingStr) {
      const rb = document.createElement("span");
      rb.className = "genre-card-rating-badge";
      rb.textContent = "⭐ " + ratingStr;
      imgWrap.appendChild(rb);
    }

    card.appendChild(imgWrap);

    const info = document.createElement("div");
    info.className = "genre-card-info";
    info.innerHTML =
      `<div class="genre-card-title">${escHtml(k.title)}</div>` +
      (k.chapter ? `<div class="genre-card-chapter">📖 ${escHtml(k.chapter)}</div>` : "");
    card.appendChild(info);
    grid.appendChild(card);
  });
}

/* ============================================================
   PAGINATION
   ============================================================ */
function renderPagination() {
  const wrap    = document.getElementById("pagination");
  const prevBtn = document.getElementById("prevPageBtn");
  const nextBtn = document.getElementById("nextPageBtn");
  const info    = document.getElementById("pageInfo");

  wrap.style.display = (currentPage > 1 || hasNextPage) ? "flex" : "none";
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = !hasNextPage;
  info.textContent = `Hal ${currentPage}`;
}

function changePage(dir) {
  const newPage = currentPage + dir;
  if (newPage < 1) return;
  if (!hasNextPage && dir > 0) return;

  currentPage = newPage;
  window.scrollTo({ top: 0, behavior: "smooth" });
  fetchGenreKomik(currentGenre, currentPage);
}

/* ============================================================
   MODE: BROWSE SEMUA GENRE (tampilkan grid genre besar)
   jika tidak ada param di URL
   ============================================================ */
function showGenreBrowse() {
  document.getElementById("activeGenreName").textContent = "Semua Genre";
  document.getElementById("activeGenreCount").textContent = `(${allGenres.length})`;

  const grid = document.getElementById("genreGrid");
  const pagination = document.getElementById("pagination");
  pagination.style.display = "none";

  if (!allGenres.length) {
    grid.innerHTML = `<div style="grid-column:1/-1" class="genre-empty"><p>😕</p><p>Gagal memuat genre.</p></div>`;
    return;
  }

  /* allGenres sudah bersih dari loadGenreList */
  const cleaned = allGenres;

  /* Render grid genre dengan emoji acak */
  const emojiMap = {
    action:"⚔️", adventure:"🗺️", comedy:"😄", drama:"🎭", fantasy:"🧙",
    horror:"👻", romance:"💕", "sci-fi":"🚀", mystery:"🔍", sports:"⚽",
    thriller:"😱", school:"🏫", supernatural:"✨", magic:"🪄", slice:"🍞",
    martial:"🥋", historical:"📜", psychological:"🧠", isekai:"🌀",
    mecha:"🤖", military:"🪖", music:"🎵", cooking:"🍳", ecchi:"🌸",
    josei:"👩", seinen:"👨", shoujo:"🌹", shounen:"💥", yaoi:"💙", yuri:"💜"
  };

  const getEmoji = (slug) => {
    const key = Object.keys(emojiMap).find(k => slug.toLowerCase().includes(k));
    return key ? emojiMap[key] : "📚";
  };

  /* Gunakan style genre browse (beda dari grid komik) */
  grid.style.gridTemplateColumns = "repeat(3, 1fr)";
  grid.innerHTML = cleaned.map(g => `
    <div
      class="genre-browse-card"
      onclick="selectGenre('${g.slug}', '${g.title.replace(/'/g,"\\'")}')">
      <span class="genre-browse-emoji">${getEmoji(g.slug)}</span>
      <span class="genre-browse-name">${g.title}</span>
    </div>
  `).join("");
}

/* ============================================================
   SEARCH (shared dengan halaman lain)
   ============================================================ */
let searchTimeout = null;

function liveSearch() {
  const query     = document.getElementById("searchInput").value.trim();
  const resultBox = document.getElementById("searchResult");
  if (!query) { resultBox.style.display = "none"; return; }
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(async () => {
    try {
      const res  = await fetch(`https://www.sankavollerei.com/comic/bacakomik/search/${encodeURIComponent(query)}`);
      const data = await res.json();
      const list = data.komikList;
      resultBox.innerHTML = "";
      if (!list?.length) { resultBox.style.display = "none"; return; }
      list.slice(0, 5).forEach(k => {
        const item = document.createElement("div");
        item.className = "search-item";
        item.innerHTML = `<img src="${proxyImg(k.cover)}" loading="lazy"><div><p>${escHtml(k.title)}</p><p>⭐ ${k.rating}</p></div>`;
        item.onclick = () => window.location.href = '/komik/'+k.slug;
        resultBox.appendChild(item);
      });
      resultBox.style.display = "block";
    } catch(e) { console.error(e); }
  }, 400);
}

document.addEventListener("click", e => {
  const s = document.getElementById("searchInput");
  const r = document.getElementById("searchResult");
  const m = document.getElementById("menuDropdown");
  const t = document.querySelector('button[onclick="toggleMenu()"]');
  if (r && s && !s.contains(e.target) && !r.contains(e.target)) r.style.display = "none";
  if (m && t && !m.contains(e.target) && !t.contains(e.target)) m.style.display = "none";
});

/* ============================================================
   UTILS
   ============================================================ */
function escHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function goHome() { window.location.href = "/"; }

function toggleDarkMode() {
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
}
