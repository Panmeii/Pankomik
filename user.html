<script type="module">
  try {
    const { initAuthHeader } = await import("/auth-header.js");
    await initAuthHeader();
  } catch(e) { console.warn("[user.html] auth-header gagal:", e); }

  /* Tema */
  if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light");
    const btn = document.getElementById("themeBtn");
    if (btn) btn.textContent = "☀️";
  }
  /* Accent */
  const acc = localStorage.getItem("pankomik-accent");
  if (acc && /^#[0-9a-fA-F]{6}$/.test(acc)) {
    const r=parseInt(acc.slice(1,3),16), g=parseInt(acc.slice(3,5),16), b=parseInt(acc.slice(5,7),16);
    document.documentElement.style.setProperty("--accent", acc);
    document.documentElement.style.setProperty("--accent-glow", `rgba(${r},${g},${b},0.28)`);
    document.documentElement.style.setProperty("--accent-soft", `rgba(${r},${g},${b},0.10)`);
    document.documentElement.style.setProperty("--accent-dark", `#${Math.max(0,r-46).toString(16).padStart(2,'0')}${Math.max(0,g-24).toString(16).padStart(2,'0')}${Math.max(0,b-24).toString(16).padStart(2,'0')}`);
  }

  window.toggleDarkMode = () => {
    document.body.classList.toggle("light");
    localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
    const btn = document.getElementById("themeBtn");
    if (btn) btn.textContent = document.body.classList.contains("light") ? "☀️" : "🌙";
  };
  window.toggleMenu = () => {
    const m = document.getElementById("menuDropdown");
    if (m) m.style.display = m.style.display === "block" ? "none" : "block";
  };
</script>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://aaqhknkyrnsapvfywdsn.supabase.co";
const SUPABASE_KEY = "sb_publishable_ND-51tP1NF40HRZ3q05N5w_1ZnlPzlL";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ── Escape HTML ── */
const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");

/* ── Format tanggal ── */
function fmtDate(d) {
  try { return new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}); } catch { return "–"; }
}
function fmtRel(d) {
  try {
    const diff = Date.now() - new Date(d).getTime();
    if (isNaN(diff) || diff < 0) return fmtDate(d);
    const m = Math.floor(diff/60000);
    if (m < 1) return "baru saja";
    if (m < 60) return `${m}m lalu`;
    const h = Math.floor(m/60);
    if (h < 24) return `${h}j lalu`;
    const day = Math.floor(h/24);
    if (day < 7) return `${day}h lalu`;
    return fmtDate(d);
  } catch { return "–"; }
}

/* ── Level ── */
function levelInfo(lv) {
  const n = parseInt(lv)||1;
  if (n>=20) return {title:"Legenda Komik 👑", cls:"gold"};
  if (n>=10) return {title:"Otaku Sejati ⭐",   cls:"purple"};
  if (n>=5)  return {title:"Pembaca Aktif 🔥",  cls:"green"};
  if (n>=2)  return {title:"Pecinta Komik 📚",  cls:"blue"};
  return          {title:"Pemula 🌱",             cls:""};
}

/* ── Lokasi komentar ── */
function resolveLoc(raw) {
  if (!raw) return {icon:"💬", label:"Pankomik", url:"/"};
  if (raw.startsWith("novel-chapter:")) {
    const s = raw.slice(14);
    return {icon:"📖", label:s.replace(/-chapter-[\d-]+$/i,"").replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,22)||"Novel", url:`/baca-novel/${s}`};
  }
  if (raw.startsWith("novel:")) {
    const s = raw.slice(6);
    return {icon:"📖", label:s.replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,22)||"Novel", url:`/novel/${s}`};
  }
  if (raw.startsWith("chapter:")) {
    const s = raw.slice(8);
    const k = s.replace(/-chapter-[\d]+.*$/i,"").trim();
    return {icon:"📚", label:k.replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,22)||"Komik", url:`/baca/${s}`};
  }
  return {icon:"📚", label:raw.replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,22)||"Komik", url:`/komik/${raw}`};
}

/* ════════════════════════
   PARSE USERNAME DARI URL
   Support semua format routing
   ════════════════════════ */
function parseUsername() {
  const pathname = window.location.pathname;   // e.g. /user/RianSamuji
  const search   = window.location.search;     // e.g. ?u=RianSamuji
  const params   = new URLSearchParams(search);

  /* Coba dari path /user/XXX */
  const m = pathname.match(/\/user\/([^/?#\s]+?)(?:\.html)?(?:[/?#]|$)/i);
  if (m && m[1]) {
    const u = decodeURIComponent(m[1]).trim();
    /* Pastikan bukan nama file itu sendiri */
    if (u && u.toLowerCase() !== "user" && !u.endsWith(".html")) return u;
  }

  /* Coba query param */
  for (const key of ["u","username","user","name"]) {
    const v = params.get(key);
    if (v) return decodeURIComponent(v).trim();
  }

  return null;
}

/* ════════════════════════
   MAIN
   ════════════════════════ */
async function main() {
  const username = parseUsername();
  console.log("[UserProfile] href =", window.location.href);
  console.log("[UserProfile] username =", username);

  if (!username) {
    showNotFound("Username tidak ditemukan di URL.\nGunakan format: /user/namauser atau ?u=namauser");
    return;
  }

  showLoading();

  /* ─ Cari profil ─ */
  let profile = null;
  try {
    /* Exact match dulu */
    const { data: exact, error: e1 } = await sb
      .from("profiles")
      .select("id,username,avatar_url,level,bio,total_chapters_read,created_at")
      .eq("username", username)
      .maybeSingle();

    if (e1) { showErr("Query profiles gagal", e1.message); return; }

    if (exact) {
      profile = exact;
    } else {
      /* Case-insensitive fallback */
      const { data: ci } = await sb
        .from("profiles")
        .select("id,username,avatar_url,level,bio,total_chapters_read,created_at")
        .ilike("username", username)
        .maybeSingle();
      profile = ci || null;
    }
  } catch(e) {
    showErr("Koneksi Supabase gagal", e.message);
    return;
  }

  if (!profile) {
    showNotFound(`User "${username}" tidak ditemukan.\nPastikan username sudah benar.`);
    return;
  }

  /* ─ Fetch data tambahan (paralel, tidak blocking) ─ */
  const [commentRes, bookmarkRes, historyRes, sessionRes] = await Promise.allSettled([
    sb.from("comments")
      .select("id,content,created_at,komik_slug,like_count")
      .eq("user_id", profile.id)
      .is("parent_id", null)
      .order("created_at",{ascending:false})
      .limit(20),
    sb.from("bookmarks")
      .select("id",{count:"exact",head:true})
      .eq("user_id", profile.id),
    sb.from("reading_history")
      .select("komik_slug,komik_title,chapter_slug,chapter_number,read_at")
      .eq("user_id", profile.id)
      .order("read_at",{ascending:false})
      .limit(10),
    sb.auth.getSession()
  ]);

  const comments  = (commentRes.status==="fulfilled"  ? commentRes.value.data   : null) || [];
  const bkCount   = (bookmarkRes.status==="fulfilled" ? bookmarkRes.value.count : null) || 0;
  const history   = (historyRes.status==="fulfilled"  ? historyRes.value.data   : null) || [];
  const session   = (sessionRes.status==="fulfilled"  ? sessionRes.value.data?.session : null) || null;

  const isMe = session?.user?.id === profile.id;
  const lv   = parseInt(profile.level)||1;
  const lvI  = levelInfo(lv);
  const name = esc(profile.username||"User");
  const raw  = profile.username||"User";
  const ini  = raw[0].toUpperCase();
  const av   = profile.avatar_url||"";
  const chap = profile.total_chapters_read||0;
  const cCnt = comments.length;

  document.title = `${raw} — Pankomik`;

  /* Badges */
  const badges = [{label:lvI.title, cls:lvI.cls}];
  if (chap>=100) badges.push({label:"100+ Chapter 📖",cls:"green"});
  if (cCnt>=50)  badges.push({label:"50+ Komentar 💬",cls:"blue"});
  if (bkCount>=10) badges.push({label:"10+ Bookmark 🔖",cls:""});

  $c.innerHTML = `
  <div>
    <!-- HERO -->
    <div class="user-hero">
      <div class="user-hero-bg"></div>
      <div class="hero-inner">
        <!-- Avatar -->
        <div class="uav-ring">
          ${av
            ? `<img class="uav-img" src="${esc(av)}" alt="${name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
               <div class="uav-fallback" style="display:none;">${ini}</div>`
            : `<div class="uav-fallback">${ini}</div>`
          }
        </div>
        <!-- Nama & level -->
        <h1 class="u-name">${name}</h1>
        <div class="u-level-pill"><span class="u-lv-dot"></span>Lv.${lv} · ${esc(lvI.title)}</div>
        ${av ? "" : ""}
        ${profile.bio ? `<p class="u-bio">${esc(profile.bio)}</p>` : ""}
        <!-- Stats -->
        <div class="u-stats">
          <div class="u-stat"><div class="u-stat-num">${chap}</div><div class="u-stat-label">Chapter</div></div>
          <div class="u-stat"><div class="u-stat-num">${cCnt}</div><div class="u-stat-label">Komentar</div></div>
          <div class="u-stat"><div class="u-stat-num">${bkCount}</div><div class="u-stat-label">Bookmark</div></div>
        </div>
        <!-- Badges -->
        <div class="u-badges">${badges.map(b=>`<span class="u-badge ${b.cls}">${esc(b.label)}</span>`).join("")}</div>
        <!-- Aksi -->
        <div class="u-action-row">
          ${isMe
            ? `<button class="btn-follow" onclick="window.location.href='/profil'">✏️ Edit Profil</button>`
            : `<button class="btn-follow" id="followBtn" disabled>...</button>`
          }
        </div>
        <p class="u-join-date">Bergabung ${fmtDate(profile.created_at)}</p>
      </div>
    </div>

    <!-- TABS -->
    <div class="u-tabs">
      <div class="u-tab active" onclick="switchUTab(this,'comments')">💬 Komentar (${cCnt})</div>
      <div class="u-tab" onclick="switchUTab(this,'history')">📖 Riwayat Baca</div>
    </div>

    <!-- KOMENTAR -->
    <div class="u-tab-panel active" id="u-tab-comments">
      ${cCnt === 0
        ? `<div class="empty-card"><div class="empty-emoji">💬</div><p>Belum ada komentar.</p></div>`
        : comments.map(c => {
            const loc  = resolveLoc(c.komik_slug);
            const txt  = (c.content||"").slice(0,150);
            const over = (c.content||"").length > 150;
            return `<a class="uc-card" href="${esc(loc.url)}">
              <div class="uc-loc">${esc(loc.icon)} ${esc(loc.label)}</div>
              <p class="uc-text">${esc(txt)}${over?"…":""}</p>
              <div class="uc-footer">
                <span class="uc-time">🕒 ${fmtRel(c.created_at)}</span>
                ${(c.like_count||0)>0?`<span class="uc-likes">❤️ ${c.like_count}</span>`:""}
              </div>
            </a>`;
          }).join("")
      }
    </div>

    <!-- RIWAYAT -->
    <div class="u-tab-panel" id="u-tab-history">
      ${history.length === 0
        ? `<div class="empty-card"><div class="empty-emoji">📖</div><p>Riwayat baca tidak tersedia.</p></div>`
        : `<div>${history.map(h => {
            const title = esc(h.komik_title || (h.komik_slug||"").replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim() || "Komik");
            const ch    = esc(h.chapter_number ? `Chapter ${h.chapter_number}` : (h.chapter_slug||"").replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim() || "Chapter");
            return `<div class="activity-item">
              <div class="activity-icon">📚</div>
              <div class="activity-body">
                <p class="activity-text"><a href="/komik/${esc(h.komik_slug||"")}">${title}</a></p>
                <p class="activity-sub">${ch}</p>
                <p class="activity-time">${fmtRel(h.read_at)}</p>
              </div>
            </div>`;
          }).join("")}</div>`
      }
    </div>
  </div>`;

  /* Tab switch */
  window.switchUTab = (el, name) => {
    document.querySelectorAll(".u-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".u-tab-panel").forEach(p => p.classList.remove("active"));
    el.classList.add("active");
    const panel = document.getElementById("u-tab-"+name);
    if (panel) panel.classList.add("active");
  };

  /* Setup follow button */
  if (!isMe) {
    const btn = document.getElementById("followBtn");
    if (!btn) return;

    if (!session?.user) {
      btn.textContent = "+ Ikuti";
      btn.disabled = false;
      btn.onclick = () => window.location.href = "/masuk";
      return;
    }

    const myId = session.user.id;
    btn.textContent = "...";
    btn.disabled = true;

    try {
      const { data: fol, error: fe } = await sb
        .from("follows")
        .select("id")
        .eq("follower_id", myId)
        .eq("following_id", profile.id)
        .maybeSingle();

      /* Kalau tabel tidak ada, sembunyikan tombol */
      if (fe && (fe.code === "42P01" || (fe.message||"").includes("does not exist"))) {
        btn.style.display = "none"; return;
      }

      let following = !!fol;
      btn.textContent = following ? "✓ Mengikuti" : "+ Ikuti";
      if (following) btn.classList.add("following");
      btn.disabled = false;

      btn.onclick = async () => {
        btn.disabled = true;
        if (following) {
          await sb.from("follows").delete()
            .eq("follower_id",myId).eq("following_id",profile.id);
          following = false;
          btn.textContent = "+ Ikuti";
          btn.classList.remove("following");
        } else {
          await sb.from("follows")
            .upsert({follower_id:myId, following_id:profile.id});
          following = true;
          btn.textContent = "✓ Mengikuti";
          btn.classList.add("following");
        }
        btn.disabled = false;
      };
    } catch(e) {
      btn.style.display = "none";
      console.warn("[Follow]", e);
    }
  }
}

main().catch(e => {
  console.error("[UserProfile] Uncaught:", e);
  document.getElementById("userProfileContent").innerHTML = `
    <div class="err-box">
      <p>❌ Terjadi kesalahan tak terduga</p>
      <pre>${e?.message||String(e)}</pre>
    </div>
    <div style="padding:14px;text-align:center;">
      <button class="nf-btn" onclick="window.location.href='/'">🏠 Home</button>
    </div>`;
});
</script>

<script type="module" src="/global-chat.js"></script>
</body>
</html>
