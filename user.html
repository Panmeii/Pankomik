<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil User — Pankomik</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ───────────────────────────────────────────────────
       USER PUBLIC PROFILE PAGE — Premium v1
    ─────────────────────────────────────────────────── */

    /* Back button */
    .back-btn {
      position: fixed; top: calc(var(--header-h) + 14px); left: 14px;
      z-index: 100;
      width: 36px; height: 36px;
      background: rgba(12,12,20,0.85); border: 1px solid var(--border-mid);
      border-radius: 50%; color: var(--text); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(12px);
      transition: all 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .back-btn:hover { background: var(--bg-elevated); border-color: var(--accent); color: var(--accent); }

    /* Hero */
    .user-hero {
      position: relative; overflow: hidden; padding-bottom: 24px;
    }
    .user-hero-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 90% 80% at 50% -15%, rgba(232,82,42,0.28) 0%, transparent 65%),
        radial-gradient(ellipse 50% 60% at 90% 50%, rgba(245,166,35,0.10) 0%, transparent 60%),
        var(--bg);
    }
    .user-hero-bg::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    .user-hero-bg::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
      background: linear-gradient(to bottom, transparent, var(--bg));
    }

    .hero-inner {
      position: relative; z-index: 1;
      padding: 40px 20px 28px;
      display: flex; flex-direction: column;
      align-items: center; text-align: center; gap: 0;
    }

    /* Animated avatar ring */
    .uav-ring {
      position: relative; width: 96px; height: 96px;
      margin-bottom: 16px; flex-shrink: 0;
    }
    .uav-ring::before {
      content: ''; position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(var(--accent), var(--accent2), #ff6b35, var(--accent));
      animation: ring-spin 6s linear infinite; z-index: 0;
    }
    @keyframes ring-spin { to { transform: rotate(360deg); } }
    .uav-ring::after {
      content: ''; position: absolute; inset: 2px; border-radius: 50%;
      background: var(--bg); z-index: 1;
    }
    .uav-ring img,
    .uav-ring .uav-fallback {
      position: relative; z-index: 2;
      width: 88px; height: 88px; border-radius: 50%; margin: 4px auto;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 900; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      object-fit: cover;
    }

    /* Name */
    .u-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px; font-weight: 700;
      color: var(--text); letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    /* Level pill */
    .u-level-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 16px;
      background: var(--accent-soft); border: 1px solid rgba(232,82,42,0.25);
      border-radius: 99px; font-size: 12px; font-weight: 800; color: var(--accent);
      margin-bottom: 14px; letter-spacing: 0.2px;
    }
    .u-lv-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: dot-pulse 2s ease infinite; }
    @keyframes dot-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.65)} }

    /* Bio */
    .u-bio {
      font-size: 13px; color: var(--text-sub); max-width: 280px;
      line-height: 1.55; margin-bottom: 20px; text-align: center;
    }

    /* Stats row */
    .u-stats {
      display: flex; width: 100%; max-width: 320px;
      background: var(--glass); border: 1px solid var(--glass-b);
      border-radius: var(--r-xl); overflow: hidden; backdrop-filter: blur(12px);
      margin-bottom: 16px;
    }
    .u-stat { flex: 1; padding: 14px 10px; text-align: center; position: relative; }
    .u-stat + .u-stat::before { content: ''; position: absolute; left: 0; top: 18%; bottom: 18%; width: 1px; background: var(--glass-b); }
    .u-stat-num { font-family: 'Bangers', cursive; font-size: 24px; color: var(--text); line-height: 1; letter-spacing: 1px; }
    .u-stat-label { font-size: 9px; color: var(--text-muted); font-weight: 700; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.6px; }

    /* Badges */
    .u-badges {
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
      padding: 0 16px; margin-bottom: 4px;
    }
    .u-badge {
      padding: 4px 12px; border-radius: 99px;
      font-size: 11px; font-weight: 800;
      background: var(--bg-elevated); border: 1px solid var(--border-mid);
      color: var(--text-sub);
    }
    .u-badge.gold  { background: rgba(245,166,35,0.1); border-color: rgba(245,166,35,0.25); color: #f5a623; }
    .u-badge.green { background: rgba(46,204,113,0.1); border-color: rgba(46,204,113,0.25); color: #2ecc71; }
    .u-badge.blue  { background: rgba(96,165,250,0.1); border-color: rgba(96,165,250,0.25); color: #60a5fa; }
    .u-badge.purple{ background: rgba(167,139,250,0.1);border-color: rgba(167,139,250,0.25);color: #a78bfa; }

    /* Content tabs */
    .u-tabs {
      display: flex; border-bottom: 1px solid var(--border);
      margin: 8px 0 0; background: var(--bg-card); position: sticky;
      top: var(--header-h); z-index: 10;
    }
    .u-tab {
      flex: 1; padding: 13px 8px; text-align: center;
      font-size: 12px; font-weight: 800; color: var(--text-muted);
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .u-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Tab content */
    .u-tab-panel { display: none; padding: 14px; }
    .u-tab-panel.active { display: block; }

    /* Activity feed */
    .activity-item {
      display: flex; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid var(--border); align-items: flex-start;
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-icon {
      width: 36px; height: 36px; border-radius: var(--r-sm); flex-shrink: 0;
      background: var(--bg-elevated); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .activity-content { flex: 1; min-width: 0; }
    .activity-text { font-size: 13px; color: var(--text); font-weight: 600; line-height: 1.4; margin-bottom: 3px; }
    .activity-text a { color: var(--accent); text-decoration: none; font-weight: 800; }
    .activity-time { font-size: 10px; color: var(--text-muted); }

    /* Comment card in user profile */
    .uc-card {
      display: block; padding: 13px 14px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--r-lg); margin-bottom: 8px;
      text-decoration: none;
      transition: background var(--fast), border-color var(--fast), transform var(--fast);
      position: relative; overflow: hidden;
    }
    .uc-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--accent); opacity: 0; transition: opacity var(--fast);
    }
    .uc-card:hover { background: var(--bg-surface); border-color: rgba(232,82,42,.2); transform: translateX(3px); }
    .uc-card:hover::before { opacity: 1; }
    .uc-loc { font-size: 10px; color: var(--accent); font-weight: 800; margin-bottom: 5px; display: flex; align-items: center; gap: 4px; }
    .uc-text { font-size: 13px; color: var(--text-sub); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 5px; }
    .uc-footer { display: flex; align-items: center; gap: 8px; }
    .uc-time { font-size: 10px; color: var(--text-dim); }
    .uc-likes { font-size: 10px; color: var(--text-muted); font-weight: 700; margin-left: auto; }

    /* Empty state */
    .empty-card {
      text-align: center; padding: 40px 20px;
      color: var(--text-muted); font-size: 13px;
    }
    .empty-card .empty-emoji { font-size: 40px; margin-bottom: 10px; }
    .empty-card p { line-height: 1.5; }

    /* Loading skeleton */
    .skel-line {
      height: 14px; border-radius: 6px; margin-bottom: 8px;
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 50%, var(--bg-card) 75%);
      background-size: 200% 100%; animation: shim 1.6s ease infinite;
    }
    @keyframes shim { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .skel-line.short { width: 60%; }
    .skel-line.tiny  { width: 35%; height: 10px; }

    /* Not found */
    .not-found-wrap {
      text-align: center; padding: 80px 20px;
      color: var(--text-muted);
    }
    .not-found-wrap .nf-icon { font-size: 64px; margin-bottom: 16px; }
    .not-found-wrap h2 { font-family: 'Bangers', cursive; font-size: 28px; letter-spacing: 2px; color: var(--text); margin-bottom: 10px; }

    /* Follow / message buttons */
    .u-action-row {
      display: flex; gap: 8px; justify-content: center;
      padding: 0 20px; margin-bottom: 8px;
    }
    .btn-follow {
      flex: 1; max-width: 140px;
      padding: 10px 16px; background: var(--accent); color: #fff;
      border: none; border-radius: var(--r-sm);
      font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800;
      cursor: pointer; transition: background var(--fast), transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-follow:hover { background: var(--accent-dark); }
    .btn-follow:active { transform: scale(0.95); }
    .btn-follow.following {
      background: transparent; color: var(--accent);
      border: 1.5px solid rgba(232,82,42,0.4);
    }
    .btn-follow.following:hover { background: var(--accent-soft); }
  </style>
</head>
<body class="has-bottom-nav">

<header class="header">
  <div class="logo" onclick="goHome()">Pankomik</div>
  <input type="text" id="searchInput" placeholder="Cari komik..." oninput="liveSearch()" autocomplete="off">
  <div class="header-right">
    <button onclick="toggleDarkMode()">🌙</button>
    <button onclick="toggleMenu()">👤</button>
  </div>
</header>

<div id="searchResult" class="search-result"></div>
<div id="menuDropdown" class="dropdown"></div>

<button class="back-btn" onclick="history.length > 1 ? history.back() : window.location.href='/'">←</button>

<main id="userProfileContent">
  <!-- Loading state -->
  <div style="padding: 60px 20px; text-align: center; color: var(--text-muted);">
    <div style="font-size:40px; margin-bottom:14px; animation: dot-pulse 1.5s ease infinite;">👤</div>
    <p>Memuat profil...</p>
  </div>
</main>

<nav class="bottom-nav">

</nav>

  import { initAuthHeader } from "/auth-header.js";

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://aaqhknkyrnsapvfywdsn.supabase.co";
const SUPABASE_KEY = "sb_publishable_ND-51tP1NF40HRZ3q05N5w_1ZnlPzlL";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ── Helpers ── */
function esc(s) {
  return String(s||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function fmtDate(d) {
  try { return new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}); }
  catch { return "–"; }
}

function fmtRelative(d) {
  try {
    const diff = Date.now() - new Date(d).getTime();
    const m = Math.floor(diff/60000);
    if (m < 1)  return "baru saja";
    if (m < 60) return `${m}m lalu`;
    const h = Math.floor(m/60);
    if (h < 24) return `${h}j lalu`;
    return fmtDate(d);
  } catch { return "–"; }
}

function getLevelInfo(level) {
  if (level >= 20) return { title: "Legenda Komik 👑", badgeClass: "gold" };
  if (level >= 10) return { title: "Otaku Sejati ⭐", badgeClass: "purple" };
  if (level >= 5)  return { title: "Pembaca Aktif 🔥", badgeClass: "green" };
  if (level >= 2)  return { title: "Pecinta Komik 📚", badgeClass: "blue" };
  return              { title: "Pemula 🌱", badgeClass: "" };
}

/* Get username from URL: /user/username or ?u=username */
function getUsername() {
  const path  = window.location.pathname;
  const m     = path.match(/^\/user\/([^/?]+)/);
  if (m) return decodeURIComponent(m[1]);
  return new URLSearchParams(window.location.search).get("u") || null;
}

function resolveLocation(raw) {
  if (!raw) return { icon:"💬", label:"Pankomik", url:"/" };
  if (raw.startsWith("novel-chapter:")) {
    const slug = raw.slice("novel-chapter:".length);
    const label = slug.replace(/-chapter-[\d-]+$/i,"").replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,22)||"Chapter Novel";
    return { icon:"📖", label, url:`/baca-novel/${slug}` };
  }
  if (raw.startsWith("novel:")) {
    const slug = raw.slice("novel:".length);
    return { icon:"📖", label:slug.replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,22)||"Novel", url:`/novel/${slug}` };
  }
  if (raw.startsWith("chapter:")) {
    const slug = raw.slice("chapter:".length);
    const kSlug = slug.replace(/-chapter-[\d]+.*$/i,"").trim();
    return { icon:"📚", label:kSlug.replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,22)||"Chapter Komik", url:`/baca/${slug}` };
  }
  return { icon:"📚", label:raw.replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,22)||"Komik", url:`/komik/${raw}` };
}

/* ── RENDER PAGE ── */
async function loadUserProfile() {
  const username = getUsername();
  const container = document.getElementById("userProfileContent");

  if (!username) {
    container.innerHTML = notFoundHTML("Username tidak ditemukan");
    return;
  }

  /* Fetch profile by username */
  const { data: profile, error } = await sb
    .from("profiles")
    .select("id,username,avatar_url,level,bio,total_chapters_read,created_at")
    .eq("username", username)
    .maybeSingle();

  if (error || !profile) {
    container.innerHTML = notFoundHTML(`User "${esc(username)}" tidak ditemukan`);
    return;
  }

  /* Fetch comment count */
  const { count: commentCount } = await sb
    .from("comments")
    .select("id", { count: "exact", head: true })
    .eq("user_id", profile.id);

  /* Fetch recent comments */
  const { data: comments } = await sb
    .from("comments")
    .select("id,content,created_at,komik_slug,like_count,parent_id")
    .eq("user_id", profile.id)
    .order("created_at", { ascending: false })
    .limit(20);

  /* Fetch bookmarks count */
  const { count: bookmarkCount } = await sb
    .from("bookmarks")
    .select("id", { count: "exact", head: true })
    .eq("user_id", profile.id);

  /* Fetch reading history (komik) */
  const { data: readHistory } = await sb
    .from("reading_history")
    .select("komik_slug,chapter_slug,updated_at")
    .eq("user_id", profile.id)
    .order("updated_at", { ascending: false })
    .limit(8);

  /* Build page */
  const lvl = profile.level || 1;
  const lvlInfo = getLevelInfo(lvl);
  const name = esc(profile.username || "User");
  const bio  = esc(profile.bio || "");
  const initial = (profile.username||"U")[0].toUpperCase();
  const avatar  = profile.avatar_url || "";
  const chapRead = profile.total_chapters_read || 0;
  const joinDate = fmtDate(profile.created_at);

  /* Get current user to show "edit profile" vs other profile */
  const { data: { session } } = await sb.auth.getSession();
  const isMe = session?.user?.id === profile.id;

  /* Build badges array */
  const badges = [];
  badges.push({ label: lvlInfo.title, cls: lvlInfo.badgeClass });
  if (chapRead >= 100) badges.push({ label: "100+ Chapter 📖", cls: "green" });
  if ((commentCount||0) >= 50)  badges.push({ label: "50+ Komentar 💬", cls: "blue" });
  if ((bookmarkCount||0) >= 10) badges.push({ label: "10+ Bookmark 🔖", cls: "" });

  document.title = `${profile.username} — Pankomik`;

  container.innerHTML = `
    <div class="user-profile-page">

      <!-- HERO -->
      <div class="user-hero">
        <div class="user-hero-bg"></div>
        <div class="hero-inner">

          <!-- Avatar ring -->
          <div class="uav-ring">
            ${avatar
              ? `<img src="${esc(avatar)}" alt="${name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                 <div class="uav-fallback" style="display:none;">${initial}</div>`
              : `<div class="uav-fallback">${initial}</div>`
            }
          </div>

          <!-- Name -->
          <h1 class="u-name">${name}</h1>

          <!-- Level pill -->
          <div class="u-level-pill">
            <span class="u-lv-dot"></span>
            Lv.${lvl} · ${lvlInfo.title}
          </div>

          <!-- Bio -->
          ${bio ? `<p class="u-bio">${bio}</p>` : ""}

          <!-- Stats -->
          <div class="u-stats">
            <div class="u-stat">
              <div class="u-stat-num">${chapRead}</div>
              <div class="u-stat-label">Chapter</div>
            </div>
            <div class="u-stat">
              <div class="u-stat-num">${commentCount||0}</div>
              <div class="u-stat-label">Komentar</div>
            </div>
            <div class="u-stat">
              <div class="u-stat-num">${bookmarkCount||0}</div>
              <div class="u-stat-label">Bookmark</div>
            </div>
          </div>

          <!-- Badges -->
          ${badges.length > 0 ? `
            <div class="u-badges">
              ${badges.map(b => `<span class="u-badge ${b.cls}">${esc(b.label)}</span>`).join("")}
            </div>` : ""}

          <!-- Action buttons -->
          <div class="u-action-row" style="margin-top:12px;">
            ${isMe
              ? `<button class="btn-follow" onclick="window.location.href='/profil'">✏️ Edit Profil</button>`
              : `<button class="btn-follow" id="followBtn" onclick="toggleFollow('${esc(profile.id)}')">+ Ikuti</button>`
            }
          </div>

          <!-- Join date -->
          <p style="font-size:11px;color:var(--text-dim);margin-top:8px;">Bergabung ${joinDate}</p>
        </div>
      </div>

      <!-- TABS -->
      <div class="u-tabs" id="uTabs">
        <div class="u-tab active" data-tab="comments" onclick="switchUTab(this,'comments')">💬 Komentar</div>
        <div class="u-tab" data-tab="activity" onclick="switchUTab(this,'activity')">📖 Riwayat</div>
      </div>

      <!-- COMMENTS TAB -->
      <div class="u-tab-panel active" id="u-tab-comments">
        ${renderCommentsTab(comments || [])}
      </div>

      <!-- ACTIVITY TAB -->
      <div class="u-tab-panel" id="u-tab-activity">
        ${renderActivityTab(readHistory || [])}
      </div>

    </div>
  `;

  /* Check follow state */
  if (!isMe && session?.user) {
    checkFollowState(session.user.id, profile.id);
  }
}

function renderCommentsTab(comments) {
  if (!comments || comments.length === 0) {
    return `<div class="empty-card"><div class="empty-emoji">💬</div><p>Belum ada komentar.</p></div>`;
  }
  return comments.map(c => {
    const loc  = resolveLocation(c.komik_slug);
    const text = (c.content||"").slice(0, 140);
    const likes = c.like_count || 0;
    return `
      <a class="uc-card" href="${esc(loc.url)}">
        <div class="uc-loc">${esc(loc.icon)} ${esc(loc.label)}</div>
        <p class="uc-text">${esc(text)}${(c.content||"").length>140?"…":""}</p>
        <div class="uc-footer">
          <span class="uc-time">🕒 ${fmtRelative(c.created_at)}</span>
          ${likes>0?`<span class="uc-likes">❤️ ${likes}</span>`:""}
        </div>
      </a>`;
  }).join("");
}

function renderActivityTab(history) {
  if (!history || history.length === 0) {
    return `<div class="empty-card"><div class="empty-emoji">📖</div><p>Belum ada riwayat baca yang tersedia.</p></div>`;
  }
  return `
    <div style="padding:4px 0;">
      ${history.map(h => {
        const name = (h.komik_slug||"").replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,28)||"Komik";
        const chName = (h.chapter_slug||"").replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).trim().slice(0,28)||"Chapter";
        return `
          <div class="activity-item">
            <div class="activity-icon">📚</div>
            <div class="activity-content">
              <p class="activity-text">Membaca <a href="/komik/${esc(h.komik_slug)}">${esc(name)}</a></p>
              <p style="font-size:11px;color:var(--text-muted);margin-bottom:3px;">${esc(chName)}</p>
              <p class="activity-time">${fmtRelative(h.updated_at)}</p>
            </div>
          </div>`;
      }).join("")}
    </div>`;
}

function notFoundHTML(msg) {
  return `
    <div class="not-found-wrap">
      <div class="nf-icon">🕵️</div>
      <h2>Profil Tidak Ditemukan</h2>
      <p style="font-size:13px;line-height:1.6;">${esc(msg)}</p>
      <button onclick="window.location.href='/'" style="margin-top:20px;padding:10px 28px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;">🏠 Kembali ke Home</button>
    </div>`;
}

/* ── TAB SWITCH ── */
window.switchUTab = function(el, name) {
  document.querySelectorAll(".u-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".u-tab-panel").forEach(p => p.classList.remove("active"));
  el.classList.add("active");
  const panel = document.getElementById("u-tab-" + name);
  if (panel) panel.classList.add("active");
};

/* ── FOLLOW ── */
async function checkFollowState(myId, targetId) {
  const { data } = await sb.from("follows").select("id").eq("follower_id", myId).eq("following_id", targetId).maybeSingle();
  const btn = document.getElementById("followBtn");
  if (!btn) return;
  if (data) {
    btn.textContent = "✓ Mengikuti";
    btn.classList.add("following");
    btn._following = true;
  } else {
    btn.textContent = "+ Ikuti";
    btn.classList.remove("following");
    btn._following = false;
  }
}

window.toggleFollow = async function(targetId) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = "/masuk"; return; }
  const myId = session.user.id;
  const btn = document.getElementById("followBtn");
  if (!btn) return;

  if (btn._following) {
    await sb.from("follows").delete().eq("follower_id", myId).eq("following_id", targetId);
    btn.textContent = "+ Ikuti"; btn.classList.remove("following"); btn._following = false;
  } else {
    await sb.from("follows").upsert({ follower_id: myId, following_id: targetId });
    btn.textContent = "✓ Mengikuti"; btn.classList.add("following"); btn._following = true;
  }
};

/* ── LOAD ── */
loadUserProfile();
</script>
