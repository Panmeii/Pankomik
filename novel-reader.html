<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baca Novel — Pankomik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito:wght@400;600;700;800&family=Lora:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════
       NOVEL READER — IMMERSIVE INK EXPERIENCE
    ═══════════════════════════════════════════════════════ */
    :root {
      --bg: #09080f; --surface: #110f1c; --surface2: #1a1726;
      --text: #e8e2f2; --muted: #6e6480; --border: rgba(255,255,255,0.07);
      --accent: #7c3aed; --accent2: rgba(124,58,237,0.15);
      --gold: #c9a84c;
      --radius: 10px; --header-h: 52px;
    }
    body.light {
      --bg: #faf8f5; --surface: #ffffff; --surface2: #f0ede8;
      --text: #1c1510; --muted: #7a6e5a; --border: rgba(0,0,0,0.09);
    }
    body.sepia {
      --bg: #f2e8d5; --surface: #fdf6e8; --surface2: #e8dcc8;
      --text: #2c1e0f; --muted: #7a5c3a; --border: rgba(0,0,0,0.1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Nunito', sans-serif;
      transition: background 0.35s, color 0.35s;
      overscroll-behavior: none;
    }

    /* ── Progress bar — gold gradient ──────────────────────── */
    #readingProgressBar {
      position: fixed; top: 0; left: 0; height: 2px; width: 0%;
      background: linear-gradient(90deg, #7c3aed, #c9a84c, #e879a0);
      z-index: 1100; transition: width 0.12s linear;
    }

    /* ── Header ────────────────────────────────────────────── */
    .reader-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      height: var(--header-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; gap: 10px;
      background: rgba(9,8,15,0.94);
      backdrop-filter: blur(20px) saturate(1.5);
      border-bottom: 1px solid rgba(201,168,76,0.12);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    body.light .reader-header {
      background: rgba(250,248,245,0.94);
      border-bottom-color: rgba(0,0,0,0.08);
    }
    body.sepia .reader-header {
      background: rgba(242,232,213,0.94);
      border-bottom-color: rgba(0,0,0,0.1);
    }
    .reader-header.hide { transform: translateY(-100%); opacity: 0; pointer-events: none; }

    .header-back {
      background: none; border: none; color: var(--text);
      font-size: 18px; cursor: pointer; padding: 6px;
      line-height: 1; flex-shrink: 0; border-radius: 8px;
      transition: background 0.15s;
    }
    .header-back:hover { background: rgba(255,255,255,0.08); }

    .header-title {
      flex: 1; font-family: 'Lora', serif;
      font-size: 12px; font-style: italic; font-weight: 400;
      color: var(--muted); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; text-align: center;
    }
    .header-btns { display: flex; gap: 4px; flex-shrink: 0; }
    .hbtn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
      color: var(--text); padding: 6px 10px; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-family: 'Nunito', sans-serif; font-weight: 700;
      transition: background 0.15s, transform 0.1s;
    }
    .hbtn:hover  { background: rgba(124,58,237,0.2); border-color: rgba(124,58,237,0.3); }
    .hbtn:active { transform: scale(0.92); }

    /* ── Settings Panel ─────────────────────────────────────── */
    .settings-panel {
      position: fixed; right: 12px; top: 60px; z-index: 1000;
      width: 236px; padding: 18px;
      background: rgba(15,12,24,0.97); backdrop-filter: blur(20px);
      border: 1px solid rgba(201,168,76,0.15); border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(124,58,237,0.1);
      display: none; animation: popIn 0.18s ease;
    }
    body.light .settings-panel { background: rgba(255,255,255,0.97); border-color: rgba(0,0,0,0.1); }
    body.sepia .settings-panel { background: rgba(253,248,238,0.97); border-color: rgba(0,0,0,0.1); }
    .settings-panel.open { display: block; }
    @keyframes popIn { from{opacity:0;transform:scale(0.93) translateY(-8px)} to{opacity:1;transform:scale(1) translateY(0)} }

    .settings-title {
      font-family: 'Cinzel', serif;
      font-size: 11px; font-weight: 600; letter-spacing: 2px;
      color: var(--gold); margin-bottom: 16px;
      text-transform: uppercase;
    }
    .settings-label {
      font-size: 9px; font-weight: 800; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.8px; margin: 13px 0 7px;
    }

    .font-size-row { display: flex; align-items: center; gap: 8px; }
    .font-size-row button {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06); color: var(--text); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .font-size-row button:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .font-size-num { flex: 1; text-align: center; font-size: 14px; font-weight: 800; }

    .font-btns { display: flex; gap: 5px; }
    .font-btn {
      flex: 1; padding: 7px 5px; border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04); color: var(--muted);
      font-size: 11px; font-weight: 700; cursor: pointer; text-align: center;
      transition: all 0.15s;
    }
    .font-btn.active { background: var(--accent2); border-color: rgba(124,58,237,0.4); color: #c4a0ff; }

    .theme-btns { display: flex; gap: 5px; }
    .theme-btn {
      flex: 1; padding: 8px 4px; border-radius: 8px;
      border: 2px solid transparent; font-size: 10px; font-weight: 800;
      cursor: pointer; text-align: center; transition: border-color 0.15s;
    }
    .theme-btn.dark  { background: #09080f; color: #e8e2f2; border-color: rgba(255,255,255,0.08); }
    .theme-btn.light { background: #faf8f5; color: #1c1510; border-color: rgba(0,0,0,0.1); }
    .theme-btn.sepia { background: #f2e8d5; color: #2c1e0f; border-color: rgba(0,0,0,0.1); }
    .theme-btn.active { border-color: var(--gold) !important; }

    .lh-slider { width: 100%; accent-color: var(--accent); height: 4px; }

    /* ── Reader content ─────────────────────────────────────── */
    #readerWrap {
      margin-top: var(--header-h);
      min-height: calc(100vh - var(--header-h));
      padding-bottom: 80px;
    }

    .chapter-head {
      padding: 28px 22px 18px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    /* Dekoratif garis emas */
    .chapter-head::after {
      content: '';
      position: absolute; bottom: 0; left: 22px;
      width: 40px; height: 1px;
      background: linear-gradient(90deg, var(--gold), transparent);
    }
    .chapter-head .novel-label {
      font-family: 'Cinzel', serif;
      font-size: 9px; font-weight: 600; letter-spacing: 2.5px;
      background: linear-gradient(135deg, var(--gold), #f0d080);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-transform: uppercase; margin-bottom: 8px; display: block;
    }
    .chapter-head h2 {
      font-family: 'Lora', serif;
      font-size: 17px; font-weight: 600; line-height: 1.45; color: var(--text);
      margin-bottom: 10px;
    }
    .chapter-head .nav-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .nav-pill {
      padding: 5px 14px; border-radius: 99px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04); color: var(--muted);
      font-size: 11px; font-weight: 700; cursor: pointer; text-decoration: none;
      display: inline-block; transition: all 0.15s;
    }
    .nav-pill:hover { border-color: rgba(201,168,76,0.4); color: var(--gold); }
    .nav-pill.accent {
      background: rgba(124,58,237,0.15); border-color: rgba(124,58,237,0.35);
      color: #c4a0ff;
    }

    /* ── THE NOVEL TEXT ─────────────────────────────────────── */
    #novelContent {
      max-width: 660px;
      margin: 0 auto;
      padding: 32px 22px 40px;
    }

    #novelContent p {
      margin-bottom: 1.1em;
      color: var(--text);
      line-height: var(--lh, 2.0);
      font-size: var(--fs, 16px);
      font-family: var(--ff, 'Lora', serif);
      transition: font-size 0.2s, line-height 0.2s;
      /* Teks rata kanan-kiri untuk feel novel premium */
      text-align: justify;
      text-justify: inter-word;
    }
    /* First paragraph drop-cap efek elegan */
    #novelContent > p:first-of-type::first-letter {
      font-family: 'Cinzel', serif;
      font-size: 3.4em; font-weight: 700;
      float: left; line-height: 0.75;
      margin: 0.05em 0.1em 0 0;
      background: linear-gradient(135deg, var(--gold), #f0d080);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    body.light #novelContent > p:first-of-type::first-letter,
    body.sepia #novelContent > p:first-of-type::first-letter {
      background: linear-gradient(135deg, #8a5a0a, #c9a84c);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    #novelContent p:empty { margin-bottom: 0.4em; }
    #novelContent b, #novelContent strong { font-weight: 700; }
    #novelContent i, #novelContent em { font-style: italic; }

    /* Divider ornamen di antara section */
    #novelContent hr {
      border: none; text-align: center; margin: 1.5em 0;
      color: var(--muted); letter-spacing: 6px; font-size: 14px;
    }
    #novelContent hr::after { content: '· · ·'; }

    /* ── Chapter navigation bar ─────────────────────────────── */
    .chapter-nav-bar {
      display: flex; gap: 8px; padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .cnav-btn {
      flex: 1; padding: 13px; border-radius: 99px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04); color: var(--text);
      font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .cnav-btn:hover:not(:disabled) {
      background: rgba(201,168,76,0.12); border-color: rgba(201,168,76,0.3);
      color: var(--gold);
    }
    .cnav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .cnav-btn.primary {
      background: linear-gradient(135deg, rgba(124,58,237,0.8), rgba(124,58,237,0.6));
      border-color: rgba(124,58,237,0.4); color: #fff; flex: 2;
      box-shadow: 0 4px 16px rgba(124,58,237,0.25);
    }
    .cnav-btn.primary:hover:not(:disabled) {
      box-shadow: 0 6px 22px rgba(124,58,237,0.4);
      transform: translateY(-1px);
    }

    /* ── Loading & Error ────────────────────────────────────── */
    .reader-loading {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; gap: 18px; color: var(--muted);
    }
    .reader-spinner {
      width: 38px; height: 38px;
      border: 2px solid rgba(201,168,76,0.15);
      border-top-color: var(--gold);
      border-radius: 50%; animation: spin 1.0s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .reader-error {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; gap: 12px;
      color: var(--muted); text-align: center; padding: 20px;
    }

    /* ── Toast ──────────────────────────────────────────────── */
    #toastWrap {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%); z-index: 3000; pointer-events: none;
    }
    .toast-item {
      padding: 10px 22px; border-radius: 99px; font-size: 13px;
      font-weight: 700; color: #fff; white-space: nowrap;
      background: rgba(20,16,32,0.9); backdrop-filter: blur(12px);
      border: 1px solid rgba(201,168,76,0.2);
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
      animation: toastIn 0.25s ease; margin-top: 6px;
      font-family: 'Nunito', sans-serif;
    }
    @keyframes toastIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    /* ── Chapter List Panel ─────────────────────────────────── */
    .ch-panel-overlay {
      display: none; position: fixed; inset: 0;
      z-index: 1499; background: rgba(0,0,0,0.6);
      backdrop-filter: blur(2px);
    }
    .ch-panel-overlay.open { display: block; }

    .ch-panel {
      position: fixed; top: 0; left: -320px; width: 300px; height: 100vh;
      z-index: 1500; display: flex; flex-direction: column;
      background: rgba(11,9,18,0.98); backdrop-filter: blur(20px);
      border-right: 1px solid rgba(201,168,76,0.1);
      box-shadow: 6px 0 36px rgba(0,0,0,0.7);
      transition: left 0.28s cubic-bezier(0.4,0,0.2,1);
    }
    .ch-panel.open { left: 0; }
    body.light .ch-panel { background: rgba(252,250,248,0.98); border-right-color: rgba(0,0,0,0.08); }
    body.sepia .ch-panel { background: rgba(248,240,228,0.98); }

    .ch-panel-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 16px; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .ch-panel-head h3 {
      font-family: 'Cinzel', serif;
      font-size: 12px; font-weight: 600; letter-spacing: 2px;
      background: linear-gradient(135deg, var(--gold), #f0d080);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-transform: uppercase; margin: 0;
    }
    .ch-panel-close {
      width: 28px; height: 28px; border-radius: 8px;
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: var(--text); font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .ch-panel-close:hover { background: rgba(255,255,255,0.12); }

    .ch-panel-list {
      flex: 1; overflow-y: auto; padding: 4px 0;
      scrollbar-width: thin; scrollbar-color: rgba(124,58,237,0.3) transparent;
    }
    .ch-panel-list::-webkit-scrollbar { width: 3px; }
    .ch-panel-list::-webkit-scrollbar-thumb { background: rgba(124,58,237,0.3); border-radius: 99px; }

    .ch-panel-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 16px; cursor: pointer; font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background 0.12s;
    }
    .ch-panel-item:hover { background: rgba(124,58,237,0.08); }
    .ch-panel-item.active {
      background: rgba(124,58,237,0.12);
      border-left: 2px solid var(--gold);
      padding-left: 14px;
    }
    .ch-panel-item-title {
      flex: 1; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ch-panel-item.active .ch-panel-item-title { color: #c4a0ff; }
    .ch-panel-item-date { font-size: 10px; color: var(--muted); flex-shrink: 0; margin-left: 8px; }
    .ch-panel-badge     { font-size: 12px; flex-shrink: 0; margin-left: 4px; }
  </style>
</head>
<body>

<!-- Progress bar -->
<div id="readingProgressBar"></div>

<!-- Header -->
<div class="reader-header" id="readerHeader">
  <button class="header-back" onclick="goBack()">←</button>
  <span class="header-title" id="headerTitle">Memuat...</span>
  <div class="header-btns">
    <button class="hbtn" onclick="toggleChapterPanel()" title="Daftar Chapter">📚</button>
    <button class="hbtn" onclick="toggleSettings()" title="Pengaturan">⚙️</button>
    <button class="hbtn" onclick="goToDetail()" title="Detail Novel">📋</button>
  </div>
</div>

<!-- Settings Panel -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-title">⚙️ Pengaturan Baca</div>

  <div class="settings-label">Ukuran Teks</div>
  <div class="font-size-row">
    <button onclick="changeFontSize(-1)">−</button>
    <span class="font-size-num" id="fontSizeNum">16px</span>
    <button onclick="changeFontSize(1)">＋</button>
  </div>

  <div class="settings-label">Font</div>
  <div class="font-btns">
    <button class="font-btn active" id="fb-nunito"     onclick="setFont('Nunito')">Sans</button>
    <button class="font-btn"        id="fb-merriweather" onclick="setFont('Merriweather')">Serif</button>
  </div>

  <div class="settings-label">Jarak Baris</div>
  <input class="lh-slider" type="range" id="lhSlider" min="1.4" max="3.0" step="0.1" value="1.9"
    oninput="setLineHeight(this.value)">

  <div class="settings-label">Tema</div>
  <div class="theme-btns">
    <button class="theme-btn dark  active" id="theme-dark"  onclick="setTheme('dark')">🌙 Gelap</button>
    <button class="theme-btn light"        id="theme-light" onclick="setTheme('light')">☀️ Terang</button>
    <button class="theme-btn sepia"        id="theme-sepia" onclick="setTheme('sepia')">📜 Sepia</button>
  </div>
</div>

<!-- Reader wrap -->

<!-- Chapter List Overlay -->
<div class="ch-panel-overlay" id="chPanelOverlay" onclick="toggleChapterPanel()"></div>

<!-- Chapter List Panel -->
<div class="ch-panel" id="chPanel">
  <div class="ch-panel-head">
    <h3>📚 Daftar Chapter</h3>
    <button class="ch-panel-close" onclick="toggleChapterPanel()">✕</button>
  </div>
  <div class="ch-panel-list" id="chPanelList">
    <div style="padding:20px;text-align:center;color:#888;font-size:13px;">Memuat...</div>
  </div>
</div>

<div id="readerWrap">
  <div class="reader-loading">
    <div class="reader-spinner"></div>
    <p>Memuat chapter...</p>
  </div>
</div>

<!-- ── Komentar Chapter Novel ────────────────────────────── -->
<div id="novelReaderCommentSection"
  style="max-width:780px;margin:0 auto;"></div>

<!-- Toast container -->
<div id="toastWrap"></div>

<script type="module">
  import { getCurrentUser, saveNovelHistory, updateNovelProgress } from "/supabase.js";
  import { initComments } from "/comment-system.js";
  window._novelAuth = { getCurrentUser, saveNovelHistory, updateNovelProgress };

  /* Expose initComments untuk dipanggil dari script biasa */
  window._initNovelChapterComments = async function(chSlug) {
    const user = await getCurrentUser();
    await initComments({
      containerId : "novelReaderCommentSection",
      contentSlug : `novel-chapter:${chSlug}`,
      accentColor : "#8e44ad",
      user,
    });
  };
</script>

<script>
/* ============================================================
   novel-reader.html
   API: GET /novel/sakuranovel/read/{chapter-slug}
   JSON: { data: { title, content (HTML), navigation: { prev_slug, next_slug, parent_slug } } }
   ============================================================ */

const BASE        = "https://www.sankavollerei.com/novel/sakuranovel/read";
function getChapterSlug() {
  const m = window.location.pathname.match(/^\/baca-novel\/([^/]+)\/?$/);
  if (m) return m[1];
  return new URLSearchParams(window.location.search).get("slug");
}
const chapterSlug = getChapterSlug();
if (!chapterSlug) window.location.href = "novel.html";

/* ── State ─────────────────────────────────────────────────── */
let currentSlug   = chapterSlug;
let navigation    = {};
let currentUser   = null;
let historySaved  = false;
let parentSlug    = null;

/* ── Settings state ─────────────────────────────────────────── */
let fontSize   = parseInt(localStorage.getItem("nv_fs")   || "16");
let fontFamily = localStorage.getItem("nv_ff")             || "Nunito";
let lineHeight = parseFloat(localStorage.getItem("nv_lh") || "1.9");
let theme      = localStorage.getItem("nv_theme")          || "dark";

/* ── INIT ─────────────────────────────────────────────────── */
window.addEventListener("DOMContentLoaded", async () => {
  applySettings(false);
  initProgressBar();
  initHeaderHide();

  await new Promise(r => setTimeout(r, 80));
  if (window._novelAuth) currentUser = await window._novelAuth.getCurrentUser();

  await loadChapter(currentSlug);
});

/* ── FETCH & RENDER ────────────────────────────────────────── */
async function loadChapter(slug, append = false) {
  if (!append) {
    document.getElementById("readerWrap").innerHTML = `
      <div class="reader-loading">
        <div class="reader-spinner"></div>
        <p>Memuat chapter...</p>
      </div>`;
    historySaved = false;
    window.scrollTo({ top: 0, behavior: "smooth" });
    const bar = document.getElementById("readingProgressBar");
    if (bar) { bar.style.width = "0%"; bar.style.background = "linear-gradient(90deg,#8e44ad,#d4a0ff)"; }
  }

  try {
    const res  = await fetch(`${BASE}/${slug}`);
    const json = await res.json();
    if (!json.data) throw new Error("No data");

    const d  = json.data;
    navigation  = d.navigation || {};
    parentSlug  = navigation.parent_slug || null;
    currentSlug = slug;

    document.title = (d.title || "Baca Novel") + " — Pankomik";
    document.getElementById("headerTitle").textContent = d.title || "Novel";

    renderChapter(d);

    /* Init komentar untuk chapter ini */
    if (typeof window._initNovelChapterComments === "function") {
      window._initNovelChapterComments(slug);
    }

    /* Auto-save riwayat */
    if (currentUser && !historySaved && window._novelAuth) {
      historySaved = true;
      const _novelSlug  = parentSlug || chapterSlug;
      const _novelTitle = extractNovelTitle(d.title || "");
      const _chTitle    = d.title || chapterSlug;

      window._novelAuth.saveNovelHistory(currentUser.id, {
        slug:  _novelSlug,
        title: _novelTitle,
        cover: d.cover || ""
      }, {
        slug:  chapterSlug,
        title: _chTitle
      }).catch(console.error);

      /* Update progress novel */
      window._novelAuth.updateNovelProgress(currentUser.id, {
        slug:             _novelSlug,
        title:            _novelTitle,
        cover:            d.cover || "",
        lastChapterSlug:  chapterSlug
      }, _chTitle).catch(console.error);
    }

  } catch (err) {
    console.error("Gagal load chapter:", err);
    document.getElementById("readerWrap").innerHTML = `
      <div class="reader-error">
        <p style="font-size:40px">😕</p>
        <p>Gagal memuat chapter. Cek koneksimu.</p>
        <button onclick="loadChapter('${slug}')" style="
          margin-top:12px;padding:9px 22px;background:#8e44ad;
          color:#fff;border:none;border-radius:9px;cursor:pointer;
          font-weight:700;font-family:'Nunito',sans-serif;font-size:14px;">
          🔄 Coba Lagi
        </button>
      </div>`;
  }
}

function renderChapter(d) {
  const prevSlug = navigation.prev_slug;
  const nextSlug = navigation.next_slug;

  /* Bersihkan konten HTML dari link eksternal & elemen berbahaya */
  const cleanContent = sanitizeNovelHtml(d.content || "<p>Tidak ada konten.</p>");

  document.getElementById("readerWrap").innerHTML = `
    <!-- Chapter header -->
    <div class="chapter-head">
      <div class="novel-label">📖 Novel</div>
      <h2>${escHtml(d.title || "")}</h2>
      <div class="nav-pills">
        ${parentSlug ? `<a class="nav-pill" href="/novel/${parentSlug}">← Detail Novel</a>` : ""}
        ${prevSlug   ? `<span class="nav-pill" onclick="goToChapter('${prevSlug}')">⬅ Sebelumnya</span>` : ""}
        ${nextSlug   ? `<span class="nav-pill accent" onclick="goToChapter('${nextSlug}')">Selanjutnya ➡</span>` : ""}
      </div>
    </div>

    <!-- Content -->
    <div id="novelContent">${cleanContent}</div>

    <!-- Bottom chapter nav -->
    <div class="chapter-nav-bar">
      <button class="cnav-btn" id="prevChBtn" onclick="goToChapter('${prevSlug}')"
        ${!prevSlug ? "disabled" : ""}>⬅ Sebelumnya</button>
      ${nextSlug
        ? `<button class="cnav-btn primary" onclick="goToChapter('${nextSlug}')">Selanjutnya ➡</button>`
        : parentSlug
          ? `<button class="cnav-btn primary" onclick="window.location.href='/novel/${parentSlug}'">📋 Kembali ke Detail</button>`
          : `<button class="cnav-btn" disabled>✅ Selesai</button>`
      }
    </div>
  `;

  applySettings(false);
}

/* Bersihkan HTML konten novel (hapus script, iframe, link eksternal tidak perlu) */
function sanitizeNovelHtml(html) {
  return html
    .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, "")
    .replace(/<iframe[^>]*>.*?<\/iframe>/gi, "")
    .replace(/href="https?:\/\/(?!pankomik)[^"]*"/gi, 'href="#"')
    /* Proxy semua gambar inline dalam konten novel */
    .replace(/src="(https?:\/\/[^"]+)"/gi, (match, url) => {
      const clean   = url.split("?")[0];
      const proxied = "https://proxy.sankavolereii.my.id/" + clean;
      return `src="${proxied}"`;
    })
    /* Hapus semua paragraf/div yang mengandung teks promo/branding */
    .replace(/<p[^>]*>[^<]*(?:Ko-fi|sakuranovel\.id|sakuranovel|Baca novel lain|baca lebih lanjut di|lanjutkan baca di|sumber\s*:|source\s*:|diterjemahkan oleh|translated by)[^<]*<\/p>/gi, "")
    .replace(/<div[^>]*>[^<]*(?:sakuranovel\.id|sakuranovel)[^<]*<\/div>/gi, "")
    /* Hapus teks mentah sakuranovel.id yang muncul di luar tag (text node) */
    .replace(/sakuranovel\.id/gi, "")
    .replace(/sakuranovel/gi, "");
}

/* ── NAVIGASI ────────────────────────────────────────────── */
window.goToChapter = function (slug) {
  if (!slug) return;
  currentSlug  = slug;
  historySaved = false;
  /* Reset section komentar saat ganti chapter */
  const cs = document.getElementById("novelReaderCommentSection");
  if (cs) cs.innerHTML = "";
  loadChapter(slug);
  /* Update active state di panel */
  setTimeout(renderChapterPanel, 600);
};


/* ============================================================
   CHAPTER LIST PANEL
   ============================================================ */
let _chapterList = [];
let _chPanelLoaded = false;

window.toggleChapterPanel = function () {
  const panel   = document.getElementById("chPanel");
  const overlay = document.getElementById("chPanelOverlay");
  if (!panel) return;

  const isOpen = panel.classList.contains("open");
  panel.classList.toggle("open");
  overlay.classList.toggle("open");

  /* Load chapter list pertama kali dibuka */
  if (!isOpen && !_chPanelLoaded && parentSlug) {
    loadChapterList(parentSlug);
  }

  /* Scroll ke chapter aktif */
  if (!isOpen) {
    setTimeout(() => {
      document.querySelector(".ch-panel-item.active")
        ?.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 200);
  }
};

async function loadChapterList(novelSlug) {
  const listEl = document.getElementById("chPanelList");
  if (!listEl) return;

  try {
    const BASE_DETAIL = "https://www.sankavollerei.com/novel/sakuranovel";
    const res  = await fetch(`${BASE_DETAIL}/detail/${novelSlug}`);
    const json = await res.json();

    if (!json.data?.chapters?.length) {
      listEl.innerHTML = '<div style="padding:20px;text-align:center;color:#888;font-size:13px;">Tidak ada daftar chapter.</div>';
      return;
    }

    _chapterList = json.data.chapters;
    _chPanelLoaded = true;
    renderChapterPanel();
  } catch (e) {
    console.error("Gagal load chapter list:", e);
    const listEl = document.getElementById("chPanelList");
    if (listEl) listEl.innerHTML = '<div style="padding:20px;text-align:center;color:#888;font-size:13px;">Gagal memuat. Coba lagi.</div>';
  }
}

function renderChapterPanel() {
  const listEl = document.getElementById("chPanelList");
  if (!listEl || !_chapterList.length) return;

  listEl.innerHTML = _chapterList.map((ch, i) => {
    const isActive = ch.slug === currentSlug;
    const title    = ch.title || `Chapter ${i + 1}`;
    const date     = ch.date  || "";
    const shortTitle = title.length > 45 ? title.slice(0, 42) + "…" : title;
    return `
      <div class="ch-panel-item ${isActive ? "active" : ""}"
           onclick="goToChapterFromPanel('${ch.slug}')">
        <span class="ch-panel-item-title">${shortTitle}</span>
        ${date ? `<span class="ch-panel-item-date">${date}</span>` : ""}
        ${isActive ? `<span class="ch-panel-badge">📖</span>` : ""}
      </div>`;
  }).join("");
}

window.goToChapterFromPanel = function (slug) {
  if (slug === currentSlug) { toggleChapterPanel(); return; }
  toggleChapterPanel();
  goToChapter(slug);
  /* Re-render panel setelah chapter baru load untuk update active */
  setTimeout(renderChapterPanel, 800);
};

window.goBack = function () {
  if (parentSlug) {
    window.location.href = `/novel/${parentSlug}`;
  } else {
    history.back();
  }
};

window.goToDetail = function () {
  if (parentSlug) window.location.href = `/novel/${parentSlug}`;
  else history.back();
};

/* Ekstrak judul novel dari judul chapter (hapus nama chapter di akhir) */
function extractNovelTitle(chapterTitle) {
  return chapterTitle.replace(/\s*(volume\s*\d+)?\s*chapter\s*[\d.]+.*$/i, "")
                     .replace(/\s*(short story|afterword|prologue|epilogue).*$/i, "")
                     .replace(/\s*bahasa indonesia\s*/i, "")
                     .trim() || chapterTitle;
}

/* ── SETTINGS ────────────────────────────────────────────── */
window.toggleSettings = function () {
  document.getElementById("settingsPanel").classList.toggle("open");
};

function applySettings(save = true) {
  const content = document.getElementById("novelContent");
  if (content) {
    content.style.setProperty("--fs", fontSize + "px");
    content.style.setProperty("--lh", lineHeight);
    content.style.setProperty("--ff",
      fontFamily === "Merriweather" ? "'Merriweather', serif" : "'Nunito', sans-serif");
  }

  /* Sync slider & display */
  const fsNum = document.getElementById("fontSizeNum");
  const lhSlider = document.getElementById("lhSlider");
  if (fsNum) fsNum.textContent = fontSize + "px";
  if (lhSlider) lhSlider.value = lineHeight;

  /* Font buttons */
  document.querySelectorAll(".font-btn").forEach(b => b.classList.remove("active"));
  const ffBtn = document.getElementById("fb-" + fontFamily.toLowerCase());
  if (ffBtn) ffBtn.classList.add("active");

  /* Theme */
  document.body.className = theme;
  document.querySelectorAll(".theme-btn").forEach(b => b.classList.remove("active"));
  const themeBtn = document.getElementById("theme-" + theme);
  if (themeBtn) themeBtn.classList.add("active");

  if (save) {
    localStorage.setItem("nv_fs", fontSize);
    localStorage.setItem("nv_ff", fontFamily);
    localStorage.setItem("nv_lh", lineHeight);
    localStorage.setItem("nv_theme", theme);
  }
}

window.changeFontSize = function (delta) {
  fontSize = Math.min(24, Math.max(12, fontSize + delta));
  applySettings();
};
window.setFont = function (ff) {
  fontFamily = ff; applySettings();
};
window.setLineHeight = function (val) {
  lineHeight = parseFloat(val); applySettings();
};
window.setTheme = function (t) {
  theme = t; applySettings();
};

/* ── READING PROGRESS BAR ────────────────────────────────── */
function initProgressBar() {
  const bar = document.getElementById("readingProgressBar");
  window.addEventListener("scroll", () => {
    const scrollTop = window.scrollY;
    const docH = document.body.scrollHeight - window.innerHeight;
    const pct  = docH > 0 ? (scrollTop / docH) * 100 : 0;
    if (bar) {
      bar.style.width = Math.min(pct, 100) + "%";
      if (pct >= 95) bar.style.background = "linear-gradient(90deg,#27ae60,#2ecc71)";
    }
  }, { passive: true });
}

/* ── HEADER AUTO-HIDE ────────────────────────────────────── */
function initHeaderHide() {
  const header = document.getElementById("readerHeader");
  let timer = null;
  window.addEventListener("scroll", () => {
    header?.classList.add("hide");
    clearTimeout(timer);
    timer = setTimeout(() => header?.classList.remove("hide"), 1800);
  }, { passive: true });

  /* Tap on content = toggle header */
  document.getElementById("readerWrap")?.addEventListener("click", e => {
    if (e.target.closest("button") || e.target.closest("a")) return;
    header?.classList.toggle("hide");
  });
}

/* ── CLOSE SETTINGS ON OUTSIDE CLICK ───────────────────────── */
document.addEventListener("click", e => {
  const panel = document.getElementById("settingsPanel");
  const btn   = document.querySelector('.hbtn[onclick="toggleSettings()"]');
  if (panel?.classList.contains("open") && !panel.contains(e.target) && !btn?.contains(e.target)) {
    panel.classList.remove("open");
  }
});

/* ── KEYBOARD ─────────────────────────────────────────────── */
document.addEventListener("keydown", e => {
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if ((e.key === "ArrowRight" || e.key === "d") && navigation.next_slug) goToChapter(navigation.next_slug);
  if ((e.key === "ArrowLeft"  || e.key === "a") && navigation.prev_slug) goToChapter(navigation.prev_slug);
});

/* ── HELPERS ─────────────────────────────────────────────── */
function escHtml(str) {
  return String(str || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function showToast(msg, type = "info") {
  const wrap = document.getElementById("toastWrap");
  if (!wrap) return;
  const t  = document.createElement("div");
  const bg = type === "success" ? "#27ae60" : type === "error" ? "#e8522a" : "#333";
  t.className = "toast-item";
  t.style.background = bg;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
</script>
