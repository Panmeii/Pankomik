<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Baca Novel — Pankomik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Cinzel:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════
       NOVEL READER — PREMIUM RESPONSIVE THEME
       Dengan dukungan optimal untuk ilustrasi/illustrasi novel
    ═══════════════════════════════════════════════════════ */
    :root {
      --ink:         #0d0b14;
      --ink2:        #13101e;
      --ink3:        #1a1728;
      --ink4:        #221f32;
      --gold:        #c9a84c;
      --gold-light:  #e8c96a;
      --gold-dim:    rgba(201,168,76,0.16);
      --gold-glow:   rgba(201,168,76,0.08);
      --crimson:     #8b1a1a;
      --crimson-bg:  rgba(139,26,26,0.15);
      --text:        #ede8f5;
      --text2:       #c4bdd6;
      --muted:       #6e6480;
      --border:      rgba(255,255,255,0.06);
      --border-gold: rgba(201,168,76,0.18);
      --r:           12px;
      --header-h:    54px;
      --reader-max:  800px;
      --font-base:   18px;
      --line-height: 1.9;
    }

    /* Light mode variables */
    body.light-mode {
      --ink:         #faf8f5;
      --ink2:        #f5f2ed;
      --ink3:        #ebe7e0;
      --ink4:        #e0dcd4;
      --text:        #2d2a33;
      --text2:       #4a4652;
      --muted:       #8a8494;
      --border:      rgba(0,0,0,0.08);
      --border-gold: rgba(201,168,76,0.4);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--ink);
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      font-size: var(--font-base);
      line-height: var(--line-height);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    .reader-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: var(--header-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      background: rgba(13,11,20,0.96);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-gold);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    body.light-mode .reader-header {
      background: rgba(250,248,245,0.96);
    }
    .reader-header.hidden {
      transform: translateY(-100%);
      opacity: 0;
    }
    .header-left, .header-right { display: flex; align-items: center; gap: 8px; }
    .back-btn, .menu-btn {
      width: 40px; height: 40px; border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--muted); font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .back-btn:hover, .menu-btn:hover { 
      background: var(--gold-dim); 
      border-color: var(--border-gold); 
      color: var(--gold); 
    }
    .novel-title {
      font-family: 'Cinzel', serif; 
      font-size: 13px; 
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text);
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── SETTINGS PANEL ───────────────────────────────── */
    .settings-panel {
      position: fixed; top: var(--header-h); right: -320px;
      width: 320px; max-height: calc(100vh - var(--header-h));
      background: var(--ink2);
      border-left: 1px solid var(--border-gold);
      z-index: 999;
      transition: right 0.3s ease;
      overflow-y: auto;
      padding: 20px;
    }
    .settings-panel.open { right: 0; }
    .settings-title {
      font-family: 'Cinzel', serif;
      font-size: 12px; letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-gold);
    }
    .setting-group { margin-bottom: 24px; }
    .setting-label {
      font-size: 11px; font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: block;
    }
    .font-size-controls {
      display: flex; align-items: center; gap: 12px;
    }
    .font-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-gold);
      background: var(--gold-dim);
      color: var(--gold);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .font-btn:hover { background: rgba(201,168,76,0.25); }
    .font-display {
      font-size: 14px; color: var(--text);
      min-width: 50px; text-align: center;
    }
    .theme-toggle {
      display: flex; gap: 10px;
    }
    .theme-btn {
      flex: 1; padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .theme-btn.active {
      border-color: var(--gold);
      background: var(--gold-dim);
      color: var(--gold);
    }
    .line-height-options {
      display: flex; gap: 8px;
    }
    .lh-btn {
      flex: 1; padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lh-btn.active {
      border-color: var(--gold);
      background: var(--gold-dim);
      color: var(--gold);
    }

    /* ── READER CONTAINER ──────────────────────────────── */
    .reader-container {
      max-width: var(--reader-max);
      margin: 0 auto;
      padding: calc(var(--header-h) + 30px) 24px 100px;
      position: relative;
    }

    /* ── CHAPTER HEADER ───────────────────────────────── */
    .chapter-header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 1px solid var(--border-gold);
    }
    .chapter-number {
      font-family: 'Cinzel', serif;
      font-size: 11px; letter-spacing: 3px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .chapter-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    .chapter-meta {
      margin-top: 16px;
      font-size: 12px; color: var(--muted);
      font-family: 'Nunito', sans-serif;
    }

    /* ── NOVEL CONTENT — RESPONSIVE ILLUSTRATIONS ───────── */
    .novel-content {
      font-size: var(--font-base);
      line-height: var(--line-height);
      color: var(--text);
    }
    .novel-content p {
      margin-bottom: 1.5em;
      text-align: justify;
      text-indent: 2em;
    }
    .novel-content p:first-of-type::first-letter {
      font-size: 3em;
      float: left;
      line-height: 0.8;
      padding-right: 8px;
      color: var(--gold);
      font-weight: 600;
    }

    /* ═══════════════════════════════════════════════════════
       RESPONSIVE ILLUSTRATION STYLES
    ═══════════════════════════════════════════════════════ */
    
    /* Container untuk ilustrasi */
    .novel-content .illustration,
    .novel-content .illust,
    .novel-content figure,
    .novel-content .img-container {
      margin: 2.5em auto;
      text-align: center;
      max-width: 100%;
    }

    /* Gambar ilustrasi — responsif */
    .novel-content .illustration img,
    .novel-content .illust img,
    .novel-content figure img,
    .novel-content img.illust,
    .novel-content img.illustration,
    .novel-content .img-container img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    body.light-mode .novel-content img {
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }

    /* Hover effect untuk desktop */
    @media (hover: hover) {
      .novel-content img:hover {
        transform: scale(1.02);
        box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      }
    }

    /* Caption untuk ilustrasi */
    .novel-content figcaption,
    .novel-content .illust-caption,
    .novel-content .caption {
      font-size: 0.85em;
      color: var(--muted);
      font-style: italic;
      margin-top: 12px;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
    }

    /* Ilustrasi full-width pada mobile */
    @media (max-width: 768px) {
      .reader-container {
        padding: calc(var(--header-h) + 20px) 16px 80px;
      }
      .novel-content p {
        text-indent: 1.5em;
      }
      
      /* Ilustrasi full bleed pada mobile */
      .novel-content .illustration,
      .novel-content .illust,
      .novel-content figure,
      .novel-content .img-container {
        margin: 2em -16px; /* Full width dengan negatif margin */
        padding: 0;
      }
      
      .novel-content .illustration img,
      .novel-content .illust img,
      .novel-content figure img,
      .novel-content img.illust,
      .novel-content img.illustration,
      .novel-content .img-container img {
        border-radius: 0; /* No border radius untuk full bleed */
        width: 100%;
        max-width: 100vw;
      }
      
      /* Caption tetap dengan padding */
      .novel-content figcaption,
      .novel-content .illust-caption,
      .novel-content .caption {
        padding: 0 16px;
      }
    }

    /* Ilustrasi landscape mode */
    @media (max-width: 768px) and (orientation: landscape) {
      .novel-content .illustration,
      .novel-content .illust,
      .novel-content figure,
      .novel-content .img-container {
        max-width: 80%;
        margin: 2em auto;
      }
      
      .novel-content .illustration img,
      .novel-content .illust img,
      .novel-content figure img {
        border-radius: 8px;
      }
    }

    /* Tablet optimization */
    @media (min-width: 769px) and (max-width: 1024px) {
      .novel-content .illustration,
      .novel-content .illust,
      .novel-content figure,
      .novel-content .img-container {
        max-width: 90%;
      }
    }

    /* Lightbox untuk ilustrasi */
    .img-lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: zoom-out;
    }
    .img-lightbox.active { display: flex; }
    .img-lightbox img {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
      border-radius: 4px;
    }
    .img-lightbox .close-btn {
      position: absolute; top: 20px; right: 20px;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── NAVIGATION ───────────────────────────────────── */
    .chapter-nav {
      display: flex; gap: 12px;
      margin-top: 60px;
      padding-top: 30px;
      border-top: 1px solid var(--border-gold);
    }
    .nav-btn {
      flex: 1; padding: 16px 20px;
      border-radius: 10px;
      border: 1px solid var(--border-gold);
      background: var(--gold-dim);
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-size: 12px; letter-spacing: 1px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .nav-btn:hover:not(:disabled) {
      background: rgba(201,168,76,0.25);
      transform: translateY(-2px);
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .nav-btn.primary {
      background: linear-gradient(135deg, var(--crimson), #c9291c);
      border-color: transparent;
      color: #fff;
    }
    .nav-btn.primary:hover:not(:disabled) {
      box-shadow: 0 6px 20px rgba(139,26,26,0.4);
    }

    /* ── PROGRESS BAR ─────────────────────────────────── */
    .progress-bar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 3px;
      background: transparent;
      z-index: 1001;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      width: 0%;
      transition: width 0.1s;
    }

    /* ── BOTTOM TOOLBAR ───────────────────────────────── */
    .bottom-toolbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(13,11,20,0.96);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-gold);
      display: flex; align-items: center; justify-content: center;
      gap: 40px;
      padding: 0 20px;
      z-index: 999;
      transition: transform 0.3s ease;
    }
    body.light-mode .bottom-toolbar {
      background: rgba(250,248,245,0.96);
    }
    .bottom-toolbar.hidden {
      transform: translateY(100%);
    }
    .tool-btn {
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      background: none; border: none;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s;
    }
    .tool-btn:hover, .tool-btn.active { color: var(--gold); }
    .tool-icon { font-size: 20px; }
    .tool-label { font-size: 9px; font-family: 'Nunito', sans-serif; font-weight: 700; }

    /* ── COMMENT SECTION ──────────────────────────────── */
    .comment-section {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid var(--border-gold);
    }
    .comment-title {
      font-family: 'Cinzel', serif;
      font-size: 14px; letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* ── LOADING STATES ───────────────────────────────── */
    .skeleton-text {
      background: linear-gradient(90deg, var(--ink3) 0%, var(--ink4) 50%, var(--ink3) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      height: 1em;
      border-radius: 4px;
      margin-bottom: 0.8em;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── SCROLL TO TOP ─────────────────────────────────── */
    .scroll-top {
      position: fixed; bottom: 80px; right: 20px;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--gold-dim);
      border: 1px solid var(--border-gold);
      color: var(--gold);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden;
      transition: all 0.3s;
      z-index: 998;
    }
    .scroll-top.visible {
      opacity: 1; visibility: visible;
    }
    .scroll-top:hover {
      background: rgba(201,168,76,0.25);
      transform: translateY(-3px);
    }

    /* ── TOAST ────────────────────────────────────────── */
    #toastWrap {
      position: fixed; bottom: 80px; left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      pointer-events: none;
    }
    .toast {
      padding: 12px 24px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--crimson), #c9291c);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      margin-top: 8px;
      animation: toastIn 0.3s ease;
      font-family: 'Nunito', sans-serif;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── SELECTION POPUP (Quote) ──────────────────────── */
    .selection-popup {
      position: absolute;
      background: var(--ink3);
      border: 1px solid var(--border-gold);
      border-radius: 8px;
      padding: 8px 12px;
      display: none;
      gap: 8px;
      z-index: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .selection-popup button {
      background: none; border: none;
      color: var(--gold);
      font-size: 12px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
    }

    /* ── RESPONSIVE BREAKPOINTS ───────────────────────── */
    @media (max-width: 480px) {
      :root { --font-base: 16px; }
      .novel-title { max-width: 140px; font-size: 11px; }
      .settings-panel { width: 100%; right: -100%; }
    }

    @media (min-width: 1200px) {
      :root { --font-base: 20px; }
      .reader-container { padding-top: calc(var(--header-h) + 40px); }
    }
  </style>
</head>
<body>

  <!-- Progress Bar -->
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- Header -->
  <header class="reader-header" id="readerHeader">
    <div class="header-left">
      <button class="back-btn" onclick="goBack()">←</button>
      <span class="novel-title" id="novelTitle">Memuat...</span>
    </div>
    <div class="header-right">
      <button class="menu-btn" onclick="toggleSettings()" title="Pengaturan">⚙️</button>
    </div>
  </header>

  <!-- Settings Panel -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-title">⚙️ Pengaturan Baca</div>
    
    <div class="setting-group">
      <span class="setting-label">Ukuran Teks</span>
      <div class="font-size-controls">
        <button class="font-btn" onclick="changeFontSize(-1)">−</button>
        <span class="font-display" id="fontDisplay">18px</span>
        <button class="font-btn" onclick="changeFontSize(1)">+</button>
      </div>
    </div>

    <div class="setting-group">
      <span class="setting-label">Tema</span>
      <div class="theme-toggle">
        <button class="theme-btn active" onclick="setTheme('dark')" id="themeDark">🌙 Gelap</button>
        <button class="theme-btn" onclick="setTheme('light')" id="themeLight">☀️ Terang</button>
      </div>
    </div>

    <div class="setting-group">
      <span class="setting-label">Jarak Baris</span>
      <div class="line-height-options">
        <button class="lh-btn" onclick="setLineHeight(1.6)">Rapat</button>
        <button class="lh-btn active" onclick="setLineHeight(1.9)">Normal</button>
        <button class="lh-btn" onclick="setLineHeight(2.2)">Longgar</button>
      </div>
    </div>
  </div>

  <!-- Reader Container -->
  <main class="reader-container" id="readerContainer">
    <!-- Chapter Header -->
    <div class="chapter-header">
      <div class="chapter-number" id="chapterNumber">CHAPTER 1</div>
      <h1 class="chapter-title" id="chapterTitle">Memuat Chapter...</h1>
      <div class="chapter-meta" id="chapterMeta"></div>
    </div>

    <!-- Novel Content -->
    <article class="novel-content" id="novelContent">
      <!-- Skeleton Loading -->
      <div class="skeleton-text" style="width: 100%; height: 1.2em;"></div>
      <div class="skeleton-text" style="width: 95%;"></div>
      <div class="skeleton-text" style="width: 98%;"></div>
      <div class="skeleton-text" style="width: 92%;"></div>
      <div class="skeleton-text" style="width: 100%; height: 1.2em;"></div>
      <div class="skeleton-text" style="width: 96%;"></div>
      <div class="skeleton-text" style="width: 94%;"></div>
      <div class="skeleton-text" style="width: 100%;"></div>
      <div class="skeleton-text" style="width: 90%;"></div>
      <div class="skeleton-text" style="width: 100%; height: 1.2em;"></div>
      <div class="skeleton-text" style="width: 95%;"></div>
      <div class="skeleton-text" style="width: 88%;"></div>
    </article>

    <!-- Chapter Navigation -->
    <nav class="chapter-nav">
      <button class="nav-btn" id="prevBtn" onclick="goToChapter('prev')">
        ← Sebelumnya
      </button>
      <button class="nav-btn primary" onclick="showChapterList()">
        📑 Daftar Chapter
      </button>
      <button class="nav-btn" id="nextBtn" onclick="goToChapter('next')">
        Selanjutnya →
      </button>
    </nav>

    <!-- Comment Section -->
    <div class="comment-section" id="commentSection">
      <h3 class="comment-title">💬 Komentar Chapter</h3>
      <div id="chapterComments"></div>
    </div>
  </main>

  <!-- Bottom Toolbar -->
  <div class="bottom-toolbar" id="bottomToolbar">
    <button class="tool-btn" onclick="toggleSettings()">
      <span class="tool-icon">⚙️</span>
      <span class="tool-label">Setting</span>
    </button>
    <button class="tool-btn" onclick="toggleFullscreen()">
      <span class="tool-icon" id="fullscreenIcon">⛶</span>
      <span class="tool-label">Layar Penuh</span>
    </button>
    <button class="tool-btn" onclick="scrollToComments()">
      <span class="tool-icon">💬</span>
      <span class="tool-label">Komentar</span>
    </button>
  </div>

  <!-- Scroll to Top -->
  <button class="scroll-top" id="scrollTop" onclick="scrollToTop()">↑</button>

  <!-- Image Lightbox -->
  <div class="img-lightbox" id="imgLightbox" onclick="closeLightbox()">
    <button class="close-btn" onclick="closeLightbox()">✕</button>
    <img src="" alt="Illustration" id="lightboxImg">
  </div>

  <!-- Selection Popup -->
  <div class="selection-popup" id="selectionPopup">
    <button onclick="copySelection()">📋 Salin</button>
    <button onclick="shareSelection()">📤 Bagikan</button>
  </div>

  <!-- Toast -->
  <div id="toastWrap"></div>

  <script type="module">
    import { initAuthHeader } from "/auth-header.js";
    import { getCurrentUser, saveNovelHistory } from "/supabase.js";
    import { initComments } from "/comment-system.js";

    initAuthHeader();

    // State
    let currentUser = null;
    let novelData = null;
    let chapterData = null;
    let settings = {
      fontSize: parseInt(localStorage.getItem('reader_fontSize')) || 18,
      theme: localStorage.getItem('reader_theme') || 'dark',
      lineHeight: parseFloat(localStorage.getItem('reader_lineHeight')) || 1.9
    };

    // Initialize
    window.addEventListener('DOMContentLoaded', async () => {
      if (window._supabase) {
        currentUser = await window._supabase.getCurrentUser();
      }
      
      applySettings();
      await loadChapter();
      setupEventListeners();
      setupImageHandlers();
    });

    // Load Chapter Data
    async function loadChapter() {
      const slug = getChapterSlug();
      if (!slug) {
        showError('Chapter tidak ditemukan');
        return;
      }

      try {
        const res = await fetch(`/novel/sakuranovel/chapter/${slug}`);
        const data = await res.json();
        
        if (!data.data) throw new Error('No data');
        
        chapterData = data.data;
        novelData = data.novel || {};
        
        renderChapter();
        saveHistory();
        initComments({
          containerId: 'chapterComments',
          contentSlug: `chapter:${slug}`,
          accentColor: '#c9a84c',
          user: currentUser
        });
      } catch (err) {
        console.error(err);
        showError('Gagal memuat chapter');
      }
    }

    function getChapterSlug() {
      const path = window.location.pathname;
      const match = path.match(/\/baca-novel\/([^/]+)/);
      return match ? match[1] : new URLSearchParams(window.location.search).get('chapter');
    }

    function renderChapter() {
      // Update header
      document.getElementById('novelTitle').textContent = novelData.title || 'Novel';
      document.getElementById('chapterNumber').textContent = `CHAPTER ${chapterData.number || 1}`;
      document.getElementById('chapterTitle').textContent = chapterData.title || 'Untitled';
      
      // Update meta
      const meta = [];
      if (chapterData.date) meta.push(`📅 ${formatDate(chapterData.date)}`);
      if (chapterData.translator) meta.push(`👤 ${chapterData.translator}`);
      document.getElementById('chapterMeta').textContent = meta.join(' · ');

      // Render content dengan ilustrasi yang responsif
      const content = processContent(chapterData.content);
      document.getElementById('novelContent').innerHTML = content;

      // Update navigation
      updateNavigation();

      // Setup image handlers untuk ilustrasi
      setupImageHandlers();

      // Update title
      document.title = `${chapterData.title} — ${novelData.title || 'Pankomik'}`;
    }

    // Process content untuk memastikan ilustrasi responsif
    function processContent(html) {
      if (!html) return '<p>Tidak ada konten.</p>';

      // Parse HTML
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      
      // Process images untuk responsivitas
      const images = doc.querySelectorAll('img');
      images.forEach(img => {
        // Hapus atribut width/height fixed
        img.removeAttribute('width');
        img.removeAttribute('height');
        
        // Tambahkan class untuk styling
        img.classList.add('illust');
        
        // Pastikan ada container jika belum ada
        const parent = img.parentElement;
        if (parent && !parent.matches('figure, .illustration, .illust, .img-container')) {
          const wrapper = document.createElement('figure');
          wrapper.className = 'illustration';
          parent.insertBefore(wrapper, img);
          wrapper.appendChild(img);
          
          // Tambahkan caption jika ada alt text
          if (img.alt) {
            const caption = document.createElement('figcaption');
            caption.textContent = img.alt;
            wrapper.appendChild(caption);
          }
        }
        
        // Lazy loading
        img.loading = 'lazy';
        img.decoding = 'async';
      });

      // Wrap text nodes in paragraphs jika belum
      const body = doc.body;
      let currentP = null;
      
      Array.from(body.childNodes).forEach(node => {
        if (node.nodeType === Node.TEXT_NODE && node.textContent.trim()) {
          if (!currentP) {
            currentP = document.createElement('p');
            node.parentNode.insertBefore(currentP, node);
          }
          currentP.appendChild(node);
        } else if (node.nodeType === Node.ELEMENT_NODE) {
          currentP = null;
        }
      });

      return body.innerHTML;
    }

    // Setup image click handlers untuk lightbox
    function setupImageHandlers() {
      const images = document.querySelectorAll('.novel-content img');
      const lightbox = document.getElementById('imgLightbox');
      const lightboxImg = document.getElementById('lightboxImg');

      images.forEach(img => {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', (e) => {
          e.preventDefault();
          lightboxImg.src = img.src;
          lightboxImg.alt = img.alt || 'Illustration';
          lightbox.classList.add('active');
          document.body.style.overflow = 'hidden';
        });
      });
    }

    window.closeLightbox = function() {
      const lightbox = document.getElementById('imgLightbox');
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    };

    // Navigation
    function updateNavigation() {
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      
      prevBtn.disabled = !chapterData.prev_slug;
      nextBtn.disabled = !chapterData.next_slug;
    }

    window.goToChapter = function(direction) {
      const slug = direction === 'prev' ? chapterData.prev_slug : chapterData.next_slug;
      if (slug) {
        window.location.href = `/baca-novel/${slug}`;
      }
    };

    window.goBack = function() {
      if (novelData.slug) {
        window.location.href = `/novel/${novelData.slug}`;
      } else {
        history.back();
      }
    };

    window.showChapterList = function() {
      if (novelData.slug) {
        window.location.href = `/novel/${novelData.slug}#chapters`;
      }
    };

    // Settings
    window.toggleSettings = function() {
      const panel = document.getElementById('settingsPanel');
      panel.classList.toggle('open');
    };

    window.changeFontSize = function(delta) {
      settings.fontSize = Math.max(14, Math.min(24, settings.fontSize + delta));
      applySettings();
      saveSettings();
    };

    window.setTheme = function(theme) {
      settings.theme = theme;
      applySettings();
      saveSettings();
    };

    window.setLineHeight = function(lh) {
      settings.lineHeight = lh;
      applySettings();
      saveSettings();
    };

    function applySettings() {
      const root = document.documentElement;
      
      // Font size
      root.style.setProperty('--font-base', settings.fontSize + 'px');
      document.getElementById('fontDisplay').textContent = settings.fontSize + 'px';
      
      // Theme
      if (settings.theme === 'light') {
        document.body.classList.add('light-mode');
        document.getElementById('themeLight').classList.add('active');
        document.getElementById('themeDark').classList.remove('active');
      } else {
        document.body.classList.remove('light-mode');
        document.getElementById('themeDark').classList.add('active');
        document.getElementById('themeLight').classList.remove('active');
      }
      
      // Line height
      root.style.setProperty('--line-height', settings.lineHeight);
      document.querySelectorAll('.lh-btn').forEach(btn => {
        btn.classList.toggle('active', 
          Math.abs(parseFloat(btn.onclick.toString().match(/[\d.]+/)) - settings.lineHeight) < 0.1
        );
      });
    }

    function saveSettings() {
      localStorage.setItem('reader_fontSize', settings.fontSize);
      localStorage.setItem('reader_theme', settings.theme);
      localStorage.setItem('reader_lineHeight', settings.lineHeight);
    }

    // Fullscreen
    window.toggleFullscreen = function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    // Scroll handlers
    window.scrollToTop = function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.scrollToComments = function() {
      document.getElementById('commentSection').scrollIntoView({ behavior: 'smooth' });
    };

    // Progress bar
    function updateProgress() {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = (scrollTop / docHeight) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
    }

    // Auto-hide header/toolbar on scroll
    let lastScroll = 0;
    let scrollTimeout;
    
    function handleScroll() {
      const currentScroll = window.scrollY;
      const header = document.getElementById('readerHeader');
      const toolbar = document.getElementById('bottomToolbar');
      const scrollTop = document.getElementById('scrollTop');
      
      // Progress bar
      updateProgress();
      
      // Show/hide scroll to top
      scrollTop.classList.toggle('visible', currentScroll > 500);
      
      // Auto hide/show header & toolbar
      if (currentScroll > lastScroll && currentScroll > 100) {
        header.classList.add('hidden');
        toolbar.classList.add('hidden');
      } else {
        header.classList.remove('hidden');
        toolbar.classList.remove('hidden');
      }
      
      lastScroll = currentScroll;
      
      // Clear timeout untuk save history
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(saveReadingPosition, 3000);
    }

    // Save reading position
    function saveReadingPosition() {
      const slug = getChapterSlug();
      if (slug) {
        localStorage.setItem(`read_pos_${slug}`, window.scrollY);
      }
    }

    // Restore reading position
    function restoreReadingPosition() {
      const slug = getChapterSlug();
      const pos = localStorage.getItem(`read_pos_${slug}`);
      if (pos) {
        window.scrollTo({ top: parseInt(pos), behavior: 'auto' });
      }
    }

    // Save to history
    async function saveHistory() {
      if (!currentUser || !window._supabase) return;
      
      try {
        await window._supabase.saveNovelHistory(currentUser.id, {
          novel_slug: novelData.slug,
          novel_title: novelData.title,
          chapter_slug: chapterData.slug,
          chapter_title: chapterData.title,
          chapter_number: chapterData.number,
          cover: novelData.poster || ''
        });
      } catch (e) {
        console.warn('Failed to save history:', e);
      }
    }

    // Event listeners
    function setupEventListeners() {
      window.addEventListener('scroll', handleScroll, { passive: true });
      
      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.target.matches('input, textarea')) return;
        
        switch(e.key) {
          case 'ArrowLeft':
            if (chapterData?.prev_slug) goToChapter('prev');
            break;
          case 'ArrowRight':
          case ' ':
            if (chapterData?.next_slug) goToChapter('next');
            break;
          case 'Escape':
            closeLightbox();
            document.getElementById('settingsPanel').classList.remove('open');
            break;
          case 'f':
            toggleFullscreen();
            break;
        }
      });
      
      // Close settings on outside click
      document.addEventListener('click', (e) => {
        const panel = document.getElementById('settingsPanel');
        const btn = e.target.closest('.menu-btn');
        if (!panel.contains(e.target) && !btn) {
          panel.classList.remove('open');
        }
      });
      
      // Text selection popup
      document.addEventListener('selectionchange', () => {
        const selection = window.getSelection();
        const popup = document.getElementById('selectionPopup');
        
        if (selection.toString().trim().length > 0) {
          const range = selection.getRangeAt(0);
          const rect = range.getBoundingClientRect();
          popup.style.display = 'flex';
          popup.style.top = (rect.top - 40) + 'px';
          popup.style.left = (rect.left + rect.width / 2 - 50) + 'px';
        } else {
          popup.style.display = 'none';
        }
      });
      
      // Restore position after load
      setTimeout(restoreReadingPosition, 100);
    }

    // Helpers
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('id-ID', { 
        day: 'numeric', 
        month: 'short', 
        year: 'numeric' 
      });
    }

    function showError(msg) {
      document.getElementById('novelContent').innerHTML = `
        <div style="text-align:center;padding:60px 20px;color:var(--muted);">
          <p style="font-size:40px;margin-bottom:16px;">📖</p>
          <p style="font-style:italic;font-size:16px;margin-bottom:20px;">${msg}</p>
          <button onclick="location.reload()" style="
            padding:12px 24px;
            background:linear-gradient(135deg,var(--crimson),#c9291c);
            color:#fff;border:none;border-radius:8px;
            cursor:pointer;font-family:'Cinzel',serif;font-size:12px;
          ">Coba Lagi</button>
        </div>
      `;
    }

    // Text selection actions
    window.copySelection = function() {
      const text = window.getSelection().toString();
      navigator.clipboard.writeText(text).then(() => {
        toast('Teks disalin!');
      });
      document.getElementById('selectionPopup').style.display = 'none';
    };

    window.shareSelection = function() {
      const text = window.getSelection().toString();
      if (navigator.share) {
        navigator.share({
          title: document.title,
          text: text,
          url: window.location.href
        });
      } else {
        navigator.clipboard.writeText(`"${text}" — ${window.location.href}`).then(() => {
          toast('Kutipan disalin!');
        });
      }
      document.getElementById('selectionPopup').style.display = 'none';
    };

    // Toast notification
    function toast(msg) {
      const wrap = document.getElementById('toastWrap');
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      wrap.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    // Expose to window
    window._supabase = { getCurrentUser, saveNovelHistory };
  </script>
</body>
</html>
