<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime — Pankomik</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Bangers&display=swap" rel="stylesheet">
  <style>
    :root {
      --anime-accent: #6c63ff;
      --anime-accent2: #a78bfa;
      --anime-glow: rgba(108,99,255,0.3);
      --anime-surface: rgba(108,99,255,0.08);
    }

    /* ── Anime Hero Banner ─────────────────────────────────── */
    .anime-hero {
      position: relative;
      overflow: hidden;
      padding: 20px 14px 16px;
      background: linear-gradient(135deg,
        rgba(108,99,255,0.15) 0%,
        rgba(167,139,250,0.08) 50%,
        transparent 100%);
      border-bottom: 1px solid rgba(108,99,255,0.15);
    }
    .anime-hero::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 60% at 10% 50%,
        rgba(108,99,255,0.12) 0%, transparent 70%);
    }
    .anime-hero-title {
      font-family: 'Bangers', cursive;
      font-size: 32px;
      letter-spacing: 3px;
      color: var(--anime-accent2);
      text-shadow: 0 0 30px rgba(108,99,255,0.5);
      position: relative;
      z-index: 1;
      margin-bottom: 4px;
    }
    .anime-hero-sub {
      font-size: 12px;
      color: var(--text-muted);
      position: relative; z-index: 1;
    }

    /* ── Search Anime ──────────────────────────────────────── */
    .anime-search-wrap {
      padding: 12px 14px 0;
      position: relative;
    }
    .anime-search {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    .anime-search:focus {
      border-color: var(--anime-accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }
    .anime-search-icon {
      position: absolute;
      left: 26px; top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
    }
    #animeSearchResult {
      position: fixed;
      top: calc(var(--header-h) + 60px);
      left: 10px; right: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-height: 340px;
      overflow-y: auto;
      display: none;
      z-index: 1999;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .anime-search-item {
      display: flex; gap: 10px; padding: 10px 12px;
      cursor: pointer; border-bottom: 1px solid var(--border);
      transition: background 0.15s; align-items: center;
    }
    .anime-search-item:last-child { border-bottom: none; }
    .anime-search-item:hover { background: var(--bg-card); }
    .anime-search-item img {
      width: 38px; height: 54px; object-fit: cover;
      border-radius: 5px; flex-shrink: 0;
    }
    .anime-search-item .asi-info p:first-child {
      font-size: 13px; font-weight: 700; color: var(--text);
    }
    .anime-search-item .asi-info p:last-child {
      font-size: 11px; color: var(--anime-accent2); margin-top: 2px;
    }

    /* ── Tab Pills ─────────────────────────────────────────── */
    .anime-tabs {
      display: flex;
      gap: 8px;
      padding: 14px 14px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .anime-tabs::-webkit-scrollbar { display: none; }
    .anime-tab {
      flex-shrink: 0;
      padding: 7px 16px;
      border-radius: 99px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-family: 'Nunito', sans-serif;
      font-size: 12px; font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .anime-tab.active {
      background: var(--anime-accent);
      border-color: var(--anime-accent);
      color: #fff;
      box-shadow: 0 4px 14px var(--anime-glow);
    }
    .anime-tab:not(.active):hover {
      border-color: var(--anime-accent);
      color: var(--anime-accent2);
    }

    /* ── Tab Content ───────────────────────────────────────── */
    .anime-tab-content { display: none; }
    .anime-tab-content.active { display: block; }

    /* ── Section Title Anime ───────────────────────────────── */
    .anime-section-title {
      font-family: 'Bangers', cursive;
      font-size: 18px;
      letter-spacing: 1px;
      padding: 14px 14px 8px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .anime-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--anime-accent), transparent);
      opacity: 0.3;
      margin-left: 4px;
    }

    /* ── Anime Grid ────────────────────────────────────────── */
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 14px 14px;
    }
    @media (min-width: 400px) {
      .anime-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .anime-card {
      background: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.18s, border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .anime-card:hover {
      transform: translateY(-3px);
      border-color: var(--anime-accent);
      box-shadow: 0 8px 24px rgba(108,99,255,0.2);
    }
    .anime-card:active { transform: scale(0.97); }

    .anime-card-img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
      background: var(--bg-surface);
    }

    .anime-card-eps {
      position: absolute;
      top: 6px; left: 6px;
      background: rgba(108,99,255,0.9);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 9px; font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
    }

    .anime-card-day {
      position: absolute;
      top: 6px; right: 6px;
      background: rgba(0,0,0,0.75);
      color: var(--anime-accent2);
      font-size: 9px; font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
    }

    .anime-card-info {
      padding: 7px 8px 8px;
    }
    .anime-card-title {
      font-size: 11px;
      font-weight: 800;
      line-height: 1.4;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 3px;
    }
    .anime-card-meta {
      font-size: 10px;
      color: var(--text-muted);
    }
    .anime-card-score {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: #f5a623;
      font-weight: 700;
      font-size: 10px;
    }

    /* ── Ongoing Slider ────────────────────────────────────── */
    .anime-ongoing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 14px 14px;
    }

    /* ── Schedule Section ──────────────────────────────────── */
    .schedule-day-wrap {
      margin-bottom: 6px;
    }
    .schedule-day-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      cursor: pointer;
      user-select: none;
    }
    .schedule-day-name {
      font-family: 'Bangers', cursive;
      font-size: 16px;
      letter-spacing: 1px;
      color: var(--anime-accent2);
    }
    .schedule-day-count {
      font-size: 10px;
      font-weight: 800;
      background: var(--anime-surface);
      color: var(--anime-accent2);
      padding: 2px 7px;
      border-radius: 99px;
      border: 1px solid rgba(108,99,255,0.2);
    }
    .schedule-day-arrow {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-muted);
      transition: transform 0.2s;
    }
    .schedule-day-wrap.open .schedule-day-arrow { transform: rotate(180deg); }
    .schedule-day-list {
      display: none;
      padding: 0 14px 8px;
    }
    .schedule-day-wrap.open .schedule-day-list { display: block; }
    .schedule-item {
      display: flex;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      align-items: center;
      transition: background 0.15s;
    }
    .schedule-item:last-child { border-bottom: none; }
    .schedule-item img {
      width: 40px; height: 56px;
      object-fit: cover; border-radius: 6px;
      flex-shrink: 0; background: var(--bg-surface);
    }
    .schedule-item-info { flex: 1; min-width: 0; }
    .schedule-item-title {
      font-size: 13px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .schedule-item-meta {
      font-size: 11px; color: var(--text-muted); margin-top: 2px;
    }
    .schedule-item-btn {
      flex-shrink: 0;
      padding: 5px 11px;
      background: var(--anime-accent);
      color: #fff;
      border: none; border-radius: 7px;
      font-family: 'Nunito', sans-serif;
      font-size: 11px; font-weight: 800;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .schedule-item-btn:hover { filter: brightness(1.15); }

    /* ── Genre Chips ───────────────────────────────────────── */
    .genre-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 0 14px 14px;
    }
    .genre-chip-anime {
      padding: 9px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 12px; font-weight: 700;
      color: var(--text);
      text-align: center;
      cursor: pointer;
      transition: all 0.18s;
    }
    .genre-chip-anime:hover {
      background: var(--anime-surface);
      border-color: var(--anime-accent);
      color: var(--anime-accent2);
      transform: translateY(-1px);
    }
    .genre-chip-anime:active { transform: scale(0.97); }

    /* ── Load More ─────────────────────────────────────────── */
    .load-more-wrap {
      padding: 4px 14px 20px;
      display: none;
    }
    .load-more-btn {
      width: 100%;
      padding: 12px;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 13px; font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .load-more-btn:hover {
      background: var(--anime-accent);
      border-color: var(--anime-accent);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px var(--anime-glow);
    }
    .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Skeleton ──────────────────────────────────────────── */
    .skel-anime {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-surface) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 10px;
    }
    .skel-anime-card {
      aspect-ratio: 3/4;
    }

    /* ── Empty state ───────────────────────────────────────── */
    .anime-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .anime-empty .ico { font-size: 40px; margin-bottom: 10px; }

    /* Pastikan card image tidak blank saat loading */
    .anime-card-img {
      background-color: var(--bg-surface);
      min-height: 120px;
    }

    /* ── Spinner ───────────────────────────────────────────── */
    .anime-spinner {
      display: flex; align-items: center; justify-content: center;
      padding: 40px; gap: 12px; color: var(--text-muted); font-size: 13px;
    }
    .spin-ring {
      width: 24px; height: 24px;
      border: 3px solid rgba(108,99,255,0.2);
      border-top-color: var(--anime-accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>

<script type="module">
import { animeURL, animeGenreURL, animeWatchURL } from "/router.js";

/* Expose ke window agar bisa dipakai di onclick template string */
window._animeURL      = animeURL;
window._animeGenreURL = animeGenreURL;
window._animeWatchURL = animeWatchURL;

const API = "https://www.sankavollerei.com";
let ongoingPage = 1, completePage = 1;
let ongoingDone = false, completeDone = false;
let scheduleLoaded = false, genreLoaded = false;

/* ── Init ─────────────────────────────────────────────────── */
window.addEventListener("load", () => {
  if (localStorage.getItem("theme") === "light") document.body.classList.add("light");
  loadOngoing();
});

/* ── Tab switch ───────────────────────────────────────────── */
window.switchTab = function(tab, btn) {
  document.querySelectorAll(".anime-tab").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".anime-tab-content").forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(`tab-${tab}`).classList.add("active");

  if (tab === "complete"  && !completeDone)   loadComplete(true);
  if (tab === "schedule"  && !scheduleLoaded) loadSchedule();
  if (tab === "genre"     && !genreLoaded)    loadGenres();
};

/* ── Proxy img ────────────────────────────────────────────── */
function pImg(url, w=300) {
  return url || "";
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── Navigate ─────────────────────────────────────────────── */
window.gotoAnime = function(id) { window.location.href = animeURL(id); };

/* ── Render card ──────────────────────────────────────────── */
function renderCard(a, badge="") {
  const img   = pImg(a.poster || a.img, 200);
  const title = esc(a.title);
  const id    = a.animeId || a.slug || a.id || "";
  const eps   = a.episodes ? `Ep ${a.episodes}` : "";
  const score = a.score && a.score !== "null" ? a.score : "";
  const day   = a.releaseDay ? a.releaseDay.slice(0,3) : "";
  return `
    <div class="anime-card" onclick="gotoAnime('${esc(id)}')">
      ${img
        ? `<img class="anime-card-img" src="${esc(img)}" alt="${title}" loading="lazy"
            onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=\'anime-card-img\' style=\'display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--bg-surface)\'>⚡</div>')">`
        : `<div class="anime-card-img" style="display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--bg-surface);">⚡</div>`}
      ${eps ? `<span class="anime-card-eps">${eps}</span>` : ""}
      ${day ? `<span class="anime-card-day">${day}</span>` : ""}
      ${badge ? `<span class="anime-card-eps" style="background:rgba(232,82,42,0.9);left:auto;right:6px;top:auto;bottom:6px;">${badge}</span>` : ""}
      <div class="anime-card-info">
        <div class="anime-card-title">${title}</div>
        ${score ? `<div class="anime-card-score">⭐ ${esc(score)}</div>` :
                   `<div class="anime-card-meta">${esc(a.season||a.latestReleaseDate||"")}</div>`}
      </div>
    </div>`;
}

/* ── ONGOING ──────────────────────────────────────────────── */
async function loadOngoing(append=false) {
  const grid = document.getElementById("ongoingGrid");
  if (!append) grid.innerHTML = Array(9).fill('<div class="skel-anime skel-anime-card"></div>').join('');
  try {
    const res  = await fetch(`${API}/anime/ongoing-anime?page=${ongoingPage}`);
    const json = await res.json();
    const list = json.data?.animeList || [];
    if (!append) grid.innerHTML = "";
    if (!list.length && !append) {
      grid.innerHTML = '<div class="anime-empty" style="grid-column:1/-1"><div class="ico">😕</div><p>Tidak ada data</p></div>';
      return;
    }
    list.forEach(a => { grid.insertAdjacentHTML("beforeend", renderCard(a)); });
    const more = document.getElementById("ongoingMore");
    if (json.pagination?.hasNextPage) {
      more.style.display = "block";
      ongoingPage++;
    } else {
      more.style.display = "none";
      ongoingDone = true;
    }
  } catch(e) {
    console.error(e);
    if (!append) grid.innerHTML = '<div class="anime-empty" style="grid-column:1/-1"><div class="ico">😕</div><p>Gagal memuat. Coba lagi.</p></div>';
  }
}
window.loadMoreOngoing = () => loadOngoing(true);

/* ── COMPLETE ─────────────────────────────────────────────── */
async function loadComplete(reset=false) {
  if (reset) { completePage = 1; completeDone = false; }
  const grid = document.getElementById("completeGrid");
  if (completePage === 1) grid.innerHTML = Array(9).fill('<div class="skel-anime skel-anime-card"></div>').join('');
  try {
    const res  = await fetch(`${API}/anime/complete-anime?page=${completePage}`);
    const json = await res.json();
    const list = json.data?.animeList || [];
    if (completePage === 1) grid.innerHTML = "";
    list.forEach(a => { grid.insertAdjacentHTML("beforeend", renderCard(a)); });
    const more = document.getElementById("completeMore");
    if (json.pagination?.hasNextPage) {
      more.style.display = "block"; completePage++;
    } else {
      more.style.display = "none"; completeDone = true;
    }
  } catch(e) {
    if (completePage === 1) grid.innerHTML = '<div class="anime-empty" style="grid-column:1/-1"><div class="ico">😕</div><p>Gagal memuat.</p></div>';
  }
}
window.loadMoreComplete = () => loadComplete(false);

/* ── SCHEDULE ─────────────────────────────────────────────── */
async function loadSchedule() {
  scheduleLoaded = true;
  const el = document.getElementById("scheduleContent");
  try {
    const res  = await fetch(`${API}/anime/schedule`);
    const json = await res.json();
    const days = json.data || [];

    const TODAY_IDX = new Date().getDay(); // 0=Sun..6=Sat
    const dayMap = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
    const todayName = dayMap[TODAY_IDX];

    el.innerHTML = days.map(d => {
      const isToday = d.day === todayName;
      const items = (d.anime_list || []).map(a => `
        <div class="schedule-item" onclick="gotoAnime('${esc(a.slug)}')">
          ${a.poster ? `<img src="${esc(pImg(a.poster,80))}" alt="${esc(a.title)}" loading="lazy"
            onerror="this.outerHTML='<div style=\'width:40px;height:56px;background:var(--bg-surface);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center\'>⚡</div>'" >` :
            `<div style="width:40px;height:56px;background:var(--bg-surface);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;">⚡</div>`}
          <div class="schedule-item-info">
            <div class="schedule-item-title">${esc(a.title)}</div>
            <div class="schedule-item-meta">Tayang ${esc(d.day)}</div>
          </div>
          <button class="schedule-item-btn">Tonton</button>
        </div>`).join('');

      return `
        <div class="schedule-day-wrap ${isToday ? 'open' : ''}">
          <div class="schedule-day-header" onclick="toggleScheduleDay(this.parentElement)">
            <span class="schedule-day-name">${esc(d.day)}${isToday ? ' 🔴' : ''}</span>
            <span class="schedule-day-count">${d.anime_list?.length||0} anime</span>
            <span class="schedule-day-arrow">▼</span>
          </div>
          <div class="schedule-day-list">${items}</div>
        </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = '<div class="anime-empty"><div class="ico">😕</div><p>Gagal memuat jadwal.</p></div>';
  }
}
window.toggleScheduleDay = function(wrap) {
  wrap.classList.toggle("open");
};

/* ── GENRE ────────────────────────────────────────────────── */
async function loadGenres() {
  genreLoaded = true;
  const el = document.getElementById("genreGrid");
  try {
    const res  = await fetch(`${API}/anime/genre`);
    const json = await res.json();
    const list = json.data?.genreList || [];
    el.innerHTML = list.map(g =>
      `<div class="genre-chip-anime" onclick="window.location.href=window._animeGenreURL('${esc(g.genreId)}')">
        ${esc(g.title)}
      </div>`
    ).join('');
  } catch(e) {
    el.innerHTML = '<div class="anime-empty" style="grid-column:1/-1"><div class="ico">😕</div><p>Gagal memuat genre.</p></div>';
  }
}

/* ── SEARCH ───────────────────────────────────────────────── */
let _searchTimer;
window.searchAnime = function(q) {
  const box = document.getElementById("animeSearchResult");
  clearTimeout(_searchTimer);
  if (!q.trim()) { box.style.display="none"; return; }
  box.style.display = "block";
  box.innerHTML = '<div class="anime-spinner" style="padding:16px;"><div class="spin-ring"></div>Mencari...</div>';
  _searchTimer = setTimeout(async () => {
    try {
      const res  = await fetch(`${API}/anime/ongoing-anime?page=1`);
      const json = await res.json();
      const list = (json.data?.animeList || []).filter(a =>
        a.title.toLowerCase().includes(q.toLowerCase())
      ).slice(0,6);

      if (!list.length) {
        box.innerHTML = '<div class="anime-search-item" style="justify-content:center;color:var(--text-muted);font-size:13px;">Tidak ditemukan 😕</div>';
        return;
      }
      box.innerHTML = list.map(a => `
        <div class="anime-search-item" onclick="gotoAnime('${esc(a.animeId||'')}');document.getElementById('animeSearchResult').style.display='none'">
          ${a.poster ? `<img src="${esc(pImg(a.poster,80))}" alt="${esc(a.title)}" loading="lazy">` : ''}
          <div class="asi-info">
            <p>${esc(a.title)}</p>
            <p>Ep ${a.episodes||'?'} · ${esc(a.releaseDay||'')}</p>
          </div>
        </div>`).join('');
    } catch(e) {
      box.innerHTML = '<div class="anime-search-item" style="justify-content:center;color:var(--text-muted);">Gagal mencari</div>';
    }
  }, 400);
};

document.addEventListener("click", e => {
  const box = document.getElementById("animeSearchResult");
  const inp = document.getElementById("animeSearchInput");
  if (box && !box.contains(e.target) && !inp.contains(e.target)) box.style.display="none";
});

/* ── UI helpers ───────────────────────────────────────────── */
window.toggleDarkMode = () => {
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light")?"light":"dark");
};
window.toggleMenu = () => {
  const m = document.getElementById("menuDropdown");
  if (m) m.style.display = m.style.display==="block"?"none":"block";
};
document.addEventListener("click", e => {
  const m = document.getElementById("menuDropdown");
  const b = document.querySelector('button[onclick="toggleMenu()"]');
  if (m && !m.contains(e.target) && !b?.contains(e.target)) m.style.display="none";
});
</script>
