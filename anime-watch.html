<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonton Anime — Pankomik</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    :root {
      --anime-accent: #6c63ff;
      --anime-accent2: #a78bfa;
      --anime-glow: rgba(108,99,255,0.3);
      --anime-surface: rgba(108,99,255,0.08);
    }

    body { background: #08080f; }
    body.light { background: #0e0e16; }

    .player-wrap { position:relative; width:100%; background:#000; overflow:hidden; }
    .player-ratio { position:relative; width:100%; padding-bottom:56.25%; }
    #playerFrame { position:absolute; inset:0; width:100%; height:100%; border:none; }
    .player-loading {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:#050508; gap:14px;
      z-index:5; transition:opacity 0.3s;
    }
    .player-loading.hidden { opacity:0; pointer-events:none; }
    .player-spin {
      width:48px; height:48px;
      border:4px solid rgba(108,99,255,0.15);
      border-top-color:var(--anime-accent);
      border-radius:50%; animation:spin 0.7s linear infinite;
    }
    .player-loading p { font-size:13px; color:rgba(108,99,255,0.6); font-weight:700; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .watch-header {
      display:flex; align-items:center;
      padding:10px 14px; gap:10px;
      background:rgba(8,8,15,0.95);
      border-bottom:1px solid rgba(108,99,255,0.1);
      position:sticky; top:0; z-index:100;
    }
    .watch-back {
      width:32px; height:32px;
      background:rgba(108,99,255,0.12);
      border:1px solid rgba(108,99,255,0.2);
      border-radius:8px; color:var(--anime-accent2);
      font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:background 0.2s;
    }
    .watch-back:hover { background:rgba(108,99,255,0.25); }
    .watch-title {
      flex:1; min-width:0;
      font-size:13px; font-weight:800;
      color:#eaeaf0;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .watch-share { width:32px; height:32px; background:transparent; border:none; color:var(--text-muted); font-size:16px; cursor:pointer; flex-shrink:0; }

    .ep-info-bar { padding:10px 14px; background:rgba(108,99,255,0.05); border-bottom:1px solid rgba(108,99,255,0.1); }
    .ep-info-bar h2 { font-size:14px; font-weight:800; color:#eaeaf0; margin-bottom:4px; }
    .ep-info-bar p { font-size:11px; color:#666; }

    .ep-nav { display:flex; gap:8px; padding:10px 14px; border-bottom:1px solid rgba(108,99,255,0.08); }
    .ep-nav-btn {
      flex:1; padding:9px 0;
      background:rgba(108,99,255,0.08);
      border:1px solid rgba(108,99,255,0.15);
      border-radius:9px; color:var(--anime-accent2);
      font-family:'Nunito',sans-serif; font-size:13px; font-weight:800;
      cursor:pointer; transition:all 0.2s;
      display:flex; align-items:center; justify-content:center; gap:5px;
    }
    .ep-nav-btn:hover { background:var(--anime-accent); border-color:var(--anime-accent); color:#fff; }
    .ep-nav-btn:disabled { opacity:0.3; cursor:not-allowed; pointer-events:none; }

    .server-section { padding:12px 14px 8px; }
    .server-section-title { font-size:11px; font-weight:800; color:#555; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
    .quality-group { margin-bottom:10px; }
    .quality-label { font-size:10px; font-weight:800; color:var(--anime-accent2); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
    .quality-label::after { content:''; flex:1; height:1px; background:rgba(108,99,255,0.15); }
    .server-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .server-chip {
      padding:6px 12px;
      background:rgba(108,99,255,0.08);
      border:1px solid rgba(108,99,255,0.15);
      border-radius:7px; color:var(--anime-accent2);
      font-family:'Nunito',sans-serif; font-size:11px; font-weight:800;
      cursor:pointer; transition:all 0.18s;
    }
    .server-chip:hover { background:rgba(108,99,255,0.2); border-color:var(--anime-accent); }
    .server-chip.active { background:var(--anime-accent); border-color:var(--anime-accent); color:#fff; box-shadow:0 3px 10px var(--anime-glow); }
    .server-chip.loading { opacity:0.6; pointer-events:none; }
    .quality-empty { font-size:11px; color:#444; padding:4px 0; font-style:italic; }

    .download-section { padding:8px 14px 12px; border-top:1px solid rgba(108,99,255,0.08); }
    .download-title { font-size:11px; font-weight:800; color:#555; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .dl-quality-group { margin-bottom:8px; }
    .dl-quality-label { font-size:10px; font-weight:800; color:#27ae60; margin-bottom:5px; }
    .dl-links { display:flex; flex-wrap:wrap; gap:5px; }
    .dl-link { padding:5px 10px; background:rgba(39,174,96,0.1); border:1px solid rgba(39,174,96,0.2); border-radius:6px; color:#27ae60; font-size:11px; font-weight:700; cursor:pointer; text-decoration:none; transition:all 0.18s; }
    .dl-link:hover { background:#27ae60; color:#fff; }

    .ep-list-wrap { padding:8px 14px 14px; border-top:1px solid rgba(108,99,255,0.08); }
    .ep-list-title { font-size:11px; font-weight:800; color:#555; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .ep-list-scroll { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
    .ep-list-scroll::-webkit-scrollbar { display:none; }
    .ep-chip { flex-shrink:0; padding:6px 12px; background:rgba(108,99,255,0.08); border:1px solid rgba(108,99,255,0.15); border-radius:7px; cursor:pointer; font-size:11px; font-weight:800; color:var(--anime-accent2); transition:all 0.18s; }
    .ep-chip:hover { background:rgba(108,99,255,0.2); }
    .ep-chip.current { background:var(--anime-accent); border-color:var(--anime-accent); color:#fff; }

    .anime-info-bar { padding:10px 14px; background:rgba(108,99,255,0.04); border-top:1px solid rgba(108,99,255,0.08); display:flex; align-items:center; gap:10px; cursor:pointer; transition:background 0.2s; }
    .anime-info-bar:hover { background:rgba(108,99,255,0.1); }
    .anime-info-back-title { font-size:12px; font-weight:800; color:var(--anime-accent2); flex:1; }
    .anime-info-sub { font-size:10px; color:#555; }

    .player-error { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#050508; gap:12px; color:#666; text-align:center; padding:20px; }
    .player-error .err-icon { font-size:40px; }
    .player-error p { font-size:13px; }
    .btn-retry { padding:9px 20px; background:var(--anime-accent); color:#fff; border:none; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; font-family:'Nunito',sans-serif; }
    .err-msg { font-size:13px; color:#aaa; }
    .err-id  { font-size:11px; color:#666; margin-top:4px; }
    .err-det { font-size:10px; color:#555; margin-top:2px; max-width:280px; word-break:break-all; }

    .ep-genre-wrap { display:flex; flex-wrap:wrap; gap:5px; padding:0 14px 10px; }
    .ep-genre-chip { padding:3px 8px; background:rgba(108,99,255,0.08); border:1px solid rgba(108,99,255,0.15); border-radius:99px; font-size:10px; font-weight:700; color:var(--anime-accent2); cursor:pointer; transition:all 0.18s; }
    .ep-genre-chip:hover { background:var(--anime-accent); color:#fff; }
  </style>
</head>
<body>

<div class="watch-header">
  <div class="watch-back" onclick="history.back()">←</div>
  <div class="watch-title" id="watchTitle">Memuat...</div>
  <button class="watch-share" onclick="shareEp()">🔗</button>
</div>

<div class="player-wrap">
  <div class="player-ratio">
    <div class="player-loading" id="playerLoading">
      <div class="player-spin"></div>
      <p>Memuat stream...</p>
    </div>
    <iframe id="playerFrame" allowfullscreen allow="autoplay; fullscreen" scrolling="no" frameborder="0"></iframe>
  </div>
</div>

<div class="ep-info-bar">
  <h2 id="epTitle">Memuat...</h2>
  <p id="epMeta">—</p>
</div>

<div class="ep-nav">
  <button class="ep-nav-btn" id="prevEpBtn" disabled onclick="goPrev()">⬅ Sebelumnya</button>
  <button class="ep-nav-btn" id="nextEpBtn" disabled onclick="goNext()">Selanjutnya ➡</button>
</div>

<div class="server-section" id="serverSection">
  <div class="server-section-title">🖥 Pilih Server</div>
  <div id="serverList"><div style="color:#555;font-size:13px;text-align:center;padding:10px;">Memuat server...</div></div>
</div>

<div class="ep-genre-wrap" id="epGenreWrap" style="display:none"></div>

<div class="anime-info-bar" id="animeInfoBar" style="display:none" onclick="goToAnimeDetail()">
  <span style="font-size:20px;">⚡</span>
  <div>
    <div class="anime-info-back-title" id="animeInfoTitle">Lihat Detail Anime</div>
    <div class="anime-info-sub">Tap untuk ke halaman detail</div>
  </div>
  <span style="color:#555;font-size:14px;">→</span>
</div>

<div class="ep-list-wrap" id="epListWrap" style="display:none">
  <div class="ep-list-title">📺 Episode Lainnya</div>
  <div class="ep-list-scroll" id="epListScroll"></div>
</div>

<div class="download-section" id="downloadSection" style="display:none">
  <div class="download-title">⬇ Unduh Episode</div>
  <div id="downloadLinks"></div>
</div>

<div id="menuDropdown" class="dropdown" style="display:none;position:fixed;right:10px;top:58px;z-index:2000;background:rgba(20,20,28,0.96);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.10);border-radius:12px;overflow:hidden;min-width:160px;box-shadow:0 8px 32px rgba(0,0,0,0.5);"></div>

<script type="module">
  import { initAuthHeader } from "/auth-header.js";
  initAuthHeader();
</script>
<script type="module">
import { getAnimeEpisodeId, animeWatchURL, animeURL, animeGenreURL, pushAnimeURL } from "/router.js";
import { getCurrentUser, saveAnimeHistory } from "/supabase.js";

const API = "https://www.sankavollerei.com";
window._animeWatchURL = animeWatchURL;
window._animeURL      = animeURL;
window._animeGenreURL = animeGenreURL;

let currentUser = null;
/* Ambil user di background — tidak blocking load episode */
getCurrentUser().then(u => { currentUser = u; }).catch(() => {});

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let episodeData    = null;
let currentAnimeId = null;

async function loadEpisode() {
  const epId = getAnimeEpisodeId();
  if (!epId) { window.location.href = "/anime/"; return; }

  document.getElementById("epTitle").textContent   = "Memuat...";
  document.getElementById("epMeta").textContent    = "";
  document.getElementById("watchTitle").textContent = "Memuat...";
  document.getElementById("serverList").innerHTML  = '<div style="color:#555;font-size:13px;text-align:center;padding:10px;">Memuat server...</div>';
  document.getElementById("prevEpBtn").disabled    = true;
  document.getElementById("nextEpBtn").disabled    = true;
  document.getElementById("animeInfoBar").style.display   = "none";
  document.getElementById("epListWrap").style.display     = "none";
  document.getElementById("downloadSection").style.display = "none";
  document.getElementById("epGenreWrap").style.display    = "none";

  try {
    const res  = await fetch(`${API}/anime/episode/${epId}`);
    const json = await res.json();
    if (!json.ok || !json.data) throw new Error(json.message || "Data episode tidak ditemukan: " + epId);

    episodeData = json.data;
    const d     = episodeData;
    const rawTitle   = d.title || "";
    const shortTitle = rawTitle.replace(/\s*subtitle\s*indonesia/i,"").trim();

    document.title = `${shortTitle || epId} — Pankomik`;
    document.getElementById("watchTitle").textContent = shortTitle || epId;
    document.getElementById("epTitle").textContent   = rawTitle || shortTitle;
    document.getElementById("epMeta").textContent    = d.releaseTime ? `📅 ${d.releaseTime}` : "";

    document.getElementById("prevEpBtn").disabled = !(d.hasPrevEpisode && d.prevEpisode?.episodeId);
    document.getElementById("nextEpBtn").disabled = !(d.hasNextEpisode && d.nextEpisode?.episodeId);

    renderServers(d.server?.qualities || []);

    if (d.defaultStreamingUrl) {
      loadStream(d.defaultStreamingUrl);
      const ordered = [...(d.server?.qualities||[])].sort((a,b)=>{ const o={"720p":0,"480p":1,"360p":2}; return (o[a.title]??9)-(o[b.title]??9); });
      const firstServer = ordered.find(q=>q.serverList?.length)?.serverList?.[0];
      if (firstServer) { const chip = document.querySelector(`[data-sid="${firstServer.serverId}"]`); if (chip) chip.classList.add("active"); }
    } else {
      const ordered = [...(d.server?.qualities||[])].sort((a,b)=>{ const o={"720p":0,"480p":1,"360p":2}; return (o[a.title]??9)-(o[b.title]??9); });
      const firstServer = ordered.find(q=>q.serverList?.length)?.serverList?.[0];
      if (firstServer) { await selectServer(firstServer.serverId); }
      else { showPlayerError("Tidak ada server streaming tersedia untuk episode ini."); }
    }

    currentAnimeId = d.animeId || null;
    if (currentAnimeId) {
      const bar = document.getElementById("animeInfoBar");
      document.getElementById("animeInfoTitle").textContent = `Detail Anime: ${currentAnimeId.replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).replace(/sub indo/i,"").trim()}`;
      bar.style.display = "flex";

      /* Simpan riwayat nonton ke DB (seperti komik & novel) */
      if (currentUser) {
        const epNum = d.eps || (rawTitle.match(/episode\s*(\d+)/i)?.[1] || "");
        saveAnimeHistory(currentUser, {
          id:    currentAnimeId,
          title: currentAnimeId.replace(/-/g," ").replace(/\b./g,c=>c.toUpperCase()).replace(/sub indo/i,"").trim(),
          cover: d.info?.poster || ""
        }, {
          id:     epId,
          title:  rawTitle || shortTitle,
          number: epNum
        }).catch(() => {});
      }
    }

    const genreList = d.info?.genreList || [];
    if (genreList.length) {
      const wrap = document.getElementById("epGenreWrap");
      wrap.style.display = "flex";
      wrap.innerHTML = genreList.map(g=>`<span class="ep-genre-chip" onclick="window.location.href=window._animeGenreURL('${esc(g.genreId)}')">${esc(g.title)}</span>`).join("");
    }

    renderEpList(d.info?.episodeList || [], epId);
    renderDownloads(d.downloadUrl?.qualities || []);

  } catch(e) {
    console.error("[Watch] loadEpisode error:", e);
    showPlayerError("Gagal memuat episode.", epId, String(e.message||e));
    document.getElementById("epTitle").textContent = "Episode tidak ditemukan";
    document.getElementById("serverList").innerHTML = `<div style="text-align:center;padding:16px;color:#555;font-size:12px;">Gagal memuat data untuk:<br><strong style="color:#a78bfa;">${esc(epId)}</strong></div>`;
  }
}

function renderServers(qualities) {
  const el = document.getElementById("serverList");
  const hasServers = qualities.some(q=>q.serverList?.length);
  if (!hasServers) { el.innerHTML = '<div style="color:#555;font-size:13px;text-align:center;padding:10px;">Tidak ada server tersedia</div>'; return; }
  el.innerHTML = qualities.map(q => {
    if (!q.serverList?.length) return `<div class="quality-group"><div class="quality-label">${esc(q.title)}</div><div class="quality-empty">Tidak ada server untuk kualitas ini</div></div>`;
    return `<div class="quality-group">
      <div class="quality-label">${esc(q.title)}</div>
      <div class="server-chips">
        ${q.serverList.map(s=>`<div class="server-chip" data-sid="${esc(s.serverId)}" onclick="selectServer('${esc(s.serverId)}',this)">${esc(s.title.trim())}</div>`).join("")}
      </div>
    </div>`;
  }).join("");
}

window.selectServer = async function(serverId, chipEl) {
  if (!serverId) return;
  document.querySelectorAll(".server-chip").forEach(c=>c.classList.remove("active","loading"));
  const chip = chipEl || document.querySelector(`[data-sid="${serverId}"]`);
  if (chip) chip.classList.add("active","loading");
  document.getElementById("playerLoading").classList.remove("hidden");
  try {
    const res  = await fetch(`${API}/anime/server/${serverId}`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.message || "Server error");
    const url = json.data?.url || json.data?.embedUrl || json.data?.embed_url || json.data?.streamUrl;
    if (url) { loadStream(url); } else { throw new Error("URL stream tidak ditemukan"); }
  } catch(e) {
    console.error("[Watch] selectServer error:", e);
    showPlayerError("Gagal memuat server ini. Coba server lain.");
  } finally {
    const c = document.querySelector(`[data-sid="${serverId}"]`);
    if (c) c.classList.remove("loading");
  }
};

function renderDownloads(qualities) {
  const section = document.getElementById("downloadSection");
  const el      = document.getElementById("downloadLinks");
  const hasLinks = qualities.some(q=>q.urls?.length);
  if (!hasLinks) { section.style.display="none"; return; }
  section.style.display = "block";
  el.innerHTML = qualities.filter(q=>q.urls?.length).map(q=>`
    <div class="dl-quality-group">
      <div class="dl-quality-label">${esc(q.title)}${q.size?` · ${esc(q.size)}`:""}</div>
      <div class="dl-links">${q.urls.map(u=>`<a class="dl-link" href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.title)}</a>`).join("")}</div>
    </div>`).join("");
}

function renderEpList(epList, currentId) {
  const wrap   = document.getElementById("epListWrap");
  const scroll = document.getElementById("epListScroll");
  if (!epList.length) { wrap.style.display="none"; return; }
  wrap.style.display = "block";
  scroll.innerHTML = epList.map(ep=>`<div class="ep-chip ${ep.episodeId===currentId?"current":""}" onclick="navigateEpisode('${esc(ep.episodeId)}')">${esc(ep.title||`Ep ${ep.eps}`)}</div>`).join("");
  setTimeout(()=>{ const a=scroll.querySelector(".current"); if(a) a.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"}); },300);
}

function loadStream(url) {
  const frame   = document.getElementById("playerFrame");
  const loading = document.getElementById("playerLoading");
  const errEl   = frame.parentElement.querySelector(".player-error");
  if (errEl) errEl.remove();
  loading.classList.remove("hidden");
  frame.src = url;
  frame.onload  = () => { setTimeout(()=>loading.classList.add("hidden"),600); };
  frame.onerror = () => { showPlayerError("Gagal memuat stream."); };
}

function showPlayerError(msg, epId, detail) {
  document.getElementById("playerLoading").classList.add("hidden");
  const frame = document.getElementById("playerFrame");
  frame.src = "";
  let errEl = frame.parentElement.querySelector(".player-error");
  if (!errEl) { errEl = document.createElement("div"); errEl.className="player-error"; frame.parentElement.appendChild(errEl); }
  errEl.innerHTML = `<div class="err-icon">😕</div><p class="err-msg"></p>${epId?'<p class="err-id"></p>':""}${detail?'<p class="err-det"></p>':""}<button class="btn-retry" onclick="location.reload()">🔄 Coba Lagi</button>`;
  errEl.querySelector(".err-msg").textContent = msg;
  if (epId)   errEl.querySelector(".err-id").textContent  = "ID: "+epId;
  if (detail) errEl.querySelector(".err-det").textContent = detail;
}

function navigateEpisode(episodeId) {
  pushAnimeURL(episodeId);
  /* Track episode baru (SPA — tidak reload) */
  if (window.trackNow) window.trackNow();
  const frame   = document.getElementById("playerFrame");
  const loading = document.getElementById("playerLoading");
  frame.src = "";
  loading.classList.remove("hidden");
  const err = frame.parentElement.querySelector(".player-error");
  if (err) err.remove();
  episodeData = null;
  loadEpisode();
  window.scrollTo({ top:0, behavior:"smooth" });
}
window.navigateEpisode = navigateEpisode;

window.goPrev = function() { const ep=episodeData?.prevEpisode?.episodeId; if(ep) navigateEpisode(ep); };
window.goNext = function() { const ep=episodeData?.nextEpisode?.episodeId; if(ep) navigateEpisode(ep); };
window.goToAnimeDetail = function() { if(currentAnimeId) window.location.href=window._animeURL(currentAnimeId); };
window.shareEp = async function() {
  const title = document.getElementById("epTitle").textContent;
  const url   = window.location.href;
  if (navigator.share) { try { await navigator.share({title,url}); return; } catch {} }
  try { await navigator.clipboard.writeText(url); } catch {}
  alert("Link disalin!");
};

document.addEventListener("keydown",e=>{ if(e.key==="ArrowLeft") window.goPrev(); if(e.key==="ArrowRight") window.goNext(); });

window.addEventListener("load",()=>{ document.body.classList.remove("light"); loadEpisode(); });
window.toggleDarkMode = ()=>{};
window.toggleMenu = ()=>{ const m=document.getElementById("menuDropdown"); if(m) m.style.display=m.style.display==="block"?"none":"block"; };
document.addEventListener("click",e=>{ const m=document.getElementById("menuDropdown"); const b=document.querySelector('.watch-share'); if(m&&m.style.display==="block"&&!m.contains(e.target)&&!b?.contains(e.target)) m.style.display="none"; });
</script>
  <script type="module" src="/tracker.js"></script>
</body>
</html>
