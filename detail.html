<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Komik — Pankomik</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="searchResult" class="search-result"></div>

<!-- Dropdown diisi auth-header.js -->

<!-- Konten detail diisi detail.js -->
<div id="detailKomik"></div>

<!--
  Kedua script pakai type="module" karena keduanya
  menggunakan import/export dari supabase.js
-->
<script type="module" src="auth-header.js"></script>
<script type="module" src="detail.js"></script>
</body>
</html>
